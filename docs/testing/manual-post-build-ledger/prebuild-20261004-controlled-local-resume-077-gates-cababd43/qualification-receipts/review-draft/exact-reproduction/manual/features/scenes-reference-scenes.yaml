schema_version: 1
fixture_kind: behaviour-case
trace_contract: The original pinned case replays public inputs and verifies every
  authored semantic selector; per-scene deltas include native encoder units and waits.
scenes:
- id: algorithm-choose-and-preview
  feature_id: adding-trigs
  title: Choose a trig algorithm
  behaviour_case: M-LIVEUI-ALGO-001
  requirements:
  - UI-FEEDBACK-ALGORITHM
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-LIVEUI-ALGO-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: euclidean
    title: Choose Euclidean
    caption: Tap grid (14,2). The row reads SELECTED and its algorithm fader lights.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 5
      y: 8
      state: 1
    - type: grid
      x: 5
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: grid
      x: 14
      y: 2
      state: 1
    - type: grid
      x: 14
      y: 2
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Euclidean
        value: SELECTED
        matched: true
  - id: focus-drum
    title: Browse without applying
    caption: Turn E2 two detents left to Drum. A blank value means the focused algorithm
      has not been applied.
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    expect:
      assertion:
        kind: selected-field
        label: Drum
        value: ''
        matched: true
  - id: apply-drum
    title: Apply Drum
    caption: Press K3. Drum now reads SELECTED; the grid uses the same algorithm.
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Drum
        value: SELECTED
        matched: true
  - id: preview-differs
    title: Compare the preview
    caption: 'Cancel the Drum preview. Choose Euclidean from Pattern tasks and prime
      again: the independently checked preview cells differ.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: grid
      x: 14
      y: 8
      state: 1
    - type: grid
      x: 14
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.05
    - type: enc
      n: 1
      delta: 2
    - type: wait
      seconds: 0.15
