- id: paint-shift-and-cancel
  feature_id: adding-trigs
  title: Move a rhythm before committing
  behaviour_case: M-LIVEUI-PAINT-001
  requirements:
  - UI-FEEDBACK-PAINT
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-LIVEUI-PAINT-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: numeric
    title: Choose Numeric
    caption: Tap grid (15,2). Numeric gives a sparse preview that makes shifts easy
      to see.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 5
      y: 8
      state: 1
    - type: grid
      x: 5
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: grid
      x: 15
      y: 2
      state: 1
    - type: grid
      x: 15
      y: 2
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Numeric
        value: SELECTED
        matched: true
  - id: right
    title: Shift right
    caption: 'Prime then tap grid (12,8): Shift +1 rotates each preview cell one step
      right.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    - type: grid
      x: 12
      y: 8
      state: 1
    - type: grid
      x: 12
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_right
        shift: '+1'
        passed: true
  - id: left
    title: Return to zero
    caption: 'Tap grid (10,8): Shift 0 restores the original preview.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 10
      y: 8
      state: 1
    - type: grid
      x: 10
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_left
        shift: '0'
        passed: true
  - id: before
    title: Shift left
    caption: 'Tap grid (10,8) again: Shift -1 rotates each preview cell one step left.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 10
      y: 8
      state: 1
    - type: grid
      x: 10
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_left
        shift: '-1'
        passed: true
  - id: reset
    title: Reset the shift
    caption: Tap grid (11,8) to reset the preview to Shift 0.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 11
      y: 8
      state: 1
    - type: grid
      x: 11
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_reset
        shift: '0'
        passed: true
  - id: cancel
    title: Cancel the preview
    caption: Tap grid (14,8). Preview is OFF, Trigs is NONE, and no preview cells
      remain.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 14
      y: 8
      state: 1
    - type: grid
      x: 14
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: live-ui-paint-summary
        passed: true
