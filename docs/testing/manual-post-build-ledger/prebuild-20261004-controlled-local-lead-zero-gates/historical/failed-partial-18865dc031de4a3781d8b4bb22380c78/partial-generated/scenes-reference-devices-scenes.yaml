- id: device-stored-value-and-step-lock
  feature_id: device-parameters
  title: Keep a stored value while locking a step
  behaviour_case: M-PATCH-012
  requirements:
  - CH-PATCH-RECALL
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-PATCH-012
    input_units: native; encoder units are twice the detents
  steps:
