- id: interesting-components-for-norns-script-developers
  title: Interesting Components for Norns Script Developers
  audience: developer
  summary: The Lua harness and mocks run norns script tests away from hardware.
  prose: 'Mosaic’s Lua test harness runs scripts away from norns hardware. It downloads a norns repository
    copy and uses local mocks and shims for luaunit tests. See /lib/tests for the harness and example
    tests.


    This program is released under the GNU license. Copyright Andrew Hillel 2024.'
