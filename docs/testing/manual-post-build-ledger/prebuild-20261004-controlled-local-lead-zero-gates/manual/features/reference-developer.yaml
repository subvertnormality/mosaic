features:
- id: development
  title: Development
  audience: developer
  summary: Run the repository tests on a development machine before opening a pull request.
  prose: 'Run the repository tests before opening a pull request:


    ```

    ./test.sh

    ```


    Run the harness on a development machine. Do not run it on norns: the harness downloads a norns repository
    copy, which can conflict with the device installation. If it was run on the device, delete /code/mosaic/lib/tests/test_artefacts
    to remove that copy.'
  musical_use: ''
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#development
    behaviour_cases: []
    code:
    - test.sh
    - lib/tests/run_tests.lua
    - tests/behaviour/run.py
    - tests/behaviour/suite.py
  controls:
  - gesture: Run ./test.sh on the development machine.
    result: The Lua test suite runs. Do not run the harness on the norns device.
  details:
  - title: Behavior changes
    text: '1. Add the smallest regression for the change.

      2. Confirm that it fails for the expected reason.

      3. Make the production change and rerun the regression.

      4. Run affected unit, integration and emulator behavior tests, then the full Lua suite.

      Follow AGENTS.md. Documentation does not replace observable acceptance.'
  recipes: []
  scene_refs: []
  review:
    status: verified
    cases: []
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence: []
    applicability: documentation-only
    rationale: Development-machine test commands are developer guidance, not a player-input feature.
    native_gap: No native playback capture is required for the prose; test-suite results remain separate
      evidence.
  category: developer
