features:
- id: getting-started
  title: Getting Started
  audience: beginner
  summary: Install Mosaic and configure one channel before creating a song.
  prose: 'Patterns supply trigs, relative notes and velocities. Channels assign these patterns to outputs
    and add exceptions. Scale slots define harmony. Song slots store sections.


    Follow [Make a piece](#learn) to keep one project from four equal notes to a saved two-section arrangement.
    Begin with [Choose one sound](#setup), then [Make four notes](#first-sound). Each chapter states its
    incoming project, action and result.


    Use [No Sound](#no-sound) if the playhead moves without audible output. Open the Reference when you
    need a particular parameter rather than continuing the course.'
  musical_use: ''
