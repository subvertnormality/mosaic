- id: hardware
  title: Hardware Requirements
  audience: beginner
  summary: Mosaic requires norns and a 128 grid.
  prose: 'Connect a 128 grid to norns. For internal sound, install a supported n.b. player and use the
    norns audio output. For external sound, connect a MIDI instrument and configure its receiving channel.


    A MIDI keyboard is optional. It can enter notes into held steps or record into a playing channel.
    Crow, Just Friends and Ansible require their supported n.b. integrations and the corresponding hardware.'
