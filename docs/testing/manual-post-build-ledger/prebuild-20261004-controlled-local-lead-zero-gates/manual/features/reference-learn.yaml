- id: mods-and-software-devices
  title: Selecting an n.b. Player
  audience: all
  summary: Install and enable a supported player before assigning it to a channel.
  prose: '1. Install the player’s n.b. mod.

    2. Enable the mod in the norns MODS menu and restart as required by the mod.

    3. Start Mosaic.

    4. Open Channel tasks → Device. Select the player and press K3.


    Supported, enabled players appear in the Device list. The researched and pinned voices are Doubledecker, Oilcan,
    Polyperc and Emplaitress. Recorded examples use Doubledecker, Oilcan and Polyperc; Emplaitress has
    no recording because the installed runtime lacks MiPlaits. Availability depends on the installed
    player and its dependencies. Crow,
    Just Friends and Ansible also require their corresponding hardware.'
  musical_use: ''
  related:
  - norns-sound-sources-with-n-b
