- id: norns-menu-navigation
  title: Norns Menu Navigation
  audience: beginner
  summary: Open tasks with E1; choose a row with E2 and change its value with E3.
  prose: '1. Turn E1 to open the current context’s task list.

    2. Select a task with E1 or E2.

    3. Press K3 to open it.

    4. Turn E2 to choose a vertical row.

    5. Turn E3 to change the selected value.


    Long values appear on a separate full-width line. A position indicator identifies the selected row
    when the list extends beyond the screen. The header retains the current page and channel or pattern
    scope.


    For staged Device, Clock, Scale and Song settings, press K3 to apply; K2 cancels the draft or returns
    to its parent. For a row marked OPEN >, K3 opens the nested list. Check the footer for the selected
    row’s action.


    Masks retain eight controls visible together on one screen. Masks and Trig params update their values
    directly. Their held-step K2 clear operation and K1 combinations remain as described on those pages;
    they are not cancelled drafts. Hold a channel step to edit its local values, then release to return
    to channel scope.


    A short K1 tap opens the norns system menu. Holding K1 is Shift. E1 opens task lists.'
  musical_use: ''
  related:
  - grid-menu-navigation
