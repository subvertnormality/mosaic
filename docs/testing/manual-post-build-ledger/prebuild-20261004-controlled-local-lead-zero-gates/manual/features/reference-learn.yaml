- id: midi-panic
  title: MIDI Panic
  audience: all
  summary: Send a Note Off sweep without stopping the sequencer.
  prose: '1. Stop playback with Play/Stop if new notes must be prevented.

    2. Hold the navigation button for a non-selected page.

    3. Release the button after the Note Off sweep. The selected page does not change.


    Panic sends Note Off for every note on every MIDI channel and connected device. Holding the selected
    page button does not trigger Panic.


    Panic does not stop the sequencer or cancel scheduled strum or arpeggio voices. Playback and scheduled
    voices continue, so new notes can sound during or after the sweep. Use Play/Stop to stop playback.'
  musical_use: ''
  related:
  - sequencer-start-and-stop
  - no-sound
  sources:
