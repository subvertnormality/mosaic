- id: install
  title: Installing Mosaic
  audience: beginner
  summary: Install Mosaic from maiden or the norns community catalogue.
  prose: '1. In maiden, enter `;install https://github.com/subvertnormality/mosaic`, or install Mosaic
    from the norns community catalogue.

    2. Connect a 128 grid.

    3. Select Mosaic from the norns script list.

    4. Continue with [Setup](#setup).


    When replacing an alpha or beta installation, back up projects and custom configurations first. The
    legacy manual instructs you to remove that installation and its `data/mosaic` folder. This applies
    to the migration, not routine reinstallation.'
