  controls:
  - gesture: Select channel; Record off; no step held; play MIDI keys
    result: Audition the selected channel’s output without entering step masks.
  - gesture: Select channel → hold step → play MIDI keys
    result: Enter that step’s note, velocity and chord masks.
  - gesture: Record (2,8) + running transport + MIDI keys
    result: Record onto the selected channel’s active steps.
