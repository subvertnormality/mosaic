- id: setup
  title: Configuring an Output
  audience: beginner
  summary: Route channel 1 to one instrument.
  prose: 'Before starting: Mosaic is installed, a grid is connected and a new project is stopped. Record
    is off. Choose either a working MIDI instrument or an enabled Polyperc 1 player.


    ### Open Device


    1. Tap Channel (3,8).

    2. Check CH01.

    3. Turn E1 to Channel tasks.

    4. Select Device with E2 and press K3.


    Device opens for channel 1.


    ### Apply one output


    1. Select a working MIDI output or enabled Polyperc 1 with E3.

    2. For MIDI, select port and channel with E2 and adjust each with E3 to match the receiver.

    3. Press K3 to apply.


    The selected output becomes active. Selecting a draft alone does not apply it.


    ### Set the tempo


    1. Tap Song (6,8).

    2. Turn E1 to Song tasks; select Tempo & feel with E2 and press K3.

    3. Select Tempo with E2; set 90 BPM with E3.

    4. Press K3 to apply.

    5. Return to Channel (3,8).


    The project uses 90 BPM. With Rate /4, each channel step lasts one sixth of a second.


    Resulting project: CH01 routes to a working MIDI instrument or Polyperc 1; no pattern assigned.'
  musical_use: ''
  related:
  - first-sound
  - hardware
  - stock-devices
  - mods-and-software-devices
  - devices
  sources:
    readme: manual/legacy/README-1.4.0.md#setup
