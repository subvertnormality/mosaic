- id: arm-live-record
  title: Arm live record
  audience: all
  summary: Record notes and edited parameters into the selected channel.
  prose: '1. Select the channel and apply its output.

    2. Tap Record `(2,8)` to arm recording.

    3. Start playback and play notes on the MIDI keyboard. Notes become masks on the selected channel
    at the step active when Mosaic processes each note-on.

    4. Release the keys to finish the recorded note lengths. A chord shares one length from its first
    press to its final release.

    5. Tap Record again to disarm. Notes already begun while armed retain their lengths when released.


    To record a trig parameter, edit its value while recording is armed. Mosaic records that value on
    subsequent eligible steps; earlier steps are unchanged. With Trigless Locks on, every step is eligible.
    With it off, only active steps are eligible. Stop or disarm clears pending parameter recording.


    Selecting another channel or Scale pauses pending parameter recording; returning can resume it. Read
    the parameter-recording rules before changing assignments or using slides during a take.'
  musical_use: ''
