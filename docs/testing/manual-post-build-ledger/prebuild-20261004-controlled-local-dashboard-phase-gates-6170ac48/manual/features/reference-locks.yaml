- id: trig-param-locks
  title: Trig Param Locks
  audience: all
  summary: Set an assigned device parameter for individual channel steps.
  prose: 'Set a device parameter lock:

    1. Open Trig params from Channel tasks with E1.

    2. Hold a step on the channel sequencer.

    3. Adjust the parameter value for that step.


    Clear a step''s parameter trig locks:

    1. Open Trig params.

    2. Hold the step and press K2.


    Clear all parameter trig locks on the channel:

    1. Open Trig params.

    2. Release all steps.

    3. Hold K1 and press K2.


    Trig locks demo'
  musical_use: Use a parameter lock to change filter cutoff or envelope settings on one step.
