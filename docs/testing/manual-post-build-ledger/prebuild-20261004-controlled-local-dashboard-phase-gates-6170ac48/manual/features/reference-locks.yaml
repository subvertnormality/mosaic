- id: mask-locks
  title: Mask Locks
  audience: all
  summary: Set mask values for individual channel steps. Step locks override channel default masks.
  prose: 'Set a mask lock:

    1. Open Masks from Channel tasks with E1.

    2. Hold a step on the channel sequencer.

    3. Adjust the mask value.


    Clear a step''s mask locks:

    1. Open Masks.

    2. Hold the step and press K2.


    Clear all step-mask locks on the channel:

    1. Open Masks.

    2. Release all steps.

    3. Hold K1 and press K2.

    Channel default masks are retained.


    Mask locks demo'
  musical_use: Use note and velocity locks to vary individual steps while retaining channel defaults.
  related:
  - locks
  sources:
