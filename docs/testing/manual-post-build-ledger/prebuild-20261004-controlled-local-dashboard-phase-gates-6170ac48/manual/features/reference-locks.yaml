- id: save-and-load
  title: Save and Load
  audience: all
  summary: Save named projects and load saved projects from PARAMS > MOSAIC. Stopped, idle projects normally
    autosave after 60 seconds.
  prose: 'Open PARAMS > MOSAIC to save or load a project. Choose Save project and enter a descriptive
    name. Use named saves for versions that must not be overwritten by autosave.


    When playback is stopped, 60 seconds of inactivity normally saves the current project as autosave.
    Mosaic loads the most recent autosave at startup.


    Before replacing the current project, Mosaic checks saved song slots, global lengths, channel ranges
    and scale-track ranges. If a check fails, the screen identifies the problem. The current project and
    playback are retained.


    A rejected load suspends autosave to protect the rejected file. Editing, playing and cancelling a
    dialog do not resume autosave. A successful valid load, a successful named save or New resumes the
    normal idle autosave interval. A failed save leaves autosave suspended.


    Valid saved one-step ranges are supported. There is no one-step range gesture. Validation covers the
    saved range structure; it does not check every possible corrupted project field.'
