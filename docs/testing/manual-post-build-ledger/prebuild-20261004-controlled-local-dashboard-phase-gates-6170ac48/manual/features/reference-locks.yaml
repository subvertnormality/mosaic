features:
- id: locks
  title: Locks
  audience: all
  summary: Set parameter, mask, scale, transposition and octave changes on sequencer steps. Lock duration
    depends on the lock type.
  prose: 'Set parameter values, masks and grid-function values on specific steps in the channel or global
    Scale workspace. A lock takes effect at its step. Parameter and octave locks affect that step. Scale
    locks use the persistence rules in Scale Locks. See Transposition Locks for transposition behaviour.


    Set channel locks from the Channel Editor. Set global scale and transposition locks from the Scale
    workspace.'
  musical_use: Use locks to change a value at a specific step.
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#locks
    behaviour_cases: []
    code:
    - lib/models/program.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/step.lua
  controls:
  - gesture: Hold a sequencer step, then edit the relevant parameter or grid selector
    result: Writes to that step rather than the channel default.
  details: []
  recipes: []
  scene_refs:
