- id: param-slides
  title: Param Slides
  audience: all
  summary: Interpolate between parameter locks. Enable slides for a parameter across the channel or for
    an individual step.
  prose: 'Enable slides for a parameter across the channel:

    1. Open Trig params and select the parameter.

    2. Release all steps and press K3.

    The parameter slides between its trig locks.


    Enable a slide on one step:

    1. Hold the step.

    2. Select the parameter and press K3.

    The selected step slides to the next lock for that parameter. Other locks remain unchanged.


    Slides do not cross into a different song pattern. Enable Wrap param slides to allow a slide across
    the boundary of the same repeating pattern. Slides use additional resources; limit their use when
    necessary.


    Param slides demo'
  musical_use: Use two parameter locks and a slide to change a value gradually.
  related:
