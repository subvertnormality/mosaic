- id: scale-locks
  title: Scale Locks
  audience: all
  summary: Set scale slots on channel steps or the global scale track. Channel locks take precedence over
    global locks.
  prose: 'Set scale locks on channel steps in the Channel Editor, or on the global scale track in the
    Scale Editor. Channel scale locks take precedence over global scale locks.


    Set a channel scale lock:

    1. Hold a step on the channel sequencer.

    2. Press the required scale slot.


    Clear a step lock:

    1. Hold the step.

    2. Press K2 in the relevant lock workspace.


    With Scales lock until ptn end On, a channel scale lock remains until the channel wraps to its start
    or another channel scale lock replaces it.


    With the option Off, the lock remains until the next active trig that passes its probability check.
    A probability-rejected trig does not clear it. A scale lock on the next accepted trig replaces the
    previous lock.


    Global scale-track locks are independent of this option. They remain until another global lock replaces
    them or the global scale track wraps.


    Scale locks demo'
  musical_use: Use channel locks for a separate scale progression on one channel. Use global locks for
    a shared progression.
  related:
  - locks
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-locks
    behaviour_cases:
    - M-GESTURE-ORDER-001
    - M-RANGE-GLOBAL-004
    - M-SCALE-002
    - M-SCALE-004
    - M-SCALE-DISPLAY-001
    - M-SCALE-LOCK-003
    - M-SCALE-ORDER-001
    - M-TRANS-004
    - M-TRANS-005
    - M-TRIPLE-001
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: Hold a channel sequencer step, then press a scale-slot button on the channel grid
    result: Sets a channel scale lock at that step, taking precedence over the global scale track.
  - gesture: Hold a global scale-track step, then press its scale-slot button
    result: Sets a global scale lock, which persists until replacement or global-track wrap.
  - gesture: Hold the step and press its currently locked scale slot again
    result: Removes that scale lock.
  - gesture: Hold the step and press K2 in the relevant Scale or channel lock workspace
    result: Clears locks in that workspace; this is a step clear, not an individual-field undo.
