features:
- id: scale-editor
  title: Scale Editor
  audience: all
  summary: Select one of 16 scale slots. Edit Root, Scale, Degree, Rotation and Transpose for the selected
    slot.
  prose: 'Press the second global menu button to open the Scale Editor.


    Short-press a scale button to select and apply one of the 16 scale slots. The applied scale is brightly
    lit on the grid. Short-press the applied slot again to turn global scale off; that slot remains selected
    for editing. Press it again to apply it. With global scale off and no scale lock, pattern degrees
    play as chromatic semitone offsets. Patterns use the applied scale unless a global scale trig lock
    or channel scale trig lock overrides it.


    On the Scale screen, turn E2 to select Root, Scale, Degree, Rotation or Transpose. Turn E3 to change
    the value. Press K3 to apply the changes or K2 to cancel. The title row identifies the slot selected
    for editing.


    Hold K1 and press a scale slot to select it for editing without changing the applied scale. Long-press
    a different editing slot for the same result. Long-press the slot already selected for editing to
    turn global scale off and clear the editing selection. A dim indicator marks the editing slot when
    it differs from the applied scale. Selecting a slot for editing does not apply it to playback. Applying
    changes to a slot already used by playback changes that scale.


    To set a [scale lock](#scale-locks), hold a step and press the required scale slot. On the Scale page,
    the lock applies globally to channels without an active channel scale trig lock. On a channel page,
    the lock applies only to that channel. Channel scale locks take precedence over the global scale and
    global locks. A global lock remains active until another global lock or the global scale track wraps.
    Channel-lock duration follows Scales Lock Until Pattern End.


    Set the global scale track’s rate and length independently of other channels to run a chord progression
    over a different number of steps.


    Scale editor demo'
  musical_use: Change a melody’s harmonic setting without changing its rhythm or pattern degrees. Edit
    an unused scale slot to prepare a different setting before applying it.
  related:
  - scale-locks
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-editor
    behaviour_cases:
    - M-SCALE-001
    - M-SCALE-002
    - M-SCALE-003
    - M-SCALE-004
    - M-SCALE-DISPLAY-001
    code:
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/ui_adapters/scale.lua
    - lib/models/program.lua
    - lib/quantiser.lua
    - lib/step.lua
  controls:
  - gesture: Press Grid (4, 8).
    result: The Scale Editor opens. Scale slots occupy Grid row 3.
  - gesture: Short-press a scale slot on row 3.
    result: Apply it globally and select it for editing. Press the applied slot again to turn global scale
      off while retaining the editing selection.
  - gesture: Hold K1 and press a scale slot, or long-press a different editing slot.
    result: Select the slot for editing without changing which scale playback uses.
  - gesture: Long-press the slot already selected for editing.
    result: Turn global scale off and clear the editing selection.
  - gesture: On the Scale screen, turn E2 to select a field. Turn E3 to change its value.
    result: Root, Scale, Degree, Transpose or Rotation changes in the draft for the named slot.
  - gesture: Release grid keys, then press K3 or K2.
    result: K3 applies the draft. K2 cancels it. Applying changes to a scale used by playback changes
      its harmony.
  - gesture: Hold a sequencer step, then press a scale slot.
    result: 'Set or toggle a scale lock at that step: global on the Scale page, channel-specific on a
      channel page.'
  details:
  - title: Editing selection and applied scale
    text: The title identifies the slot selected for editing. The editing indicator is dim when that slot
      differs from the applied scale. With global scale off and no scale lock, pattern degrees play as
      chromatic semitone offsets. Active channel scale locks take precedence.
  - title: Vertical list controls
    text: Scale settings appear as vertical rows. Turn E2 to select a row and bring later fields into
      view. E3 edits the selected slot’s draft; K3 applies and K2 cancels. Selecting another row does
      not apply a draft. Tapping a grid key, including Play/Stop, cancels an unapplied draft. Press
      K3 before using the grid to keep your edit. Long selected scale names use a separate full-width
      value row.
  recipes:
  - title: Prepare and apply a second scale
    text: Apply scale slot 1 to a short degree melody. Hold K1 and press slot 2 to select it for editing.
      Edit Root or Scale, then press K3 to apply the draft. Short-press slot 2 to use it for playback.
      Short-press slot 1 to restore the original setting.
