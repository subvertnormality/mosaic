- id: transposition
  title: Transposition
  audience: all
  summary: Set global transposition for the selected Song Sequence from −12 to +12 semitones. Use transposition
    locks to change it at specified steps.
  prose: 'Use the global quantiser transposition fader to transpose the entire Song Sequence. Set a global
    value or use [transposition locks](#transposition-locks) to change the value at specified steps.


    Global or trig transposition is added to the active scale slot’s Transpose value.


    Global transposition demo'
  musical_use: Transpose a section while keeping its rhythm and intervals. Global or locked transposition
    is added to the active scale slot’s Transpose value.
  related:
  - transposition-locks
  - scale-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#transposition
    behaviour_cases:
    - M-TRANS-006
    - M-TRANS-007
    - M-TRANS-008
    - M-TRANS-009
    code:
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/controls/fader.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: On the Scale page, press the transpose fader on Grid row 8, columns 8–16.
    result: The selected Song Sequence’s global transposition is set within −12 to +12 semitones.
  - gesture: Press the left or right fader endpoint.
    result: Decrease or increase by one semitone; the centre button returns to zero.
  - gesture: Hold a sequencer step and press the transpose fader.
    result: Set a transposition lock for that step. Repeating the same value toggles that lock off.
  details:
  - title: Transposition precedence
    text: The current global or persistent step-lock value is added to the active scale slot’s Transpose
      value. For its lifetime, a step lock replaces the global fader value.
  recipes:
  - title: Transpose a copied Song slot
    text: Copy a Song slot to an unused slot. Select the copy and raise its global transposition by two
      semitones. Select the original slot to return to the previous transposition. Check that the higher
      notes remain within the sound’s usable register.
  scene_refs:
  - transpose-next-onset
