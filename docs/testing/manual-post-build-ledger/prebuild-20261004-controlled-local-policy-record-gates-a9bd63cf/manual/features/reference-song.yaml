- id: button-indicators
  title: Button Indicators
  audience: all
  summary: Song slot brightness indicates empty, filled and selected slots.
  prose: 'Read Song slot status from the grid:


    * Dim buttons indicate empty slots.

    * Mid-glow buttons indicate slots containing rhythms and patterns.

    * The brightly lit button identifies the Song Sequence currently in play.'
  musical_use: Check which slots contain sequences and which slot is selected before changing slots.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#button-indicators
    behaviour_cases:
    - M-SONG-FLOW-001
    - M-SONG-COPY-001
    - M-SONG-QUEUE-STOP-001
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/controls/button.lua
  controls:
  - gesture: Check Song Editor Grid rows 1–6.
    result: Dim slots are empty; mid-bright slots contain active sequences; the selected slot is bright.
  - gesture: Press another slot while playback runs.
    result: Its blinking feedback marks the queued selection until the boundary.
  details:
  - title: Selected while stopped
    text: The bright indicator represents the selected Song slot, including when transport is stopped.
      During playback it identifies the current section; queued selection has blinking feedback.
