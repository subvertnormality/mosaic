- id: song-mode-operations
  title: Song Mode Operations
  audience: all
  summary: Song mode advances to the next filled slot after the current slot’s repeats. An empty slot
    ends the contiguous group and returns playback to that group’s first filled slot.
  prose: 'Enable Song mode to advance automatically to the next slot after the current sequence has played
    its specified number of repetitions.


    When playback reaches an empty slot, it returns to the first filled slot in the current sequence group.
    Use empty slots to separate groups.


    Press another slot during playback to queue a change. The change takes effect after the current sequence
    completes.'
  musical_use: Separate Song groups with empty slots. Press a slot in another group to queue a change
    at the current sequence boundary.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#song-mode-operations
    behaviour_cases:
    - M-SONG-FLOW-001
    - M-SONG-QUEUE-STOP-001
    - M-SONG-SETTINGS-001
    code:
    - lib/song_transition.lua
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/ui_adapters/song.lua
    - lib/application_parameters.lua
  controls:
  - gesture: Choose Song tasks with E1, then Slot setup; edit Song mode with E2/E3 and apply with K3.
    result: Enable automatic progression, or disable it to keep repeating the selected slot.
  - gesture: Set Repeats in Slot setup and apply with K3.
    result: Determine how many passes the selected slot plays before Song mode advances.
  - gesture: Press another Song slot during playback.
    result: Queue a change for completion of the current sequence, including its repeats.
  details:
  - title: Song groups
    text: When the next slot is empty, playback returns to the first filled slot of the current contiguous
      group. Manual slot selection remains available when Song mode is off.
  recipes:
  - title: Create two Song groups
    text: Fill slots 1–2 and 4–5. Leave slots 3 and 6 empty. Enable Song mode and select slot 1 to loop
      slots 1–2. During playback, press slot 4 to queue a change; slots 4–5 loop after the change. Use
      a different bass rhythm or harmony in the second group and retain one motif in both groups.
  scene_refs:
  - song-mode-groups-and-selection
  review:
    status: verified
    cases:
