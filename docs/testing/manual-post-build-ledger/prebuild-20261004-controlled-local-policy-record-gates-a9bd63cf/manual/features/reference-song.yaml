features:
- id: song-editor
  title: Song Editor
  audience: all
  summary: Select and arrange 96 Song Sequence slots on six grid rows. Each slot stores its pattern, channel
    and harmonic setup.
  prose: 'The Song Editor contains 96 Song Sequence slots, arranged in six rows of 16. Use each slot to
    store a configuration of patterns, channels, rhythms and scales.


    Song editor demo'
  musical_use: Store variations in separate slots. Select slots during playback or enable Song mode for
    automatic progression.
  related:
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#song-editor
    behaviour_cases:
    - M-SONG-FLOW-001
    - M-SONG-COPY-001
    - M-SONG-SETTINGS-001
    - M-SONG-SETTINGS-002
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/models/program.lua
    - lib/song_transition.lua
  controls:
  - gesture: Press Grid (6, 8).
    result: The Song Editor opens on Playback. Grid rows 1–6 contain the 96 Song slots.
  - gesture: Press a Song slot.
    result: Select it immediately while stopped, or queue it for the current sequence boundary during
      playback.
  details:
  - title: Song slot contents
    text: Copying a Song slot copies its sequence configuration. Source note patterns and channel settings
      can be reused or changed within the copied slot.
  recipes:
  - title: Create a two-slot group
    text: Copy slot 1 to slot 2. Change one channel’s rhythm or mask in slot 2 and retain the motif in
      the other channels. Leave slot 3 empty. Enable Song mode to loop slots 1 and 2.
  scene_refs:
  - song-global-length
  - workflow-compose-two-channels
  - song-mode-groups-and-selection
