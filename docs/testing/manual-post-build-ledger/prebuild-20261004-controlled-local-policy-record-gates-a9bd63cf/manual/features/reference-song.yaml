      - *id010
      scope: The authored scene’s cited workflow and stated semantic outcomes.
      run: /home/andy/mosaic-manual-runs/bf06e4c957154a359e3bb9f5f2c638b9
      data_sha256: 74303143000c74cb5d269dd250926b34883345710ab4511f79a4f10e537d2eb9
    applicability: native-ui
    native_gap: null
