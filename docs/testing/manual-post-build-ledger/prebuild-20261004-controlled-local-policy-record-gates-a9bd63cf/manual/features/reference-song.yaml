- id: interacting-with-slots
  title: Interacting with Slots
  audience: all
  summary: Select, copy and erase Song slots using grid presses.
  prose: 'Press a slot button to select its Song Sequence.


    To copy a slot, press and hold the source slot, then press the destination slot. The destination’s
    contents are overwritten.


    To erase a slot, copy an empty slot over it. There is no undo.'
  musical_use: Copy a Song slot before editing a variation. The original slot remains available for playback.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#interacting-with-slots
    behaviour_cases:
    - M-SONG-COPY-001
    - M-SONG-FLOW-001
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/models/program.lua
  controls:
  - gesture: Press a Song slot.
    result: Select the sequence while stopped; during playback, queue it until the current sequence completes.
  - gesture: Press and hold the source slot, then press the destination slot.
    result: Copy the first-pressed slot over the destination. Either release order keeps the first-pressed
      slot as source.
  - gesture: Copy an empty slot over a filled slot.
    result: Erase the destination. The destination’s previous content is overwritten; there is no undo.
  details:
  - title: Copy direction
    text: Press the source slot first, then the destination. Either release order uses the first-pressed
      slot as the source. Copying leaves the source and other slots unchanged.
  recipes:
  - title: Copy a slot before editing
    text: Press and hold the current slot, then press an unused destination slot. Release both buttons.
      While stopped, select the destination and edit the variation. Select the original slot to return
      to the previous section.
  scene_refs:
  - workflow-compose-two-channels
  - song-mode-groups-and-selection
  review:
    status: verified
    cases:
    - M-SONG-FLOW-001
    - M-WORKFLOW-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
