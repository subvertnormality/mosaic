- id: navigating-the-norns-display
  title: Navigating the Norns Display
  audience: all
  summary: Open Playback, Slot setup or Tempo / feel from Song tasks.
  prose: 'The Song page opens on Playback. This screen shows the playing slot, the next slot, the current
    pass within its repeats, global pattern length and whether Song mode is advancing. Use E1 to open
    Song tasks and select another screen.


    Open Slot setup to set the number of repetitions for the selected Song Sequence. This setting determines
    when Song mode advances. With Song mode off, select slots manually.


    Open Tempo and feel to set global tempo and Swing or Shuffle.'
  musical_use: Use Playback to check the playing slot and repeat count. Set repeats in Slot setup. Set
    global tempo and groove in Tempo / feel.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#navigating-the-norns-display
    behaviour_cases:
    - M-LIVEUI-DASH-001
    - M-SONG-SETTINGS-001
    - M-SONG-SETTINGS-002
    code:
    - lib/ui_spec_data.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/ui_adapters/song.lua
    - lib/ui_adapters/song_clock.lua
    - lib/ui_adapters/read_only.lua
  controls:
  - gesture: Open the Song Editor.
    result: Playback shows Playing, Next, Pass, global length and Song mode status.
  - gesture: Turn E1 to Song tasks, choose Slot setup and open it.
    result: Edit the selected slot’s Repeats and global Song mode with E2/E3; K3 applies and K2 cancels.
  - gesture: Choose Tempo / feel from Song tasks.
    result: Edit global tempo and Swing or Shuffle settings. Choose a field with E2, change it with E3,
      then apply with K3 or cancel with K2.
  details:
  - title: Setting scope
    text: Repeats applies to the selected Song slot. Song mode, tempo and global feel apply across the
      song.
  - title: Vertical list controls
    text: Slot setup and Tempo / feel use vertical lists. Turn E2 to select the row and E3 to edit it.
      K3 applies the draft; K2 cancels. Repeats belongs to the selected slot; Song mode and global feel
      apply across the song. Playback remains a read-only dashboard.
  recipes: []
