- id: keyboard-honour-degree
  feature_id: honor-scale-degree
  title: Start from the chosen scale degree
  behaviour_case: M-OPT-KEYS-001
  requirements:
  - OPT-KEYBOARD-WHITE
  - OPT-KEYBOARD-ROTATION
  - OPT-KEYBOARD-DEGREE
  - OPT-KEYBOARD-TRANSPOSE
  - SETUP-MIDI-INPUT
  profile: base-midi
  session_ordinal: 0
