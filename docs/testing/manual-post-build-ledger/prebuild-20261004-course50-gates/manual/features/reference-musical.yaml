- id: musical-merge-and-voice-leading
  title: Musical Merge and Voice Leading
  audience: all
  summary: Foundation and Fragments reshape merged output without rewriting patterns. Harmony places output
    voices; its default is Off.
  prose: 'Merge Shape changes a channel’s merged rhythm. Harmony places output notes in specified registers.
    Neither feature rewrites source patterns. Older projects with Merge Shape Off use their saved legacy
    strategy and retain its original MIDI, timing and random behavior.


    Merge modes, Merge Shape and Harmony are consecutive Channel tasks. Merge Shape and Voice leading
    use vertical lists. Editable rows display their current value. Submenus display OPEN >. The selected
    row is marked >.


    1. Open Merge Shape or Harmony from Channel tasks.

    2. Turn E2 to select a row.

    3. Turn E3 to change a staged value.

    4. Press K3 on OPEN > to open that settings list. The bottom line names the action, for example K3
    OPEN RHYTHM.

    5. Press K3 on an ordinary value row to validate and apply the complete draft.


    Action rows, including Create group, Four-part smooth, Delete group and Reset map, display a plain
    >. Delete group and Reset map require confirmation.


    Press K2 to discard a dirty draft, or to return from an opened list to its parent. Turn E1 to return
    to the feature’s first screen and discard an unapplied draft. From the first screen, E1 returns to
    Channel tasks.


    A stopped edit applies immediately. During playback, Merge Shape displays NEXT CYCLE and applies before
    the next channel-cycle onset. Harmony displays NEXT PATTERN and applies at the next global pattern
    boundary. Stop activates the latest applied request for the next start.


    Merge Shape shows a read-only Strategy summary. Its Strategy selector action discards an unapplied
    parameter draft and opens the shared selector on Merge modes. Grid (14,8) selects the same Skip, Only,
    All, Foundation and Fragments choices. A strategy request is immediate; parameter drafts still need
    K3 Apply. Active is sounding output, while Pending is an accepted request awaiting its displayed boundary.'
  musical_use: Use Merge Shape to add or remove channel trigs without editing the assigned patterns. Use
    Harmony to set output registers.
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#musical-merge-and-voice-leading
    behaviour_cases:
    - M-MERGE-FOUNDATION-001
    - M-MERGE-PHRASE-001
    - M-HARMONY-REVOICE-001
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/optional_config_transaction.lua
    - lib/musical_merge/state.lua
    - lib/harmony/config_state.lua
  controls:
  - gesture: In Channel tasks, turn E2 to Merge Shape or Harmony. Press K3.
    result: The selected feature opens.
  - gesture: Turn E2.
    result: The selected row changes.
  - gesture: Turn E3 on a value row.
    result: The draft value changes.
  - gesture: Press K3 on a row marked OPEN >.
    result: The selected settings list opens.
  - gesture: Press K3 on a value row.
    result: Mosaic validates and applies the draft.
  - gesture: Press K2.
    result: A dirty draft is discarded. In an opened settings list, the parent list returns.
  - gesture: Turn E1.
    result: An unapplied draft is discarded and the feature’s first screen returns. From that screen,
      Channel tasks returns.
  details:
  - title: Applying changes
    text: Stopped edits apply immediately. During playback, Merge Shape normally displays NEXT CYCLE and
      applies at the next channel-cycle onset. Harmony displays NEXT PATTERN and applies at the next global
      pattern boundary. A shared group-reference change can also queue Merge Shape for NEXT PATTERN. Stop
      settles the latest applied request.
  - title: Source patterns
    text: E3 edits a draft until K3 applies it. Grid editing can cancel a dirty draft. Merge Shape and
      Harmony change channel output; they do not rewrite source patterns.
  recipes: []
  scene_refs:
  - foundation-protected-and-added
  - harmony-revoice-two-voices
  review:
    status: pending
    cases:
    - M-HARMONY-REVOICE-001
    - M-MERGE-FOUNDATION-001
    note: Shared Strategy instructions updated to the candidate control contract. Earlier native evidence
      remains historical; new shared-selector captures and musical acceptance are pending.
    source_status: code-and-case-reviewed
    native_evidence:
