- id: harmony
  title: Harmony
  audience: all
  summary: Harmony provides Off, Revoice, Pattern and Ensemble modes for channel output pitch placement.
  prose: "[Captured Harmony range failure and fallback](#harmony/harmony-range-failure-and-fallback)\n\
    \n[Captured Harmony Revoice workflow](#harmony/harmony-revoice-two-voices)\n\nHarmony offers four\
    \ mutually exclusive channel modes:\n\n- Off follows the ordinary Mosaic pitch path exactly.\n- Revoice\
    \ takes the actual root and enabled chord-mask voices after Mosaic's\n  pitch-class decisions, preserving\
    \ their pitch classes and sounding count while\n  choosing legal octaves and assignments.\n- Pattern\
    \ maps explicit effective relative values in the current merge binding\n  to Bass, Inner1–3 or Top.\
    \ Repeated mapped values reuse one pitch for the entire\n  harmonic frame; unmapped values remain\
    \ Raw. Random, fixed, absolute-mask and\n  chord-mask events visibly bypass Pattern. Conflicting aliases\
    \ fail closed.\n- Ensemble assigns Bass/Inner/Top roles to one to five explicit monophonic\n  channels.\
    \ Each member retains its own rhythm, velocity, gate, clock and route,\n  but its pitch is replaced\
    \ by the shared frame. A conflicting local scale lock\n  temporarily uses the ordinary pitch path\
    \ (`LOCAL SCALE BYPASS`); a channel or\n  step octave override does the same (`LOCAL OCTAVE BYPASS`).\n\
    \nRegister rows set inclusive MIDI Low/High, Centre and Preferred leap for every\nrole. Smooth prioritises\
    \ literal common tones and economical movement; Compact\nprioritises register centre/spacing; Independent\
    \ prioritises movement without a\ncommon-tone score. Hard options cover crossing, exact unison, strict\
    \ leap and\nstrict bass direction. Bass can be Root, an explicit Inversion tone, Smooth or\nan exact\
    \ Pedal. Revoice pedals must already be in its input material; only an\nEnsemble group can explicitly\
    \ allow a non-chord pedal.\n\nThe deterministic solver searches every legal pitch-class placement\
    \ inside the\nconfigured ranges (up to five voices) and never clamps an illegal result. A frame\n\
    with no solution silences affected mapped voices by default; Legacy fallback is\nexplicit. A bounded\
    \ search reports `BUDGET EXCEEDED` rather than emitting a\npartial answer. Preparing a frame does\
    \ not change voice history: the first real\nscheduled onset consumes it, while redraws, rests, failed\
    \ probability, mute and\nmissing output do not. Delayed strums and arpeggios keep the pitch snapshot\
    \ made\nat their onset, and Note Off always releases the pitch and route actually sent.\n\n[Captured\
    \ NO VOICING and Legacy fallback](#harmony/harmony-range-failure-and-fallback)\n\nThe Channel grid\
    \ remains the chronological trig/mask surface. Foundation anchors\nand additions therefore appear\
    \ as active steps there. After a step plays, the\nPattern Note grid moves that step's bright note\
    \ LED to the final effective pitch\nthat the native 21-position note range can represent. Switch its\
    \ upper, centred\nor lower seven-note bank as usual to inspect octave placement. Raw and bypassed\n\
    events use the ordinary pre-Harmony position; turning Harmony Off restores the\nordinary merged/scale\
    \ positions immediately. An exact pitch outside that native\nrange has no false in-range LED and remains\
    \ available in Result/Note Dashboard.\n\nThis display is read-only: touching the projected Note fader\
    \ still edits its\nselected source-pattern value. Until the changed step plays again, the edited\n\
    source is displayed rather than a stale output. Final Harmony pitches are also\nshown on Output (its\
    \ Pitch and Sent rows) and on Harmony's Result screen, one row\nper voice as the planned and sent\
    \ note (`C3 > C3`). Result uses its Step row to\nselect one coherent event chain; on Note\nDashboard,\
    \ holding a grid step temporarily inspects that step instead of combining\nit with a later delayed\
    \ event. A step with no recorded event says `NO EVENT` and\nshows no planned or emitted pitch; it\
    \ never borrows the latest event from another\nstep. This readout occupies the bottom two lines of\
    \ the Note Dashboard, which is\nthe row tooltips use, so while a harmony event is being shown there\
    \ the page\nclears that row and tooltips are not visible on it. Result status names local scale/octave\
    \ bypasses, explicit Legacy fallback\nand the specific no-voicing reason. For an Ensemble group, any\
    \ member bypass or failure is\nsurfaced even when another member has a valid voicing. The projection\
    \ never writes\nback into a shared pattern. Copy/save stores\nversioned configuration, not running\
    \ solver or phrase history. Missing optional\nconfiguration loads as Off; unknown schema versions\
    \ reject the project before it\nreplaces the active project."
  musical_use: Use Revoice for root and chord-mask voices, Pattern for repeated relative values, or Ensemble
    for a chord distributed across monophonic channels.
  related:
  - musical-merge-and-voice-leading
  sources:
    readme: manual/legacy/README-1.4.0.md#harmony
    behaviour_cases:
    - M-HARMONY-REVOICE-001
    - M-HARMONY-PATTERN-001
    - M-HARMONY-PATTERN-CLOCKS-001
    - M-HARMONY-PATTERN-BYPASS-001
    - M-HARMONY-ENSEMBLE-001
    - M-HARMONY-PERSIST-001
    - M-HARMONY-FAILURE-001
    - M-HARMONY-HELD-001
    - M-UIACC-A19-001
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/harmony/config.lua
    - lib/harmony/config_state.lua
    - lib/harmony/context.lua
    - lib/harmony/voicing.lua
    - lib/harmony/pattern.lua
    - lib/harmony/state.lua
    - lib/harmony/inspection.lua
    - lib/harmony/grid_projection.lua
    - lib/step.lua
  controls:
  - gesture: In Channel tasks, select Harmony. Press K3.
    result: Voice leading settings open.
  - gesture: Turn E2 to Mode. Turn E3.
    result: The draft mode changes between Off, Revoice, Pattern and Ensemble.
  - gesture: Select Register or another settings row marked OPEN >. Press K3.
    result: The selected settings list opens.
  - gesture: Turn E2 to select a value. Turn E3 to change it. Press K3 on a value row.
    result: Mosaic validates and applies the draft. During playback, NEXT PATTERN indicates a queued change.
  - gesture: Press K2.
    result: A dirty draft is cancelled. An opened settings list returns to its parent.
  - gesture: In Result, select Step.
    result: The selected event’s planned and sent pitches are displayed.
  - gesture: On Note Dashboard, hold a grid step.
    result: That step’s event is inspected. A step without a recorded event displays NO EVENT.
  details:
  - title: Mode selection
    text: Revoice places the actual root and enabled chord-mask voices in legal octaves. Pattern maps
      repeated effective relative values to roles. Ensemble assigns a shared harmonic frame to specified
      monophonic channels; each member retains its rhythm and route.
  - title: No voicing and fallback
    text: Infeasible registers display NO VOICING. Silence is the default failure fallback; Legacy must
      be selected explicitly. A solver budget failure does not emit a partial answer.
  - title: Note grid editing
    text: After a played event, the Note grid displays the final pitch if it is within the native range.
      Editing a Note fader still edits the selected source pattern. Projected pitches are not written
      to that pattern.
  recipes:
  - title: Map three relative values
    text: '1. Create a pattern with three repeating relative note values.

      2. Open Harmony. Set Mode to Pattern.

      3. Map the effective values to Bass, Inner1 and Top.

      4. Set each role’s Register. Press K3 on a value row to apply.

      Repeated mapped values use one pitch per harmonic frame. If the ranges have no legal placement,
      Result displays NO VOICING.'
