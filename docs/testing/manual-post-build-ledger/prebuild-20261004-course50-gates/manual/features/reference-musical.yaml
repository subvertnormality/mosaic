- id: result-and-reason
  title: Result and Reason
  audience: all
  summary: Result shows a step’s source, role and decision. Reason lists the decisions that excluded an
    addition.
  prose: 'Result shows the selected step’s role and decision. Reason displays one dashboard with six rows:
    Step, Role with source patterns, Decision, Interlock, Velocity and Pitch target.


    1. Open Result in Merge Shape.

    2. Select Step with E2. Turn E3 to select the inspected step.

    3. Select Reason. Press K3 to open its dashboard.


    Admitted Foundation additions show their role and source, for example ADDITION P2, and their addition
    velocity. In this revision, a suppressed Foundation addition displays EMPTY with its source patterns
    and NONE for Velocity. EMPTY P2 therefore does not mean Pattern 2 has no candidate trig: use Decision
    to identify why the candidate was suppressed.


    Decision lists every applicable exclusion reason in order: GAP first, then INTERLOCK CH02. When both
    apply, both are displayed. The Interlock row remains separate: ON indicates filtering, OFF indicates
    no leader, and RESYNC or PLAN LIMIT indicates a planning bypass. During a bypass, Gap and Amount still
    decide the step as if Interlock were Off.


    A fragment step identifies its fragment and source, for example FRAGMENT 1 P03 or KEPT ANCHOR. A Structure
    marker displays MARKER CHORD G01 when its pitch is snapped, CHORD MISSING when the group is unavailable,
    or a pitch-precedence reason such as BYPASS NOTE MASK, BYPASS RANDOM, BYPASS FIXED or BYPASS QUANTISED
    FIXED.


    When a leader is set, Result includes Interlock status. A queued edit refused at the loop boundary
    is displayed as Rejected. Silence-aware interlock, which would reserve space while another channel’s
    notes sustain, is not part of this release.'
  musical_use: Inspect Result and Reason before changing a pattern or adding a mask to correct an absent
    addition.
