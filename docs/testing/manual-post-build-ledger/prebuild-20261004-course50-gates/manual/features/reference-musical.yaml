- id: fragments
  title: Fragments
  audience: all
  summary: Fragments selects one assigned pattern for each 4-, 8- or 16-step section of the channel loop.
  prose: '[Captured Fragments seed and playback workflow](#fragments/fragments-seed-source-choice)


    Fragments is a separate mode for building a phrase from pieces of the assigned

    patterns. Choose Fragments with the shared Strategy selector, then open Rhythm from Merge Shape for
    Size (4,

    8 or 16 steps), Keep anchor, Anchor (shown only with Keep anchor) and Seed. The

    channel loop is cut into fragments of Size steps counted from the channel''s own

    start step; the last fragment is shorter when the loop does not divide evenly,

    and a loop shorter than Size is one fragment. Fragments never cross the loop end.


    Each fragment plays one assigned pattern, chosen repeatably by the Seed: the

    same seed always gives the same choice. The fragment keeps that pattern''s own

    trigs, notes, velocities and lengths exactly, so the legacy trig, note,

    velocity and length merge modes and merged-pentatonic do not apply while

    Fragments is active. Merge modes marks its retained note, velocity and length rows inactive, with
    values such as `AVERAGE SAVED`. These rows and their grid buttons do not edit saved values. Choose
    Skip, Only or All to restore the retained settings. A note longer than the gap to

    the next onset on the loop is shortened to that gap. Keep anchor also plays the

    Anchor pattern''s trigs where the fragment''s own pattern has none; where both have

    a trig, the fragment''s pattern wins. With no assigned pattern the mode falls back

    to legacy merging and Result says `ASSIGN PATTERN`.


    Phrase shows only Cycles and Variation in this mode. Fixed repeats the same

    fragment sources every phrase; Per phrase draws new ones for each phrase.

    Shape percentages, Amount, Accent and Gap do not apply. Fragments hides Pitch; choose the adjacent
    Harmony task directly for voice leading. Explicit masks still win and probability can still reject
    an

    onset. The channel grid shows exactly the trigs the fragments play.'
  musical_use: Use Fragments to combine sections of assigned patterns while retaining each section’s authored
    notes, velocities and lengths.
  related:
  - merge-shape
  sources:
    readme: manual/legacy/README-1.4.0.md#fragments
    behaviour_cases:
    - M-MERGE-FRAGMENTS-001
    - M-MERGE-FRAGMENTS-002
    - M-MERGE-FRAGMENTS-003
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/optional_config_transaction.lua
    - lib/musical_merge/fragments.lua
    - lib/musical_merge/config.lua
    - lib/musical_merge/state.lua
    - lib/pattern.lua
  controls:
  - gesture: Choose Fragments with Strategy on Merge modes or grid (14,8). On Merge Shape, select Rhythm
      and press K3.
    result: The accepted Fragments strategy owns all four merge attributes. Rhythm opens Size, Keep anchor,
      Anchor and Seed settings.
  - gesture: Select Size. Turn E3.
    result: Fragment size changes between 4, 8 and 16 channel steps.
  - gesture: Select Keep anchor. Turn E3.
    result: When On, anchor trigs fill positions where the fragment’s source has no trig.
  - gesture: Select Phrase. Press K3.
    result: Cycles and Fixed or Per phrase Variation settings open.
  details:
  - title: Loop boundaries
    text: Fragments start at the channel loop’s start step. The last fragment is shorter when the loop
      does not divide evenly. A loop shorter than Size is one fragment. Fragments do not cross the loop
      end.
  - title: Overrides and fallback
    text: Legacy trig, note, velocity and length merges and merged-pentatonic do not apply in Fragments.
      Explicit masks and probability still apply. With no assigned pattern, Result displays ASSIGN PATTERN
      and uses legacy merging.
  recipes:
  - title: Set four-step fragments
    text: '1. Assign two patterns to the channel.

      2. Choose Fragments with Strategy on Merge modes or grid (14,8), then open Merge Shape.

      3. Open Rhythm. Set Size to 4.

      4. Set Variation to Fixed in Phrase.

      5. Change Seed to select different fragment sources. Press K3 on a value row to apply the parameter
      draft.

      Enable Keep anchor if empty positions should play anchor trigs.'
