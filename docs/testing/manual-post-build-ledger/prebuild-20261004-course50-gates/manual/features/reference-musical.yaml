  controls:
  - gesture: In Foundation, open Pitch > Structure.
    result: Markers and Chord group settings open.
  - gesture: Select Markers. Turn E3.
    result: Markers changes between Off, Anchors, Every 4 and Every 8.
  - gesture: Select Chord group. Turn E3.
    result: An enabled Harmony Ensemble group becomes the draft chord source.
  - gesture: Press K3 on a value row.
    result: The draft applies. An unavailable group prevents activation.
  details:
  - title: Markers and pitch precedence
    text: Markers count from the channel loop’s start step. The nearest chord pitch class is selected;
      ties select the lower pitch. Note masks, random shifts and fixed notes retain their precedence.
  - title: Group deletion and disable
    text: Deleting or disabling a referenced group turns affected Markers Off in the same transaction.
      During playback, that change waits for NEXT PATTERN. Pending linked Merge Shape edits wait for the
      same boundary.
  recipes:
  - title: Set Every 4 markers
    text: '1. Create an enabled Harmony group.

      2. Set Merge Shape to Foundation. Open Pitch > Structure.

      3. Set Markers to Every 4. Select the group in Chord group.

      4. Press K3 on a value row to apply.

      The marker notes use the nearest chord pitch class. Notes between markers retain their existing
      pitch targets.'
