- id: scale-edit-versus-apply
  feature_id: scale-editor
  cases:
  - M-SCALE-001
  source: tests/behaviour/scale_memory.py
  function: scale_edit_selection
  readme:
  - README.md#scale-editor
  setup: four_note_pattern
  phases:
  - id: applied-scale1
    public_inputs:
    - grid tap (4
    - 8)
    observe: scale header slot1; scale_slot1 selected15; four-note baseline MIDI.
  - id: edit-scale2
    public_inputs:
    - K1 down
    - wait0.3s
    - grid tap (2
    - 3)
    - K1 up
    - E2 -1
    - E3 +2
    - K3 tap
    observe: Header edit slot2; slot1 stays selected, slot2 blink-low; baseline MIDI [60,62,64,65] unchanged.
  - id: apply-scale2
    public_inputs:
    - grid tap (2
    - 3)
    observe: Header slot2; slot2 selected; MIDI pitches [62,64,66,67], velocities [127,117,107,97].
  - id: edit-other-slot
    public_inputs:
    - grid (3
    - 3) down
    - wait1.1s
    - grid (3
    - 3) up
    - wait0.06s
    observe: Header edit slot3; slot2 remains applied; MIDI remains D-major [62,64,66,67].
  boundary: Saving an applied slot changes playback; double long-select disables global scale and yields
    chromatic [60,61,62,63]. Optional extension needs full source sequence.
- id: memory-rewind-and-branch
  feature_id: memory-undo-and-redo
  cases:
  - M-MEMORY-001
  - M-MEMORY-002
  source: tests/behaviour/scale_memory.py
  function: memory_navigation
  readme:
  - README.md#memory-undo-and-redo
  setup: 'four_note_pattern; Ui.channel_page(''masks'') using public task navigation.

    Ui.record_midi_mask_on_step(1,72,90); Ui.record_midi_mask_on_step(2,76,80).

    MIDI helper holds absolute step, sends port1 [144,note,velocity], waits0.05,

    sends [128,note,0], releases grid, waits0.1; no direct mask-state edits.

    Open Memory through Channel tasks (do not reuse obsolete E1 +/-2 relative page-ring shortcuts).

    '
  phases:
  - id: two-edits
    public_inputs: []
    observe: Memory counter2/2; exact MIDI [[72,90],[76,80],[64,107],[65,97]].
  - id: undo-last
    public_inputs:
    - E3 -1
    observe: Counter1/2; exact MIDI [[72,90],[62,117],[64,107],[65,97]].
  - id: redo-last
    public_inputs:
    - E3 +1
    observe: Counter2/2; two-edits MIDI restored.
  - id: beginning-and-end
    public_inputs:
    - K2 tap
    - K3 tap
    observe: K2 counter0/2 baseline MIDI, K3 counter2/2 edited MIDI. Capture each edge separately.
  extension: Undo once; record step3 note79 velocity70; counter2/2 replaces future. M-MEMORY-002 proves
    other-channel history isolation.
  caution: Existing source uses relative E1 shortcuts; verify current task map before actual capture.
    Keep exact counter/phrase oracles.
- id: channel-routing-visible-scope
  feature_id: devices
  cases:
  - M-LIVEUI-CHSELECT-001
  - M-CHANNEL-001
  source: tests/behaviour/contract/live_ui_feedback.py
  function: live_ui_channel_select
  readme:
  - README.md#devices
  - README.md#norns-menu-navigation
  setup: four_note_pattern
  phases:
  - id: device-channel1
    public_inputs: []
    observe: midi_config CH01; Device=CC Device.
  - id: device-channel2
    public_inputs:
    - grid tap (2
    - 1)
    observe: Same midi_config family CH02; Device=None; channel row only2 at15 others2.
  - id: return-channel1
    public_inputs:
    - grid tap (1
    - 1)
    observe: midi_config CH01; Device=CC Device; only1 selected.
  - id: independent-clock
    public_inputs:
    - Ui.channel_page('clock_mods'
    - channel=1)
    - grid tap (2
    - 1)
    - E3 -2
    - K3 tap
    observe: CH02 clock_mods Rate=/2; channel1 remains/1 when selected; exact focused-art row oracle.
  limitation: Visible scope scene alone cannot claim emitted MIDI routing. Full M-CHANNEL-001 covers all16
    channels/two ports/mutes.
  audible_extension: 'Shorten full routing setup to channels1/2 only, both assigned pattern1/range1..4.

    Channel2 device CC Device, MIDI channel2, port2. Verify port1/status144 and

    port2/status145 independently, literal four-note phrase, alignment within documented

    lane tolerance, mute2 leaves1, unmute2 restores2, then Stop and no outstanding notes.

    Add a separately identified manual acceptance case; do not relabel the full16-channel case.

    '
scenes:
- id: algorithm-choose-and-preview
  feature_id: adding-trigs
  title: Choose a trig algorithm
  behaviour_case: M-LIVEUI-ALGO-001
  citation: README.md#adding-trigs
  steps:
  - id: euclidean
    title: Choose Euclidean
    caption: Tap grid (14,2). The row reads SELECTED and its algorithm fader lights.
    assertion:
      kind: selected-field
      label: Euclidean
      value: SELECTED
      matched: true
    occurrence: 1
  - id: focus-drum
    title: Browse without applying
    caption: Turn E2 two detents left to Drum. A blank value means the focused algorithm has not been
      applied.
    assertion:
      kind: selected-field
      label: Drum
      value: ''
      matched: true
    occurrence: 1
  - id: apply-drum
    title: Apply Drum
    caption: Press K3. Drum now reads SELECTED; the grid uses the same algorithm.
    assertion:
      kind: selected-field
      label: Drum
      value: SELECTED
      matched: true
    occurrence: 1
  - id: preview-differs
    title: Compare the preview
    caption: 'Cancel the Drum preview. Choose Euclidean from Pattern tasks and prime again: the independently
      checked preview cells differ.'
    assertion:
      kind: prime-uses-selected-algorithm
      passed: true
- id: paint-shift-and-cancel
  feature_id: adding-trigs
  title: Move a rhythm before committing
  behaviour_case: M-LIVEUI-PAINT-001
  citation: README.md#adding-trigs
  steps:
  - id: numeric
    title: Choose Numeric
    caption: Tap grid (15,2). Numeric gives a sparse preview that makes shifts easy to see.
    assertion:
      kind: selected-field
      label: Numeric
      value: SELECTED
      matched: true
  - id: right
    title: Shift right
    caption: 'Prime then tap grid (12,8): Shift +1 rotates each preview cell one step right.'
    assertion:
      kind: paint-shift-cells
      control: shift_right
      shift: '+1'
      passed: true
  - id: left
    title: Return to zero
    caption: 'Tap grid (10,8): Shift 0 restores the original preview.'
    assertion:
      kind: paint-shift-cells
      control: shift_left
      shift: '0'
      passed: true
  - id: before
    title: Shift left
    caption: 'Tap grid (10,8) again: Shift -1 rotates each preview cell one step left.'
    assertion:
      kind: paint-shift-cells
      control: shift_left
      shift: '-1'
      passed: true
  - id: reset
    title: Reset the shift
    caption: Tap grid (11,8) to reset the preview to Shift 0.
    assertion:
      kind: paint-shift-cells
      control: shift_reset
      shift: '0'
      passed: true
  - id: cancel
    title: Cancel the preview
    caption: Tap grid (14,8). Preview is OFF, Trigs is NONE, and no preview cells remain.
    assertion:
      kind: live-ui-paint-summary
      passed: true
- id: merge-overlap-and-union
  feature_id: merge-modes
  title: Merge two patterns
  behaviour_case: M-LIVEUI-MERGEMODES-001
  citation: README.md#merge-modes
  steps:
  - id: patterns
    title: Two source patterns
    caption: The channel receives patterns 01 and 02. Assign them on the grid; this row is read-only.
    assertion:
      kind: selected-field
      label: Patterns
      value: 01 02
      matched: true
    occurrence: 2
  - id: skip
    title: Skip overlap
    caption: Select Strategy with E2. SKIP keeps trigs present in exactly one source pattern.
    assertion:
      kind: merge-mode
      row: Strategy
      value: SKIP
      passed: true
    occurrence: 1
  - id: only
    title: Keep overlap
    caption: 'Turn E3 once on Strategy: ONLY keeps trigs present in two or more patterns.'
    assertion:
      kind: merge-mode
      row: Strategy
      value: ONLY
      passed: true
    occurrence: 1
  - id: all
    title: Play the union
    caption: 'Turn E3 once more on Strategy: ALL includes every trig from either source.'
    assertion:
      kind: merge-mode
      row: Strategy
      value: ALL
      passed: true
    occurrence: 1
  - id: note-pat2
    title: Choose a pitch source
    caption: Select Note mode with E2 and turn E3 through UP, DOWN and PAT 1 to PAT 2. Rhythm still merges;
      notes come from pattern 2.
    assertion:
      kind: selected-field
      label: Note mode
      value: PAT 2
      matched: true
  - id: average
    title: Restore the average
    caption: Turn E3 back to AVERAGE. Independent MIDI checks confirm the averaged phrase returns.
    assertion:
      kind: selected-field
      label: Note mode
      value: AVERAGE
      matched: true
    occurrence: 2
- id: scale-edit-versus-apply
  feature_id: scale-editor
  title: Prepare a scale before applying it
  behaviour_case: M-SCALE-001
  citation: README.md#scale-editor
  steps:
  - id: save-unused
    title: Save an unused scale
    caption: Hold K1 and select scale 2, change its root to D and press K3. The verified MIDI phrase stays
      in C while scale 1 remains applied.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 1
  - id: apply-d
    title: Apply D major
    caption: Tap scale slot 2. The emitted phrase now reads D, E, F sharp and G; the applied slot indicator
      follows.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 2
  - id: browse-unused
    title: Browse without changing playback
    caption: Long-select scale slot 3. The editor changes but the verified phrase remains in D major.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 3
  - id: turn-off
    title: Return to chromatic notes
    caption: Long-select the edit slot again to disable scale mapping. MIDI confirms the chromatic relative
      intervals C, C sharp, D and D sharp.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 5
- id: song-global-length
  feature_id: adjusting-song-sequence-length
  title: Set the global song length
  behaviour_case: M-LIVEUI-FOCUS-001
  citation: README.md#adjusting-song-sequence-length
  steps:
  - id: shorten
    title: Shorten by one step
    caption: Open Song with grid (6,8), then tap (1,7). Global length is 63 on the live dashboard.
    assertion:
      kind: dashboard
      rows:
      - - Playing
        - SONG 01
      - - Next
        - SONG 01
      - - Pass
        - 1 / 1
      - - Global length
        - '63'
      - - Song mode
        - AUTO
      passed: true
  - id: restore
    title: Return to 64 steps
    caption: Tap grid (8,7). Global length returns to 64.
    assertion:
      kind: dashboard
      rows:
      - - Playing
        - SONG 01
      - - Next
        - SONG 01
      - - Pass
        - 1 / 1
      - - Global length
        - '64'
      - - Song mode
        - AUTO
      passed: true
- id: channel-routing-visible-scope
  feature_id: devices
  title: Keep each channel independent
  behaviour_case: M-LIVEUI-CHSELECT-001
  citation: README.md#norns-menu-navigation
  steps:
  - id: device1
    title: Channel 1 has its own output
    caption: The configured channel shows CC Device on CH01.
    assertion:
      kind: selected-field
      label: Device
      value: CC Device
      matched: true
    occurrence: 1
  - id: device2
    title: An unused channel has no output
    caption: Tap grid (2,1). Device stays open on CH02 and shows None.
    assertion:
      kind: selected-field
      label: Device
      value: None
      matched: true
  - id: device1-again
    title: Return to channel 1
    caption: Tap grid (1,1). Its CC Device returns.
    assertion:
      kind: selected-field
      label: Device
      value: CC Device
      matched: true
    occurrence: 2
  - id: clock2
    title: Give channel 2 a different rate
    caption: Open Clock, select channel 2, turn E3 down two detents and K3 to apply /2.
    assertion:
      kind: selected-field
      label: Rate
      value: /2
      matched: true
    occurrence: 1
  - id: clock1
    title: Channel 1 keeps its rate
    caption: Select channel 1. Its Clock page still reads /1.
    assertion:
      kind: selected-field
      label: Rate
      value: /1
      matched: true
    occurrence: 3
  - id: clock2-again
    title: Channel 2 remembers its rate
    caption: Select channel 2 again. Its Clock page reads /2.
    assertion:
      kind: selected-field
      label: Rate
      value: /2
      matched: true
    occurrence: 2
- id: pattern-note-range
  feature_id: adding-notes
  title: Shape notes across the grid range
  behaviour_case: M-EDIT-001
  citation: README.md#adding-notes
  steps:
  - id: initial-note-range
    title: Choose a scale degree
    caption: Tap the fourth column note fader. MIDI confirms the fourth note is 71 while the first three
      notes stay unchanged.
    assertion:
      kind: workflow-check
      name: initial-note-range
      passed: true
  - id: first-up-step
    title: Move the note range up
    caption: Tap the range-up control and choose the upper value. The fourth MIDI note becomes 72.
    assertion:
      kind: workflow-check
      name: first-up-step
      passed: true
  - id: hold-to-highest-range
    title: Reach the upper boundary
    caption: Hold range up, then choose the upper value. The fourth MIDI note is 83; the next range-up
      tap clamps here.
    assertion:
      kind: workflow-check
      name: hold-to-highest-range
      passed: true
  - id: center-restores-root-page
    title: Return to the central range
    caption: Tap the central range control and choose the fourth value. The fourth MIDI note returns to
      65.
    assertion:
      kind: workflow-check
      name: center-restores-root-page
      passed: true
- id: pattern-velocity-range
  feature_id: adding-velocity
  title: Shape accents and rests
  behaviour_case: M-EDIT-002
  citation: README.md#adding-velocity
  steps:
  - id: velocity-127
    title: Make a strong accent
    caption: Choose the top velocity in column four. MIDI confirms velocity 127 on the fourth note.
    assertion:
      kind: workflow-check
      name: velocity-127
      passed: true
  - id: velocity-68
    title: Soften the accent
    caption: Choose the lower visible velocity. MIDI confirms 68 while the other three notes keep their
      velocities.
    assertion:
      kind: workflow-check
      name: velocity-68
      passed: true
  - id: velocity-0
    title: Turn an attack into a rest
    caption: Hold the range-down control and choose the lowest value. The fourth note is absent from the
      exact MIDI phrase.
    assertion:
      kind: workflow-check
      name: velocity-0
      passed: true
  - id: hold-to-highest-velocity-range
    title: Restore full velocity
    caption: Hold the central range control and choose the top value. The fourth MIDI note returns at
      velocity 127.
    assertion:
      kind: workflow-check
      name: hold-to-highest-velocity-range
      passed: true
- id: pattern-copy-groups
  feature_id: adding-notes
  title: Copy notes and dynamics across all four pages
  behaviour_case: M-EDIT-003
  citation: README.md#adding-notes
  steps:
  - id: shift-copies-notes-to-four-groups
    title: Copy the contour
    caption: Hold K1 while entering the four note degrees. The semantic grid oracle verifies the same
      four active degrees on all four pages.
    assertion:
      kind: workflow-check
      name: shift-copies-notes-to-four-groups
      passed: true
  - id: shift-copies-velocities-to-four-groups
    title: Copy the dynamics
    caption: Hold K1 while setting velocities. Each of the four pages shows the corresponding active fader
      cells.
    assertion:
      kind: workflow-check
      name: shift-copies-velocities-to-four-groups
      passed: true
  - id: play-step-group-4
    title: Hear the fourth page
    caption: "Restrict the channel range to steps 49\u201352. The exact emitted phrase is C, D, E, F,\
      \ each at velocity 117."
    assertion:
      kind: workflow-check
      name: play-step-group-4
      passed: true
