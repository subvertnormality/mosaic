    - 8)
    observe: Shift=0; original preview restored.
  - id: shift-before-start
    public_inputs:
    - grid tap (10
    - 8)
    observe: Shift=-1; original set rotated -1 mod64, including wrap at step1.
  - id: reset-and-cancel
    public_inputs:
    - grid tap (11
    - 8)
    - grid tap (14
    - 8)
    observe: Reset Shift=0/original cells; then Preview=OFF/Trigs=NONE/no cells.
- id: merge-overlap-and-union
  feature_id: merge-modes
  cases:
  - M-LIVEUI-MERGEMODES-001
  - M-MERGE-001
  source: tests/behaviour/contract/live_ui_feedback.py
  function: live_ui_merge_modes
  readme:
  - README.md#merge-modes
  - README.md#trig-merge-modes
  - README.md#note-merge-modes
  setup: 'four_note_pattern; grid(5,8) Pattern; grid(2,1) choose pattern2; step1/step2 tap;

    grid(3,8) Channel; grid(2,2) assign pattern2. Verify merge_detail Patterns=01 02.

    K2 returns Masks; Ui.open_channel_task(''merge'') opens through E1 task picker.

    '
  phases:
  - id: assigned-patterns
    public_inputs:
    - E2 -6
    - E3 +1
    observe: Patterns=01 02 remains read-only despite E3.
  - id: skip
    public_inputs:
    - E2 +1
    observe: Strategy=SKIP; grid(14,8)=2; MIDI pairs [[64,107],[65,97]] with rests matching steps3/4.
  - id: only
    public_inputs:
    - E3 +1
    observe: Strategy=ONLY; grid(14,8)=5. Audible acceptance must use M-MERGE-001 overlap positions,
      not invented velocities.
  - id: all
    public_inputs:
    - E3 +1
    observe: Strategy=ALL; grid(14,8)=8; MIDI pairs [[60,114],[62,109],[64,107],[65,97]].
  - id: take-note-from-pattern2
    public_inputs:
    - E2 -24
    - E2 +4
    - E3 +4
    observe: Note mode traverses UP/DOWN/PAT1/PAT2; MIDI pairs [[60,114],[60,109],[60,107],[60,97]].
  - id: restore-average
    public_inputs:
    - E3 -4
    - E3 -1
    observe: AVERAGE clamped; the prior All phrase is restored exactly. Select Strategy and turn
      E3 -5 to restore Skip.
