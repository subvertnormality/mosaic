  extension: Selecting Rhythm Doctor then K3 opens R01; include only if its destination is explained.
- id: paint-shift-and-cancel
  feature_id: adding-trigs
  cases:
  - M-LIVEUI-PAINT-001
  source: tests/behaviour/contract/live_ui_feedback.py
  function: live_ui_paint
  readme:
  - README.md#adding-trigs
  setup: initial_empty
  phases:
  - id: numeric-preview
