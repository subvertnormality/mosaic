schema_version: 1
status: authoring-plan-not-captured
base_revision: 54d7b871358fcc68b7166847603cc9fb1461d0b6
scope: 'Expansion scene plan derived from existing semantic behaviour assertions.

  Every scene below needs a fresh native capture plus the cited oracle before publication.

  Public semantic UI verbs resolve through tests/behaviour/ui_map.py; enc deltas are detents

  through Driver.enc, not raw emulator deltas. No internal Lua state is an acceptance oracle.

  Shortened phases must retain their prerequisite setup; full-case passing evidence remains separate.

  '
conventions:
  initial_empty: Fresh actual Mosaic instance, seed 42; tap Pattern editor skips splash.
  four_note_pattern: Ui.configure, implemented entirely with grid/key/encoder public input.
  four_note_phrase:
  - - 60
    - 127
  - - 62
    - 117
  - - 64
    - 107
  - - 65
    - 97
  midi_output: Port 1, status 144; public play_stop and balanced releases after stopping.
  grid_tap: press state 1, release state 0, then settle
  citations: Exact cited README headings; source assertions label these outside manual if needed.
priority:
- algorithm-choose-and-preview
- paint-shift-and-cancel
- merge-overlap-and-union
- song-global-length
- scale-edit-versus-apply
- memory-rewind-and-branch
- channel-routing-visible-scope
research_plans:
- id: algorithm-choose-and-preview
  feature_id: adding-trigs
  cases:
  - M-LIVEUI-ALGO-001
  - M-LIVEUI-PAINT-001
  source: tests/behaviour/contract/live_ui_feedback.py
  functions:
