- id: note-dashboard
  title: Note Dashboard
  audience: all
  summary: Open Output to inspect the selected channel’s last note or a held step’s
    resolved output.
  prose: 'Choose Output from Channel tasks to inspect the last note played by the
    selected channel. **Note** shows the note and its chord voices. **Vel / Len**
    shows velocity and length. **Step** identifies the source step. **Degree** shows
    the pattern degree and the merged result, for example +2 > +3 MERGED. **Pitch**
    shows the scale pitch and any Harmony change, for example E4 > G4 HARMONY. **Sent**
    shows the note sent, or the reason none was sent: MUTED or REST.


    Hold a step to inspect that step’s output, including the stages of a [Harmony](#harmony)
    event.'
