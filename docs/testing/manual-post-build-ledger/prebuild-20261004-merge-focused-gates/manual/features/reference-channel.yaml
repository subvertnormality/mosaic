- id: adding-melodic-notes-over-harmony-and-drums
  title: Adding Melodic Notes over Harmony and Drums
  audience: all
  summary: Set channel mask defaults or step overrides for note, velocity, length
    and chord voices.
  prose: 'Open Masks on norns. The screen shows eight attributes, each with a short
    name above its value: Trig, Note, Vel (velocity), Len (length), and Chd1–Chd4
    (four chord notes).


    Hold the step to edit and set the required attribute value. Alternatively, hold
    the step and press the corresponding note on a MIDI keyboard to enter note-mask
    data.


    To set a channel default, edit a mask value with no step held. The default applies
    to all steps without an explicit override for that attribute. For example, set
    a chord note for every trigger, a fixed velocity, or a trig default that enables
    or disables every trigger.'
  musical_use: Set a channel note default. Hold the final step and set a different
    note mask to create a phrase variation without changing the source rhythm.
