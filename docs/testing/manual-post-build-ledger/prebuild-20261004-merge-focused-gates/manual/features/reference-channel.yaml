- id: channel-length
  title: Channel Length
  audience: all
  summary: Set an independent inclusive channel range within the 64-step sequence.
  prose: 'Set channels independently, including the global scale pattern, within the
    64-step sequence.


    To set a channel range, hold its start step in Channel Editor. While holding the
    start, press and release a different, later end step, then release the start.
    The range commits when the end step is released. Brighter buttons indicate the
    active range.


    The gesture cannot select a one-step range. A long hold alone has no effect; the
    held step remains available for combinations with other buttons, including a subsequent
    end-step press. The end must follow the start. A reversed selection shows a message
    and leaves the previous range unchanged. Channel ranges do not wrap from the final
    step to the first. The same restrictions apply to the Scale Editor range. Pattern
    note-length wrapping is unchanged.


    Use the norns parameter [options](#options) to configure sequencer handling of
    channels with different lengths.


    Channel length demo'
  musical_use: Set a five-step lead range and a sixteen-step drum range. Align their
    starts; the ranges return to their shared start every eighty steps.
  related:
  - options
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#channel-length
    behaviour_cases:
    - M-GRID-001
    - M-MASK-030
    - M-MASK-031
    - M-PATCH-016
    - M-PATCH-018
    - M-RANGE-001
