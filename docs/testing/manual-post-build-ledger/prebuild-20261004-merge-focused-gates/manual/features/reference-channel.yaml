- id: note-merge-modes
  title: Note Merge Modes
  audience: all
  summary: Select Average, Higher, Lower or a priority pattern for merged note values.
  prose: 'These modes determine how note values are handled when steps overlap:


    * **Average**: Average the contributing note values and round to the nearest integer,
    choosing the greater integer at an exact half (1.5 becomes 2; -1.5 becomes -1;
    -0.5 becomes 0). One contributor passes through unchanged. The result then uses
    the configured scale and pentatonic processing.

    * **Higher**: Add the difference between the highest and lowest contributing note
    values to their rounded average. One contributor passes through unchanged; the
    result then uses the configured scale and pentatonic processing.

    * **Lower**: Subtract the rounded average from twice the lowest contributing note
    value: `2 * lowest - rounded_average`. One contributor passes through unchanged;
    the result then uses the configured scale and pentatonic processing.

    * **Pattern**: To prioritise a specific pattern''s note values during conflicts,
    hold the note merge button and select the desired pattern. You can even select
    patterns that aren''t current asigned to the active channel.


    By default, notes will snap to the pentatonic version of the currently active
    scale to assist with avoiding unpleasant harmonic interactions. This can be disabled
    in _Mosaic_''s settings.'
  musical_use: 'Compare Average, Higher and Lower using the same source patterns.
    Check the resulting scale degrees: Higher and Lower are calculated from the mean
    and range, not the maximum and minimum alone.'
  related:
  - merge-modes
  sources:
    readme: manual/legacy/README-1.4.0.md#note-merge-modes
