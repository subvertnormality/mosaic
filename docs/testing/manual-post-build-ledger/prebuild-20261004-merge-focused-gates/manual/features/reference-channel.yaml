    - lib/pattern.lua
  controls:
  - gesture: In Channel Editor, press grid (14,8).
    result: Cycle the shared Strategy through Skip, Only, All, Foundation and Fragments;
      the sequence wraps.
  - gesture: On Merge modes, select Strategy with E2 and turn E3.
    result: Request the same strategy; the list is clamped and needs no extra K3 Apply.
  - gesture: Press grid (15,8) or (16,8), or hold K1 and press (16,8).
    result: Change note, velocity or length merge respectively when the active strategy
      permits it. Fragments leaves saved settings unchanged.
  - gesture: Hold note, velocity or length merge button and tap a pattern in row 2.
    result: Choose a source pattern for that attribute when the active strategy permits
      it.
  details:
  - title: Accepted state and refusal
    text: Active and Pending identify accepted output, separately from the requested
      Strategy cursor. Foundation without a valid assigned anchor shows NEEDS ANCHOR
      and does not apply; the cursor remains at Foundation so the next forward choice
      reaches Fragments.
  - title: Attribute ownership
    text: Foundation owns trigs only. Fragments owns trigs, notes, velocity and length.
      Its retained legacy settings are inactive and SAVED; selecting a legacy strategy
      restores them.
