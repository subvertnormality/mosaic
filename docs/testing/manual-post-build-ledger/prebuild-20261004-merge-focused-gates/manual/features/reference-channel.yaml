- id: random-note
  title: Random Note
  audience: all
  summary: Add a random scale-degree offset. Zero leaves the note unchanged.
  prose: Set Random Note to add a random offset to the selected note. A value of 0
    will leave the note unchanged. A value of 1 will randomly give your existing note
    or the note one higher in the scale. A value of 2 will randomly give your existing
    note, the note one higher in your selected scale, or the note one lower. A value
    of 3 will randomly select notes -1, 0, 1 or 2. A value of 4 will randomly select
    notes -2, -1, 0, 1 or 2. Higher values continue this range expansion. Apply step
    locks where required. Random Note can be combined with Random Twos Note. By default,
    random notes are quantised to the pentatonic version of the currently selected
    scale to limit dissonant intervals. This can be disabled in _Mosaic_'s param settings.
    With Lock random to pent. enabled, a nonzero sum of Random Note and Random Twos
    offsets triggers nearest-pentatonic snapping for ordinary notes and fully quantised
    note masks, in either direction. Zero sums, including cancellation, do not trigger
    this option; other applicable pentatonic options still apply. Equal-distance pitches
    choose the lower note. Snap-only and unquantised masks retain their chromatic
    random-offset behaviour. Fixed Note and Quantised Fixed Note retain their override
    precedence.
  musical_use: Set a small Random Note value on the last step of a repeated phrase.
    Leave the remaining steps unchanged.
  related:
  - sequencer-params
  sources:
    readme: manual/legacy/README-1.4.0.md#random-note
    behaviour_cases:
    - M-PARAM-037
    - M-PARAM-038
    - M-PARAM-039
    - M-PARAM-040
    - M-PARAM-041
    - M-PARAM-042
    - M-TRIPLE-001
    code:
    - lib/devices/device_map.lua
    - lib/step.lua
    - lib/quantiser.lua
  controls:
  - gesture: Channel tasks → Trig params → E2 slot → K2 → E3 Random Note → K3 → K2
    result: Assign Random Note to one of the ten slots.
  - gesture: E3 with no grid step held
    result: 'Edit the channel default: 0 disables random displacement; positive values
      expand its scale-degree choices.'
  - gesture: Hold a sequencer step + E3
    result: Set that step’s parameter lock; clear it with held step + K2 to return
      to the channel default.
