- id: midi-sound-sources
  title: MIDI Sound Sources
  audience: all
  summary: Route a channel to a configured MIDI output, device and MIDI channel.
  prose: 'Select either an internal norns sound engine supplied by [n.b.](https://github.com/sixolet/nb/tree/main)
    or a MIDI device in the workspace. Devices are assigned per scene and retain their
    settings across all song sequences. Configure a MIDI output device in norns before
    selecting a MIDI sound source.


    If a device configuration file is available, such as a configuration for an Elektron
    -takt instrument, select the device by name and edit its labelled parameters.
    If no configuration is available, select the CC device and enter MIDI CC numbers
    from the receiving instrument’s documentation.'
  musical_use: Select a named device map to edit labelled parameters. Select the generic
    CC device when using the receiving instrument’s MIDI CC numbers.
