    \ Use the norns encoder to navigate the selected channel’s history.\n\nOpen Channel\
    \ Editor and choose History from Channel tasks. The Memory screen shows your position\
    \ in the channel's memory, the selected action, and how many actions you can still\
    \ undo and redo.\n\n- Use E3 to step back through past actions or forward towards\
    \ more recent ones.\n- Press K3 to jump directly to the latest action.\n- Press\
    \ K2 to return to the beginning of the memory.\n\nTo jump to the latest action\
