- id: random-twos-note
  title: Random Twos Note
  audience: all
  summary: Add a random offset in multiples of two scale degrees. Zero leaves the
    note unchanged.
  prose: Set Random Twos Note to add a random offset restricted to multiples of two.
    A value of 0 will leave the note unchanged. A value of 1 will randomly give your
    existing note or the note two higher in the scale. A value of 2 will randomly
    give your existing note, the note two higher in your selected scale, or the note
    two lower. A value of 3 will randomly select notes -2, 0, 2 or 4. A value of 4
    will randomly select notes -4, -2, 0, 2 or 4. Higher values continue this range
    expansion. Apply step locks where required. Random Twos Note can be combined with
    Random Note. By default, random notes are quantised to the pentatonic version
    of the currently selected scale to limit dissonant intervals. This can be disabled
    in _Mosaic_'s param settings.
  musical_use: Set Twos Random Note on selected steps to vary the phrase in two-degree
