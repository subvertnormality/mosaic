- id: trig-parameters
  title: Trig Parameters
  audience: all
  summary: Assign up to ten parameters per channel and set defaults or step locks
    for the current song pattern.
  prose: "Assign trig parameters to change sequencing or device sound values. Trig\
    \ parameters belong to a song pattern, so different sections can use different\
    \ parameter settings. Each channel has up to 10 assigned parameters. Set an individual\
    \ [trig lock](#locks) on a step to override its parameter default. This per-step\
    \ parameter method is also used on Elektron synthesizers.\n\nThe Trig params screen\
    \ of the channel editor shows all ten slots at once. Each slot shows its parameter's\
    \ two short names from the device definition, the first above the value and the\
    \ second below, so together they name the parameter (for example `Quan` over `Note`\
    \ for Quantised Fixed Note). The names stay still; one too long for its slot is\
    \ cut short. A value too wide for its slot shows `...`, and while that slot is\
    \ selected its full name and whole value take the last line. Use the following\
    \ controls:\n\n* **Screen Navigation**: Use E1 to open Channel tasks, then choose\
    \ Masks, Trig params or another screen with E2 and open it with K3.\n* **Changing\
    \ Parameters**: To select a slot, turn E2. Adjust its value by rotating E3. To\
    \ fine tune, rotate E3 whilst holding K1.\n* **Activating Parameters**: To activate\
    \ a different parameter within the same slot, press K2 to open the parameter list,\
    \ turn E3 to browse, press K3 to assign, and press K2 to return.\n* **Locking\
    \ Changes**: As you adjust values, the system automatically saves your changes.\
    \ You can also create \"trig locks\" on specific steps by holding down the step\
    \ and turning E3. This allows you to set values that will override the default\
    \ parameter for that step.\n* **Default Parameter Values**: A pre-set parameter\
    \ value is transmitted to your selected device on steps without a trig lock, unless\
    \ the value is off or a parameter slide is active.\n* **Handling Off Settings**:\
    \ An explicit MIDI parameter lock set to \"off\" sends no value for that parameter\
    \ on that step. It does not resend the previous lock or restore the default, so\
    \ the device keeps its last received value. An off lock does not itself cancel\
    \ a parameter slide that is already running; that slide may continue sending values.\n\
    \n\n\n  \n  Params and trig locks demo"
  musical_use: Assign Fixed Note to a drum channel. Assign Trig Probability to another
    slot and reduce it on selected quieter steps.
  related:
  - locks
  - dig-deeper
  sources:
