features:
- id: channel-editor
  title: Channel Editor
  audience: all
  summary: Select one of 16 channels and open its editing tasks.
  prose: 'Press the far-left global menu button to open Channel Editor. Press a button
    in the top channel-select row to select one of the 16 channels.


    Channel editor demo


    The scale-slot row displays the selected channel’s active scale slot while playback
    runs. Holding a step with a scale lock shows its locked slot.


    Use the five octave buttons in grid row 8, columns 8–12, to set the selected channel’s
    offset from −2 to +2 octaves. Press the centre button, column 10, for zero offset.
    Hold a step and choose an octave to set a step override. Press the same explicit
    octave again to remove its lock.'
  musical_use: Assign a bass, drum or melody part to each channel. Reuse a source
    pattern on several channels, then set each channel’s output and masks separately.
  related:
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#channel-editor
    behaviour_cases:
    - M-CHANNEL-001
    - M-LIVEUI-CHSELECT-001
    - M-REC-PARAM-002
    - M-REC-PARAM-004
    - M-REC-PARAM-008
    - M-REC-PARAM-019
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/ui_adapters/tasks.lua
    - lib/ui_router.lua
  controls:
  - gesture: Grid (3,8)
    result: Open the Channel Editor.
  - gesture: Tap a channel in grid row 1
    result: Select one of 16 channels; the selected channel supplies the current masks,
      locks and range.
  - gesture: E1 → E2 task → K3
    result: Open the named channel task; use the task list rather than an old screen-page
      shortcut.
  - gesture: Grid row 3
    result: Read the currently active scale slot during playback.
  - gesture: Grid (8,8)–(12,8), no step held
    result: Set the selected channel’s octave offset to −2, −1, 0, +1 or +2.
  - gesture: Press grid (10,8)
    result: Set the selected channel’s octave offset to zero.
  details:
  - title: Scale-slot feedback
    text: The scale-slot row indicates the selected channel’s active scale slot during
      playback. When a step with a scale lock is held, the row displays that lock
      instead of the moving active-scale indicator.
  - title: Channel octave scope
    text: The octave fader applies to the selected channel, not every channel in the
      pattern. Its centre sets a zero-octave offset; it does not disable a separate
      global-octave setting. Hold a step and choose an octave to set its override.
      Choosing the same explicit step octave again removes that lock; otherwise the
      channel offset applies.
  recipes: []
  scene_refs:
  - channel-routing-visible-scope
  - merge-overlap-and-union
  - workflow-compose-two-channels
  - trig-params-assignment-and-selection
  - hold-step-return
  review:
    status: verified
    cases:
    - M-PARAM-001
    - M-WORKFLOW-001
    - M-LIVEUI-FOLLOW-001
    note: Source and case definitions reviewed. Published native assertions and their
      scope are listed separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
