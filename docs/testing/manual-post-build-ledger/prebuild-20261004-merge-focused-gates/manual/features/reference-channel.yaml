- id: removing-masks
  title: Removing Masks
  audience: all
  summary: Clear step-mask overrides without changing channel mask defaults.
  prose: "On the Masks page, hold a step and press K2 to clear its step-mask overrides.\
    \ With no grid keys held, hold K1 and press K2 to clear all step-mask overrides\
    \ on the selected channel. Both actions preserve channel mask defaults, which\
    \ apply wherever an explicit step override is absent. Held steps take precedence\
    \ even while K1 is down. Other channels are unaffected.\n\n  \n  Removing masks\
