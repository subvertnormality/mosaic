- id: chord-acceleration
  title: Chord Acceleration
  audience: all
  summary: Change successive Strum or Arpeggio gaps using Spread and Acceleration.
    Zero Spread disables the acceleration effect.
  prose: 'Chord Acceleration modifies the spacing of an enabled Strum or Arpeggio
    together with Chord Spread. Off (0) means no progressive change: every gap is
    the selected division plus Spread. A positive value lengthens each following gap;
    a negative value shortens it. With Spread at zero, Acceleration has no effect.


    In channel-step units, let `d` be the Strum or Arp division, `s` be Spread, and
    `a` be Acceleration (zero when off). The gap before slot `k`, counting the first
    gap as 1, is `d + s * (1 + (k - 1) * a)`. The first slot occurs at trigger time;
    later slot times are the sums of these gaps. A new trigger restarts the ordinal.
    Wrapping an arp''s slots does not restart it. These are the nominal musical times
    before swing and clock-pulse quantisation. An arp interval occupies at least one
    scheduler pulse, including after swing. At fast channel rates, this limits the
    resolution of very short gaps.


    For a division of 1/2 and Spread of 1/4:


    | Acceleration | Successive gaps | Slot times from the trigger |

    |---|---|---|

    | Off | 3/4, 3/4, 3/4, 3/4 | 0, 3/4, 3/2, 9/4, 3 |

    | +1 | 3/4, 1, 5/4, 3/2 | 0, 3/4, 7/4, 3, 9/2 |

    | +2 | 3/4, 5/4, 7/4, 9/4 | 0, 3/4, 2, 15/4, 6 |

    | -1 | 3/4, 1/2, 1/4, then 0 | 0, 3/4, 5/4, 3/2, then stop |


    When the next gap is zero or negative, scheduling ends before that slot. There
    is no extra simultaneous note or reversed time; notes already sounding retain
    their releases. Empty slots, including trailing rests, advance the same ordinal
    in both strums and arps.'
  musical_use: Set Arpeggio to half a step, Spread to a quarter step and Acceleration
    to +1. Each successive gap increases.
