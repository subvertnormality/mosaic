- id: trig-merge-modes
  title: Trig Merge Modes
  audience: all
  summary: Select All, Skip or Only to determine which overlapping pattern trigs play.
  prose: 'Skip, Only and All are the first three choices of the shared Strategy selector.
    They define how trigs are combined across assigned patterns:


    * **All**: Trigs will apply if they appear on a step in any selected pattern.

    * **Skip**: Trigs will apply only if they appear on a step in exactly one selected
    pattern. If a trig appears on a step in multiple patterns, it won''t activate.

    * **Only**: Trigs will apply only if they appear on a step in more than one selected
    pattern, ignoring those that appear in just one.'
  musical_use: Select All to play trigs from any assigned pattern. Select Skip to
    exclude shared steps. Select Only to play steps shared by more than one pattern.
