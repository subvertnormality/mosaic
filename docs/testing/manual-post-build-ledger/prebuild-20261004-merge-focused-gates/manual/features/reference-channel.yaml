- id: norns-sound-sources-with-n-b
  title: Norns Sound Sources with n.b.
  audience: all
  summary: Select an installed supported n.b. voice for internal audio or Crow output.
  prose: 'Install a supported [n.b.](https://github.com/sixolet/nb/tree/main) mod
    to sequence internal sound sources or devices connected through Crow. Supported
    mods include:


    * [nb_ansible](https://github.com/sixolet/nb_ansible) for Ansible voices.

    * [emplaitress](https://github.com/sixolet/emplaitress/) offers four MI Plaits
    voices in parallel. Emplatress''s params can be locked in _Mosaic_. Emplaitress
    is sensitive to rapid notes. Check playback when using arpeggios, chords or small
    clock divisions.

    * [nb_jf](https://github.com/sixolet/nb_jf) accesses multiple voice modes from
    Just Friends, including individual mono voice (with slew), polysynth, kit, and
    unison modes.

    * [nb_crow](https://github.com/sixolet/nb_crow) for Crow v/8 and envelope functions.

    * [nb_drum_crow](https://github.com/entzmingerc/nb_drumcrow) turns a monome crow
    into a synthesizer.

    * [nb_polyperc](https://github.com/dstroud/nb_polyperc) poly perc. Poly perc''s
    params can be locked in _Mosaic_.

    * [nb_rudiments](https://github.com/entzmingerc/nb_rudiments) percussion synth.

    * [nb_doubledecker](https://github.com/sixolet/doubledecker) 2-layer synth. Doubledecker''s
    params can be locked in _Mosaic_.

    * [nb_oilcan](https://github.com/zjb-s/oilcan) percussion sync. Oilcan''s params
    can be locked in _Mosaic_.


    Installed n.b. devices are detected automatically. Install the required mod, then
    select its voice in the device picker. Adding too many internal sound engines
    to channels can overload norns.'
  musical_use: Assign one internal voice and check playback. Add further voices before
    increasing chord density or arpeggio rate; multiple sound engines increase norns
    processing load.
  related:
  - devices
  sources:
    readme: manual/legacy/README-1.4.0.md#norns-sound-sources-with-n-b
    behaviour_cases: []
    code:
    - lib/devices/device_descriptors.lua
    - lib/devices/nb_device_param_maps.lua
    - lib/step.lua
  controls:
  - gesture: Install and enable the supported n.b. mod, then open Channel tasks →
      Device
    result: Installed supported voices appear in the device picker.
  - gesture: Select the voice with E3 and apply with K3
    result: Route the channel to the chosen internal engine or Crow voice.
  details:
  - title: Choose three voices for a phrase
    text: Open Channel tasks, select Device, and turn E3 to choose an installed voice.
      The examples show Oilcan 1 on channel 1, Polyperc 1 on channel 2, and Doubledecker
      on channel 3. Each screen shows the selected voice before you press K3 to apply
      it. The following public K3 input is retained with the capture; the linked three-voice
      audio example lets you hear the resulting assignments together.
  recipes: []
  scene_refs:
  - software-player-oilcan
  - software-player-polyperc
  - software-player-doubledecker
  review:
    status: verified
    cases:
    - MA-AUDIO-bass-and-intervals
    - MA-AUDIO-oilcan-pocket
    - MA-AUDIO-three-voice-conversation
    note: Source and case definitions reviewed. Published native assertions and their
      scope are listed separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence: []
    applicability: native-ui
    native_gap: The linked canonical voice-picker frames precede K3; retained subsequent
