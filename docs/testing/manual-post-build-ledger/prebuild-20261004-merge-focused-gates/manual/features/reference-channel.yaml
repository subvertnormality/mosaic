- id: merge-modes
  title: Merge Modes
  audience: all
  summary: Set how assigned patterns supply trigs, notes, velocities and note lengths
    to a channel.
  prose: 'Use one shared Strategy selector for channel output. Press grid (14,8) to
    cycle Skip → Only → All → Foundation → Fragments, wrapping after Fragments. On
    Merge modes, select Strategy with E2 and turn E3 through the same choices; E3
    stops at the first and last choice. A successful choice requests immediately,
    without K3 Apply.


    Strategy is the requested choice. Active is what is sounding; Pending is an accepted
    change waiting for its boundary, or NONE. While stopped, a valid choice applies
    immediately. During playback, Boundary names NEXT CYCLE or NEXT PATTERN.


    Foundation controls trigs only. Note, velocity and length merge settings remain
    active. Fragments controls all four attributes. Retained note, velocity and length
    settings are labelled inactive and their values show SAVED. Those rows and their
    grid buttons do not edit saved values while Fragments is active. Select Skip,
    Only or All to restore the retained settings.


    Foundation needs a valid assigned anchor. A refused request leaves the cursor
    at FOUNDATION and shows NEEDS ANCHOR, while Active and Pending keep their accepted
    values. The next forward detent or grid press reaches Fragments.'
  musical_use: Choose a strategy, then compare channel playback. In a legacy strategy
    or Foundation, set the active note, velocity and length merge settings separately.
    In Fragments, compare its source fragments while the saved legacy settings remain
    inactive.
  related:
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#merge-modes
    behaviour_cases:
    - M-LIVEUI-MERGEMODES-001
    - M-LIVEUI-SHAPETRIG-001
    - M-UIACC-A10-001
    code:
