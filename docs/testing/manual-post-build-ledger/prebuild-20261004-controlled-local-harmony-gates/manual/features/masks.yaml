schema_version: 1
feature:
  id: masks
  title: Masks
  audience: all
  summary: Override channel and step trig, note, velocity, length and chord values.
  prose: Masks override attributes of the merged pattern data. Set a channel default to affect every step,
    or hold a step to set an individual override. Unset attributes use the channel default or merged pattern
    data.
  musical_use: Set a note mask to change pitch while retaining the pattern rhythm. Set individual velocity
    masks to add accents.
  related:
  - merge-modes
  - channel-length
  - chord-strum
  - fully-quantise-mask
  - arm-live-record
  sources:
    readme: README.md#masks
    behaviour_cases:
    - M-MASK-007
    - M-MASK-008
    - M-MASK-010
    - M-MASK-005
    - M-MASK-017
    - M-MASK-021
    code:
    - lib/pages/channel_edit_page/channel_edit_masks.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/ui_adapters/masks.lua
  controls:
  - gesture: Grid (3,8) → E1 tasks → E2 Masks → K3
    result: Open the eight mask values.
  - gesture: E2
    result: Choose Trig, Note, Vel, Len, Chd1–Chd4.
  - gesture: E3, no step held
    result: Edit the channel default.
  - gesture: Hold step + E3
    result: Edit that step's exception.
  - gesture: Hold K1 + tap step
    result: Add or remove a trig mask.
  - gesture: Hold step + K2
    result: Clear all mask attributes for the held step.
  - gesture: K1 + K2, no grid keys held
    result: Clear channel step overrides; preserve defaults.
  details:
  - title: Unset values and precedence
    text: X is an unset attribute, not zero. A step's explicit attribute wins over the channel default;
      an unset step uses the default; an unset default falls back to merged pattern data. Clearing step
      overrides does not erase the defaults.
  - title: Chord masks
    text: Chd1–Chd4 add four scale-relative voices above or below the root. 3rd and 5th specify intervals,
      not MIDI note numbers. Select a polyphonic output to play simultaneous chord voices. Use strum and
      chord velocity to adjust their timing and level.
  - title: Scale, degree and rotation
    text: Note masks snap to the selected scale by default. Degree and rotation apply only when full quantisation
      is enabled. See Snap Note Masks to Scale, Quantise Note Masks and Fully Quantise Mask for their
      precedence.
  - title: MIDI and clearing
    text: Hold a step and play a MIDI keyboard to enter notes and chords. Live recording also enters masks.
      With a step held, K2 clears that step even if K1 is held. Other channels are unaffected.
  - title: If a new note is silent
    text: Check the selected channel's output, active range and mute state. A trig alone needs an audible
      note, velocity and length. A mono voice cannot sound all chord voices together. To undo an exception,
      hold that step and press K2.
  - title: Note names on the Masks screen
    text: 'The Masks screen uses norns musicutil: floor(MIDI note / 12 − 2). MIDI note 60 is displayed
      as C3. The Fixed Note parameter uses a different label convention and displays MIDI note 60 as C5.
      Use numeric MIDI notes when comparing these controls.'
  recipes:
  - title: Change the end of a melody
    text: '1. Select C major.

      2. Enter MIDI notes 72, 74, 79 and 76 on steps 1, 4, 7 and 11 of a 16-step channel.

      3. Hold step 11 and set its note mask to MIDI 74.

      The first three notes remain unchanged. Change the mask to MIDI 72 to end on the root.'
  - title: Add a quiet note
    text: '1. Set the main accent to velocity 90.

      2. Add a note before the accent and set its velocity mask to 35.

      3. Set Trig Probability on the quiet note to make it intermittent.

      Velocity sets the level; probability determines whether the trig plays.'
  - title: Add chord voices
    text: '1. Enter MIDI 48 on a bass channel.

      2. Enter MIDI 60 on a polyphonic channel.

      3. Set its Chd1 and Chd2 masks to 3rd and 5th.

      The second channel plays a chord above the bass. Change one chord mask to adjust the voicing.'
  - title: Use different channel lengths
    text: '1. Set the drum channel length to 16 steps.

      2. Set a melody channel length to five steps.

      3. Start playback.

      The channels return to their shared start after 80 steps. Channel length and clock controls are
      described in their reference pages.'
scenes:
- id: mask-precedence
  title: Set channel and step note masks
  behaviour_case: M-MASK-007
  setup:
    fixture: four-note-pattern
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: route
    caption: Open Channel tasks with E1. Turn E2 to Masks and press K3. Select Note with E2.
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    expect:
      screen:
      - - note
        - X
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: default
    caption: With no step held, turn E3 to G3 (MIDI 67). All four steps use this channel note default;
      their velocities remain unchanged.
    inputs:
    - type: enc
      n: 3
      delta: 68
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 67
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: step-one
    caption: Hold step 1 and turn E3 five detents to C4 (MIDI 72). The step uses this note instead of
      the channel default.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 5
    expect:
      screen:
      - - note
        - C4
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: release-one
    caption: Release step 1. The screen returns to the G3 channel default; playback keeps the C4 exception.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 72
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: step-two
    caption: Hold step 2, turn E3 to D4 (MIDI 74), then release it. Steps 1 and 2 now have individual
      note masks.
    inputs:
    - type: grid
      x: 2
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 7
    - type: grid
      x: 2
      y: 4
      state: 0
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 72
        - 127
      - port: 1
        bytes:
        - 144
        - 74
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: clear-one
    caption: Hold step 1 and press K2. Release it. Its exception disappears; step 2 still plays D4.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: key
      n: 2
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 67
        - 127
      - port: 1
        bytes:
        - 144
        - 74
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#removing-masks
  - id: clear-channel
    caption: With no grid keys held, hold K1 and press K2. All step exceptions clear; G3 remains the channel
      default.
    inputs:
    - type: key
      n: 1
      state: 1
    - type: key
      n: 2
    - type: key
      n: 1
      state: 0
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 67
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#removing-masks
- id: mask-expression
  title: Set velocity and length masks
  behaviour_case: M-MASK-008
  setup:
    fixture: four-note-pattern
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: velocity
    caption: Open Masks and select Vel. X means inherit the pattern's velocity.
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 2
      delta: 1
    expect:
      screen:
      - - velocity
        - X
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: soft-default
    caption: Set a channel velocity of 50. Every note is softer; pitch and timing are inherited.
    inputs:
    - type: enc
      n: 3
      delta: 51
    expect:
      screen:
      - - velocity
        - '50'
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 50
      - port: 1
        bytes:
        - 144
        - 62
        - 50
      - port: 1
        bytes:
        - 144
        - 64
        - 50
      - port: 1
        bytes:
        - 144
        - 65
        - 50
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: accent
    caption: Hold step 1 and turn E3 to velocity 90. Release it. Step 1 plays at velocity 90; other steps
      use the channel default of 50.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 40
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - velocity
        - '50'
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 90
      - port: 1
        bytes:
        - 144
        - 62
        - 50
      - port: 1
        bytes:
        - 144
        - 64
        - 50
      - port: 1
        bytes:
        - 144
        - 65
        - 50
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: zero
    caption: Hold step 2 and turn E3 down to 0. Zero is a silent velocity, distinct from the X inheritance
      state.
    inputs:
    - type: grid
      x: 2
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: -50
    expect:
      screen:
      - - velocity
        - '0'
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: restore
    caption: 'Release step 2, then hold it again and press K2. Release it: the channel velocity 50 returns.'
    inputs:
    - type: grid
      x: 2
      y: 4
      state: 0
    - type: grid
      x: 2
      y: 4
      state: 1
    - type: key
      n: 2
    - type: grid
      x: 2
      y: 4
      state: 0
    expect:
      screen:
      - - velocity
        - '50'
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 90
      - port: 1
        bytes:
        - 144
        - 62
        - 50
      - port: 1
        bytes:
        - 144
        - 64
        - 50
      - port: 1
        bytes:
        - 144
        - 65
        - 50
    citation: README.md#removing-masks
  - id: length
    caption: Select Len and turn E3 to 1/2. Each note has a half-step gate.
    inputs:
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 3
      delta: 8
    expect:
      screen:
      - - length
        - 1/2
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 90
      - port: 1
        bytes:
        - 144
        - 62
        - 50
      - port: 1
        bytes:
        - 144
        - 64
        - 50
      - port: 1
        bytes:
        - 144
        - 65
        - 50
      durations:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
- id: mask-chords
  title: Set chord masks
  behaviour_case: M-MASK-010
  setup:
    fixture: four-note-pattern
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: chord
    caption: Open Masks and select Chd1. The four chord slots add voices to the root.
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 2
      delta: 3
    expect:
      screen:
      - - chord_1
        - X
    citation: README.md#adding-chords
  - id: thirds
    caption: Turn E3 two detents to 3rd. These are scale-relative intervals, not absolute MIDI note numbers.
    inputs:
    - type: enc
      n: 3
      delta: 2
    expect:
      screen:
      - - chord_1
        - 3rd
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 127
      - port: 1
        bytes:
        - 144
        - 64
        - 127
      - port: 1
        bytes:
        - 144
        - 62
        - 117
      - port: 1
        bytes:
        - 144
        - 65
        - 117
      - port: 1
        bytes:
        - 144
        - 64
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 65
        - 97
      - port: 1
        bytes:
        - 144
        - 69
        - 97
    citation: README.md#adding-chords
  - id: fifth
    caption: Hold step 1 and turn E3 from 3rd to 5th. That step plays MIDI notes 60 and 67.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 2
    expect:
      screen:
      - - chord_1
        - 5th
    citation: README.md#adding-chords
  - id: release
    caption: Release step 1. The screen shows the channel 3rd again, while the first chord remains a fifth.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - chord_1
        - 3rd
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 127
      - port: 1
        bytes:
        - 144
        - 62
        - 117
      - port: 1
        bytes:
        - 144
        - 65
        - 117
      - port: 1
        bytes:
        - 144
        - 64
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 65
        - 97
      - port: 1
        bytes:
        - 144
        - 69
        - 97
    citation: README.md#adding-chords
  - id: clear
    caption: Hold step 1 and press K2, then release. The fifth is gone and the default thirds return.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: key
      n: 2
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - chord_1
        - 3rd
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 127
      - port: 1
        bytes:
        - 144
        - 64
        - 127
      - port: 1
        bytes:
        - 144
        - 62
        - 117
      - port: 1
        bytes:
        - 144
        - 65
        - 117
      - port: 1
        bytes:
        - 144
        - 64
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 65
        - 97
      - port: 1
        bytes:
        - 144
        - 69
        - 97
    citation: README.md#removing-masks
- id: mask-trigs
  title: Add and remove trig masks
  behaviour_case: M-MASK-005
  setup:
    fixture: four-note-eight-step
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: route
    caption: Open Masks. The source pattern contains four notes followed by four empty steps in an eight-step
      loop.
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    expect:
      screen:
      - - note
        - X
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: voice
    caption: Set Note to C3, Vel to 80 and Len to a half-step. These defaults make a new trig audible.
    inputs:
    - type: enc
      n: 3
      delta: 61
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 3
      delta: 81
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 3
      delta: 8
    expect:
      screen:
      - - length
        - 1/2
    citation: README.md#adding-trig-masks
  - id: add
    caption: Hold K1 and tap step 5. A forced-on trig adds an extra C3 after the source's four notes.
    inputs:
    - type: key
      n: 1
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 0
    - type: key
      n: 1
      state: 0
    expect:
      screen:
      - - length
        - 1/2
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      - 4
      cycle_steps: 8
    citation: README.md#adding-trig-masks
  - id: remove
    caption: Repeat K1 + step 5 to remove that note. The original four-note rhythm continues.
    inputs:
    - type: key
      n: 1
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 0
    - type: key
      n: 1
      state: 0
    expect:
      screen:
      - - length
        - 1/2
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#adding-trig-masks
