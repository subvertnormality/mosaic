  controls:
  - gesture: Choose Rhythm Doctor; stop the sequencer before recording
    result: Open capture and paint for the selected bank.
  - gesture: 'Empty bank: grid (1,2)'
    result: Start Record. Press again or use K3 after ENOUGH / REC OR K3 to finish.
  - gesture: Record before enough audio, or Record on an occupied bank
    result: Open an abandon/clear question; K2 cancels and K3 confirms. Clearing a bank preserves already
      painted patterns.
  - gesture: 'Before capture: E2/E3 edit setup → K3 confirm; K2 cancels.'
    result: Record uses the confirmed Auto/Manual tempo and Stereo/L/R settings for the take. Manual uses
      the selected integer BPM and starts timing at recording start.
  - gesture: 'Ready bank: select a lane, then E2 field → E3'
    result: Browse Window bar/step, sensitivity or paint policy.
  - gesture: 'Ready bank: select Alignment → K3'
    result: Open the tempo, start beat and fine-start draft. K2 cancels; K3 confirms explicit alignment
      and replaces the earlier capture timing.
  - gesture: Grid (10,8) / (12,8); hold for a phrase
    result: Move the recording window one step backward / forward, or a whole four-bar phrase.
  - gesture: Grid (11,8)
    result: Return the window to its calculated phrase start.
  - gesture: Select destination pattern in row 1 → grid (16,8) twice
    result: Preview the selected lane, then paint it; grid (14,8) cancels the preview.
  details:
  - title: Recording and playback
    text: Stop the transport before recording. After analysis produces a ready bank, browse, adjust and
      paint it while playback runs.
  - title: Capture and analysis results
    text: Capture, analysis and painting are separate stages. A backend failure shows an explicit error
      and does not produce a ready bank. The retained README describes the ten broad instrument lanes
      as an experimental detector; it does not specify detection accuracy.
  - title: Paint destination
    text: Select the destination pattern and song slot before previewing. Changing either invalidates
      the prepared Doctor paint preview. Preview again before committing.
  - title: Local worker requirements
    text: The default path uses python3 to launch the worker and gcc to compile the shipped model-free
      C detector. It does not require third-party Python packages.
  - title: Vertical list controls
    text: 'Rhythm Doctor’s setup, capture, analysis, window, alignment and paint screens show labelled
      vertical rows. Select an editable row with E2 and change it with E3. Read the contextual footer
      before confirming an action: the grid Paint button remains the painting control, and K3 does not
      substitute for it. This display change does not change capture, lane selection or paint scope.'
  - title: Confirmed capture setup
    text: Confirm the setup with K3 before Record. Stereo preserves separate left/right channels; L or
      R duplicates that chosen input into both channels. Manual uses 40–240 integer BPM from recording
      start; Auto estimates tempo and phrase start. A later explicitly confirmed Alignment draft takes
      precedence.
