  controls:
  - gesture: 'Pattern Trig: tap row-1 pattern button'
    result: Choose the source pattern for editing.
  - gesture: Tap a sequencer step in grid rows 4–7
    result: Toggle a trig; active trigs glow brightly.
  - gesture: Hold a trig and choose its end step
    result: Set the note’s length; dimmer steps show its duration, cut short by another trig in the same
      pattern.
  - gesture: Tap algorithm button, columns 12–16 of row 2
    result: Select Drum, Tresillo, Euclidean, Numeric Repetitor or Rhythm Doctor.
  - gesture: Tap Paint at grid (16,8), then tap it again
    result: Preview the generated pattern, then commit it; flashing steps show the preview.
  - gesture: Tap Cancel at grid (14,8)
    result: Discard the prepared preview.
  - gesture: Grid (10,8), (11,8), (12,8)
    result: Move the preview left, reset its shift, or move it right; paint to commit.
  - gesture: Grid row 3, columns 12–16, with Drum or Tresillo selected
    result: Select one of five algorithm banks.
  - gesture: Grid row 3, columns 12–15, with Numeric Repetitor selected
    result: Select one of four banks. Euclidean and Rhythm Doctor do not use this bank fader.
  - gesture: Grid row 2, columns 1–10
    result: Set the algorithm’s first parameter. The outer buttons decrement/increment; inner buttons
      choose broader values.
  - gesture: Grid row 3, columns 1–10
    result: Set the second algorithm parameter for Tresillo, Euclidean or Numeric Repetitor. This fader
      is disabled for Drum and Rhythm Doctor.
  details:
  - title: Algorithm faders
    text: 'Use the left faders to edit the generated pattern before painting. The first fader occupies
      columns 1–10 of row 2; the second occupies the same columns of row 3. Each end button changes its
      value by one. The inner buttons select proportional values, with the centre selecting the middle
      value. The enabled parameters depend on the algorithm: Drum uses Pattern 1 (1–128); Tresillo uses
      Pattern 1 and Pattern 2 (each 1–128); Euclidean uses Fill and Length (each 1–32); Numeric Repetitor
      uses Pattern 1 (1–32) and Pattern 2 (1–16). Rhythm Doctor disables these faders and uses its capture
      controls.'
  - title: Bank selection
    text: Select banks with the row-3 fader starting at column 12. Drum and Tresillo have five bank choices;
      Numeric Repetitor has four. Euclidean and Rhythm Doctor do not use bank selection. Changing an enabled
      parameter or bank refreshes the prepared algorithm pattern.
