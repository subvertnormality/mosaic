- id: adding-notes
  title: Adding Notes
  audience: all
  summary: Set source-pattern notes as scale degrees relative to the channel’s active root.
  prose: 'Pattern notes are positions relative to the active scale root, not fixed pitches. In C major,
    position 0 is C, one step above is D and one step below is B. Changing the channel scale to E minor
    makes the same positions E, F sharp and D.


    Sequenced scale and degree changes described in [Harmony Design](#harmony-design) affect pattern output.
    Use pattern notes for harmony and rhythm parts. Patterns can also provide melodies, but changing a
    scale progression changes their tonality. Use [Masks](#masks) to enter a deliberate melody independently.


    From Pattern Trig, press the third global-menu button again to open Pattern Note.


    The grid displays 16 steps at a time. Active trigs show dim vertical bars; a dim horizontal line marks
    the root. Selected note values glow brightly. Press a cell in a step’s column to set its note. Hold
    K1 while entering a note to copy it to the corresponding position across all four step pages.


    The channel supplies the scale; the pattern does not own it. The same source pattern can therefore
    play different notes on different channels. Use the norns channel grid viewer to inspect channel output.


    Use the step-page buttons to select one of four groups of 16 steps.


    Use the outer note-range buttons to move the displayed range up or down one step. Hold an outer button
    to reach its extreme. Press the middle button to return to the page with the root note on the bottom
    row.


    A step without a trig can still store note data for use by another merge mode.


    The top row flickers to indicate the selected pattern. Hold a top-row button, or hold K1 and press
    it, to select another pattern.


    The norns Pattern Note screen shows the viewed channel’s steps as 64 cells. Turn E3 to view another
    channel.


    Pattern editor note page demo'
  musical_use: Enter a repeating scale-degree pattern. Assign it to two channels with different scales.
    Set note masks where a channel needs specific pitches.
