- id: rhythm-doctor
  title: Rhythm Doctor
  audience: all
  summary: Select the fifth pattern algorithm at grid column 16, row 2 to capture, analyse and paint rhythm
    lanes.
  prose: "Rhythm Doctor is the fifth pattern-editor algorithm, at grid column 16, row 2.\nSetup and workflow\
    \ screens use labelled vertical rows. E2 selects an editable row and E3 changes it. The contextual\
    \ footer names confirmation actions; painting still uses the grid Paint control.\nEach project retains\
    \ one captured bank. Select a lane, preview a 64-step\nwindow, then paint it into the selected pattern.\n\
    \nThe lanes occupy a block of five columns on each of two rows, starting at\ncolumn 3: lanes one to\
    \ five on row 2 at columns 3–7, and lanes six to ten on\nrow 3 at the same columns. Column 1 of row\
    \ 2 is Record, column 2 is reserved,\nand columns 12–16 of both rows belong to the algorithm and bank-mask\
    \ faders and\nare never lanes. A bank analysed on the device declares three lanes — **BD**\n(bass\
    \ drum), **SD** (snare drum) and **CYM** (hi-hats and cymbals) — so only\nthe first three cells light.\
    \ A remote analysis declares up to ten, which is why\nthe block is two rows: a single row would run\
    \ the later lanes under the\nalgorithm fader, where selecting one would also change the algorithm.\n\
    \nLanes read in kit order rather than alphabetically: kick, snare, hi-hat,\ncymbals and toms fill\
    \ the top row, and whatever else the analysis separated out\n— bass, guitar, piano, vocals and demucs'\
    \ residual **OTHER** — follows on the\nbottom row. A lane neither of those names keeps a stable alphabetical\
    \ place\nafter the ones they do, so an unfamiliar backend still puts its columns in the\nsame order\
    \ every time a project loads. A bank saved before this order existed\nis brought forward when it loads,\
    \ so an older capture does not keep an\nalphabetical grid until it is recorded again.\n\nThe lanes\
    \ describe what can be told apart reliably, not a full drum-kit\ntranscription. **CYM** is hats *and*\
    \ cymbals together because a closed hat and a\nride are both inharmonic metal with overlapping spectra,\
    \ and the decay that\ndistinguishes them in isolation is buried in a mix; separating them was measured\n\
    and does not work. Bass, open hi-hat and tom have no lane: none could be\ndetected reliably enough\
    \ to paint. Bass was tried and withdrawn — every\napproach either failed to separate a bass note from\
    \ the kick that hides it, or\nmarked the kicks themselves, so the lane only ever restated what BD\
    \ already\nsaid.\n\nRecording needs the sequencer stopped, because capture takes over the audio\n\
    input and analysis replaces the bank underneath whatever is on the screen. So\ndoes Alignment, which\
    \ re-analyses. Record, capture setup and Alignment do\nnothing while the sequencer runs, and the screen\
    \ says `STOP SEQUENCER` when\nthere is no bank to work on instead.\n\nA bank that has already been\
    \ analysed stays usable while the sequencer plays.\nChoosing a lane, browsing the recording, changing\
    \ sensitivity or paint policy,\nand previewing and painting all read a finished bank and write to\
    \ a pattern,\nwhich is what the rest of the Trigger Editor already lets you do while playing.\nStarting\
    \ the sequencer cancels an unfinished capture or analysis and closes a\ncapture-setup or alignment\
    \ draft, but keeps an armed paint preview, so you can\narm Paint, start the sequencer and commit.\
    \ Rhythm Doctor does not start or stop\nthe sequencer for you.\n\nOn an empty bank, press grid column\
    \ 1, row 2 to begin Record; the press starts\nthe action and its release is consumed. Press Record\
    \ again to stop, or press K3:\neither finishes the capture once the screen says `ENOUGH / REC OR K3`.\
    \ Until it\ndoes, the screen says `MORE AUDIO NEEDED`, and pressing Record then asks whether\nto abandon\
    \ the take instead. Pressing Record on an occupied bank asks whether to\nclear its capture bank. K2\
    \ cancels that question and K3 confirms it; clearing keeps patterns that\nwere already painted. In\
    \ a ready bank, use E2 to choose Window bar, Window\nstep, selected-lane sensitivity, Paint policy,\
    \ or Alignment, then use E3 to\nedit the chosen item. Window bar moves by 16 steps and Window step\
    \ by one; both\nview the same bounded timeline. Alignment shows `OPEN >`: choose it and press\nK3\
    \ (or turn E3) to open its tempo, start-beat, and fine-start settings; K2\ncancels and K3 applies\
    \ the draft.\n\nBefore recording, use E2/E3 to open and edit the setup draft for Auto or Manual tempo,\
    \ manual BPM (40–240), and Stereo/L/R input. Press K3 to confirm the settings for the take, or K2\
    \ to discard the draft. Record uses the confirmed settings.\n\nStereo records left and right separately.\
    \ L records the left input into both recorded channels; R records the right input into both. Auto\
    \ estimates tempo and phrase start from the recording. Manual uses the selected integer BPM and starts\
    \ the phrase at the beginning of recording. Applying an explicit Alignment draft later replaces that\
    \ capture timing.\n\nTo paint a ready lane, select the destination pattern with the top row, press\n\
    Paint (column 16, row 8) to preview, then press it again to commit. Cancel\n(column 14, row 8) discards\
    \ the preview. Toggle is the default paint policy;\nAdd and Replace are selectable on the Rhythm Doctor\
    \ screen. Painting does not\nalter the captured bank.\n\n**Finding the phrase.** Auto estimates where\
    \ the four-bar phrase begins and aligns gates to it. Manual starts the phrase at the beginning of\
    \ recording; Alignment can move it afterward. In this mode columns 10, 11 and 12 of row 8 browse the\
    \ recording, and\nthey do it with the same gestures that shift a previewed pattern everywhere\nelse.\
    \ A press of column 10 or 12 moves the window one step back or forward.\nHolding either of them covers\
    \ a whole four-bar phrase in that direction, which\nis exactly the width of the displayed window,\
    \ so every position reached by\nholding stays aligned with the phrase. A press of column 11 returns\
    \ to the\ncalculated phrase start. E3 still moves by a single bar or step. In every\nother algorithm\
    \ those three buttons continue to shift a previewed pattern's\nposition.\n\nEach move names where\
    \ it landed, as bar.beat.step, so the tooltip\nidentifies the current window position. A move that\
    \ the\nrecording absorbs -- a step forward when the window is already at the last\nwhole phrase, or\
    \ a return to a phrase start you are already sitting on --\nsays so instead of reporting a move that\
    \ did not happen. If you are painting\nwhile you browse, the preview follows the window: the grid\
    \ keeps showing the\ngates under the part of the recording you are looking at.\n\nUse the estimated\
    \ phrase start as an initial position. A crash on the first\nbeat or a fill before the bar provides\
    \ evidence for the bar boundary. Identical\nbars can make that boundary undecidable; check the reported\
    \ confidence. To\nchange the position, open ALIGNMENT and step START BEAT through the detected\nbeat\
    \ grid. The editor starts on the detected beat. Confirming without an edit\npreserves that position.\n\
    \n**Analysis server (advanced).** Analysis runs on the norns by default and\nneeds nothing configured.\
    \ If you run the optional analysis server on a computer\non the same network, Rhythm Doctor can send\
    \ the capture there instead and get\nback ten lanes rather than three: KICK, SNARE, TOMS, HIHAT and\
    \ CYMBALS from a\nmodel that separates a kit into its pieces, and BASS, GUITAR, PIANO, VOCALS and\n\
    OTHER from the rest of the mix. The melodic lanes carry rhythm and velocity,\nnot notes.\n\nSet it\
    \ up in PARAMS > MOSAIC > Rhythm Doctor: put the address in **Analysis\nserver** (for example `http://192.168.1.50:8420`)\
    \ and switch **Use analysis\nserver** on. The switch is separate from the address so you can keep\
    \ a server\nsaved while working locally.\n\nThe on-device analysis stays the default and the fallback.\
    \ If the server is\nswitched off, unreachable, slower than its timeout, or returns anything Mosaic\n\
    does not accept, the capture is analysed on the norns instead and you still get\ngates. You lose the\
    \ extra lanes, not the recording.\n\nThe server also tracks the beat with a model trained for it,\
    \ so on the remote\npath the tempo and the phrase start are usually better than the on-device\nestimate.\n\
    \n`tools/rhythm_doctor_server/README.md` has step-by-step setup, including a\nWindows walkthrough\
    \ that needs no administrator rights, how to find the\naddress to type into the setting, and what\
    \ to check when captures keep coming\nback with three lanes. Three lanes is the on-device fallback:\
    \ it is what you\nget whenever the server cannot be reached, so it is the symptom to look for\nrather\
    \ than an error message.\n\n**Availability:** Mosaic starts a local capture helper when this mode\
    \ opens,\nand analyses captures with a model-free detector it builds from source the\nfirst time this\
    \ mode is used. Nothing is downloaded, no Python packages are\nneeded. The local worker uses python3\
    \ to launch the analysis and gcc to compile the shipped C source. No analysis server configuration\
    \ is required. The build takes about half a\nminute on a Norns and is then reused. Analysis of a 45-second\
    \ capture takes\nroughly half a minute on the device.\n\nIf no C compiler is available, or the build\
    \ fails, analysis fails closed with\n`ANALYSIS_BACKEND_UNAVAILABLE` and no bank is produced. A delivery\
    \ profile can\nstill point the analysis worker at its own executable that accepts the worker\nrequest/result\
    \ protocol and returns the lanes it declares, in which case that\none is used instead. No detector\
    \ quality, transcription accuracy, or timing\nperformance is claimed here.\n\nEach algorithm has its\
    \ own grid options. Press a grid control to display its function on norns.\n\nThe left side faders\
    \ adjust algorithm values. Brightly lit end buttons refine values, with the furthest left-hand button\
    \ incrementing downwards and the furthest right-hand button incrementing upwards. The dimmer ones\
    \ in the middle of the faders adjust values broadly. \n\nThe rightmost fader typically toggles between\
    \ different banks in the selected algorithm.\n\nPress Prime to preview the selected algorithm’s pattern.\
    \ Potential new steps are shown as flashing bright steps on the sequencer. While these steps flash,\
    \ they aren't painted yet. Any step that would be painted over an existing active step will blink\
    \ dimly. By painting the new pattern, you'll deactivate the faintly blinking steps. You can modify\
    \ algorithm parameters while the pattern is primed.\n\nIf you haven't painted the new pattern, the\
    \ prime button continues to blink. Pressing it again paints your edits. Pressing the prime button\
    \ again without tweaking the algorithm or its parameters effectively acts as an undo for the last\
    \ action.\n\nPress Cancel to discard a prepared pattern.\n\nWhile previewing a new pattern, use the\
    \ move controls to shift its position. The first button shifts it left, the third to the right, and\
    \ the center button resets it. Press Paint to commit the changes. Pressing prime, cancel or a move\
    \ button shows the Paint Preview screen on the norns: whether a preview is showing, the algorithm\
    \ it comes from, the shift, and how many steps it triggers. In Rhythm Doctor these same three buttons\
    \ browse the recording instead, with the same gestures: a press of the outer two moves the window\
    \ one step, holding either covers a whole four-bar phrase, and the centre button returns to the calculated\
    \ start of the phrase.\n\nOn the Norns screen, Pattern Trig shows the pattern you are editing brightly\
    \ over the viewed channel's steps, which stay dim as context; the viewed channel is the merged version\
    \ of the channel. The title row names both (`PAT02 CH01`). Channel view, in the pattern task list,\
    \ shows the viewed channel on its own. Use E3 to view another channel; it does not change the selected\
    \ channel. Choose Options from the pattern task list (E1) to edit the tresillo multiplier in use;\
    \ a new multiplier takes effect the next time you prime the tresillo algorithm. Change the multiplier\
    \ and prime Tresillo again to compare the generated rhythm.\n\n  \n  Pattern editor trig page demo"
  musical_use: Record a percussion phrase into an empty bank. Select a lane and an unused destination
    pattern. Adjust sensitivity and paint policy, preview the result, then paint it.
