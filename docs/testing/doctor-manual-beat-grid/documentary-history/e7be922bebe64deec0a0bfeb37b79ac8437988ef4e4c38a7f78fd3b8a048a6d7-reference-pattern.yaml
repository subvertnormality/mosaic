- id: adding-velocity
  title: Adding Velocity
  audience: all
  summary: Set source-pattern velocities using fourteen discrete grid levels from MIDI 127 to 0.
  prose: 'From Pattern Note, press the third global-menu button again to open Pattern Velocity.


    The velocity editor operates like the note editor. Its two extreme vertical pages show velocities
    127–68 and 58–0. Press a velocity-range button to move the displayed range by one value level. Hold
    it to reach an extreme.


    The norns Pattern Velocity screen shows the viewed channel’s steps as 64 cells. Turn E3 to view another
    channel.


    Pattern editor velocity page demo'
  musical_use: Set higher velocities on the main hits and lower velocities on intervening hits. Use velocity
    masks for channel-specific overrides.
  related:
  - pattern-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#adding-velocity
    behaviour_cases:
