- id: scales-lock-until-pattern-end
  title: Scales Lock Until Pattern End
  audience: all
  summary: 'Retain channel scale locks until channel wrap or replacement. Default: On.'
  prose: 'Scales lock until ptn end defaults to On and controls channel scale locks.


    On retains a channel lock until the channel wraps to its start or another channel scale lock replaces
    it.


    Off clears the previous lock at the next active trig that passes its probability check. A probability-rejected
    trig does not clear it. A new scale lock on the accepted trig applies normally.


    Global scale-track locks are independent of this option. They remain until replacement or global-track
    wrap.'
  musical_use: Set On to retain a channel scale lock across subsequent trigs. Set Off to clear it at the
    next active trig that passes probability.
  related:
  - quantiser-options
  sources:
    readme: manual/legacy/README-1.4.0.md#scales-lock-until-pattern-end
    behaviour_cases:
