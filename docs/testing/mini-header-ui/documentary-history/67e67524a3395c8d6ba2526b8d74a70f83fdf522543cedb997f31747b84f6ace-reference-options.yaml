- id: ui-motion
  title: UI Motion
  audience: all
  summary: 'Enable decorative screen motion. Default: On. This setting does not change sequencer timing
    or input.'
  prose: 'Open PARAMS > MOSAIC > UI motion. Default: On. Off keeps screen decoration still.


    Fitting vertical-list labels, values, neighboring rows, title, scope and controls remain still. Only
    selected text that exceeds its available row scrolls right to left with motion On. A long selected
    value first uses a separate full-width row. With motion Off, shortened text uses ~; an exact value
    that cannot fit reports LAYOUT OVERFLOW instead of silently changing its displayed value.


    The miniature-header design replaces the four-tile title mark with a small screen graphic wherever
    it fits within the title area; title, scope and controls take priority. Normal icons occupy at most
    32 × 9 pixels; Masks and Trig params use 7 × 8 and retain all controls. Native norns PARAMS retains
    its own display.


    While playing, the miniature follows sequencer transport pulses. While stopped, it follows the selected
    norns musical clock without starting playback or emitting notes. Motion Off or an invalid or unavailable
    clock holds the rest pose. It uses musical position rather than elapsed wall time.


    Startup and selection shadows on the retained overview grids remain decorative. This setting does
    not change input or sequencer timing. Actual-app miniature-header acceptance is pending; design previews
    are not native captures.'
  musical_use: Set Off for a still screen. Set On for animated screen feedback.
  related:
  - screen-options
  sources:
    readme: manual/legacy/README-1.4.0.md#ui-motion
    behaviour_cases: []
    code:
    - lib/application_parameters.lua
    - lib/ui_motion.lua
    - lib/ui_render.lua
    - lib/ui_characters.lua
    - lib/ui_live.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select UI motion. Change its value.
    result: 'Off keeps the screen still; On enables decorative motion and musical characters without changing
      input or sequencer timing. Default: On.'
  details:
  - title: Selected overflow text
    text: Overflow scrolling is restricted to the selected label or value. Fitting text and neighboring
      rows remain stationary. Off stops scrolling; ~ indicates shortened text, and exact values that cannot
      fit report LAYOUT OVERFLOW.
  - title: Miniature header timing
    text: Playing uses musical sequencer transport position. Stopped uses the selected musical clock and
      does not start Mosaic or sound notes. Off or missing/invalid clock holds the rest pose. Native PARAMS
      owns its own screen.
  recipes: []
  scene_refs: []
