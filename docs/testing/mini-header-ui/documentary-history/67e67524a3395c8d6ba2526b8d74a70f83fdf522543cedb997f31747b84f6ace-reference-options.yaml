- id: parameter-slides-wrap
  title: Parameter Slides Wrap
  audience: all
  summary: 'Allow the final parameter slide to reach the first lock across a repeating pattern boundary.
    Default: Off.'
  prose: Wrap param slides defaults to Off. With On selected and the current song pattern repeating, the
    final parameter slide can return to the first eligible lock earlier in the sequence. Wrapping follows
    the effective channel range. On a full 64-step range, this crosses the step-64 boundary described
    in the archived README.
  musical_use: Enable wrapping to repeat a parameter transition across the channel range boundary.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#parameter-slides-wrap
    behaviour_cases:
    - M-PATCH-018
    - M-PATCH-021
    - M-PATCH-022
    - M-PATCH-023
    - M-PATCH-026
    - M-SLIDE-STEP-001
    code:
    - lib/application_parameters.lua
    - lib/models/program.lua
    - lib/clock/slide_lifetime.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Wrap param slides. Change its value.
    result: 'On lets an eligible final parameter slide target the first lock within the repeating pattern;
      different song patterns are not joined. Default: Off.'
  details:
  - title: Channel range boundary
    text: Wrapping follows the channel’s configured start and end steps. It is not limited to a fixed
      step-64 boundary.
  - title: Legacy wording awaiting reconciliation
    text: The preserved legacy README paragraph describes wrapping beyond step 64. The current owner uses
      the effective channel range, capped by the song pattern’s global length, as reflected in the control
      table. This boundary wording is awaiting reconciliation in the manual discrepancy review.
  recipes: []
  scene_refs:
  - slide-wrap-boundary
  - last-lock-slide-wrap
  review:
    status: verified
    cases:
    - M-SLIDE-STEP-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
    - scene: slide-wrap-boundary
      data: reference-parameter-scenes.json
      clock_mode: real-time
      run: /home/andy/mosaic-manual-runs/d0a8dc021ded4143b41130c987418b04
      data_sha256: 335dabb07b3dcba565ce8f39b9cd08b46b60809da8042dd80017ec8449d62f07
