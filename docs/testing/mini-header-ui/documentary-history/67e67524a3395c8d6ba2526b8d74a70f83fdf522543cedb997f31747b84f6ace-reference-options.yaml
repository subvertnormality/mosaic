- id: reset-at-song-editor-pattern-change
  title: Reset at Song Editor Pattern Change
  audience: all
  summary: 'Reset channel positions when the song pattern changes. Default: On.'
  prose: Reset on song seq change defaults to On. On resets all channel positions when the Song Editor
    changes to another pattern. Set Off to continue channel phases across the change, including channels
    with different lengths.
  musical_use: Set On to restart channel phrases at each section. Set Off to continue their phases.
  related:
