- id: reset-at-pattern-repeat
  title: Reset at Pattern Repeat
  audience: all
  summary: 'Reset channel positions when the song pattern repeats. Default: Off.'
  prose: Reset on pattern repeat defaults to Off. On resets all channels to their starting steps when
    the same Song Editor pattern repeats at the end of a song sequence. Channels with custom lengths restart
    at each repeat. Set Off to retain their phases.
  musical_use: Set On to restart unequal channel lengths at each pattern repeat.
