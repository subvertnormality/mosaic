name: Run tests
on:
  push:
    branches: [ main ]
  pull_request:
    # Stacked release branches are gated too: a pull request into a release
    # branch is reviewed on the same evidence as one into main, and without
    # this a stacked PR shows no checks at all rather than showing red.
    branches: [ main, codex/1.4.0, codex/rhythm-doctor-phrase ]

jobs:
  Run-tests-on-Ubuntu:
    name: Run tests on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"
      - run: ./test.sh
