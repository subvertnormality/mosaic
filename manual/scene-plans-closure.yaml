- id: screen-motion-on-and-off
  feature_id: ui-motion
  title: Turn screen motion on or off
  behaviour_case: M-MANUAL-CLOSURE-MOTION-001
  citation: README.md#ui-motion
  related:
  - screen-options
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs on steps 1 to 4
      (the channel range) with notes C3, D3, E3 and F3 (MIDI 60, 62, 64, 65) at velocities 127, 117, 107
      and 97. Tempo is the default 90 BPM, Rate is /1 (sixteenth-note steps, one sixth of a second each)
      and the sequencer is stopped. The norns shows channel 1''s Device screen and every Mosaic option
      is at its default. UI motion is at its default On.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: off-menu
    title: Set UI motion Off
    caption: Tap K1 and open PARAMS > MOSAIC and select UI motion in the Screen section. Turn E3 left
      to Off. The row shows Off. UI motion only changes decoration; it never changes timing or input.
    assertion:
      kind: selected-menu-option-row
      label: UI motion
      value: 'Off'
      matched: true
  - id: off-rest
    title: Open the Clock screen and set Rate /1.5 (motion Off)
    caption: 'Close the menu. Turn E1 to Channel tasks, turn E2 to Clock and press K3 to open the Clock
      screen (Rate, Feel source, Swing type). Turn E3 to set Rate to /1.5 and press K3 to apply. Look
      at the mark in the top-right corner of the screen: it is in its rest pose.'
    assertion:
      kind: manual-motion-pose
      enabled: false
      phase: rest
  - id: off-moved
    title: 'Wait: the mark does not move (motion Off)'
    caption: 'Wait half a second and look at the same corner again. With UI motion Off the mark has not
      changed, and Rate, Feel source and Swing type are as readable as before.'
    assertion:
      kind: manual-motion-pose
      enabled: false
      phase: moved
      at_rest: true
  - id: off-list
    title: Set Rate back to /1
    caption: Set Rate back to /1 the same way, turning E3 and pressing K3. Every label and value stays
      fully readable and the header mark stays in its rest pose.
    assertion:
      kind: manual-motion-stable-rows
      enabled: false
      clock_value: /1
      decorative_mark_changed: false
      passed: true
  - id: off-phrase
    title: Play the phrase with motion Off
    caption: Press Play (1,8), let the four-note pattern play and press Play again to stop. With UI motion
      Off you hear C3, D3, E3, F3 (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97; keep this
      as the reference.
    assertion:
      kind: manual-motion-music
      enabled: false
      pitches:
      - 60
      - 62
      - 64
      - 65
      velocities:
      - 127
      - 117
      - 107
      - 97
      stopped: true
      passed: true
  - id: on-menu
    title: Set UI motion On
    caption: Tap K1 and open PARAMS > MOSAIC, select UI motion and turn E3 right to On. The row shows
      On.
    assertion:
      kind: selected-menu-option-row
      label: UI motion
      value: 'On'
      matched: true
  - id: on-rest
    title: Open the Clock screen and set Rate /1.5 (motion On)
    caption: 'Close the menu and open the Clock screen again (E1 to Channel tasks, E2 to Clock, K3). Set
      Rate to /1.5 with E3 and press K3. Watch the mark in the top-right corner: this is the moment it
      passes through its rest pose, the same picture as with motion Off.'
    assertion:
      kind: manual-motion-pose
      enabled: true
      phase: rest
  - id: on-moved
    title: 'Wait: the mark has moved (motion On)'
    caption: 'Wait a fraction of a second and look at the same corner. The mark has turned to another
      pose while Rate, Feel source and Swing type still read exactly the same.'
    assertion:
      kind: manual-motion-pose
      enabled: true
      phase: moved
      at_rest: false
  - id: on-list
    title: Set Rate back to /1
    caption: Restore Rate to /1 with E3 and K3. Labels and values are still fully readable while the
      header mark keeps moving.
    assertion:
      kind: manual-motion-stable-rows
      enabled: true
      clock_value: /1
      decorative_mark_changed: true
      passed: true
  - id: on-phrase
    title: Play the same phrase with motion On
    caption: 'Press Play (1,8), let the four-note pattern play and press Play again to stop. The notes
      (60, 62, 64, 65), velocities (127, 117, 107, 97), gates and transport LED are exactly what they
      were with UI motion Off: it changes only what the screen draws.'
    assertion:
      kind: manual-motion-music
      enabled: true
      pitches:
      - 60
      - 62
      - 64
      - 65
      velocities:
      - 127
      - 117
      - 107
      - 97
      stopped: true
      passed: true
- id: song-repeats-advance
  feature_id: navigating-the-norns-display
  title: Hear Repeats advance the song
  behaviour_case: M-MANUAL-CLOSURE-SONG-002
  citation: README.md#song-mode-operations
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays the four-step phrase (MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97)
      through a MIDI device at 90 BPM, Rate /1. Only Song slot 1 is filled, Song mode is at its default
      On and playback is stopped. The norns shows channel 1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: set-length
    title: Shorten the song to 8 steps
    caption: 'Press Song (6,8) and tap fader cell (2,7) on the Song page, then tap (8,7) seven times:
      Song Playback reads Global length 8, so one pass of a slot lasts 8 steps (about 1.3 seconds).'
    assertion:
      kind: dashboard-row
      label: Global length
      value: '8'
  - id: repeats-2
    title: Copy slot 1 to slot 2 an octave higher with Repeats 2
    caption: 'Hold slot 1 at (1,1), press slot 2 at (2,1) and release; tap (2,1) to select slot 2. Press
      Channel (3,8) and tap octave +1 at (11,8), then press Song (6,8). Turn E1 to Song tasks, E2 to
      Slot setup and press K3, turn E3 up one detent and press K3: Repeats reads 2 for slot 2.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Repeats
      value: '2'
  - id: slot-1
    title: Play slot 1 once
    caption: 'Press Song (6,8), tap slot 1 at (1,1) and press Play (1,8). Slot 1 is bright and plays C, D,
      E, F (MIDI 60, 62, 64, 65); Song Playback reads Pass 1 / 1. Watch the MIDI strip "MIDI sent in this
      step": each note is one sixth of a second after the last.'
    assertion:
      kind: manual-song-repeat-advance
      stage: slot-1
  - id: slot-2-pass-1
    title: Slot 2, first of two passes
    caption: 'After eight steps the song moves on by itself. Slot 2 is bright and slot 1 mid-bright; the
      phrase sounds an octave higher (MIDI 72, 74, 76, 77) and Song Playback reads Pass 1 / 2.'
    assertion:
      kind: manual-song-repeat-advance
      stage: slot-2-pass-1
  - id: slot-2-pass-2
    title: Slot 2, second pass
    caption: 'Slot 2 stays bright and plays the same octave-higher phrase again; Song Playback reads
      Pass 2 / 2. Repeats held the slot for exactly two passes.'
    assertion:
      kind: manual-song-repeat-advance
      stage: slot-2-pass-2
  - id: wrapped
    title: The song loops back to slot 1
    caption: 'Slot 3 is empty, so after slot 2 the song returns to slot 1: it is bright again, the notes
      drop back to C, D, E, F (MIDI 60, 62, 64, 65) and Song Playback reads Pass 1 / 1. Press Stop at
      (1,8).'
    assertion:
      kind: manual-song-repeat-advance
      stage: wrapped
- id: panic-stops-sounding-note
  feature_id: midi-panic
  title: Panic silences a note that is still sounding
  behaviour_case: M-MANUAL-CLOSURE-PANIC-001
  citation: README.md#midi-panic
  related:
  - song-editor
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes
      C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. The sequencer is stopped
      and three MIDI ports are connected. The norns shows channel 1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: note-sounding
    title: Start one long note
    caption: 'On Channel, hold step 1 at (1,4) and tap step 24 to set the channel range to steps 1 to
      24. Open Pattern (5,8) and tap steps 2, 3 and 4 to clear those trigs, then hold step 1 and tap step
      24 to give the one remaining trig a length of 24 steps: four seconds. Press Song (6,8), then Play
      (1,8). C (MIDI 60) starts and keeps sounding; the MIDI strip "MIDI sent in this step" shows only its
      Note On.'
    assertion:
      kind: panic-note-sounding
  - id: panic-released
    title: Hold Channel to panic
    caption: 'While the note sounds, hold Channel (3,8), a page you are not on, for about two seconds and
      release it. The note is cut off about a second and a quarter after it started, well before its four seconds are up: the MIDI
      strip shows the 6,144 note-offs of the panic sweep, 128 notes on each of the 16 MIDI channels of
      the three ports. The screen stays on Song and playback carries on, so C starts again when the
      loop comes round. Press Stop at (1,8).'
    assertion:
      kind: panic-releases-sounding-note
      released_early: true
      playback_continued: true
      passed: true
