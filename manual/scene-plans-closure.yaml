- id: polymeter-song-reset
  feature_id: reset-at-song-editor-pattern-change
  title: Restart or carry on at a song slot change
  behaviour_case: M-MANUAL-CLOSURE-RESET-001
  citation: README.md#song-editor
  steps:
  - id: start
    title: Starting point
    caption: 'A new project with playback stopped and Rate /1. Channel 1 plays range 1-4, MIDI 60, 62, 64
      and 65 at velocities 127, 117, 107 and 97, to its own MIDI output. Channel 2 is not set up yet. The
      norns shows channel 1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
    occurrence: 1
  - id: build
    title: Build channel 2 and a two-slot song
    caption: 'Give channel 2 its own MIDI output on the Device page, pattern 1 and the range steps 1-3, then
      open Masks and set its values: Note 79, Vel 40 and Len ½ on every step, with step 2 locked to Note
      81, Vel 60 and Len 1¼. Select channel 1. Press Song (6,8), set the global length fader to 10 steps and
      copy slot 1 into slot 2 (hold (1,1) and tap (2,1)). Each slot is now ten steps long and both play
      the same four-against-three pair.'
    assertion:
      kind: dashboard-row
      label: Global length
      value: '10'
      passed: true
  - id: reset-on-option
    title: Check Reset on song seq change
    caption: Tap K1 and open PARAMS > MOSAIC, select Reset on song seq change and turn E3 right to On (the
      default). The row reads On.
    assertion:
      kind: selected-menu-option-row
      label: Reset on song seq change
      value: 'On'
      matched: true
    occurrence: 1
  - id: reset-on
    title: Both loops restart at slot 2
    caption: 'Close the menu, tap slot 1 at (1,1) and press Play (1,8). Play slot 1 and the first four steps
      of slot 2, then press Stop. Ten steps in, the song moves to slot 2 and both channels start their
      loops again: channel 1 plays 60 and channel 2 plays 79 on step 11, as the MIDI strip "MIDI sent in
      this step" shows.'
    assertion:
      kind: song-boundary-reset-polymeter
      reset_on_song_change: true
      passed: true
  - id: reset-off-option
    title: Switch Reset on song seq change Off
    caption: Tap K1 and open PARAMS > MOSAIC, select Reset on song seq change and turn E3 left to Off. The
      row reads Off.
    assertion:
      kind: selected-menu-option-row
      label: Reset on song seq change
      value: 'Off'
      matched: true
    occurrence: 1
  - id: reset-off
    title: Neither loop restarts
    caption: 'Close the menu, tap slot 1 and press Play again, then press Stop after the first four steps of
      slot 2. This time the loops carry on across the slot change: on step 11 channel 1 plays 64, the
      third note of its four-note loop, and channel 2 plays 81, the second note of its three-note loop.'
    assertion:
      kind: song-boundary-reset-polymeter
      reset_on_song_change: false
      passed: true
