schema_version: 1
status: source-plan-not-yet-captured
scope: Specific public-input controls, original full-case MIDI assertions, Song LED/Slot Setup acceptance
  and native UI motion On/Off. Capture only after the new UI candidate freeze. Timing receipts characterize
  the admitted emulator runtime, with no hardware scheduling claim.
scenes:
- id: random-pentatonic-on
  feature_id: lock-random-to-pentatonic
  title: 'Lock random notes to pentatonic: On'
  behaviour_case: M-PARAM-039
  citation: README.md#lock-random-to-pentatonic
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs on steps 1 to 4
      (the channel range) with notes C3, D3, E3 and F3 (MIDI 60, 62, 64, 65) at velocities 127, 117, 107
      and 97. Tempo is the default 90 BPM, Rate is /1 (sixteenth-note steps, one sixth of a second each)
      and the sequencer is stopped. The norns shows channel 1''s Device screen and every Mosaic option
      is at its default. Lock random to pent. and Lock merged to pent. are both On, and no trig params
      are assigned yet.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: switch
    title: Check Lock random to pent.
    caption: Tap K1 and open PARAMS > MOSAIC, select Lock random to pent. and turn E3 right to On (the
      default). The row shows On. Notes moved by Random Note or Twos Random Note will snap to the five-note
      selection.
    assertion:
      kind: selected-menu-option-row
      label: Lock random to pent.
      value: 'On'
      matched: true
  - id: merged-off
    title: Turn Lock merged to pent. Off (not needed here)
    caption: Select Lock merged to pent. and turn E3 left to Off. The row shows Off. That option only
      affects notes made by merge modes, so it has no effect on this lesson's random notes; the recording
      turns it Off here and you can leave it On.
    assertion:
      kind: selected-menu-option-row
      label: Lock merged to pent.
      value: 'Off'
      matched: true
  - id: assign-random
    title: Assign Random Note
    caption: Close the menu. On Channel tasks > Trig params assign Random Note to the first slot. The
      slot list shows Random Note; its value is still 0, so the pattern is unchanged.
    assertion:
      kind: parameter-list-label
      label: Random Note
      passed: true
  - id: assign-twos
    title: Assign Twos Random Note
    caption: Assign Twos Random Note to the second slot in the same way. It stays at 0, so it adds nothing
      to this lesson; only Random Note is used.
    assertion:
      kind: parameter-list-label
      label: Twos Random Note
      passed: true
  - id: phrase
    title: Hear random notes locked to pentatonic
    caption: 'Select the Random Note slot, turn E3 right to 4 and press Play (1,8). Random Note 4 offsets
      each note by -2, -1, 0, +1 or +2 scale degrees chosen at random; with Lock random to pent. On every
      result snaps to the five-note selection C D E G A. Listen to several loops and press Stop. The recorded
      run begins 60, 64, 64, 64, 60, 64, 67, 64: step 4, a plain F (65), now sounds as E (64). Random
      notes change on every run, so your notes will differ. A step whose random offset is 0 keeps its
      own note, so a plain pattern note outside the selection, such as F, can still sound.'
    assertion:
      kind: random-note-domain
      pentatonic: true
      random: 4
      twos: 0
      seed: 42
      mask: null
      passed: true
- id: random-pentatonic-off
  feature_id: lock-random-to-pentatonic
  title: 'Lock random notes to pentatonic: Off'
  behaviour_case: M-PARAM-037
  citation: README.md#lock-random-to-pentatonic
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs on steps 1 to 4
      (the channel range) with notes C3, D3, E3 and F3 (MIDI 60, 62, 64, 65) at velocities 127, 117, 107
      and 97. Tempo is the default 90 BPM, Rate is /1 (sixteenth-note steps, one sixth of a second each)
      and the sequencer is stopped. The norns shows channel 1''s Device screen and every Mosaic option
      is at its default. Lock random to pent. and Lock merged to pent. are both On, and no trig params
      are assigned yet.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: switch
    title: Turn Lock random to pent. Off
    caption: Tap K1 and open PARAMS > MOSAIC, select Lock random to pent. and turn E3 left to Off. The
      row shows Off. Random note offsets will now land on any degree of the seven-note scale.
    assertion:
      kind: selected-menu-option-row
      label: Lock random to pent.
      value: 'Off'
      matched: true
  - id: merged-off
    title: Turn Lock merged to pent. Off (not needed here)
    caption: Select Lock merged to pent. and turn E3 left to Off. The row shows Off. That option only
      affects notes made by merge modes, so it has no effect on this lesson's random notes; the recording
      turns it Off here and you can leave it On.
    assertion:
      kind: selected-menu-option-row
      label: Lock merged to pent.
      value: 'Off'
      matched: true
  - id: assign-random
    title: Assign Random Note
    caption: Close the menu. On Channel tasks > Trig params assign Random Note to the first slot. The
      slot list shows Random Note; its value is still 0, so the pattern is unchanged.
    assertion:
      kind: parameter-list-label
      label: Random Note
      passed: true
  - id: assign-twos
    title: Assign Twos Random Note
    caption: Assign Twos Random Note to the second slot in the same way. It stays at 0, so it adds nothing
      to this lesson; only Random Note is used.
    assertion:
      kind: parameter-list-label
      label: Twos Random Note
      passed: true
  - id: plain
    title: Hear the plain pattern
    caption: 'Press Play (1,8) with Random Note at 0: the pattern repeats C, D, E, F (MIDI 60, 62, 64,
      65) with no random offsets. Stop playback.'
    assertion:
      kind: random-note-domain
      pentatonic: false
      random: 0
      twos: 0
      seed: 42
      mask: null
      passed: true
  - id: phrase
    title: Hear random notes on all seven degrees
    caption: 'Raise Random Note to 4 in single steps: turn E3 right once, press Play (1,8) and Stop, and
      repeat until it reads 4. Random Note 4 offsets each note by -2, -1, 0, +1 or +2 scale degrees chosen
      at random, and with Lock random to pent. Off the results use all seven degrees of C major. The recorded
      final run begins 57, 64, 67, 62, 64, 59, 65, 65. F (65) and B (59) are in C major but outside C
      D E G A, so hearing them shows the lock is off. Random notes change on every run: play several loops
      and expect F and B to turn up now and then.'
    assertion:
      kind: random-note-domain
      pentatonic: false
      random: 4
      twos: 0
      seed: 42
      mask: null
      passed: true
- id: merged-pentatonic-on
  feature_id: lock-merged-to-pentatonic
  title: 'Lock merged notes to pentatonic: On'
  behaviour_case: M-MERGE-011
  citation: README.md#lock-merged-to-pentatonic
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs on steps 1 to 4
      (the channel range) with notes C3, D3, E3 and F3 (MIDI 60, 62, 64, 65) at velocities 127, 117, 107
      and 97. Tempo is the default 90 BPM, Rate is /1 (sixteenth-note steps, one sixth of a second each)
      and the sequencer is stopped. The norns shows channel 1''s Device screen and every Mosaic option
      is at its default. Lock merged to pent. is at its default On. Only pattern 1 exists and is assigned
      to channel 1; patterns 2 and 3 are built in the next steps.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: switch
    title: Check Lock merged to pent.
    caption: Tap K1 and open PARAMS > MOSAIC, select Lock merged to pent. and turn E3 right to On (the
      default). The row shows On.
    assertion:
      kind: selected-menu-option-row
      label: Lock merged to pent.
      value: 'On'
      matched: true
  - id: pattern-one
    title: Enter pattern 1
    caption: Close the menu. Press Pattern (5,8), choose pattern 1 at (1,1) and tap (1,7), (2,5), (3,3)
      and (4,1) to rewrite its four notes as scale degrees I, III, V, VII (C E G B). The four notes light
      on the grid.
    assertion:
      kind: grid
      cells:
      - - 1
        - 7
      - - 2
        - 5
      - - 3
        - 3
      - - 4
        - 1
      expected:
      - 12
      - 12
      - 12
      - 12
  - id: pattern-two
    title: Enter pattern 2
    caption: 'Choose pattern 2 at (2,1), add four trigs on steps 1 to 4 and tap (1,5), (2,3), (3,1) and
      (4,7): degrees III, V, VII, I (E G B C). Pattern 2 is a second voice that overlaps pattern 1 on
      every step.'
    assertion:
      kind: grid
      cells:
      - - 1
        - 5
      - - 2
        - 3
      - - 3
        - 1
      - - 4
        - 7
      expected:
      - 12
      - 12
      - 12
      - 12
  - id: velocity-pattern
    title: Build pattern 3 as a velocity source
    caption: 'Choose pattern 3 at (3,1), add four trigs on steps 1 to 4 and put their notes on the top
      row, (1,1) to (4,1); the four top-row notes light. Pattern 3 will never be assigned to the channel.
      It is only a velocity source: every trig has the default velocity 100, and its notes are ignored
      by the merge, so the notes you hear come only from patterns 1 and 2.'
    assertion:
      kind: selected-pattern-top-note-blink
      slot: 3
      levels:
      - 11
      - 13
      passed: true
  - id: trig-strategy-all
    title: Choose Strategy ALL
    caption: Press Channel (3,8), tap pattern slot 2 at (2,2) so patterns 1 and 2 are both assigned, then
      press the trig merge key at (14,8) twice. Strategy moves from Skip to Only to ALL and the key lights
      at medium brightness. With Skip every step both patterns share would be silenced; ALL lets every
      trig sound.
    assertion:
      kind: grid
      cells:
      - - 14
        - 8
      expected:
      - 8
  - id: assign
    title: Take velocity from pattern 3
    caption: 'Hold the velocity merge key (16,8), tap pattern slot 3 at (3,2) and release. Slots 1 and
      2 stay lit as the assigned patterns and slot 3 stays dim because it is not assigned: it only supplies
      the velocity of the merged notes. Note merge stays on its default, Average.'
    assertion:
      kind: grid
      cells:
      - - 1
        - 2
      - - 2
        - 2
      - - 3
        - 2
      expected:
      - 15
      - 15
      - 2
  - id: phrase
    title: Hear the averaged phrase snap to pentatonic
    caption: Press Play (1,8), listen to two loops and press Play again to stop. The average of each step's
      degrees is II, IV, VI, IV, which in C major is D, F, A, F. With Lock merged to pent. On, F is not
      in the C D E G A selection and snaps to the nearer E, so you hear 62, 64, 69, 64 (D E A E) at velocity
      100, taken from pattern 3. Compare the Off lesson, which plays F (65) on steps 2 and 4.
    assertion:
      kind: numeric-note-merge
      mode: average
      assigned_patterns:
      - 1
      - 2
      velocity_source: 3
      pitches:
      - 62
      - 64
      - 69
      - 64
      passed: true
  - id: higher-phrase
    title: Switch Note merge to Higher and listen
    caption: 'Tap the note merge key at (15,8) once; it brightens as Note merge moves from Average to Higher. Press Play (1,8), listen to two loops and press Play again to stop. Higher adds the spread (the highest minus the lowest degree) to the rounded average, so the four steps become degrees IV, VI, VIII and X: F, A, C and E in C major. Lock merged to pent. On snaps F to the nearer E, so the MIDI strip "MIDI sent in this step" shows 64, 69, 72, 76 at velocity 100. Compare the Off lesson, which plays F (65) on the first step.'
    assertion:
      kind: numeric-note-merge
      mode: higher
      velocity_source: 3
      pitches:
      - 64
      - 69
      - 72
      - 76
      passed: true
