- id: song-tempo-across-slots
  feature_id: navigating-the-norns-display
  title: Set Tempo and feel across Song slots
  behaviour_case: M-SONG-SETTINGS-002
  citation: README.md#navigating-the-norns-display
  related:
  - song-editor
  - adjusting-song-sequence-length
  steps:
  - id: start
    title: Starting point
    caption: Song slot 1 holds the four-step phrase on channel 1 (MIDI 60, 62, 64, 65) and slot 2 is a
      copy with channel 1 raised one octave. Song mode is Off, the tempo is 90 BPM, slot 1 is selected
      and playback is stopped. Song tasks > Tempo / feel is the screen that holds the song's one tempo,
      next to its swing and shuffle feel.
    assertion:
      kind: mosaic-option-input
      label: Song mode
      enabled: false
  - id: set-30
    title: Turn Tempo down to 30
    caption: 'Close the menu. With slot 1 selected at (1,1), turn E1 to Song tasks, turn E2 to Tempo /
      feel and press K3. Turn E3 all the way down: Tempo reads 30, the lowest value.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '30'
      matched: true
    occurrence: 1
  - id: minimum
    title: Hear slot 1 at 30 BPM
    caption: Press K3 to apply, then press Play (1,8) to hear the phrase at 30 BPM and press Play again
      to stop. Swing type stays Swing and Swing 0.
    assertion:
      kind: song-global-tempo
      stage: minimum
      slot: 1
      bpm: 30
      passed: true
  - id: slot-2-reads-30
    title: Slot 2 reads the same tempo
    caption: 'Select slot 2 at (2,1), the copy that plays an octave higher, then turn E1 to Song tasks,
      E2 to Tempo / feel and press K3. It already reads 30: tempo belongs to the whole song, not to one
      slot.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '30'
      matched: true
    occurrence: 2
  - id: set-300
    title: Turn Tempo up to 300
    caption: 'Press Play (1,8) and Stop to hear slot 2 at 30 BPM. With slot 2 selected, open Tempo / feel
      again, turn E3 all the way up: Tempo reads 300, the highest value. Press K3 to apply.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '300'
      matched: true
    occurrence: 1
  - id: maximum
    title: Hear slot 2 at 300 BPM
    caption: Press Play (1,8) to hear slot 2 at 300 BPM, ten times as fast as before, then press Play
      again to stop.
    assertion:
      kind: song-global-tempo
      stage: maximum
      slot: 2
      bpm: 300
      passed: true
  - id: slot-1-reads-300
    title: Slot 1 reads 300
    caption: Select slot 1 at (1,1) and open Tempo / feel again. It reads 300, the value you set while
      slot 2 was selected.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '300'
      matched: true
    occurrence: 2
  - id: set-90
    title: Set Tempo back to 90
    caption: Press Play (1,8) to hear slot 1 at 300 BPM and Stop. Open Tempo / feel on slot 1, turn E3
      down to 30, then up 60 detents to 90, and press K3 to apply.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '90'
      matched: true
    occurrence: 1
  - id: restore
    title: Hear slot 1 at 90 BPM
    caption: Press Play (1,8) to hear slot 1 at 90 BPM, the starting tempo, then press Play again to stop.
    assertion:
      kind: song-global-tempo
      stage: restore
      slot: 1
      bpm: 90
      passed: true
  - id: slot-2-reads-90
    title: Slot 2 follows to 90
    caption: 'Select slot 2 at (2,1) and open Tempo / feel. It reads 90 too: the tempo you set on any
      slot applies to every slot.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Tempo
      value: '90'
      matched: true
    occurrence: 2
- id: song-slot-light-states
  feature_id: button-indicators
  title: Read Song slot lights
  behaviour_case: M-MANUAL-CLOSURE-SONG-001
  citation: README.md#button-indicators
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays the four-step phrase (MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97)
      through a MIDI device on OUT 1, in C major at 90 BPM with sixteenth-note steps (Rate /1). Only Song
      slot 1 is filled. Song mode is Off, the global length is 32 steps (fader cell (4,7) on the Song page; Song Playback
      reads Global length 32) and playback is stopped. The norns shows channel 1's Device screen.
    assertion:
      kind: mosaic-option-input
      label: Song mode
      enabled: false
  - id: copied-selected
    title: Copy a populated slot
    caption: 'Close the menu and press Song at grid (6,8). Hold slot 1 at (1,1), press slot 2 at (2,1),
      then release both: slot 1 is copied to slot 2. Tap (2,1) to select slot 2. The top row now reads
      slot 1 mid-bright (filled), slot 2 bright (selected) and slot 3 dim (empty). The norns shows Slot
      setup for SONG 02 with the message Song sequence 2 selected.'
    assertion:
      kind: manual-song-indicators
      stage: copied-selected
      levels:
      - 7
      - 15
      - 2
      passed: true
  - id: repeats-set
    title: Give slot 2 Repeats 2
    caption: Turn E1 to Song tasks, turn E2 to Slot setup and press K3. Turn E3 up to Repeats 2 and press
      K3 to apply. Song mode is Off, so Repeats does not hold the slot for extra passes here; it only
      shows as the pass count on Song Playback.
    assertion:
      kind: manual-song-slot-setting
      field: Repeats
      value: 2
      passed: true
  - id: playing
    title: Play the selected slot
    caption: Press Song (6,8) and then Play at (1,8). Slot 2 plays the phrase C, D, E, F (MIDI 60, 62,
      64, 65) and stays bright; slot 1 stays mid-bright and empty slot 3 stays dim. Song Playback reads
      Playing SONG 02, Pass 1 / 2, Song mode MANUAL.
    assertion:
      kind: manual-song-indicators
      stage: playing
      levels:
      - 7
      - 15
      - 2
      passed: true
  - id: queued-blink
    title: Queue slot 1 while slot 2 plays
    caption: 'Do these in order. 1: press Stop (1,8). 2: press Song (6,8) and select slot 1 at (1,1).
      3: press Channel (3,8) and tap octave +1 at (11,8), so slot 1 sounds an octave higher. 4: press
      Song (6,8) again, select slot 2 at (2,1) and press Play (1,8). 5: while slot 2 sounds, press slot
      1 at (1,1) to queue it. Slot 1 now blinks between dim and mid-bright (a still shows one moment of
      the blink) while slot 2 stays bright. Song mode is Off, so playback continues on slot 2 until one
      pass of its sequence ends.'
    assertion:
      kind: manual-song-queue-blink
      stage: waiting
      queued_slot: 1
      playing_slot: 2
      passed: true
  - id: queued-transition
    title: Hear the queued slot take over
    caption: 'Do nothing for about five seconds: slot 2 plays its full 32 steps (32 steps at one sixth
      of a second each). Slot 1 then becomes bright and plays its phrase an octave higher (MIDI 72, 74,
      76, 77); slot 2 returns to mid-bright. Press Stop at (1,8). Song Playback reads Playing SONG 01.'
    assertion:
      kind: manual-song-queue-transition
      from_slot: 2
      to_slot: 1
      transition_index: 32
      levels:
      - 15
      - 7
      - 2
      passed: true
  - id: empty-copy-erases
    title: Erase by copying an empty slot
    caption: 'With playback stopped, hold empty slot 3 at (3,1), press slot 2 at (2,1) and release: the
      empty slot is copied over slot 2 and erases it. Tap slot 1 at (1,1). Slot 1 is bright; slots 2 and
      3 are both dim. There is no undo.'
    assertion:
      kind: manual-song-indicators
      stage: empty-copy-erases
      levels:
      - 15
      - 2
      - 2
      passed: true
