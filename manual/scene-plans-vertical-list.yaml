schema_version: 1
status: authoring-plan-not-captured
base_revision: 54d7b871358fcc68b7166847603cc9fb1461d0b6
scenes:
- id: vertical-clock-neighbors
  feature_id: clocks-swing-and-shuffle
  title: Channel Clock vertical list
  behaviour_case: M-UI-VERTICAL-001
  citation: README.md#norns-menu-navigation
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through the test MIDI device: four trigs on steps 1 to 4 with
      C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, in C major, stopped. Clock
      Rate is /1 and no Swing or Shuffle is set. Channel 1 is selected and its Clock page is open. Your
      goal is to give channel 1 its own shuffle feel. Rate is the first row of a vertical list.'
    assertion:
      kind: ui-confirm
      page: clock_mods
      channel: 1
  - id: neighbors
    title: Read the Clock settings together
    caption: Turn E2 left until Rate is selected, the first row (it reads /1, the default). The list shows
      Rate, Feel source and Swing type together, so you can read the channel's clock and feel settings
      at a glance.
    assertion:
      kind: vertical-list-ui
      checkpoint: clock-neighbors
      passed: true
  - id: select-swing
    title: Select Swing type
    caption: 'Tap K1 twice: the first tap opens the norns menu and the second closes it, and the page
      keeps your place. Turn E2 to Swing type. It reads X: this channel has no feel of its own yet.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Swing type
      value: X
      matched: true
    occurrence: 1
  - id: inherit-sentinel
    title: Follow the global feel
    caption: 'Turn E3 left as far as it goes and press K3. It stays at X. X means this channel follows
      the global feel set in Song > Tempo and feel.'
    assertion:
      kind: vertical-list-ui
      checkpoint: inherit-sentinel
      passed: true
  - id: choose-shuffle
    title: Choose Shuffle
    caption: Turn E3 right to Shuffle and press K3. Shuffle adds its own rows below Swing type for setting
      this channel's feel.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Swing type
      value: Shuffle
      matched: true
  - id: scroll-end
    title: Reach the end of the list
    caption: Keep turning E2 right. The list stops on its last row, Shuffle amount (0), and does not wrap
      round however far you turn.
    assertion:
      kind: vertical-list-ui
      checkpoint: scroll-end
      passed: true
