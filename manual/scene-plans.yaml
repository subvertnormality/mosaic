- id: song-global-length
  feature_id: adjusting-song-sequence-length
  title: Set the global song length
  behaviour_case: M-LIVEUI-FOCUS-001
  citation: README.md#adjusting-song-sequence-length
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-note pattern. The song has one slot, Song 01, at the full global length of 64
      steps, with Song mode AUTO, and the sequencer is stopped. The norns is showing the Pattern editor, left over
      from setup; it is not part of this lesson.
    assertion:
      kind: screen-header
      expected: PATTERN TRIG PAT02 CH01
      matched: true
    occurrence: 2
  - id: open-song
    title: Open the Song editor
    caption: 'Tap Song (6,8). The Playback screen lists Playing SONG 01, Next SONG 01, Pass 1/1, Global length 64
      and Song mode AUTO. The global length fader is on grid row 7: (1,7) subtracts one step, (8,7) adds one, and
      the buttons between jump to 1, 13, 32, 38, 51 and 64.'
    assertion:
      kind: screen-header
      expected: SONG PLAYBACK SONG 01
      matched: true
    occurrence: 1
  - id: shorten
    title: Shorten by one step
    caption: Tap the fader's left end (1,7). It takes one step off the length and the Playback screen shows Global
      length 63. To loop a short fragment instead, jump with (2,7) to 1 step and add steps with (8,7); see the recipe
      on this page.
    assertion:
      kind: dashboard
      rows:
      - - Playing
        - SONG 01
      - - Next
        - SONG 01
      - - Pass
        - 1 / 1
      - - Global length
        - '63'
      - - Song mode
        - AUTO
      passed: true
  - id: restore
    title: Return to 64 steps
    caption: Tap the fader's right end (8,7), which adds one step. Global length reads 64 again, so the whole phrase
      plays.
    assertion:
      kind: dashboard
      rows:
      - - Playing
        - SONG 01
      - - Next
        - SONG 01
      - - Pass
        - 1 / 1
      - - Global length
        - '64'
      - - Song mode
        - AUTO
      passed: true
  - id: length-two
    title: Set the length to 2 steps and play
    caption: 'Tap (2,7), which jumps to 1 step, then tap (8,7) once to add one. Global length reads 2. Press Play
      (1,8): the song plays only its first two steps and starts again, so the MIDI sent in this step is C and D
      (60, 62) over and over, never E or F. Press Play again to stop.'
    assertion:
      kind: song-length-playback
      length: 2
      passed: true
  - id: length-four
    title: Set the length to 4 steps and play
    caption: 'Tap (8,7) twice. Global length reads 4. Press Play: the whole four-note phrase now plays before the
      song starts again, so the MIDI sent in this step is 60, 62, 64, 65. Press Play again to stop.'
    assertion:
      kind: song-length-playback
      length: 4
      passed: true
  - id: back-to-64
    title: Return to 64
    caption: Tap (7,7), the button that jumps to 64. Global length reads 64 again and the whole phrase is available
      to the song.
    assertion:
      kind: dashboard
      rows:
      - - Playing
        - SONG 01
      - - Next
        - SONG 01
      - - Pass
        - 1 / 1
      - - Global length
        - '64'
      - - Song mode
        - AUTO
      passed: true
    occurrence: 2
- id: channel-routing-visible-scope
  feature_id: devices
  title: Each channel keeps its own device and rate
  behaviour_case: M-LIVEUI-CHSELECT-001
  citation: README.md#norns-menu-navigation
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes C, D, E
      and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. Its Device page is open, so the header reads
      CH01, and Device shows CC Device, Mosaic''s built-in generic MIDI device. Channel 2 is not set up yet. Both
      channels run at the default clock Rate /1 (one step per sixteenth note).'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
    occurrence: 1
  - id: device2
    title: An unused channel has no output
    caption: 'Tap channel 2 at (2,1). The Device page stays open but now reads CH02 and Device shows None: channel
      2 has no output yet, and setting up channel 1 did not change it. The channel buttons choose which channel
      the screen edits.'
    assertion:
      kind: selected-field
      label: Device
      value: None
      matched: true
  - id: device1-again
    title: Return to channel 1
    caption: 'Tap channel 1 at (1,1). The header returns to CH01 and Device shows CC Device again: each channel
      keeps its own device.'
    assertion:
      kind: selected-field
      label: Device
      value: CC Device
      matched: true
    occurrence: 2
  - id: open-clock
    title: Open the Clock page
    caption: 'Device was the first of a channel''s own settings; Rate is the second. Turn E1 to open Channel tasks,
      turn E2 to Clock and press K3. The Clock page for CH01 shows Rate /1, the default: one step per sixteenth
      note. Rate divides the clock, so /2 will run half as fast and make each step twice as long.'
    assertion:
      kind: selected-field
      label: Rate
      value: /1
      matched: true
    occurrence: 1
  - id: select-channel-2
    title: Select channel 2
    caption: Tap channel 2 at (2,1). The Clock page stays open and now reads CH02, with its own Rate /1.
    assertion:
      kind: selected-field
      label: Rate
      value: /1
      matched: true
    occurrence: 2
  - id: clock2
    title: Give channel 2 a different rate
    caption: 'Turn E3 down two detents to Rate /2 and press K3 to apply. Channel 2 now runs at half the speed of
      channel 1: each of its steps lasts two sixteenth notes.'
    assertion:
      kind: selected-field
      label: Rate
      value: /2
      matched: true
    occurrence: 1
  - id: clock1
    title: Channel 1 keeps its rate
    caption: 'Tap channel 1 at (1,1). Its Clock page still reads Rate /1: changing channel 2''s rate left channel
      1 alone.'
    assertion:
      kind: selected-field
      label: Rate
      value: /1
      matched: true
    occurrence: 3
  - id: clock2-again
    title: Channel 2 remembers its rate
    caption: Tap channel 2 at (2,1) again. Its Clock page reads Rate /2. Each channel remembers its own settings,
      so channels can run at different speeds against one tempo.
    assertion:
      kind: selected-field
      label: Rate
      value: /2
      matched: true
    occurrence: 2
  - id: hear-rates
    title: Hear channel 2 at half speed
    caption: Open the Device page for channel 2, give it its own MIDI output, give it pattern 1 with the range steps
      1-4 and open its Clock page again. Select channel 1 and press Play. Channel 1 plays one note every sixteenth
      note; channel 2 plays one note every two sixteenth notes, so its notes are twice as far apart. Look at the
      MIDI strip, "MIDI sent in this step", where the second port's notes arrive at half the pace of the first.
      Press Play again to stop.
    assertion:
      kind: channel-rates-audible
      passed: true
- id: pattern-note-range
  feature_id: adding-notes
  title: Shape notes across the grid range
  behaviour_case: M-EDIT-001
  citation: README.md#adding-notes
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-step phrase on steps 1-4 (MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97)
      through a MIDI device on OUT 1, in C major at 90 BPM with sixteenth-note steps (Rate /1). The Channel editor
      is open and the Pattern editor has not been opened. On Pattern Note the range buttons on row 8 are range-up
      (14,8), centre (15,8) and range-down (16,8). A press moves the window one degree up or down, a long press
      jumps to the top or bottom, and the centre button returns to the root page. Pattern Velocity has only two
      range buttons, (15,8) toward the top page and (16,8) toward the lower page, as the next lesson shows.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
    occurrence: 1
  - id: initial-note-range
    title: Choose a scale degree
    caption: 'Press Pattern (5,8) twice to open Pattern Note for pattern 1. The seven rows are scale degrees, with
      the root on the bottom row. Tap (4,1), the top row of step 4''s column. Press Play at (1,8), then Stop: step
      4 now plays degree 6, MIDI 71, while steps 1-3 stay 60, 62, 64.'
    assertion:
      kind: workflow-check
      name: initial-note-range
      passed: true
  - id: second-up-step
    title: Move the range up twice
    caption: 'Tap range-up (14,8), then tap (4,1): step 4 is now MIDI 72, the next C. Play to check, then Stop.
      Tap range-up once more, then tap (4,1): step 4 is MIDI 74. Play to check, then Stop.'
    assertion:
      kind: workflow-check
      name: second-up-step
      passed: true
  - id: second-down-step
    title: Move the range down twice
    caption: 'Tap range-down (16,8): the window moves down one degree. Tap (4,1): step 4 is MIDI 72 again. Play,
      then Stop. Tap range-down once more, then tap (4,1): step 4 is back to MIDI 71. Play, then Stop.'
    assertion:
      kind: workflow-check
      name: second-down-step
      passed: true
  - id: highest-range-clamp
    title: Jump to the top, which is a limit
    caption: 'Hold range-up (14,8) for about a second: the window jumps to its highest position. Tap (4,1): step
      4 plays MIDI 83. Tap range-up again: the window cannot go higher, so (4,1) still plays MIDI 83.'
    assertion:
      kind: workflow-check
      name: highest-range-clamp
      passed: true
  - id: lowest-range-clamp
    title: Jump to the bottom, which is a limit
    caption: 'Hold range-down (16,8) for about a second: the window jumps to its lowest position. Tap (4,7), the
      bottom row: step 4 plays MIDI 48. Tap range-down again: the window cannot go lower, so (4,7) still plays MIDI
      48.'
    assertion:
      kind: workflow-check
      name: lowest-range-clamp
      passed: true
  - id: center-restores-root-page
    title: Return to the central range
    caption: 'Tap the centre button at (15,8): the window returns to the root page, with the root on the bottom
      row. Tap (4,4), degree 3: step 4 plays MIDI 65 and the original phrase 60, 62, 64, 65 is back.'
    assertion:
      kind: workflow-check
      name: center-restores-root-page
      passed: true
