    caption: 'Hold range-down (16,8) for about a second: the window jumps to the lower page, 58 at the top down
      to 0 at the bottom. Tap (4,1): step 4 plays at 58.'
    assertion:
      kind: workflow-check
      name: velocity-58
      passed: true
  - id: velocity-29
    title: Go quieter
    caption: 'Tap down the column of step 4 to (4,4), playing after each tap: (4,2) is 48, (4,3) 39 and (4,4) 29.
