scenes:
- id: algorithm-choose-and-preview
  feature_id: adding-trigs
  title: Choose a trig algorithm
  behaviour_case: M-LIVEUI-ALGO-001
  citation: README.md#adding-trigs
  steps:
  - id: euclidean
    title: Choose Euclidean
    caption: 'In a new empty project with playback stopped and Record off, tap Pattern (5,8), then tap the third
      algorithm button (14,2). The five algorithm buttons on row 2 are, from the left: Drum (12,2), a library of
      classic bass, snare and hi-hat patterns; Tresillo (13,2), a 3-3-2 grouping; Euclidean (14,2), trigs spread
      as evenly as a mathematical rule allows; Numeric (15,2), patterns from Noise Engineering''s Numeric Repetitor;
      and Rhythm Doctor (16,2). The Trig Algorithm screen marks Euclidean as SELECTED and the fader on grid row
      2 lights its third position.'
    assertion:
      kind: selected-field
      label: Euclidean
      value: SELECTED
      matched: true
    occurrence: 1
  - id: focus-drum
    title: Browse without applying
    caption: 'Turn E2 left. The screen passes Tresillo and stops on Drum, the first algorithm (a further turn stays
      on Drum). Drum shows no SELECTED mark and the third fader position stays lit: turning E2 only browses. Euclidean
      is still the algorithm in use until you press K3.'
    assertion:
      kind: selected-field
      label: Drum
      value: ''
      matched: true
    occurrence: 1
  - id: apply-drum
    title: Apply Drum
    caption: Press K3. Drum now reads SELECTED and the fader lights its first position. Drum draws on classic drum
      patterns, so it suits a kick, snare or hi-hat lane, where Euclidean suits an even pulse.
    assertion:
      kind: selected-field
      label: Drum
      value: SELECTED
      matched: true
    occurrence: 1
  - id: prime-drum
    title: Prime with Drum selected
    caption: 'Tap Prime (16,8). The Paint Preview screen opens on Algorithm Drum with Shift 0, but no step flashes
      on the pattern grid: at its default settings Drum previews no steps. Prime previews whichever algorithm is
      selected.'
    assertion:
      kind: paint-preview
      stage: drum-prime
      painting: true
      algorithm: Drum
      shift: '0'
      passed: true
    occurrence: 1
  - id: cancel-drum
    title: Cancel the empty preview
    caption: Tap Cancel (14,8). The preview closes and nothing was painted.
    assertion:
      kind: paint-preview
      stage: drum-cancel
      painting: false
      algorithm: Drum
      shift: '0'
      passed: true
    occurrence: 1
  - id: reopen-algorithm
    title: Return to the algorithm list
    caption: Turn E1 to open Pattern tasks, turn E2 to Algorithm and press K3. The Trig Algorithm screen returns
      (a Painting cancelled tip may still show) and Drum is still SELECTED.
    assertion:
      kind: selected-field
      label: Drum
      value: SELECTED
      matched: true
    occurrence: 2
  - id: browse-euclidean
    title: Browse back to Euclidean
    caption: Turn E2 two detents right, past Tresillo. Euclidean is highlighted but carries no SELECTED mark yet,
      and the fader still shows Drum.
    assertion:
      kind: selected-field
      label: Euclidean
      value: ''
      matched: true
    occurrence: 1
  - id: apply-euclidean
    title: Apply Euclidean
    caption: Press K3. Euclidean reads SELECTED and the fader lights its third position again.
    assertion:
      kind: selected-field
      label: Euclidean
      value: SELECTED
      matched: true
    occurrence: 2
  - id: preview-differs
    title: Prime now previews Euclidean
    caption: 'Tap Prime (16,8) again. Now every step on the pattern grid flashes and Paint Preview reads 64 trigs:
      at the default settings Euclidean fills all 64 steps, where Drum previewed none. Prime always previews the
      algorithm that is selected, so changing the algorithm changes what Prime shows.'
    assertion:
      kind: prime-uses-selected-algorithm
      passed: true
  - id: prime-tresillo
    title: Prime Tresillo for a 3-3-2 preview
    caption: 'Tap Cancel (14,8) to close the Euclidean preview and tap Tresillo (13,2), the second algorithm button.
      Like Drum, Tresillo previews nothing until you choose a pattern: tap drum bank 1 at (12,3), then tap both
      ends of the first fader on row 2, (2,2) and (10,2), and of the second fader on row 3, (2,3) and (10,3). Tap
      Prime (16,8). The algorithm fader lights its second position and Paint Preview reads Algorithm Tresillo with
      8 trigs. The flashing steps are spaced 9, 9 and 6 steps apart, over and over: the 3-3-2 grouping, scaled up.
      Nothing is painted yet.'
    assertion:
      kind: paint-preview
      stage: tresillo-prime
      painting: true
      algorithm: Tresillo
      shift: '0'
      passed: true
- id: paint-shift-and-cancel
  feature_id: adding-trigs
  title: Move a rhythm before committing
  behaviour_case: M-LIVEUI-PAINT-001
  citation: README.md#adding-trigs
  steps:
  - id: numeric
    title: Choose Numeric
    caption: In a new empty project with playback stopped and Record off, tap Pattern (5,8), then tap the fourth
      algorithm button (15,2) for Numeric. The Trig Algorithm screen marks Numeric as SELECTED. Numeric gives a
      sparse pattern, which makes shifts easy to see. The controls you will use on grid row 8 are Prime (16,8),
      Move left (10,8), Reset (11,8), Move right (12,8) and Cancel (14,8).
    assertion:
      kind: selected-field
      label: Numeric
      value: SELECTED
      matched: true
  - id: prime
    title: Prime the pattern
    caption: Tap Prime (16,8). The Numeric pattern flashes on the grid and Paint Preview reads Preview PAINTING,
      Algorithm Numeric, Shift 0 and 8 trigs, on steps 5, 13, 21, 29 and so on. Nothing is painted yet.
    assertion:
      kind: paint-preview
      stage: prime
      painting: true
      algorithm: Numeric
      shift: '0'
      passed: true
    occurrence: 1
  - id: right
    title: Shift right
    caption: Tap Move right (12,8). Every flashing step moves one step to the right, from step 5 to step 6 and so
      on, and the Paint Preview screen reads Shift +1.
    assertion:
      kind: paint-shift-cells
      control: shift_right
      shift: '+1'
      passed: true
  - id: before
    title: Two taps left
    caption: Tap Move left (10,8) twice. The first tap takes the flashing steps back to where Prime put them (Shift
      0); the second moves them one step left of that, from step 5 to step 4 and so on. The screen reads Shift -1.
    assertion:
      kind: paint-shift-cells
      control: shift_left
      shift: '-1'
      passed: true
  - id: reset
    title: Reset the shift
    caption: Tap Reset (11,8). The shift returns to 0 in one tap and the flashing steps are back where Prime put
      them.
    assertion:
      kind: paint-shift-cells
      control: shift_reset
      shift: '0'
      passed: true
  - id: cancel
    title: Cancel the preview
    caption: Tap Cancel (14,8). Paint Preview reads Preview OFF and Trigs NONE, and no flashing steps remain. Nothing
      was painted, so the pattern is unchanged. To keep a shifted rhythm instead, tap Prime again while the steps
      are flashing; the next two steps do that.
    assertion:
      kind: paint-preview
      stage: cancel
      painting: false
      algorithm: Numeric
      shift: '0'
      passed: true
  - id: prime-again
    title: Prime again
    caption: Tap Prime (16,8) again. The same Numeric steps flash again at Shift 0. Prime always starts a new preview,
      so you can try a rhythm, cancel it and come back to it.
    assertion:
      kind: paint-preview
      stage: prime-2
      painting: true
      algorithm: Numeric
      shift: '0'
      passed: true
  - id: commit
    title: Press Prime again to paint the shifted rhythm
    caption: 'Tap Move right (12,8) so the preview reads Shift +1, then tap Prime (16,8) while the steps are flashing.
      Paint Preview now reads Preview OFF and the footer says Pattern painted. The steps stay lit on the pattern
      grid, one step to the right of where Prime first put them: the shifted rhythm is painted into the pattern.'
    assertion:
      kind: paint-commit
      passed: true
- id: merge-overlap-and-union
  feature_id: merge-modes
  title: Merge two patterns
  behaviour_case: M-LIVEUI-MERGEMODES-001
  citation: README.md#merge-modes
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 has two patterns assigned. Pattern 1 has trigs on steps 1-4 (C, D, E, F: MIDI 60, 62, 64,
      65 at velocities 127, 117, 107, 97) and pattern 2 has trigs on steps 1 and 2 (note C, velocity 100). The Merge
      modes screen is showing at 90 BPM with every merge mode at its default and playback stopped. The Patterns
      row reads 01 02: it only shows which patterns the channel plays, and turning E3 on it changes nothing. Assign
      patterns with the pattern slot buttons on the grid.'
    assertion:
      kind: selected-field
      label: Patterns
      value: 01 02
      matched: true
    occurrence: 1
  - id: skip
    title: Skip overlap
    caption: 'Press K2, turn E1 to Channel tasks, turn E2 to Merge modes and press K3 to return to the Merge modes
      screen, then turn E2 down to Strategy, the trig merge. It reads SKIP, the default: a step plays only if exactly
      one pattern has a trig there. Steps 1 and 2 are in both patterns and drop out; only steps 3 and 4 remain.'
    assertion:
      kind: merge-mode
      row: Strategy
      value: SKIP
      passed: true
    occurrence: 1
  - id: hear-skip
    title: Hear Skip
    caption: 'Press Play at (1,8), then Stop. The loop plays only steps 3 and 4: MIDI 64 (velocity 107) and 65 (velocity
      97), over and over.'
    assertion:
      kind: midi
      complete_cycles: 2
    occurrence: 1
  - id: only
    title: Keep overlap
    caption: 'Turn E3 up once: Strategy reads ONLY, with the footer ONLY APPLIED. (Turning E3 down first does nothing:
      SKIP is the lowest choice.) Only keeps steps that have a trig in more than one pattern, so steps 1 and 2 play
      and steps 3 and 4 drop out. The (14,8) button follows the choice.'
    assertion:
      kind: merge-mode
      row: Strategy
      value: ONLY
      passed: true
    occurrence: 1
  - id: all
    title: Play the union
    caption: 'Turn E3 up once more: Strategy reads ALL, footer ALL APPLIED. Every trig from either pattern plays.
      The change applies immediately; there is no K3 apply. The (14,8) button follows the choice.'
    assertion:
      kind: merge-mode
      row: Strategy
      value: ALL
      passed: true
    occurrence: 1
  - id: hear-all
    title: Hear All
    caption: 'Press Play, then Stop. All four steps sound: MIDI 60, 62, 64, 65 at velocities 114, 109, 107, 97.
      Steps 1 and 2 are in both patterns, so their notes and velocities are averaged: C and C stay C, and (127 +
      100) / 2 = 114.'
    assertion:
      kind: midi
      complete_cycles: 2
    occurrence: 2
  - id: note-mode
    title: Open Note mode
    caption: 'Turn E2 down to Note mode, the pitch merge. It reads AVERAGE, the default. The screen''s labels map
      to the manual''s modes: UP is Higher, DOWN is Lower, and PAT 1 and PAT 2 take the note from that pattern.'
    assertion:
      kind: selected-field
      label: Note mode
      value: AVERAGE
      matched: true
    occurrence: 1
  - id: note-pat2
    title: Turn through the note modes
    caption: 'Turn E3 up one detent at a time and watch Note mode: AVERAGE, then UP (Higher), DOWN (Lower), PAT
      1, and finally PAT 2. At PAT 2 each step takes its note from pattern 2, which is C everywhere. The rhythm
      still comes from the ALL strategy.'
    assertion:
      kind: selected-field
      label: Note mode
      value: PAT 2
      matched: true
    occurrence: 1
  - id: hear-pat2
    title: Hear Pattern 2 notes
    caption: Press Play, then Stop. The four steps still sound, now all at MIDI 60, pattern 2's note, with the same
      velocities (114, 109, 107, 97).
    assertion:
      kind: midi
      complete_cycles: 2
    occurrence: 3
  - id: hear-average
    title: Restore the average and hear it
    caption: 'Turn E3 down four detents: PAT 1, DOWN, UP, then AVERAGE (one more turn down stays on AVERAGE). Press
      Play, then Stop. The phrase is back to MIDI 60, 62, 64, 65.'
    assertion:
      kind: midi
      complete_cycles: 2
    occurrence: 4
- id: structure-every-4-markers
  feature_id: structure
  title: Mark every fourth step
  behaviour_case: M-MERGE-STRUCTURE-004
  citation: README.md#structure
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 loops eight steps: pattern 1 plays C, D, E, F (MIDI 60, 62, 64, 65) on steps 1 to 4, and
      pattern 2 adds trigs on steps 5 and 7. Merge Shape has Foundation on with pattern 1 as the anchor, and Harmony
      Ensemble has an enabled group holding C, E and G. The Structure screen is open with Markers on Anchors, so
      each anchor note is a marker. Playback is stopped.'
    assertion:
      kind: selected-field
      layout: detail
      label: Markers
      value: ANCHORS
      matched: true
    occurrence: 1
  - id: markers-every-4
    title: Set Markers to Every 4
