  feature_id: adding-velocity
  title: Shape accents and rests
  behaviour_case: M-EDIT-002
  citation: README.md#adding-velocity
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step phrase on steps 1-4 (MIDI 60, 62, 64, 65 at velocities 127, 117, 107,
