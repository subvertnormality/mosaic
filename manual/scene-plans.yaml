    title: Apply a scale again
    caption: 'Tap slot 2 at (2,3). The scale returns with the edits you saved. Tap Play, then Stop: E major, MIDI
      64, 66, 68, 69. Recap: a tap applies a slot; K1 plus a tap, or a one-second hold, selects a slot for editing
      without applying it; a second hold on the slot being edited turns the global scale off; saving with K3 changes
      the sound only if that slot is the applied one.'
