  - id: select-slot-2
    title: Select slot 2 for editing
    caption: 'Hold K1 and tap slot 2 at (2,3). The title row names slot 2 and its button lights dimly, while slot
      1 stays bright: slot 2 is selected for editing but is not applied.'
    assertion:
      kind: scale-edit-header
      slot: 2
    occurrence: 1
  - id: edit-root
    title: Save D as the root
    caption: Turn E2 to Root, turn E3 two detents up to D and press K3 to save. Slot 2 now holds D major, but it
