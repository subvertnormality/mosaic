    Ui.record_midi_mask_on_step(1,72,90); Ui.record_midi_mask_on_step(2,76,80).

    MIDI helper holds absolute step, sends port1 [144,note,velocity], waits0.05,

    sends [128,note,0], releases grid, waits0.1; no direct mask-state edits.

    Open Memory through Channel tasks (do not reuse obsolete E1 +/-2 relative page-ring shortcuts).

    '
