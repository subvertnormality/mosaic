      kind: scale-edit-header
      slot: 3
    occurrence: 1
  - id: select-applied
    title: Select the applied scale for editing
    caption: 'Tap Play, then Stop: the phrase keeps playing in D major (62, 64, 66, 67), because selecting a slot
      for editing never changes what you hear. Now hold K1 and tap slot 2 at (2,3). Slot 2 is both the applied scale
