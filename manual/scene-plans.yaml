    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 2
  - id: browse-slot-3
    title: Select slot 3 for editing
    caption: Press and hold slot 3 at (3,3) for about one second. The editor switches to slot 3, which lights dimly,
      and slot 2 stays bright.
