  - id: two-edits
    public_inputs: []
    observe: Memory counter2/2; exact MIDI [[72,90],[76,80],[64,107],[65,97]].
  - id: undo-last
    public_inputs:
    - E3 -1
    observe: Counter1/2; exact MIDI [[72,90],[62,117],[64,107],[65,97]].
  - id: redo-last
