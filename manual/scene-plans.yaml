      plays 60 and step 5 plays 60 too, because its D snaps to C, while steps 2, 3 and 4 are no longer markers and
      keep their own notes 62, 64 and 65. Step 7 adds another 60. Each loop sounds 60, 62, 64, 65, 60, 60.'
