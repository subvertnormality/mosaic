      kind: workflow-check
      name: velocity-9
      passed: true
  - id: velocity-0
    title: Turn an attack into a rest
    caption: 'Tap (4,7), velocity 0, and play. Step 4 is silent: the MIDI strip, "MIDI sent in this step", shows
