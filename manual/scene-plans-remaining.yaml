schema_version: 1
status: semantic-checkpoint-plan-not-captured
scope: Remaining parent-session checkpoints from existing behaviour cases. Each complete case must pass
  before publishing its frames. Memory positions are exact screen assertions; the complete case separately
  verifies every restored musical phrase. Rhythm Doctor covers entry only, not recording or backend processing.
scenes:
- id: memory-undo-redo-and-branch
  feature_id: memory-undo-and-redo
  title: Undo, redo and replace a remembered edit
  behaviour_case: M-MEMORY-001
  citation: README.md#memory-undo-and-redo
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 sends to a MIDI device and plays pattern 1: four trigs on steps 1 to 4 (C, D,
      E, F = MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97) in the default C major scale. Channel
      tasks is open on channel 1. Nothing has been edited yet, so the channel''s memory (its list of remembered
      edits) is empty.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: empty
    title: Open History
    caption: Turn E2 down to History and press K3. The Memory screen shows your position in the channel's
      remembered edits, as 'position of total'. It reads 0 of 0 because nothing has been edited yet.
    assertion:
      kind: memory-position
      current: 0
      total: 0
      frame_matched: true
  - id: play-original
    title: Hear the original phrase
    caption: 'With nothing remembered, K2, K3 and E3 in History do nothing: the counter stays at 0 of
      0. Tap Play (1,8): channel 1 plays C D E F, MIDI 60, 62, 64, 65. Tap Play again to stop.'
    assertion:
      kind: midi
      expected: [[1, [144, 60, 127]], [1, [144, 62, 117]], [1, [144, 64, 107]], [1, [144, 65, 97]], [
          1, [144, 60, 127]], [1, [144, 62, 117]], [1, [144, 64, 107]], [1, [144, 65, 97]], [1, [144,
            60, 127]]]
  - id: two-edits
    title: Record two step edits
    caption: 'Open Masks (E1 to Channel tasks, E2 to Masks, K3). Any MIDI keyboard or controller connected
      to the norns can write onto a held step: hold step 1 and play note 72 at velocity 90, release, then
      hold step 2 and play note 76 at velocity 80. Each is one edit that Memory keeps. Reopen History:
      the counter reads 2 of 2, meaning you are at edit 2 of the 2 remembered.'
    assertion:
      kind: memory-position
      current: 2
      total: 2
      frame_matched: true
  - id: undo
    title: Undo the second edit
    caption: 'Tap Play: the phrase is 72, 76, 64, 65 at velocities 90, 80, 107, 97, because steps 1 and
      2 carry your edits. Now, in History, turn E3 one detent left. The counter reads 1 of 2: the second
      edit is undone.'
    assertion:
      kind: memory-position
      current: 1
      total: 2
      frame_matched: true
  - id: hear-undo
    title: Hear the undone state
    caption: 'Tap Play: step 1 keeps your recorded note 72 at velocity 90, and step 2 is back to its original
      note 62 at velocity 117.'
    assertion:
      kind: midi
      expected: [[1, [144, 72, 90]], [1, [144, 62, 117]], [1, [144, 64, 107]], [1, [144, 65, 97]], [1,
          [144, 72, 90]], [1, [144, 62, 117]], [1, [144, 64, 107]], [1, [144, 65, 97]], [1, [144, 72,
            90]]]
  - id: floor
    title: Return to the first state
    caption: 'Turn E3 left again: the counter reads 0 of 2, the oldest state, before either edit. (K2
      jumps straight here.)'
    assertion:
      kind: memory-position
      current: 0
      total: 2
      frame_matched: true
  - id: floor-stays
    title: Stop at the oldest state
    caption: 'Tap Play: the original four-step phrase 60, 62, 64, 65 is back. Then turn E3 left three
      more times. The counter stays at 0 of 2: you cannot go further back than the first state.'
    assertion:
      kind: memory-position
      current: 0
      total: 2
      frame_matched: true
    occurrence: 2
  - id: redo-one
    title: Redo the first edit
    caption: 'Tap Play: still the original phrase. Then turn E3 right once. The counter reads 1 of 2:
      step 1 has its edit back.'
    assertion:
      kind: memory-position
      current: 1
      total: 2
      frame_matched: true
    occurrence: 2
  - id: redo
    title: Redo both edits
    caption: 'Tap Play: 72, 62, 64, 65, so only the first edit is back. Then turn E3 right once more.
      The counter is back at 2 of 2.'
    assertion:
      kind: memory-position
      current: 2
      total: 2
      frame_matched: true
    occurrence: 2
  - id: hear-redo
    title: Hear both edits again
    caption: 'Tap Play: 72, 76, 64, 65, both recorded edits are back.'
    assertion:
      kind: midi
      expected: [[1, [144, 72, 90]], [1, [144, 76, 80]], [1, [144, 64, 107]], [1, [144, 65, 97]], [1,
          [144, 72, 90]], [1, [144, 76, 80]], [1, [144, 64, 107]], [1, [144, 65, 97]], [1, [144, 72, 90]]]
    occurrence: 2
  - id: branch-undo
    title: Undo one step again
    caption: 'Turn E3 right three times: the counter stays at 2 of 2, the newest state. Tap Play for 72,
      76, 64, 65, press K2 to jump all the way back (0 of 2, the original phrase when you play), then
      press K3 to jump forward to 2 of 2 (both edits again). Now turn E3 left once: the counter reads
      1 of 2 and the second edit is undone, so a new edit will replace it.'
    assertion:
      kind: memory-position
      current: 1
      total: 2
      frame_matched: true
    occurrence: 3
  - id: branch
    title: Replace the undone action
    caption: 'Open Masks, hold step 3 and play MIDI note 79 at velocity 70, release, then reopen History.
      The counter reads 2 of 2 again, but it is a different second action: the new edit replaced the undone
      one.'
    assertion:
      kind: memory-position
      current: 2
      total: 2
      frame_matched: true
    occurrence: 5
  - id: branch-hear
    title: Hear the new branch
    caption: 'Tap Play: 72, 62, 79, 65. Step 1 keeps its edit, step 2 is back to its original 62 and step
      3 plays your new note 79. The old second edit (76) is gone.'
    assertion:
      kind: midi
      expected: [[1, [144, 72, 90]], [1, [144, 62, 117]], [1, [144, 79, 70]], [1, [144, 65, 97]], [1,
          [144, 72, 90]], [1, [144, 62, 117]], [1, [144, 79, 70]], [1, [144, 65, 97]], [1, [144, 72, 90]]]
- id: output-dashboard-readout
  feature_id: note-dashboard
  title: Read the Output dashboard
  behaviour_case: M-LIVEUI-DASH-001
  citation: README.md#note-dashboard
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 sends to a MIDI device and plays pattern 1: four trigs on steps 1-4 (C, D, E,
      F = MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97) in the default C major scale. Channel tasks
      is open on channel 1. Playback has not started, so no note has played yet.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: fresh
    title: Open Output
    caption: 'Turn E2 to Output and press K3. Six rows describe the last note channel 1 played: Note (the
      note, and any chord voices), Vel / Len (velocity and length), Step (the step it came from), Degree
      (the pattern degree, and what merging made of it), Pitch (the pitch in the scale, and the harmony''s
      pitch if Harmony moved it) and Sent (the note actually sent, or why none was: MUTED or REST). Nothing
      has played yet, so every row reads NO EVENT and there is no cursor; this screen only displays. Play
      a loop and the rows fill in: see Read Output after selecting a channel.'
    assertion:
      kind: dashboard
      title: OUTPUT
      passed: true
- id: output-latest-event
  feature_id: note-dashboard
  title: Read the latest note on Output
  behaviour_case: M-UIACC-A19-001
  citation: README.md#note-dashboard
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 sends to a MIDI device and plays pattern 1: four trigs on steps 1-4 (C, D, E, F = MIDI
      60, 62, 64, 65 at velocities 127, 117, 107, 97) in the default C major scale. Channel tasks is
      open on channel 1 and playback has not started, so no note has played yet.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
    occurrence: 1
  - id: nothing-played
    title: Open Output before anything has played
    caption: 'Turn E2 to Output and press K3. Six rows describe the last note channel 1 played: Note (the note,
      and any chord voices), Vel / Len (velocity and length), Step (the step it came from), Degree (the
      pattern degree, and what merging made of it), Pitch (the pitch in the scale, and the harmony''s
      pitch if Harmony moved it) and Sent (the note actually sent, or why none was: MUTED or REST).
      Nothing has played yet, so every row reads NO EVENT and there is no cursor; this screen only
      displays.'
    assertion:
      kind: dashboard
      title: OUTPUT
      scope: CH01
      rows:
      - - Note
        - NO EVENT
      - - Vel / Len
        - NO EVENT
      - - Step
        - NO EVENT
      - - Degree
        - NO EVENT
      - - Pitch
        - NO EVENT
      - - Sent
        - NO EVENT
      passed: true
    occurrence: 1
  - id: after-play
    title: Play, then read the rows
    caption: 'Tap Play (1,8), let the loop run, then tap Play again to stop. Output now shows the last note
      channel 1 played: Note C3 (MIDI 60), Vel / Len 127 / 1.0 (velocity 127, one step long), Step
      STEP01 (the step it came from), Degree 0 (the first scale degree), Pitch C3 (the pitch in the
      scale) and Sent C3 (the note actually sent). Look at the MIDI strip, "MIDI sent in this step", for
      the notes behind it.'
    assertion:
      kind: dashboard
      title: OUTPUT
      scope: CH01
      rows:
      - - Note
        - C3
      - - Vel / Len
        - 127 / 1.0
      - - Step
        - STEP01
      - - Degree
        - '0'
      - - Pitch
        - C3
      - - Sent
        - C3
      passed: true
    occurrence: 1
  - id: held-step
    title: Hold a step to see what it plays
    caption: 'Turn E2 or E3 or press K3: nothing changes, because Output has no cursor. Now hold step 2 at
      (2,4) without tapping it. Step reads STEP02 HELD and the rows show what step 2 plays: Degree +1,
      Pitch D3 and Sent D3. Note and Vel / Len still show the last note played. Release the step to
      return to the latest note.'
    assertion:
      kind: dashboard
      title: OUTPUT
      scope: CH01 ST02
      rows:
      - - Note
        - C3
      - - Vel / Len
        - 127 / 1.0
      - - Step
        - STEP02 HELD
      - - Degree
        - '+1'
      - - Pitch
        - D3
      - - Sent
        - D3
      passed: true
    occurrence: 1
  - id: held-empty
    title: A step with no note shows NO EVENT
    caption: 'Hold step 40 at (8,6), a step with no trig. Every row reads NO EVENT and Step reads STEP40 HELD:
      a step without a note borrows nothing from the last note played. Release the step to return to the
      latest note.'
    assertion:
      kind: dashboard
      title: OUTPUT
      scope: CH01 ST40
      rows:
      - - Note
        - NO EVENT
      - - Vel / Len
        - NO EVENT
      - - Step
        - STEP40 HELD
      - - Degree
        - NO EVENT
      - - Pitch
        - NO EVENT
      - - Sent
        - NO EVENT
      passed: true
    occurrence: 1
- id: output-channel-selection
  feature_id: note-dashboard
  title: Read Output after selecting a channel
  behaviour_case: M-DASHBOARD-SELECT-001
  citation: README.md#note-dashboard
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 sends to a MIDI device and plays pattern 1: four trigs on steps 1-4 (C, D, E,
      F = MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97) in the default C major scale. The Output
      screen is open on channel 1. Playback has not started, so no note has played yet.'
    assertion:
      kind: screen-header
      expected: OUTPUT CH01
      matched: true
  - id: channel-two
    title: Select channel 2
    caption: Tap channel 2 at (2,1). Output follows the selected channel and the header changes to CH02.
      Channel 2 has not played a note, so every row, including Note and Vel / Len, reads NO EVENT.
    assertion:
      kind: dashboard-after-channel-select
      channel: 2
      note: NO EVENT
      vel_len: NO EVENT
  - id: after-play
    title: Play channel 1 and read the rows
    caption: 'Tap channel 1 at (1,1): Output returns to CH01, still NO EVENT because nothing has played.
      Then tap Play (1,8), let the loop run, and tap Play again to stop. Output now shows the last note
      channel 1 played. In this run: Note C3 (MIDI 60), Vel / Len 127 / 1.0 (velocity 127, one step long),
      Step STEP01 (the step it came from), Degree 0 (the first scale degree), Pitch C3 (the pitch in the
      scale) and Sent C3 (the note actually sent).'
    assertion:
      kind: dashboard-after-play
- id: note-merge-numeric-output
  feature_id: note-merge-modes
  title: Compare Average and Higher note merging
  behaviour_case: M-MERGE-009
  citation: README.md#note-merge-modes
  steps:
  - id: start
    title: Starting point
    caption: 'Patterns 1 and 2 are assigned to channel 1, so channel 1 merges them. Pattern 1 plays scale
      degrees 1, 3, 5, 7 (C E G B) and pattern 2 plays degrees 3, 5, 7, 1 (E G B C). Note merge is on
      Average, shown by the dim button at (15,8). Pentatonic snapping of merged notes is off: before you
      try this, tap K1, open PARAMS > MOSAIC and set Lock merged to pent. to Off. Left On (the default),
      merged notes snap to the five-note pentatonic version of the scale and you hear different pitches.'
    assertion:
      kind: grid
      cells: [[15, 8]]
      expected: [2]
  - id: average
    title: Average note merging
    caption: 'Tap Play (1,8). Each note is the mean of the two patterns'' degrees (2, 4, 6, 4): D, F,
      A, F = MIDI 62, 65, 69, 65. Velocity comes from pattern 1.'
    assertion:
      kind: numeric-note-merge
      mode: average
      pitches: [62, 65, 69, 65]
      passed: true
  - id: choose-higher
    title: Choose Higher
    caption: 'Tap (15,8) once. The button lights brighter and Note mode on the screen reads UP, which
      is the manual''s Higher: the mean plus the gap between the two degrees.'
    assertion:
      kind: grid
      cells: [[15, 8]]
      expected: [5]
  - id: higher
    title: Higher note merging
    caption: Tap Play. The notes are F, A, C, E = MIDI 65, 69, 72, 76, wider than either source. Velocity
      still comes from pattern 1. Use Higher to spread the two lines apart for a wider, brighter contour.
    assertion:
      kind: numeric-note-merge
      mode: higher
      pitches: [65, 69, 72, 76]
      passed: true
- id: velocity-merge-numeric-output
  feature_id: velocity-merge-modes
  title: Compare velocity merge modes
  behaviour_case: M-MERGE-020
  citation: README.md#velocity-merge-modes
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 has two patterns assigned with different velocities for four notes: 127, 117,
      107, 97 and 100, 100, 100, 100. Its notes come from a third pattern, shown on the screen as Note
      mode PAT 4 (pattern 4 is not assigned to the channel; all its notes are MIDI 67), so only velocity
      changes. Velocity merge is on Average, shown by the dim button at (16,8).'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [2]
  - id: average
    title: Average velocity merging
    caption: 'Tap Play (1,8). Each velocity is the mean of the two sources, for example (127 + 100) /
      2 = 114, so the four notes sound at 114, 109, 104 and 99. Read the velocities in the MIDI strip,
      "MIDI sent in this step": every note is MIDI 67 and only the velocity changes.'
    assertion:
      kind: numeric-velocity-merge
      contributors: 2
      mode: average
      velocities: [114, 109, 104, 99]
      passed: true
  - id: choose-higher
    title: Choose Higher
    caption: 'Tap (16,8) once, without K1 (with K1 held the same button sets length merge instead). The
      button lights brighter and Velocity mode on the screen reads UP, which is the manual''s Higher:
      the mean plus the gap between the sources.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [5]
  - id: higher
    title: Higher velocity merging
    caption: Tap Play. The four velocities in the MIDI strip are 127, 126, 111 and 102. The first is
      114 + 27 = 141, limited to 127. Use Higher to accent a step.
    assertion:
      kind: numeric-velocity-merge
      contributors: 2
      mode: higher
      velocities: [127, 126, 111, 102]
      passed: true
  - id: choose-lower
    title: Choose Lower
    caption: 'Tap (16,8) again. The button changes again and Velocity mode reads DOWN, the manual''s Lower:
      twice the lowest source minus the mean.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [8]
  - id: lower
    title: Lower velocity merging
    caption: Tap Play. The four velocities in the MIDI strip are 86, 91, 96 and 95. The first is 2 x 100
      - 114 = 86. Use Lower for ghost notes.
    assertion:
      kind: numeric-velocity-merge
      contributors: 2
      mode: lower
      velocities: [86, 91, 96, 95]
      passed: true
  - id: back-to-average
    title: Return to Average
    caption: 'Tap (16,8) once more. The modes cycle Average, Higher, Lower and back: tap Play and the
      MIDI strip shows the velocities 114, 109, 104 and 99 again.'
    assertion:
      kind: numeric-velocity-merge
      mode: average
      velocities: [114, 109, 104, 99]
    occurrence: 2
- id: length-merge-numeric-output
  feature_id: length-merge-modes
  title: Compare note-length merge modes
  behaviour_case: M-MERGE-025
  citation: README.md#length-merge-modes
  steps:
  - id: start
    title: Starting point
    caption: 'Patterns 1 and 2 are both assigned to channel 1, with the same trigs on the same steps:
      pattern 1''s notes are 2 steps long and pattern 2''s are 4 steps long. Length merge is on Average,
      shown by the dim button at (16,8). Length merge is set with K1 (shift) held, which turns the velocity
      merge button (16,8) into the length button.'
    assertion:
      kind: grid
      cells: [[1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4]]
      expected: [15, 5, 5, 5, 2, 2, 2, 2]
  - id: average
    title: Average length merging
    caption: Tap Play (1,8). Average is the mean of the two lengths, 2 and 4, so each merged note lasts
      3 steps (0.5 s).
    assertion:
      kind: numeric-length-merge
      source_steps: [2, 4]
      mode: average
      expected_steps: 3
      passed: true
  - id: choose-longer
    title: Choose Longer
    caption: 'Hold K1 and tap (16,8) once. The button lights brighter and Length mode on the screen reads
      UP, which is the manual''s Longer: the mean plus the gap between the lengths. Without K1 the same
      button sets the velocity merge instead.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [5]
  - id: higher
    title: Longer length merging
    caption: 'Tap Play. 3 + 2 = 5 steps (0.83 s), longer than either source: overlapping, legato notes.
      Use Longer for pads that run into each other.'
    assertion:
      kind: numeric-length-merge
      source_steps: [2, 4]
      mode: longer
      expected_steps: 5
      passed: true
  - id: choose-shorter
    title: Choose Shorter
    caption: 'Hold K1 and tap (16,8) again. The button changes again and Length mode reads DOWN, the manual''s
      Shorter: twice the shortest length minus the mean.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [8]
  - id: lower
    title: Shorter length merging
    caption: 'Tap Play. 2 x 2 - 3 = 1 step (0.17 s): short, staccato notes. Use Shorter for tight plucks.'
    assertion:
      kind: numeric-length-merge
      source_steps: [2, 4]
      mode: shorter
      expected_steps: 1
      passed: true
  - id: back-to-average
    title: Return to Average
    caption: 'Hold K1 and tap (16,8) once more: Length mode reads AVERAGE. The modes cycle Average, Longer,
      Shorter and back: tap Play and the notes last 3 steps again.'
    assertion:
      kind: numeric-length-merge
      source_steps: [2, 4]
      mode: average
      expected_steps: 3
    occurrence: 2
- id: velocity-merge-repeat-cycle
  feature_id: velocity-merge-modes
  title: Cycle velocity modes and return to Average
  behaviour_case: M-MERGE-012
  citation: README.md#velocity-merge-modes
  steps:
  - id: start
    title: Starting point
    caption: Two patterns with different velocities are assigned to channel 1 and velocity merge is on
      Average. The first note plays at velocity 114.
    assertion:
      kind: merge-mode-cycle
      field: velocity
      stage: initial-average
      passed: true
  - id: tap-average
    title: Three taps round the cycle
    caption: 'Tap (16,8) three times. Watch Velocity mode on the screen: UP (Higher), then DOWN (Lower),
      then AVERAGE again, while the button goes brighter, brighter still, then back to its dim Average
      level.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [2]
  - id: returned-average-1
    title: Hear Average after a full cycle
    caption: 'Tap Play (1,8): the first note is velocity 114 again. A full cycle of three taps always
      ends on Average.'
    assertion:
      kind: merge-mode-cycle
      field: velocity
      stage: returned-average-1
      passed: true
- id: length-merge-repeat-cycle
  feature_id: length-merge-modes
  title: Cycle length modes and return to Average
  behaviour_case: M-MERGE-013
  citation: README.md#length-merge-modes
  steps:
  - id: start
    title: Starting point
    caption: 'Patterns 1 and 2 (notes of 2 and 4 steps) are assigned to channel 1 and length merge is
      on Average: the merged notes last three steps. Length mode is set by holding K1 and pressing (16,8).'
    assertion:
      kind: merge-mode-cycle
      field: length
      stage: initial-average
      passed: true
  - id: tap-average
    title: Three taps round the cycle
    caption: 'Hold K1 and tap (16,8) three times. Watch Length mode on the screen: UP (Longer), then DOWN
      (Shorter), then AVERAGE again, while the button goes brighter, brighter still, then back to its
      dim Average level.'
    assertion:
      kind: grid
      cells: [[16, 8]]
      expected: [2]
  - id: returned-average-1
    title: Hear Average after a full cycle
    caption: 'Release K1 and tap Play (1,8): the notes last three steps again. A full cycle of three taps
      always ends on Average.'
    assertion:
      kind: merge-mode-cycle
      field: length
      stage: returned-average-1
      passed: true
- id: shuffle-smooth-amount-boundaries
  feature_id: clocks-swing-and-shuffle
  title: Set Smooth shuffle and change its amount
  behaviour_case: M-SHUFFLE-002
  citation: README.md#clocks-swing-and-shuffle
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 sends to a MIDI device and plays pattern 1: four trigs on steps 1-4 (C, D, E,
      F = MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97) in the default C major scale, with Rate
      /1. Its Clock page is set to Shuffle with Feel Smooth, Basis 9 and Amount 1. Timing is counted in
      pulses: each step is 24 pulses, so at Amount 1 the notes sit almost exactly on the straight grid,
      at 0, 24, 48 and 72. Feel and Basis stay the same through this lesson; only Amount changes.'
    assertion:
      kind: shuffle-feel-basis-amount
      feel: Smooth
      basis: '9'
      amount: 1
  - id: amount-50
    title: Set shuffle amount to 50
    caption: 'Select Amount and turn E3 to 50, then tap Play (1,8). Two of the four notes in each group
      have moved: the second now lands at 26 pulses instead of 24 and the fourth at 71 instead of 72.
      Compare the ms offsets in the MIDI strip with the straight grid.'
    assertion:
      kind: shuffle-feel-basis-amount
      feel: Smooth
      basis: '9'
      amount: 50
      passed: true
  - id: amount-0
    title: Set shuffle amount to 0
    caption: 'Set Amount to 0 and tap Play: shuffle is off and the notes are back on the straight grid
      at 0, 24, 48, 72 pulses.'
    assertion:
      kind: shuffle-feel-basis-amount
      feel: Smooth
      basis: '9'
      amount: 0
      passed: true
  - id: amount-100
    title: Set shuffle amount to 100
    caption: 'Set Amount to 100 and tap Play: the fullest shuffle for this feel and basis, with the notes
      at 0, 26, 48, 69 pulses: the second note is 2 pulses late and the fourth 3 early. The second note
      was already at 26 at Amount 50 because offsets are whole pulses, so the extra Amount shows in the
      fourth note (71, then 69). For a stronger groove change Basis; the next steps use Basis 6.'
    assertion:
      kind: shuffle-feel-basis-amount
      feel: Smooth
      basis: '9'
      amount: 100
      passed: true
    occurrence: 2
  - id: basis-6-0
    title: Basis 6 at Amount 0
    caption: 'Select Basis and turn E3 to 6, then set Amount to 0 and tap Play. Amount 0 is straight timing
