# Contract derivation (hand-derived; model in tools/test_manual_audio_invariants.py):
# README.md#adding-chords - Chd1 = 3rd (mask 2) and Chd2 = 5th (mask 4) above each root in C major, so the
# roots 48, 45, 53, 55 give C-E-G, A-C-E, F-A-C, G-B-D on steps 1, 5, 9, 13 of every bar (length 2 steps).
# Slot 1 (steps 0..31) has Harmony Off, which README.md#harmony says "follows the ordinary Mosaic pitch
# path exactly": its notes are the literal block triads below. Slot 2 (steps 32..63) has Harmony Revoice.
# README.md#harmony does not fix the notes Revoice chooses ("legal octaves and assignments" inside
# Register ranges the manual does not state), so the contract does not list them. The `revoice` invariant
# is made only of README statements: Revoice takes the root and chord-mask voices "preserving their pitch
# classes and sounding count" (rules sounding-count and pitch-classes, and the same onset steps because
# only pitch is revoiced), "Bass can be Root" (rule bass-root: the lowest note is the chord root, with the
# Bass Mode row read as ROOT on the screen). "Smooth prioritises literal common tones and economical
# movement" is not made a rule: the README defines neither a voice identity nor a measure of movement, and a
# run showed Mosaic giving up a common pitch (G, from the bass of G to the root C of the next chord) for a
# root bass. Register defaults are not stated either. The roots sit an octave below the strum lesson's: a
# first run with roots 65 and 67 (above the High of 60 the Register screen shows for the first voice) left
# those chords silent, as README.md#harmony says a frame with no solution silences its voices by default.
# The literal Revoice chords a run captured are kept as characterisation in its receipt, never as the oracle.
- id: voice-leading-revoice
  title: Block chords, then Revoice
  purpose: lesson-comparison
  feature_ids:
  - harmony
  - adding-chords
  - musical-merge-and-voice-leading
  description: Doubledecker on channel 1 plays a four-chord progression, C, A minor, F and G in C major,
    on steps 1, 5, 9 and 13 of every bar for four bars at 90 BPM, as triads at velocity 80 with Chd1 on the
    3rd and Chd2 on the 5th, each chord two steps long. In the first two bars Harmony is Off, so the chords
    sound exactly as written, each in root position. In the last two bars Harmony Revoice is on. It keeps
    the same chords, with the same pitch classes, number of notes and rhythm, and only re-places the notes
    in other octaves, with each chord's root lowest. Listen for the same four chords being re-voiced at bar
    3, about 5.3 seconds in, while the harmony stays the same.
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Doubledecker
    note: 48
    velocity: 80
    length_detents: 18
    range_last: 16
    chords:
    - 2
    - 4
    phrase:
    - - 1
      - 48
    - - 5
      - 45
    - - 9
      - 53
    - - 13
      - 55
  setup: voice-leading-revoice
  sections:
  - slot: 1
    global_length: 32
    changes: []
  - slot: 2
    global_length: 32
    changes:
    - kind: harmony
      channel: 1
      mode: revoice
  midi_contract:
    cycle_steps: 64
    invariants:
    - kind: revoice
      channel: 1
      reference_start_step: 0
      revoiced_start_step: 32
      length_steps: 32
