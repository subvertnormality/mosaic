schema_version: 1
examples:
- id: oilcan-pocket
  title: Three sounds, one pocket
  feature_ids:
  - pocket-rhythm
  - rhythm-section-design
  description: 'Oilcan 1 on channel 1 plays eight drum hits per bar for four bars at 90 BPM, all at velocity
    48. In every bar the hits fall on steps 1 (MIDI 36), 4 (38), 5 (37), 7 (38), 9 (36), 12 (38), 13 (37)
    and 15 (38). Oilcan is a drum voice: each MIDI note number picks a different pad of its default kit,
    so 36, 37 and 38 are three different drum sounds, here called timbres, played one after another on a
    single channel. Listen for the pad on MIDI 36 on beats 1 and 3, the pad on 37 on beats 2 and 4 and the
    pad on 38 filling the gaps. Every hit has the same velocity. Next, try muting the 38 hits by clearing
    their trigs and hear how the other two pads carry the pocket. Build it with the Separate fixed percussion
    example recipe.'
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Oilcan 1
    note: 36
    velocity: 48
    length_detents: 8
    phrase:
    - - 1
      - 36
    - - 4
      - 38
    - - 5
      - 37
    - - 7
      - 38
    - - 9
      - 36
    - - 12
      - 38
    - - 13
      - 37
    - - 15
      - 38
  purpose: inspiration
- id: bass-and-intervals
  title: A bass with room above it
  feature_ids:
  - masks
  - adding-chords
  - tilting-harmony
  description: 'Polyperc 1 on channel 1 plays a bass at velocity 48: MIDI 48 on steps 1, 5 and 13 and MIDI
    55 on step 9 of each bar. Doubledecker on channel 2 plays chords (velocity 32, three steps long) on
    steps 1 and 9 with root MIDI 60 then 62, Chd1 set to 3rd and Chd2 set to 5th, which gives C-E-G and
    D-F-A in C major. Four bars at 90 BPM, a four-step cycle that repeats every bar. Listen for the C-E-G chord on step 1 and the D-F-A chord on step 9. The bass plays C2 on steps 1, 5 and 13 and G2 on step 9. Build it with the Separate fixed bass-and-chord example recipe.'
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Polyperc 1
    note: 48
    velocity: 48
    length_detents: 8
    phrase:
    - - 1
      - 48
    - - 5
      - 48
    - - 9
      - 55
    - - 13
      - 48
  - channel: 2
    voice: Doubledecker
    note: 60
    velocity: 32
    length_detents: 22
    chords:
    - 2
    - 4
    phrase:
    - - 1
      - 60
    - - 9
      - 62
  purpose: inspiration
- id: three-voice-conversation
  title: Rhythm, bass and a changing chord
  feature_ids:
  - small-hours
  - mods-and-software-devices
  description: Oilcan 1, Polyperc 1 and Doubledecker play on channels 1, 2 and 3 for four bars at 90 BPM;
    a bar lasts about 2.7 seconds. Drums at velocity 38 hit steps 1/36, 4/38, 5/37, 9/36, 12/38 and 13/37
    of every bar. The bass at velocity 42 plays MIDI 48 on steps 1, 5 and 13 and MIDI 55 on step 9. The
    chords (velocity 26, three steps long, Chd1 3rd, Chd2 5th) have roots MIDI 60 on step 1 and 62 on step
    9 in bars 1 to 3, and MIDI 67 on step 49 and 60 on step 57 in bar 4. Listen for the chord changing at
    the start of bar 4, about 8 seconds in, over drums and bass that stay exactly the same. The drums are
    the loudest layer and the bass is the quietest. Build it with the three Four-Bar Percussion, Bass and
    Chord recipes.
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Oilcan 1
    note: 36
    velocity: 38
    length_detents: 8
    phrase:
    - - 1
      - 36
    - - 4
      - 38
    - - 5
      - 37
    - - 9
