# Contract derivation (hand-derived; model in tools/test_manual_audio_lessons.py, ParamLockComparison):
# README.md#trig-param-locks - holding a step and adjusting a parameter locks its value to that step. Slot 1 has
# no locks. Slot 2 locks a Polyperc voice parameter (Decay) and, on the MIDI witness channel, CC 1 on steps 1, 5, 9
# and 13. A voice-parameter lock changes no MIDI note, so the notes are identical in both slots (an eighth-note
# line, one 0.5-step note on every odd step); the CC 1 rows prove lock timing on a controller, NOT the voice
# parameter: each value leaves at its own step (README.md#lock-lead-time: lead 0 sends each value at its own
# step; the behaviour harness runs at lead 0) and ahead of that step's note-on. The CC rows exist only in
# slot 2, steps 32-63. A CC lock is turned value+1 detents up from its Off end (11 detents lock the value 10).
- id: param-lock-comparison
  title: Parameter locks on and off
  purpose: lesson-comparison
  feature_ids:
  - trig-param-locks
  description: Polyperc 1 on channel 1 plays an eighth-note line for four bars at 90 BPM, MIDI 48, 55, 52,
    55, 48, 55, 53 and 55 on the odd steps of every bar at velocity 70, short notes half a step long. In
    bars 1 and 2 nothing is locked. In bars 3 and 4 the Decay parameter is locked on steps 1, 5, 9 and 13
    of each bar, so those four notes ring with a different decay from the notes between them while the
    notes themselves stay exactly the same. Listen for the plucks on the beat lengthening against the plain
    ones after them from bar 3, about 5.3 seconds in, and for the line sounding even again at the end of
    the cycle.
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Polyperc 1
    note: 48
    velocity: 70
    length_detents: 8
    range_last: 16
    phrase:
    - - 1
      - 48
    - - 3
      - 55
    - - 5
      - 52
    - - 7
      - 55
    - - 9
      - 48
    - - 11
      - 55
    - - 13
      - 53
    - - 15
      - 55
  setup: param-lock-comparison
  sections:
  - slot: 1
