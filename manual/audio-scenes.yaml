# Contract derivation (hand-derived; model in tools/test_manual_audio_lessons.py, HarmonyStrumArp):
# README.md#adding-chords - Chd1 = 3rd (mask 2) and Chd2 = 5th (mask 4) above each root in C major, so the
# roots 60, 57, 65, 67 give C-E-G, A-C-E, F-A-C, G-B-D on steps 1, 5, 9, 13 of every bar (length 2 steps).
# README.md#chord-strum / #chord-acceleration / #chord-spread - gap before chord slot k is d + s*(1 + (k-1)*a)
# channel steps, first slot at the trigger. Strum d = 1, Spread s = 1, Acceleration a = -1: gap 1 = 1 + 1*1 = 2,
# gap 2 = 1 + 1*(1 + 1*(-1)) = 1, so root, Chd1 and Chd2 sound at 0, 2 and 3 steps. Bar 1 (slot 1) has no Strum:
# block chords. A strummed note keeps the selected length (2 steps) from its own onset ("do not change the
# selected note length"); every strum onset is a whole step. README.md#chord-arpeggio - slot 3 adds Arp 1/2
# on top of the slot 2 Strum, Spread and Acceleration; the arp overrules the strum. Gaps: 1/2 + 1*1 = 3/2 and
# 1/2 + 1*(1 + 1*(-1)) = 1/2, so the slots fall at 0, 3/2 and 2; the note at 2 would start at the original
# endpoint, where the manual says no further arp note starts, so only the root and Chd1 sound. Each arp note
# lasts one division (1/2 step) from its onset, shortened when necessary to finish at the endpoint.
# The values are step trig locks on steps 1, 5, 9 and 13 (README.md#trig-param-locks), made in the slot they
# belong to: from the lowest value of each parameter, Strum "1" is 14 detents up, Spread "1" is 14, Acceleration
# -1 is 4 (range -5..5) and Arp "1/2" is 8 (division list X, 1/24, 1/12, 1/8, 1/6, 1/4, 1/3, 3/8, 1/2, ...).
- id: harmony-strum-arp
  title: Block chords, strummed, then arpeggiated
  purpose: lesson-comparison
  feature_ids:
  - adding-chords
  - chord-strum
  - chord-acceleration
  - chord-spread
  - chord-arpeggio
  - trig-param-locks
  description: Doubledecker on channel 1 plays a four-chord progression, C, A minor, F and G in C major,
    on steps 1, 5, 9 and 13 of every bar for four bars at 90 BPM, as triads at velocity 80 with Chd1 on the
    3rd and Chd2 on the 5th, each chord two steps long. In bar 1 the chords are blocks, all three notes
    together. In bars 2 and 3 Chord Strum 1 is locked on each chord step with Spread 1 and Acceleration
    minus 1, so the root sounds first, the 3rd two steps later and the 5th a step after that, a strum that
    speeds up, about half a second end to end. In bar 4 Chord Arp 1/2 is locked on as well and takes over
    from the strum, so each chord becomes just two short notes, the root and then the 3rd a step and a half
    later. Listen for the chords opening up into a quickening strum at bar 2, about 2.7 seconds in, and
    for the strum turning into a sparse, detached two-note figure at bar 4, about 8 seconds in.
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Doubledecker
    note: 60
    velocity: 80
    length_detents: 18
    range_last: 16
    chords:
    - 2
    - 4
    phrase:
    - - 1
      - 60
    - - 5
      - 57
    - - 9
      - 65
    - - 13
