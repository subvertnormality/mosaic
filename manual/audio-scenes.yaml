    - - 1
      - 67
    - - 9
      - 60
  purpose: inspiration
- id: ghost-note-comparison
  title: Adding a Ghost Note
  purpose: lesson-comparison
  feature_ids:
  - pocket-rhythm
  - adding-velocity
  description: 'Bars 1 and 2 play only the main hits: Oilcan 1 plays MIDI 36 on steps 1 and 9 and MIDI 37
    on steps 5 and 13, all at velocity 90. Bars 3 and 4 add one quiet hit, MIDI 38 at velocity 35, on step
    12 of each bar, one step before the MIDI 37 accent. MIDI 38 is a different pad of the Oilcan kit, so
    the ghost note is both softer and a different drum sound than the main hits. 90 BPM, all notes half
    a step long. Listen for the soft extra hit that appears in the third bar, about 5 seconds in; it is
    much quieter than the main hits and the main hits do not change. Build it with the Make the recorded
    ghost-note comparison recipe.'
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Oilcan 1
    note: 36
    velocity: 90
    length_detents: 8
    phrase: &id001
    - &id002
      - 1
      - 36
    - &id003
      - 5
      - 37
    - &id004
      - 9
      - 36
    - &id005
      - 13
      - 37
    bar_phrases:
    - *id001
    - *id001
    - &id006
      - *id002
      - *id003
      - *id004
      - - 12
        - 38
      - *id005
    - *id006
    velocity_overrides:
    - - 44
      - 35
    - - 60
      - 35
