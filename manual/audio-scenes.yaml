# Contract derivation (hand-derived; models in tools/test_manual_audio_lessons.py):
# README.md#clocks-swing-and-shuffle - Swing moves notes off the grid. Swing 25 delays the second step of each
# pair by 25% of a step (+6/24, literal pulse table 0/30/48/78 of M-MANUAL-SWING-001). Slot 1 is straight.
# Gate under swing is a characterisation outside the manual (lib/clock/m_lattice.lua pending_deadline): a
# gate below one step is the fraction 0.5 of the step's own swung interval, 1.25 steps (gate 0.625) for the
# first step of a pair and 0.75 steps (gate 0.375) for the second.
- id: swing-comparison
  title: Straight, then swung
  purpose: lesson-comparison
  feature_ids:
  - clocks-swing-and-shuffle
  description: Oilcan 1 on channel 1 and Polyperc 1 on channel 2 play the same groove for four bars at
    90 BPM, straight in bars 1 and 2 and swung in bars 3 and 4. Oilcan plays MIDI 36 on steps 1 and 9,
    MIDI 38 on steps 5 and 13 and MIDI 37 on steps 2, 6, 10 and 14, all at velocity 80. Polyperc plays
    MIDI 48 on steps 1 and 9 and MIDI 55 on steps 4 and 12 at velocity 60. In bars 3 and 4 both channels
    carry Swing 25, so every second step of a pair lands a quarter of a step late, about 0.04 seconds,
    while the first step of each pair stays on the grid. Listen for the small 37 hits and the 55 bass
    notes starting to trail the beat at bar 3, about 5.3 seconds in; the 36, 38 and 48 downbeats do not
    move.
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Oilcan 1
    note: 36
    velocity: 80
    length_detents: 8
    phrase:
    - - 1
      - 36
    - - 2
      - 37
    - - 5
      - 38
    - - 6
      - 37
    - - 9
      - 36
    - - 10
      - 37
    - - 13
      - 38
    - - 14
      - 37
  - channel: 2
    voice: Polyperc 1
    note: 48
    velocity: 60
    length_detents: 8
    phrase:
    - - 1
      - 48
    - - 4
      - 55
    - - 9
      - 52
    - - 12
      - 55
  setup: swing-comparison
  sections:
  - slot: 1
    global_length: 32
    changes: []
  - slot: 2
    global_length: 32
    changes:
    - kind: swing
      amount: 25
