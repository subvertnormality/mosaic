- id: scale-slot-comparison
  title: Changing Harmony with Scale Slots
  purpose: lesson-comparison
  mode: relative-scale-slots
  feature_ids:
  - harmony-design
  - tilting-harmony
  description: 'The same relative-note patterns play under C major (scale slot 1) for bars 1 and
    2 and D major (scale slot 2) for bars 3 and 4, at 90 BPM. Doubledecker on channel 1 plays
    degrees 0, 0, 0 and 1 on steps 1, 5, 9 and 13, with the last note softer (velocity 50): MIDI
    60, 60, 60, 62 in C and 62, 62, 62, 64 in D. Polyperc 1 on channel 2 plays degrees 0 and 4
    at octave minus 1 on steps 1 and 9: MIDI 48 and 55 in C and 50 and 57 in D. Note masks stay
    X, and rhythm and velocity do not change. Listen for the whole texture stepping up a whole
    tone at bar 3. Build it with the Make the relative-note scale comparison recipe.'
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Doubledecker
    pattern: 1
    octave: 0
    velocity: 80
    length_detents: 8
