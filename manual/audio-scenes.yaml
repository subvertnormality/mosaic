# Contract derivation (hand-derived; models in tools/test_manual_audio_lessons.py):
# README.md#note-merge-modes - Average rounds half up (1.5 -> 2); Higher = rounded average + (highest - lowest);
# one contributor passes through. README.md#trig-merge-modes - All plays a trig present in any assigned pattern.
# README.md#lock-merged-to-pentatonic - 'Lock merged to pent.' is off, so degrees map through plain C major (60 62 64 65 67 69 71, +12 per 7).
- id: note-merge-modes
  title: Average, then Higher
  purpose: lesson-comparison
  mode: relative-scale-slots
  feature_ids:
  - note-merge-modes
  - trig-merge-modes
  - lock-merged-to-pentatonic
  description: 'Polyperc 1 on channel 1 plays one melody at 90 BPM, velocity 80, built from two patterns
    assigned to the same channel with trig merge All and the pentatonic lock off, in C major. Pattern
    1 has degrees 0, 2, 4, 2, 0 and 4 on steps 1, 3, 5, 7, 9 and 13; pattern 2 has degrees 2, 6, 3, 3,
    0 and 5 on steps 1, 5, 9, 11, 13 and 15. Steps 1, 5, 9 and 13 are in both patterns, so the note merge
    mode decides them. Bars 1 and 2 use Average and play MIDI 62, 69, 64 and 64 there; bars 3 and 4 use
    Higher and play MIDI 65, 72, 69 and 71. Steps 3, 7, 11 and 15 belong to one pattern each and sound
    the same in both halves: MIDI 64, 64, 65 and 69. Listen for the shared steps jumping higher at bar
    3, about 5.3 seconds in, while the in-between notes stay put.'
  bars: 4
  bpm: 90
  profile: manual-trio
  tracks:
  - channel: 1
    voice: Polyperc 1
    octave: 0
    velocity: 80
    length_detents: 8
    patterns:
    - pattern: 1
      phrase:
      - - 1
        - 0
      - - 3
        - 2
      - - 5
        - 4
      - - 7
        - 2
      - - 9
        - 0
      - - 13
        - 4
    - pattern: 2
      phrase:
      - - 1
        - 2
      - - 5
        - 6
      - - 9
        - 3
      - - 11
        - 3
      - - 13
        - 0
      - - 15
        - 5
  scale_slots:
  - slot: 1
    root: C
    root_detents: 0
  - slot: 2
    root: D
    root_detents: 2
  setup: note-merge-modes
  sections:
  - slot: 1
    global_length: 32
    changes:
    - kind: trig_merge
      mode: all
  - slot: 2
    global_length: 32
    changes:
    - kind: note_merge
      mode: higher
  midi_contract:
    cycle_steps: 64
