schema_version: 1
status: semantic-checkpoint-plan-not-captured
base_revision: 54d7b871358fcc68b7166847603cc9fb1461d0b6
scope: Replay each existing native case in full; select only post-assertion player-observable result rows.
  Checkpoints containing MIDI or persistence evidence need not visibly print the audited events. No nested-session
  or post-finish result is used as a live framebuffer checkpoint.
scenes:
- id: channel-task-navigation
  feature_id: norns-menu-navigation
  title: Find a channel task
  behaviour_case: M-LIVEUI-TASKS-001
  citation: README.md#norns-menu-navigation
  source: tests/behaviour/contract/live_ui.py
  steps:
  - id: open
    title: Open tasks
    caption: 'Tap Channel (3,8): the Masks page opens for CH01. Turn E1 one detent. From any page, E1
      opens Channel tasks, with the page you came from highlighted, here Masks. The nine tasks, top to
      bottom, are 1 Masks, 2 Trig params, 3 Output, 4 Clock, 5 Merge modes, 6 Merge Shape, 7 Harmony,
      8 Device and 9 History.'
    assertion:
      kind: e1-opens-tasks
      source: masks
      passed: true
  - id: harmony
    title: Scroll down to Harmony
    caption: 'With the list open, E1 and E2 both scroll it, one row per detent. Turn E1 two detents to
      row 3, Output, then turn E2 four detents: Clock, Merge modes, Merge Shape, and Harmony, row 7, is
      highlighted.'
    assertion:
      kind: task-scroll
      encoder: 2
      delta: 1
      row: Harmony
      passed: true
  - id: scroll-ends
    title: Scroll back up to Masks
    caption: Turn E2 four detents back up the list to Output (row 3), then turn E1 four detents the same
      way. The highlight stops on Masks, row 1, and the list does not wrap.
    assertion:
      kind: selected-field
      layout: detail
      label: Masks
      value: OPEN >
      matched: true
    occurrence: 2
  - id: open-trig-params
    title: Open Trig params
    caption: Turn E2 one detent down to Trig params (row 2) and press K3. The Trig params screen opens
      for CH01.
    assertion:
      kind: screen-header
      expected: TRIG PARAMS CH01
    occurrence: 1
  - id: family
    title: Return to the list with E1
    caption: Turn E1 one detent. Channel tasks reopens with Trig params highlighted, the page you came
      from, so E1 always brings you back to the task list at your current page.
    assertion:
      kind: e1-opens-tasks
      source: trig_locks
      passed: true
  - id: reopen-trig-params
    title: Open Trig params again
    caption: Press K3 to open Trig params again. The header reads TRIG PARAMS CH01.
    assertion:
      kind: screen-header
      expected: TRIG PARAMS CH01
    occurrence: 2
  - id: history-row
    title: Scroll to History (row 9)
    caption: Turn E1 to reopen Channel tasks, then turn E2 down to row 9. History, the last row, is
      highlighted and its value reads OPEN >.
    assertion:
      kind: selected-field
      layout: detail
      label: History
      value: OPEN >
      matched: true
    occurrence: 1
  - id: history
    title: Open History
    caption: Press K3. The History screen opens. Every task in the list opens its own screen this way.
    assertion:
      kind: channel-task
      page: memory
      passed: true
  - id: clock
    title: Open Clock (row 4)
    caption: Turn E1 to open Channel tasks from History, scroll up to row 4, Clock, and press K3. The
      Clock screen opens for channel 1.
    assertion:
      kind: channel-task
      page: clock_mods
      passed: true
  - id: device-row
    title: Scroll to Device (row 8)
    caption: Turn E1 to open Channel tasks again, then turn E2 to row 8. Device is highlighted and its
      value reads OPEN >.
    assertion:
      kind: selected-field
      layout: detail
      label: Device
      value: OPEN >
      matched: true
    occurrence: 1
  - id: device
    title: Open Device
    caption: Press K3. The Device screen opens for channel 1, where its output is chosen.
    assertion:
      kind: channel-task
      page: midi_config
      passed: true
- id: hold-step-return
  feature_id: grid-menu-navigation
  title: Inspect a step and return
  behaviour_case: M-LIVEUI-FOLLOW-001
  citation: README.md#grid-menu-navigation
  source: tests/behaviour/contract/live_ui.py
  steps:
  - id: start
    title: Starting point
    caption: 'A new empty project that has just started: stopped, Record off, channel 1 selected and no
      step held. The Channel editor is showing: its header reads NOTE MASKS CH01. The first step visits
      the page keys before you hold a step.'
    assertion:
      kind: screen-header
      expected: NOTE MASKS CH01
    occurrence: 1
  - id: pages
    title: Visit the page keys
    caption: 'Tap each page key in turn and watch the header follow. Scale (4,8) opens the Scale Editor,
      SCALE SLOT 01. Pattern (5,8) cycles Trig, Note, then Velocity: three taps reach PATTERN VELOCITY
      PAT01 CH01. Song (6,8) opens SONG PLAYBACK SONG 01. Channel (3,8) brings you back to NOTE MASKS
      CH01.'
    assertion:
      kind: screen-header
      expected: NOTE MASKS CH01
    occurrence: 2
  - id: select-channel
    title: Select channel 3
    caption: Tap channel 3 at (3,1). The header now reads NOTE MASKS CH03.
    assertion:
      kind: screen-header
      expected: NOTE MASKS CH03
    occurrence: 1
  - id: hold
    title: Hold a step
    caption: 'Press and hold step 5 at (5,4). The header reads CH03 ST05: ST05 means step 5 of the selected
      channel. While the step is held, edits on this Masks page apply to step 5 only.'
    assertion:
      kind: held-scope
      step: 5
      passed: true
  - id: edit-held
    title: Edit while the step is held
    caption: With step 5 still held, turn E2 to the Note cell and turn E3 one detent up. The Note cell
      changes from X to C-2 and the header still reads CH03 ST05, so the edit belongs to step 5 only.
    assertion:
      kind: selected-mask
      field: note
      value: C-2
      passed: true
  - id: release
    title: Release the step
    caption: Let go of step 5. The header drops back to NOTE MASKS CH03 and edits apply to the whole channel
      again.
    assertion:
      kind: screen-header
      expected: NOTE MASKS CH03
    occurrence: 2
  - id: channel-unchanged
    title: The channel value is unchanged
    caption: Look at the Note cell now. It still reads X, the channel's own value, so the C-2 you set
      lives on step 5 alone.
    assertion:
      kind: selected-mask
      field: note
      value: X
      passed: true
    occurrence: 2
  - id: open-clock
    title: Open the Clock page
    caption: Turn E1 to open Channel tasks, scroll to Clock and press K3. The Clock page for CH03 is showing.
    assertion:
      kind: ui-confirm
      page: clock_mods
      channel: 3
  - id: hold-on-clock
    title: Hold a step from the Clock page
    caption: Press and hold step 9 at (9,4). While it is held the screen switches to that step's Masks,
      header NOTE MASKS CH03 ST09, whichever page you were on.
    assertion:
      kind: screen-header
      expected: NOTE MASKS CH03 ST09
    occurrence: 1
  - id: return
    title: Return to the parent screen
    caption: Release step 9. The screen returns to the Clock page, the page you were on before you held
      the step.
    assertion:
      kind: hold-returns-to-parent
      screen: clock_mods
      passed: true
- id: protect-stop-gesture
  feature_id: shift-press-stop
  title: Protect playback from a stray tap
  behaviour_case: M-OPT-STOP-001
  citation: README.md#shift-press-stop
  source: tests/behaviour/contract/stop_safety.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step phrase through the test MIDI device: trigs on steps 1 to 4 with
      C D E F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. The channel range is steps 1-4,
      the tempo is the default 90 BPM, Rate is /1 and the sequencer is stopped. Every Mosaic option is
      at its default, so Shift press to stop is Off. The Device page for CH01 is showing.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: started
    title: Start playback
    caption: Press Play/Stop (1,8). The phrase starts and the MIDI stream carries the four notes.
    assertion:
      kind: stop-safety
      stage: default-started
      transport: playing
      passed: true
  - id: default
    title: A tap stops by default
    caption: With Shift press to stop Off, press Play/Stop (1,8) again after under a second. The sequencer
      stops, the MIDI stream goes silent and every sounding note is released.
    assertion:
      kind: stop-safety
      stage: default-tap
      transport: stopped
      passed: true
  - id: option-on
    title: Turn Shift press to stop on
    caption: Tap K1 and open PARAMS > MOSAIC, select Shift press to stop and turn E3 right to On. The
      row reads On.
    assertion:
      kind: selected-menu-option-row
      label: Shift press to stop
      value: 'On'
      matched: true
  - id: playing-on
    title: Start with the option on
    caption: 'Close the menu and press Play/Stop to start. Starting is never blocked: the phrase plays.'
    assertion:
      kind: stop-safety
      stage: on-tap-starts
      transport: playing
      passed: true
  - id: short
    title: Ignore a short stop tap
    caption: Tap Play/Stop again after under a second. The tap is ignored and the phrase keeps playing.
    assertion:
      kind: stop-safety
      stage: on-short-tap-ignored
      transport: playing
      passed: true
  - id: below
    title: Hold briefly without stopping
    caption: Press and hold Play/Stop for 0.9 seconds, then release. This is still shorter than the one-second
      threshold, so playback continues.
    assertion:
      kind: stop-safety
      stage: on-hold-below-threshold-ignored
      transport: playing
      passed: true
  - id: shift
    title: Stop with Shift
    caption: Hold K1 and tap Play/Stop. With Shift held, a short tap stops playback and releases its notes.
    assertion:
      kind: stop-safety
      stage: on-shift-K1-tap-stops
      transport: stopped
      passed: true
  - id: k3
    title: K3 is not a shift key
    caption: 'Tap Play/Stop to start again. Hold K3 and tap Play/Stop: K3 is not a shift key, so playback
      continues.'
    assertion:
      kind: stop-safety
      stage: on-K3-tap-ignored
      transport: playing
      passed: true
  - id: long
    title: Stop with a long press
    caption: Hold Play/Stop alone for 1.1 seconds. Playback stops, because a hold of one second or more
      counts as a long press.
    assertion:
      kind: stop-safety
      stage: on-long-press-stops
      transport: stopped
      passed: true
  - id: option-off
    title: Turn Shift press to stop off
    caption: Tap K1 and open PARAMS > MOSAIC, select Shift press to stop and turn E3 left to Off. The
      row reads Off.
    assertion:
      kind: selected-menu-option-row
      label: Shift press to stop
      value: 'Off'
      matched: true
  - id: restore
    title: Ordinary tap stop is back
    caption: 'Close the menu, start playback and tap Play/Stop: a short tap stops it again.'
    assertion:
      kind: stop-safety
      stage: off-again-tap-stops
      transport: stopped
      passed: true
- id: named-project-roundtrip
  feature_id: save-and-load
  title: Keep a named project and recover it
  behaviour_case: M-SAVE-NAMED-001
  citation: README.md#save-and-load
  source: tests/behaviour/named_save.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step melody through a MIDI device: trigs on steps 1 to 4 on pattern
      degrees 1 to 4 of scale slot 1 (C major), so MIDI notes 60, 62, 64 and 65. The sequencer is stopped
      and the Device page for CH01 is showing. The project has never been saved under a name, so no new
      or newB file exists.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: original
    title: Hear the original melody
    caption: 'Press Play (1,8), listen, and press it again to stop. The melody is C, D, E, F: MIDI 60,
      62, 64, 65.'
    assertion:
      kind: named-save
      stage: initial-A
      passed: true
      phrase:
      - 60
      - 62
      - 64
      - 65
  - id: save-menu
    title: Find Save project
    caption: Tap K1 to open the norns menu, choose PARAMS, then MOSAIC, and scroll to Save project.
    assertion:
      kind: selected-menu-label
      text: < Save project
    occurrence: 1
  - id: default
    title: Save the default name
    caption: Press K3 to open the name entry. It starts on the suggested name, new, with OK selected,
      so press K3 again to accept it. Mosaic writes the project file and its parameter file under that
      name. Tap K1 to close the menu.
    assertion:
      kind: named-save
      stage: save-default-name
      files_state: created
      passed: true
  - id: save-again
    title: Open Save project again
    caption: Tap K1 and scroll to MOSAIC > Save project once more.
    assertion:
      kind: selected-menu-label
      text: < Save project
    occurrence: 2
  - id: typed
    title: Save another name
    caption: Press K3 to open the name entry. Turn E3 left to the letter row, turn E2 one detent to B
      and press K3 to add it, so the name reads newB. Turn E3 right to the bottom row, turn E2 right to
      OK and press K3. A second, separate save is created, and both saves, new and newB, now hold the
      melody C, D, E, F. Tap K1 to close the menu.
    assertion:
      kind: named-save
      stage: save-typed-name
      name: newB
      files_state: created
      passed: true
  - id: edit
    title: Edit the melody
    caption: 'Press Pattern (5,8) twice: the first press shows the trig page and the second the note page.
      Press (4,3) to raise step 4 from F to G. Tap Channel (3,8) to return to the Channel editor and press
      Play (1,8): the melody is now C, D, E, G, MIDI 60, 62, 64, 67.'
    assertion:
      kind: named-save
      stage: edited-B
      passed: true
      phrase:
      - 60
      - 62
      - 64
      - 67
  - id: autosave
    title: Let autosave preserve both names
    caption: Leave Mosaic stopped and untouched for about a minute until the idle autosave runs. A third
      file, autosave, is written. The saves new and newB are not touched.
    assertion:
      kind: named-save
      stage: autosave-preserves-named
      autosave_state: created
      named_saves: unchanged
      passed: true
  - id: cancel
    title: Cancel a save
    caption: Tap K1 and scroll to MOSAIC > Save project. Press K3 to open the name entry, then press K2
      to cancel. No project file changes. Tap K1 to close the menu.
    assertion:
      kind: named-save
      stage: cancel-save
      passed: true
  - id: overwrite
    title: Overwrite only the chosen name
    caption: Open Save project again, press K3, then K3 again to accept the name new and confirm replacing
      it. The save new now holds the edited melody C, D, E, G. The save newB is unchanged and still holds
      C, D, E, F.
    assertion:
      kind: named-save
      stage: overwrite-default-name
      files_state: changed
      typed_save: unchanged
      passed: true
  - id: load-menu
    title: Find Load project
    caption: Tap K1, then scroll to MOSAIC > Load project.
    assertion:
      kind: selected-menu-label
      text: '> Load project'
    occurrence: 1
  - id: load-a
    title: Load the preserved phrase
    caption: Press K3 to open the file picker, choose newB.ptn and press K3. The original melody returns.
      Close the menu and press Play to hear MIDI 60, 62, 64 and 65.
    assertion:
      kind: named-save
      stage: load-typed-A
      phrase:
      - 60
      - 62
      - 64
      - 65
      passed: true
  - id: load-b
    title: Load the overwritten phrase
    caption: Load new.ptn the same way. The edited melody plays MIDI 60, 62, 64 and 67. The save newB
      is still in the file list.
    assertion:
      kind: named-save
      stage: load-overwritten-B
      phrase:
      - 60
      - 62
      - 64
      - 67
      passed: true
  estimated_native_seconds: 90
- id: pentatonic-snap-all
  feature_id: lock-all-to-pentatonic
  title: Restrict every note to five degrees
  behaviour_case: M-OPT-PENT-ALL-001
  citation: README.md#lock-all-to-pentatonic
  source: tests/behaviour/pentatonic_options.py
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, in C major through the test MIDI device. The channel range is steps 1-4, the tempo
      is the default 90 BPM, Rate is /1 (sixteenth-note steps, one sixth of a second each) and the sequencer
      is stopped. Every Mosaic option is at its default, so Lock all to pentatonic is Off. Lock all to
      pentatonic forces every note you play onto a five-note subset of the chosen scale, so each scale
      step below changes which five notes survive.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: seven-steps
    title: Extend the pattern to seven steps
    caption: 'Open the Pattern editor (5,8), which starts on the trig page. Tap steps 5, 6 and 7 on the
      trig row, (5,4), (6,4) and (7,4). Press (5,8) again for the note page and press the rising diagonal
      (1,7), (2,6), (3,5), (4,4), (5,3), (6,2), (7,1): one note per step, scale degrees I-VII, C D E F
      G A B. The note page now shows a rising diagonal.'
    assertion:
      kind: grid
      cells:
      - - 1
        - 7
      - - 2
        - 6
      - - 3
        - 5
      - - 4
        - 4
      - - 5
        - 3
      - - 6
        - 2
  - id: finish-pattern
    title: Set the velocities of steps 5 to 7
    caption: 'Press (5,8) for the velocity page and tap (5,1), (6,2) and (7,3): the velocity bars for
      steps 5, 6 and 7 light up.'
    assertion:
      kind: grid
      cells:
      - - 5
        - 1
      - - 6
        - 2
      - - 7
        - 3
  - id: seven-step-range
    title: Set the range to seven steps
    caption: Return to the Channel editor (3,8), hold step 1 (1,4) and tap step 7 (7,4). Steps 1 to 7
      light up and step 8 stays dark, so the channel range is steps 1-7.
    assertion:
      kind: grid
      cells:
      - - 1
        - 4
      - - 7
        - 4
      - - 8
        - 4
  - id: 'off'
    title: Hear the plain major scale
    caption: 'Press Play and listen to two loops with Lock all to pentatonic at its default Off: all seven
      plain C major degrees sound, 60, 62, 64, 65, 67, 69, 71.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: default-off-major
      pitches:
      - 60
      - 62
      - 64
      - 65
      - 67
      - 69
      - 71
      passed: true
  - id: option-on
    title: Turn Lock all to pentatonic on
    caption: Tap K1 and open PARAMS > MOSAIC, scroll to Lock all to pentatonic and turn E3 right to On.
      The row reads On.
    assertion:
      kind: selected-menu-option-row
      label: Lock all to pentatonic
      value: 'On'
      matched: true
  - id: other-locks-off
    title: Switch off the other two locks
    caption: Scroll down to Lock random to pent. and turn E3 left to Off, then do the same for Lock merged
      to pent. Both rows read Off, so Lock all to pentatonic is the only option that can change a pitch.
    assertion:
      kind: selected-menu-option-row
      label: Lock merged to pent.
      value: 'Off'
      matched: true
  - id: major
    title: Snap major to pentatonic
    caption: 'Press K2 to step back, then K1 to close the menu, and play the seven steps again: 60, 62,
      64, 64, 67, 69, 72. Major keeps degrees 1/2/3/5/6 (C D E G A). F falls to E and B rises to C because
      only those five are allowed.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-major
      pitches:
      - 60
      - 62
      - 64
      - 64
      - 67
      - 69
      - 72
      passed: true
  - id: pick-harmonic-major
    title: Pick Harmonic Major
    caption: Open the Scale Editor (grid (4,8)), turn E3 one detent and press K3. The Scale row reads
      Harmonic Major.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Scale
      value: Harmonic Major
      matched: true
  - id: harmonic-major
    title: Step to Harmonic Major
    caption: 'Return to the Channel editor (3,8) and play two loops. Harmonic Major keeps the same degrees
      as Major, 1/2/3/5/6, but its sixth is A-flat: 60, 62, 64, 64, 67, 68, 72. F falls to E, A-flat stays
      and B rises to C.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-harmonic-major
      pitches:
      - 60
      - 62
      - 64
      - 64
      - 67
      - 68
      - 72
      passed: true
  - id: minor
    title: Minor uses its own five notes
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Minor and press K3. Return
      to the Channel editor (3,8) and play two loops. The minor family keeps degrees 1/3/4/5/7 (C E-flat
      F G B-flat): 60, 63, 63, 65, 67, 67, 70. D snaps up to E-flat and A-flat snaps down to G.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-minor
      pitches:
      - 60
      - 63
      - 63
      - 65
      - 67
      - 67
      - 70
      passed: true
  - id: pick-melodic-minor
    title: Pick Harmonic Minor, then Melodic Minor
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Harmonic Minor and press K3, return
      to the Channel editor (3,8) and play. Then open the Scale Editor again, turn E3 one more detent
      and press K3: the Scale row reads Melodic Minor.'
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Scale
      value: Melodic Minor
      matched: true
  - id: melodic-minor
    title: Hear Harmonic and Melodic Minor
    caption: 'Return to the Channel editor (3,8) and play two loops. Harmonic Minor and Melodic Minor give
      the same pitches: 60, 63, 63, 65, 67, 67, 71. Only the top note differs from Minor, B-flat becoming
      B. In Harmonic Minor A-flat snaps down to G; in Melodic Minor A sits exactly between G and B, and
      an equal-distance note snaps to the lower pitch, so it also lands on G.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-melodic-minor
      pitches:
      - 60
      - 63
      - 63
      - 65
      - 67
      - 67
      - 71
      passed: true
  - id: dorian
    title: Step to Dorian
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Dorian and press K3. Return to
      the Channel editor (3,8) and play two loops. Dorian keeps degrees 1/2/4/5/7 (C D F G B-flat): 60,
      62, 62, 65, 67, 70, 70. E-flat falls to D and A rises to B-flat.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-dorian
      pitches:
      - 60
      - 62
      - 62
      - 65
      - 67
      - 70
      - 70
      passed: true
  - id: phrygian
    title: Step to Phrygian
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Phrygian and press K3. Return
      to the Channel editor (3,8) and play two loops. Phrygian keeps degrees 1/3/4/6/7 (C E-flat F A-flat
      B-flat): 60, 60, 63, 65, 68, 68, 70. D-flat falls to C and G rises to A-flat.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-phrygian
      pitches:
      - 60
      - 60
      - 63
      - 65
      - 68
      - 68
      - 70
      passed: true
  - id: lydian
    title: See the lower boundary snap
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Lydian and press K3. Return to
      the Channel editor (3,8) and play two loops. Lydian keeps degrees 2/3/5/6/7 (D E G A B), so the
      tonic C snaps down to the B below it: 59, 62, 64, 67, 67, 69, 71.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-lydian
      pitches:
      - 59
      - 62
      - 64
      - 67
      - 67
      - 69
      - 71
      passed: true
  - id: mixolydian
    title: Step to Mixolydian
    caption: 'Open the Scale Editor (grid (4,8)), turn E3 one detent to Mixolydian and press K3. Return
      to the Channel editor (3,8) and play two loops. Mixolydian keeps degrees 1/2/4/5/6 (C D F G A):
      60, 62, 65, 65, 67, 69, 69. E rises to F and B-flat falls to A.'
    assertion:
      kind: lock-all-to-pentatonic
      stage: on-mixolydian
      pitches:
      - 60
