- id: native-relative-midi-map
  feature_id: midi-controller-mapping
  title: Teach a relative MIDI controller
  behaviour_case: M-MAP-002
  citation: README.md#midi-controller-mapping
  source: tests/behaviour/midi_mapping.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with C D E F
      (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. The sequencer is stopped. A MIDI controller
      on input port 1, channel 1 is connected and sends relative CC 20: a value of 63 means one step down
      and 65 one step up. Nothing is mapped yet and the velocity mask is Off (X).'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: select-parameter
    title: Find the velocity mask parameter
    caption: Tap K1, choose PARAMS, open Mosaic Midi Mapping and turn E2 to the selected-channel velocity
      parameter. The selected row reads Selected Ch. Velocity.
    assertion:
      kind: selected-menu-label
      text: Selected Ch. Velocity
  - id: map-mode
    title: Switch to MAP mode
    caption: Hold K1 and press K3 to switch from EDIT to MAP mode. The list now names each parameter by
      its id, sel_ch_vel for this one, and nothing is mapped yet.
    assertion:
      kind: selected-menu-label
      text: sel_ch_vel
  - id: editor
    title: Open the map editor
    caption: Press K3 to open the map editor. Learn is selected, and the editor lists cc 100, ch 1, dev
      1 EMIDI, in 0 to 127, out -1.0 to 1.0, accum no and echo no.
    assertion:
      kind: map-editor
      selected: learn
      learning: false
    occurrence: 1
  - id: arm-learn
    title: Arm Learn
    caption: Press K3 on Learn. The row reads LEARNING while the editor waits for the controller.
    assertion:
      kind: map-editor
      selected: learn
      learning: true
  - id: learn
    title: Move the controller
    caption: Move the controller so it sends CC 20. The editor learns it and the cc row reads 20, with
      input port 1 and channel 1.
    assertion:
      kind: map-editor
      selected: learn
      learning: false
    occurrence: 2
  - id: in-lo
    title: Set Input low to 1
    caption: Turn E2 five clicks to the first number of the in row, Input low, and turn E3 one click
      right. It reads 1.
    assertion:
      kind: map-editor
      selected: in_lo
  - id: in-hi
    title: Set Input high to 2
    caption: Turn E2 one click to the second number of the in row, Input high, and turn E3 left until it
      reads 2. Inputs 1 and 2 are the two steps a relative controller sends.
    assertion:
      kind: map-editor
      selected: in_hi
  - id: accum
    title: Turn Accum on
    caption: Turn E2 three clicks to accum, past the out row, and turn E3 one click right. Accum reads yes
      and out still reads -1.0 to 1.0, so each message adds to the value instead of setting it.
    assertion:
      kind: map-editor
      selected: accum
  - id: assign
    title: Assign the map
    caption: Press K2 to assign. Back in the list, sel_ch_vel now shows 20:1:1, the controller's CC 20 on
      channel 1 of input port 1.
    assertion:
      kind: selected-menu-value
      text: '20:1:1'
  - id: saved-map
    title: Return to EDIT mode and leave PARAMS
    caption: Hold K1 and press K3 to return to EDIT mode, press K2 twice to leave the group, then tap K1 to
      return to Mosaic. The controller is now mapped to the velocity mask.
    assertion:
      kind: pmap-entry
      source: mosaic.pmap
      passed: true
  - id: open-masks
    title: Open the Masks page
    caption: Turn E1 to Channel tasks, choose Masks with E2 and press K3, then turn E2 to the Vel cell. It
      reads X, Off, because nothing has moved it yet.
    assertion:
      kind: selected-mask
      field: velocity
      value: X
  - id: rise-mask
    title: Turn the controller up
    caption: 'Send CC 20 with value 63 once, which leaves Off where it is, then value 65 five times: each
      message steps the velocity mask up one. The Vel cell rises from X to 4.'
    assertion:
      kind: selected-mask
      field: velocity
      value: '4'
  - id: rise
    title: Hear velocity 4
    caption: Press Play and stop. The MIDI strip shows all four notes at velocity 4.
    assertion:
      kind: midi
    occurrence: 1
  - id: control-mask
    title: Turn the controller down
    caption: Send CC 20 with value 63 once more. The Vel cell drops to 3.
    assertion:
      kind: selected-mask
      field: velocity
      value: '3'
  - id: control
    title: Hear velocity 3
    caption: Press Play and stop. The MIDI strip shows all four notes at velocity 3.
    assertion:
      kind: midi
    occurrence: 2
- id: last-lock-slide-wrap
  feature_id: parameter-slides-wrap
  title: Carry a slide across the loop boundary
  behaviour_case: M-SLIDE-STEP-001
  citation: README.md#parameter-slides-wrap
  source: tests/behaviour/step_slides.py
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, through the test MIDI device at 90 BPM with Rate /1 and channel range steps 1-4.
      The sequencer is stopped. Every Mosaic option is at its default, so Wrap param slides is Off, and
      nothing is locked yet.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: assign
    title: Assign CC 1 to a trig slot
    caption: Open Channel tasks > Trig params and assign the device's CC 1 to a trig slot. The channel
      default for CC 1 is 63.
    assertion:
      kind: parameter-list-label
      label: CC 1
      passed: true
  - id: lock-step-1
    title: Lock step 1 to 24
    caption: Press K3 to confirm the CC 1 assignment and K2 to go back. Hold step 1 and turn E3 to 24. Slot
      1 shows 24 with an L in its corner while the step is held. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: L
    occurrence: 1
  - id: lock-step-3
    title: Lock step 3 to 96
    caption: Hold step 3 and turn E3 to 96. Slot 1 shows 96 with the L. Release the step.
    assertion:
      kind: selected-param
      value: '96'
      marker: L
  - id: lock-step-4
    title: Lock step 4 to 48
    caption: Hold step 4 and turn E3 to 48. Slot 1 shows 48 with the L. Step 2 gets no lock and keeps the
      channel default, 63.
    assertion:
      kind: selected-param
      value: '48'
      marker: L
  - id: slide-on
    title: Turn a step slide on
    caption: Hold step 1 and press K3. Slot 1 shows 24 with an S in its corner, so the lock on step 1 now
      slides toward the next lock. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: S
  - id: slide-off
    title: Turn the step slide off again
    caption: Hold step 1 and press K3 again. The S goes and the L returns, so step 1 jumps again. Release
      the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: L
    occurrence: 2
  - id: toggle-off
    title: Play without a slide
    caption: 'Play two loops. With no slide, CC 1 does not glide from 24 to 96. Each loop the MIDI strip
      shows only 24 on step 1, 63 on step 2 (the channel default, because step 2 has no lock), 96 on step 3
      and 48 on step 4.'
    assertion:
      kind: step-slide
      stage: toggled-off-jumps
      passed: true
  - id: last-slide
    title: Slide the last lock
    caption: Hold step 4 and press K3 to give the last lock (48) a slide. Slot 1 shows 48 with the S.
    assertion:
      kind: selected-param
      value: '48'
      marker: S
  - id: no-wrap
    title: Give the last lock no destination
    caption: 'Wrap param slides is still Off, so there is no later lock to slide toward: CC 1 stays at 48
      through step 4, and the first lock, 24, is recalled when the loop restarts. Play and listen for the
      value changing abruptly at the loop point.'
    assertion:
      kind: step-slide
      stage: last-lock-no-wrap
      passed: true
  - id: wrap-option
    title: Turn Wrap param slides on
    caption: Tap K1, open PARAMS > MOSAIC, select Wrap param slides and turn E3 right to On. The row reads
      On.
    assertion:
      kind: selected-menu-option-row
      label: Wrap param slides
      value: 'On'
      matched: true
  - id: wrap
    title: Slide to the first lock
    caption: 'Tap K1 to return to Mosaic and play. The step-4 slide now runs from 48 down to 24 across
      one sixteenth-note step (one sixth of a second): CC 1 passes 40 and 32 and reaches 24 exactly with
      the first note of the next loop. Look for those CC values in the MIDI strip. Use this for a cyclic
      sweep, such as a filter that falls back to its start with no jump at the loop point.'
    assertion:
      kind: step-slide
      stage: last-lock-wraps
      passed: true
- id: trigless-locks-on
  feature_id: trigless-locks
  title: Keep automation on rests
  behaviour_case: M-PARAM-022
  citation: README.md#trigless-locks
  source: tests/behaviour/trig_parameter_interactions.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, in C major through the test MIDI device at 90 BPM with Rate /1 and channel range
      steps 1-4. The sequencer is stopped and the Device page for CH01 is showing. Channel 2 is not set
      up yet: you will make it a steady timing reference. Trigless locks is at its default On.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: assign-cc
    title: Check Trigless locks, then set up the channels
    caption: 'Tap K1 and open PARAMS > MOSAIC. Trigless locks reads On, its default, so locks on steps
      without a trig will still be sent. Press K2, then K1 to leave the menu. Set up channel 2 as the
      timing reference: tap (2,1), open Channel tasks > Device, point it at the second MIDI port, give
      it pattern 1 at (1,2) and range steps 1-4 (hold (1,4), tap (4,4)). It will play C D E F on MIDI
      channel 2 on every loop whatever you do to channel 1. Then tap channel 1 (1,1), open Channel tasks
      > Trig params and assign CC 1 to the first slot.'
    assertion:
      kind: parameter-list-label
      label: CC 1
      passed: true
  - id: lock-step-1
    title: Lock step 1 to 24
    caption: Press K3 to confirm CC 1 and K2 to go back. Hold step 1 and turn E3 to 24. Slot 1 shows 24
      with an L in its corner while the step is held. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: L
  - id: lock-steps-2-4
    title: Lock steps 2 to 4 to 48, 72 and 96
    caption: Do the same on the other steps. Hold step 2 and turn E3 to 48, hold step 3 for 72 and hold
      step 4 for 96. Slot 1 reads 96 with the L while step 4 is held, so every step now carries its own CC
      1 value.
    assertion:
      kind: selected-param
      value: '96'
      marker: L
  - id: assign-probability
    title: Add Trig probability
    caption: Assign Trig probability to the second slot, so you can silence channel 1's notes and see only
      its CC 1 stream beside channel 2's steady notes.
    assertion:
      kind: parameter-list-label
      label: Trig Probability
      passed: true
  - id: probability
    title: Probability 0 silences the notes, not the locks
    caption: 'Set Trig probability to 0 so channel 1''s notes never sound, and play two loops. All four
      steps have trigs, so CC 1 goes out at every step (24, 48, 72, 96) even though no note plays: look
      for those four CC values each loop in the MIDI strip, beside channel 2''s steady notes.'
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: true
      phase: probability0-active-trigs-retain-locks
      active_steps:
      - 1
      - 2
      - 3
      - 4
      accepted_steps: []
      passed: true
  - id: rest
    title: Remove the third trig
    caption: 'Open the Pattern editor (5,8), tap step 3 to remove its trig, and return to the Channel
      editor (3,8). Play. With Trigless locks On, a lock on a step with no trig is still sent: the MIDI
      strip shows CC 1 still sending 72 at step 3, so automation keeps moving through rests, for example
      a filter sweep under a sparse rhythm.'
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: true
      phase: removed-trig-respects-trigless
      active_steps:
      - 1
      - 2
      - 4
      accepted_steps: []
      passed: true
  - id: accepted
    title: Keep a lock ahead of its accepted note
    caption: Hold step 4 and turn E3 to set its Trig probability lock to 100, then play. Step 4's note
      (F3, 65) now sounds, with its CC 1 lock (96) sent just before it. Steps 1 and 2 stay silent, and
      step 3 still sends its 72. The scene Skip automation on rests plays the same steps with Trigless
      locks Off, for comparison.
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: true
      phase: step-probability100-keeps-lock-before-note
      active_steps:
      - 1
      - 2
      - 4
      accepted_steps:
      - 4
      passed: true
