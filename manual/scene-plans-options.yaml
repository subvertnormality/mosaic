      - 63
      - 65
      - 66
      - 68
      - 70
      passed: true
- id: keyboard-honour-degree
  feature_id: honor-scale-degree
  title: Start from the chosen scale degree
  behaviour_case: M-OPT-KEYS-001
  citation: README.md#honor-scale-degree
  source: tests/behaviour/keyboard_options.py
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, through the test MIDI device at 90 BPM with Rate /1 and channel range steps 1-4.
      The sequencer is stopped and a MIDI keyboard is connected as Mosaic's input. Every Mosaic option
      is at its default, so Map scale to white keys and the three Honour switches are Off, and the Scale
      Editor is on C major.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: map-on
    title: Turn on Map scale to white keys
    caption: 'Play some keys on the keyboard: each sounds the note you pressed, because nothing is mapped
      yet. Tap K1 and open PARAMS > MOSAIC > Midi control. Select Map scale to white keys and turn E3
      right to On. The row reads On.'
    assertion:
      kind: selected-menu-option-row
      label: Map scale to white keys
      value: 'On'
      matched: true
  - id: white-major
    title: Play the white keys in C major
    caption: 'Close the menu and play the white keys from C3 up to C4 on the keyboard. In C major they
      sound as written: 60, 62, 64, 65, 67, 69, 71, 72. The MIDI strip lists the notes Mosaic sent.'
    assertion:
      kind: keyboard-mapping
      stage: white-major
      passed: true
  - id: pick-natural-minor
    title: Choose natural minor in the Scale Editor
    caption: Open the Scale Editor (grid (4,8)), turn E3 two detents and press K3. The Scale row reads
      Minor, natural minor.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Scale
      value: Minor
  - id: natural-minor
    title: Play the white keys in natural minor
    caption: 'Return to the Channel editor (3,8) and play the white keys again: they now follow C natural
      minor, 60, 62, 63, 65, 67, 68, 70, 72 (C D E-flat F G A-flat B-flat C).'
    assertion:
      kind: keyboard-mapping
      stage: white-minor
      passed: true
  - id: set-degree
    title: Set degree II
    caption: Open the Scale Editor (4,8) again, turn E2 one click to Degree, turn E3 one detent and
      press K3. Degree reads ii°. Degree picks which scale note the keyboard's C starts on.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Degree
      value: "ii\u00b0"
  - id: set-rotation
    title: Set rotation 2
    caption: Turn E2 to the Rotation row, turn E3 two detents and press K3. Rotation reads r2. Rotation
      moves the top keys down an octave.
    assertion:
      kind: selected-field
      layout: vertical_list
      label: Rotation
      value: r2
  - id: set-transpose
    title: Set global transpose +2
    caption: Tap the global transpose fader on the grid at its lowest value, then tap its increment
      button fourteen times, and return to the Channel editor (3,8). The Scale overview lists Transpose
      +2, which shifts everything.
    assertion:
      kind: dashboard-row
      label: Transpose
      value: '+2'
  - id: default-off
    title: Nothing applies yet
    caption: 'The three Honour switches are still Off, so none of this is applied yet: the white keys
      still play 60, 62, 63, 65, 67, 68, 70, 72.'
    assertion:
      kind: keyboard-mapping
      stage: honour-defaults-off
      passed: true
  - id: degree-on
    title: Turn on Honour scale degree
    caption: Tap K1 and open PARAMS > MOSAIC > Midi control. Select Honour scale degree and turn E3 right
      to On. The row reads On.
    assertion:
      kind: selected-menu-option-row
      label: Honour scale degree
      value: 'On'
      matched: true
  - id: enabled
    title: Start from the chosen scale degree
    caption: 'Close the menu and play C3 to C4 again. Key C now plays the scale''s second note: 62, 63,
      65, 67, 68, 70, 72, 74 (D E-flat F G A-flat B-flat C D). Rotation and transpose stay unapplied,
      so you can start a phrase from degree II without changing the scale.'
    assertion:
      kind: keyboard-mapping
      stage: honour-degree
      passed: true
  shared_run: M-OPT-KEYS-001
