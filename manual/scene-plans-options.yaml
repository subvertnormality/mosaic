      kind: parameter-list-label
      label: Trig Probability
      passed: true
  - id: probability
    title: Probability 0 silences the notes, not the locks
    caption: 'Set Trig probability to 0 so channel 1''s notes never sound, and play two loops. All four
      steps still have trigs, so CC 1 still goes out at every step (24, 48, 72, 96) even with Trigless
      locks Off: look for those four CC values each loop in the MIDI strip, beside channel 2''s steady
      notes. A probability of 0 is not a rest: only a removed trig is.'
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: false
      phase: probability0-active-trigs-retain-locks
      active_steps:
      - 1
      - 2
      - 3
      - 4
      accepted_steps: []
      passed: true
  - id: rest
    title: Remove the third trig
    caption: 'Open the Pattern editor (5,8), tap step 3 to remove its trig, and return to the Channel
      editor (3,8). Play. With Trigless locks Off, a lock on a step with no trig is skipped: the MIDI
      strip shows CC 1 sending 24, 48 and 96 but not 72, the value on step 3.'
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: false
      phase: removed-trig-respects-trigless
      active_steps:
      - 1
      - 2
      - 4
      accepted_steps: []
      passed: true
  - id: accepted
    title: Keep a lock ahead of its accepted note
    caption: Hold step 4 and turn E3 to set its Trig probability lock to 100, then play. Step 4's note
      (F3, 65) now sounds, with its CC 1 lock (96) sent just before it. Steps 1 and 2 stay silent, and
      step 3 still sends no value. The scene Keep automation on rests plays the same steps with Trigless
      locks On, for comparison.
    assertion:
      kind: probability-trigless-midi-locks
      nrpn: false
      trigless: false
      phase: step-probability100-keeps-lock-before-note
      active_steps:
      - 1
      - 2
      - 4
      accepted_steps:
      - 4
      passed: true
- id: repeat-reset-policies
  feature_id: reset-at-pattern-repeat
  title: Decide whether a slow channel restarts
  behaviour_case: M-TIME-003
  citation: README.md#reset-at-pattern-repeat
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, through the test MIDI device at 90 BPM with Rate /1 and channel range steps 1-4.
      The sequencer is stopped. Song mode is On, and the song has one slot with a 64-step global length.
      Every other option is at its default: Reset on song seq change is On and Reset on pattern repeat
      is Off.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: slow-channel
    title: Make a slow channel
    caption: Hold step 1 and tap step 3 to set the range to steps 1-3. On Channel tasks > Clock set Clock
      Mod to /9. One step now lasts nine sixteenths (1.5 seconds), so the three notes 60, 62, 64 cycle
      every 4.5 seconds, while the song pattern repeats every 64 steps (10.7 seconds). The two never line
      up, which is what makes the reset visible.
    assertion:
      kind: ui-confirm
      page: clock_mods
      channel: 1
  - id: continuous
    title: 'Both resets off: the phase carries on'
    caption: 'Tap K1 and open PARAMS > MOSAIC. Make sure Song mode is On, then turn Reset on song seq
      change Off and Reset on pattern repeat Off. Close the menu, press Play and let it run for 24 seconds,
      then stop. The phrase carries on across each repeat: 60 62 64 60 62 64 60 62, then 64 at 12 seconds.
      Read the note times in the MIDI strip.'
    assertion:
      kind: native-repeat-reset-policy
      song_mode: true
      transition_reset: false
      repeat_reset: false
      passed: true
  - id: seq-only
    title: Reset on song seq change alone
    caption: Turn Reset on song seq change On and play 24 seconds. A pattern that is only repeating is
      not restarted by a song change, so the phrase still carries on, with the same note times as before.
    assertion:
      kind: native-repeat-reset-policy
      song_mode: true
      transition_reset: true
      repeat_reset: false
      passed: true
  - id: reset
    title: Reset at each repeat
    caption: 'Turn Reset on song seq change Off and Reset on pattern repeat On, close the menu and play
      24 seconds. At each 64-step boundary, 10.7 and 21.3 seconds, the slow channel restarts: note 60
      sounds exactly at the boundary instead of waiting for the old cycle. Compare the note times in the
      MIDI strip with the first run.'
    assertion:
      kind: native-repeat-reset-policy
      song_mode: true
      transition_reset: false
      repeat_reset: true
      passed: true
  - id: both-on
    title: Turn both reset options on
    caption: Turn Reset on song seq change On as well, so both options are On, and play 24 seconds. The
      channel restarts at each repeat, as in the last step.
    assertion:
      kind: native-repeat-reset-policy
      song_mode: true
      transition_reset: true
      repeat_reset: true
      passed: true
  - id: manual
    title: 'Song mode off: no reset'
    caption: 'Select Song mode and turn E3 left to Off; both reset options stay On. Close the menu and
      play 24 seconds. With Song mode Off the slot is not stepped by the song, so neither reset applies:
      the phrase runs continuously again, with 64 at 12 seconds.'
    assertion:
      kind: native-repeat-reset-policy
      song_mode: false
      transition_reset: true
      repeat_reset: true
      passed: true
  estimated_native_seconds: 140
- id: song-change-reset-policies
  feature_id: reset-at-song-editor-pattern-change
  title: Reset when the arrangement changes
  behaviour_case: M-TIME-005
  citation: README.md#reset-at-song-editor-pattern-change
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97, through the test MIDI device at 90 BPM with Rate /1 and channel range steps 1-4.
      The sequencer is stopped. Channel 1 has been made slow: its range is steps 1-3 and Clock Mod is
      /9, so one step lasts 1.5 seconds and the phrase 60, 62, 64 cycles every 4.5 seconds. Song mode
      is On and the song has two 64-step slots, 10.7 seconds each. Slot 2 is a copy of slot 1 with the
      channel octave raised by one, so it sounds an octave higher: C4 D4 E4 are 72, 74, 76. Slot 1 is
      selected, so on the Song editor (grid (6,8)) its LED (1,1) is bright and (2,1) dim. Both reset options
      are Off.'
    assertion:
      kind: grid
      cells:
      - - 1
        - 1
      - - 2
        - 1
      expected:
      - 15
      - 7
    occurrence: 2
  - id: slot-change
    title: Watch the slot change
    caption: 'Press Play. After 10.7 seconds, at the 64-step slot change, the slot LEDs swap brightness:
      (2,1) is now the bright one.'
    assertion:
      kind: grid
      cells:
      - - 1
        - 1
      - - 2
        - 1
      expected:
      - 7
      - 15
    occurrence: 1
  - id: continuous
    title: 'Both resets off: the phase carries across two slots'
    caption: 'Let it play to 23 seconds, then stop. The phrase keeps its place across the slot change:
      slot 2 starts on E4 (76) at 12 seconds, not C4. Read the note times in the MIDI strip.'
    assertion:
      kind: native-song-transition-reset
      transition_reset: false
      repeat_reset: false
      passed: true
  - id: reset
    title: Restart at a changed song slot
    caption: 'Tap K1 and open PARAMS > MOSAIC, select Reset on song seq change and turn E3 right to On;
      Reset on pattern repeat stays Off. Close the menu and play 23 seconds. At each slot change, 10.7
      and 21.3 seconds, the channel restarts on its first step: C4 (72) sounds exactly at the change,
      an octave above slot 1''s C3, and the slot LEDs swap as before.'
    assertion:
      kind: native-song-transition-reset
      transition_reset: true
      repeat_reset: false
      passed: true
  estimated_native_seconds: 110
- id: external-midi-source-menu
  feature_id: external-midi-transport
  title: Choose the clock source
  behaviour_case: M-TIM-003
  citation: README.md#external-midi-transport
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with C D E F
      (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, in C major. The sequencer is stopped,
      Rate is /1 and every Mosaic option is at its default. The norns clock is internal at 90 BPM. A separate
      MIDI device is connected on port 1 and will send clock at 100 BPM when Mosaic follows it. The PARAMS
      menu is closed.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: internal
    title: Begin with internal clock
    caption: 'Tap K1 to open the norns PARAMS menu and open the CLOCK group. Source reads internal: Mosaic
      keeps its own tempo of 90 BPM.'
    assertion:
      kind: selected-menu-value
      text: internal
    occurrence: 1
  - id: midi
    title: Select MIDI clock
    caption: Turn E3 one detent. Source reads midi. Mosaic now follows incoming MIDI clock, Start and
      Stop from the connected device and waits for them, so its own tempo no longer sets the speed.
    assertion:
      kind: selected-menu-value
      text: midi
  - id: clock-running
    title: The other device sends clock
    caption: 'You do nothing in this step: the connected device sends clock, a Start, more clock, then
      a Stop. Mosaic stays silent through the first clock pulses, begins when Start arrives, plays the
      phrase at the sender''s 100 BPM and halts when Stop arrives. The MIDI strip below lists the notes,
      0.15 seconds apart, one sixteenth at 100 BPM.'
    assertion:
      kind: midi-clock-onsets
  - id: return
    title: Return to internal
    caption: Turn E3 one detent back down to put Source on internal. Mosaic is on its own clock again.
    assertion:
      kind: selected-menu-value
      text: internal
    occurrence: 2
  - id: tempo
    title: Bring the tempo back to 90 BPM
    caption: 'Turn E2 to the tempo row. It reads 100 BPM: while Source was midi the incoming clock set
      the tempo, and switching Source back does not restore your own. Turn E3 ten detents down to bring
      it back to 90 BPM, the tempo the project used before.'
    assertion:
      kind: selected-menu-value
      text: '90'
  - id: restored
    title: Play on the internal clock
    caption: Close the menu and press Play. The notes are again one sixth of a second apart, the pace
      of 90 BPM, as the MIDI strip shows.
    assertion:
      kind: restored-internal-onsets
- id: record-keyboard-steps
  feature_id: arm-live-record
  title: Capture a live keyboard phrase
  behaviour_case: M-REC-001
  citation: README.md#arm-live-record
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 has pattern 1 assigned over steps 1 to 4, but pattern 1''s trigs have been cleared,
      so no step is lit. A MIDI keyboard is connected on port 1 and Record is off. The norns clock source
      is internal; an external MIDI clock at 100 BPM is available. Mosaic records each note onto the step
      that is playing when the note arrives, so recording needs a running clock: this lesson borrows the
      external one. If you have no external clock, start Mosaic''s own clock with Play (1,8) and arm Record
      the same way.'
    assertion:
      kind: grid
    occurrence: 2
  - id: clock-source
    title: Follow the external clock
    caption: Tap K1 to open the norns PARAMS menu, open the CLOCK group and turn E3 so Source reads midi.
      Mosaic now follows the external 100 BPM clock.
    assertion:
      kind: selected-menu-value
      text: midi
  - id: placement
    title: Record two notes
    caption: Close the menu and tap Record (2,8) to arm recording. While the external clock runs, play
      MIDI note 72 at velocity 90 and then note 79 at velocity 80 on the keyboard. Each note lands on
      the step playing when it arrives. Tap Record again to disarm. The grid shows steps 2 and 4 lit,
      and steps 1 and 3 empty. Which steps light depends on when you press, so your own take may land
      elsewhere.
    assertion:
      kind: recorded-step-placement
      expected_steps:
      - 2
      - 4
      channel_range:
      - 1
      - 4
      clock_step_ns: 150000000
  - id: tempo
    title: Back to the internal clock at 90 BPM
    caption: Tap K1, open the CLOCK group and turn E3 back so Source reads internal. Following the external
      clock left the tempo at 100 BPM, so turn E2 to the tempo row and turn E3 until it reads 90 BPM;
      any tempo works, the notes' spacing simply follows it.
    assertion:
      kind: selected-menu-value
      text: '90'
  - id: replay
    title: Replay and hear the rhythm
    caption: 'Close the menu and tap Play (1,8). The channel plays note 72 at velocity 90, then note 79
      at velocity 80, repeating, as the MIDI strip lists. The two notes sit on steps 2 and 4, so they
      alternate every two steps: at 90 BPM with the default Rate /1 that is one third of a second apart.'
    assertion:
      kind: midi
      complete_cycles: 3
- id: matrix-macro-route-clear
  feature_id: lfos-and-modulation
  title: Route a macro and remove its depth
  behaviour_case: M-MOD-001
  citation: README.md#lfos-and-modulation
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: The norns matrix and toolkit mods are installed and enabled. Channel 1 plays the four-step
      phrase (MIDI 60, 62, 64, 65, velocities 127, 117, 107, 97) through a CC device with Rate /1, the
      sequencer is stopped, and the Matrix has no routes yet. The Device page for CH01 is showing.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: target
    title: Open the Matrix and choose Fixed Note
    caption: 'Tap K1 and open MODS > MATRIX. Choose MOSAIC CH 1: CC DEVICE and select Fixed Note, which
      forces the channel to one MIDI note number (not quantised). Its row shows dashes: no source and
      no depth yet.'
    assertion:
      kind: selected-menu-label
      text: Fixed Note
  - id: source
    title: Choose macro 1
    caption: Press K3 to open Fixed Note's sources and turn E2 down to macro 1. A macro is a knob in the
      toolkit mod that you set by hand. The macro 1 row still shows dashes.
    assertion:
      kind: selected-menu-label
      text: macro 1
    occurrence: 1
  - id: depth
    title: Set full modulation depth
    caption: 'Hold E3 turning right until the depth reads 1.00. Depth is how strongly the macro drives
      Fixed Note: 1.00 is the full effect.'
    assertion:
      kind: selected-menu-value
      text: '1.00'
  - id: value
    title: Find the macro Value
    caption: 'Open toolkit macro 1''s parameters (E1 to the parameter list, then macro 1) and select Value.
      It reads 0.0: the macro is at rest, so nothing sounds different yet.'
    assertion:
      kind: selected-menu-label
      text: value
  - id: raise
    title: Raise the macro to its full value
    caption: Turn E3 right until Value reads 1.0, the macro at full strength. The macro now drives Fixed
      Note at the depth you set.
    assertion:
      kind: selected-menu-value
      text: '1.0'
  - id: affected
    title: Hear the phrase follow the macro
    caption: Press K1 to leave the menu, and press Play, then Play again to stop. Every note is now MIDI
      127, the Fixed Note the macro forces, while the velocities stay 127, 117, 107, 97, as the MIDI strip
      lists.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 1
  - id: reopen-route
    title: Return to the macro's route
    caption: Press K1 to return to the menu and open the Matrix again. The Fixed Note route for macro 1
      is selected.
    assertion:
      kind: selected-menu-label
      text: macro 1
    occurrence: 2
  - id: clear
    title: Clear the depth
    caption: 'Select the depth and clear it: the depth field shows a dash again and the route is removed.'
    assertion:
      kind: selected-menu-value
      text: '-'
  - id: restored
    title: Recover the authored pitches
    caption: Press K1 and Play, then Play again to stop. The phrase is back to its authored notes, MIDI
      60, 62, 64, 65, with velocities 127, 117, 107, 97.
    assertion:
      kind: midi
      complete_cycles: 3
    occurrence: 2
  profile: midi-modulation
  required_mods:
    matrix:
      url: https://github.com/sixolet/matrix.git
      commit: 41e11286bee8dbe48e8746e7a456400f93dc739a
    toolkit:
      url: https://github.com/sixolet/toolkit.git
      commit: 2e9fb56fe7b2b25bd6a0d80c40e82f7a7f9368a7
  capabilities:
  - native Matrix menus
  - native toolkit menus
  - MIDI input and output
  availability: Requires capture adapter profile support and pinned external mods; base-midi cannot establish
    this scene.
- id: toolkit-clocked-lfo-menu
  feature_id: lfos-and-modulation
  title: Set up a clocked LFO
  behaviour_case: M-MOD-002
  citation: README.md#lfos-and-modulation
  source: tests/behaviour/cases.py
  steps:
  - id: start
    title: Starting point
    caption: The norns matrix and toolkit mods are installed and enabled, and the norns tempo is 90 BPM.
      Channel 1 plays the four-step phrase (MIDI 60, 62, 64, 65) through a CC device with Rate /1, the
      sequencer is stopped, and the Matrix has no routes yet. The Device page for CH01 is showing.
    assertion:
      kind: screen-header
      expected: DEVICE CH01
    occurrence: 1
  - id: depth
    title: Route lfo 1 to Fixed Note at full depth
    caption: 'Tap K1 and open MODS > MATRIX. Choose MOSAIC CH 1: CC DEVICE and select Fixed Note, the
      parameter the LFO will drive. Press K3 to open Fixed Note''s sources and turn E2 to lfo 1; its row
      shows dashes, no depth yet. Hold E3 turning right until lfo 1''s depth reads 1.00, so the LFO controls
      Fixed Note at full strength.'
    assertion:
      kind: selected-menu-value
      text: '1.00'
  - id: clock
    title: Clock the LFO to the tempo
    caption: 'Open the parameters list, choose toolkit lfo 1 (PARAMETERS / lfo 1) and select clocked,
      which makes the LFO follow the tempo instead of running in seconds. Press K3 to switch it on: clocked
      shows a filled marker.'
    assertion:
      kind: selected-menu-label
      text: clocked
  - id: shape
    title: Set the period and the shape
    caption: Turn E2 down one row to Beats, the LFO period in beats. It reads 1/4. Turn E3 right until
      Beats reads 4, a period of four beats. Turn E2 down two rows to Shape, which still reads sine.
