      kind: selected-menu-label
      text: shape
  - id: choose-pulse
    title: Choose Pulse
    caption: Turn E3 two detents to choose Pulse. Shape now reads pulse.
    assertion:
      kind: selected-menu-value
      text: pulse
  - id: play
    title: Play the phrase
    caption: 'Tap K1 and press Play. The LFO now alternates every two beats, half of its four-beat period:
      eight steps at MIDI 127, the Fixed Note pitch, then eight steps of the authored phrase, 60, 62, 64,
      65, repeating. The MIDI strip lists the notes in that order.'
    assertion:
      kind: midi
      complete_cycles: 2
