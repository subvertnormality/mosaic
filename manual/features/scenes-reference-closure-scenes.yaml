      average of each step's degrees is II, IV, VI, IV, which in C major is D, F,
      A, F. With Lock merged to pent. On, F is not in the C D E G A selection and
      snaps to the nearer E, so you hear 62, 64, 69, 64 (D E A E) at velocity 100,
      taken from pattern 3. Compare the Off lesson, which plays F (65) on steps 2
      and 4.
