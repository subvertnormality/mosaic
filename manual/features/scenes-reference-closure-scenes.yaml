  - id: phrase
    title: Hear random notes locked to pentatonic
    caption: 'Select the Random Note slot, turn E3 right to 4 and press Play (1,8).
      Random Note 4 offsets each note by -2, -1, 0, +1 or +2 scale degrees chosen
      at random; with Lock random to pent. On every result snaps to the five-note
      selection C D E G A. Listen to several loops and press Stop. The recorded run
      begins 60, 64, 64, 64, 60, 64, 67, 64: step 4, a plain F (65), now sounds as
      E (64). Random notes change on every run, so your notes will differ. A step
      whose random offset is 0 keeps its own note, so a plain pattern note outside
      the selection, such as F, can still sound.'
    citation: README.md#lock-random-to-pentatonic
