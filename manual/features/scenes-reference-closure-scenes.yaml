  - id: off-moved
    title: 'Wait: the mark does not move (motion Off)'
    caption: Wait half a second and look at the same corner again. With UI motion
      Off the mark has not changed, and Rate, Feel source and Swing type are as readable
      as before.
    citation: README.md#ui-motion
    inputs:
    - type: wait
      seconds: 0.5
    expect:
      assertion:
        kind: manual-motion-pose
        enabled: false
        phase: moved
        at_rest: true
  - id: off-list
    title: Set Rate back to /1
    caption: Set Rate back to /1 the same way, turning E3 and pressing K3. Every label
      and value stays fully readable and the header mark stays in its rest pose.
    citation: README.md#ui-motion
    inputs:
    - type: enc
      n: 3
      delta: 2
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.01
    expect:
      assertion:
        kind: manual-motion-stable-rows
        enabled: false
        clock_value: /1
        decorative_mark_changed: false
        passed: true
