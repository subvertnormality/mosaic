  - id: note-sounding
    title: Start one long note
    caption: 'On Channel, hold step 1 at (1,4) and tap step 24 to set the channel
      range to steps 1 to 24. Open Pattern (5,8) and tap steps 2, 3 and 4 to clear
      those trigs, then hold step 1 and tap step 24 to give the one remaining trig
      a length of 24 steps: four seconds. Press Song (6,8), then Play (1,8). C (MIDI
      60) starts and keeps sounding; the MIDI strip "MIDI sent in this step" shows
      only its Note On.'
