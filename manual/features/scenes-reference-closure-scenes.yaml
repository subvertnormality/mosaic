  - id: phrase
    title: Hear random notes on all seven degrees
    caption: 'Raise Random Note to 4 in single steps: turn E3 right once, press Play
      (1,8) and Stop, and repeat until it reads 4. Random Note 4 offsets each note
      by -2, -1, 0, +1 or +2 scale degrees chosen at random, and with Lock random
      to pent. Off the results use all seven degrees of C major. The recorded final
      run begins 57, 64, 67, 62, 64, 59, 65, 65. F (65) and B (59) are in C major
      but outside C D E G A, so hearing them shows the lock is off. Random notes change
      on every run: play several loops and expect F and B to turn up now and then.'
    citation: README.md#lock-random-to-pentatonic
