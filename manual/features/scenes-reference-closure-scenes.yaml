        kind: manual-motion-pose
        enabled: true
        phase: moved
        at_rest: false
  - id: on-list
    title: Set Rate back to /1
    caption: Restore Rate to /1 with E3 and K3. Labels and values are still fully
      readable while the header mark keeps moving.
