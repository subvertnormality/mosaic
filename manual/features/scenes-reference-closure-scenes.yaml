  - id: higher-phrase
    title: Switch Note merge to Higher and listen
    caption: 'Tap the note merge key at (15,8) once; it brightens as Note merge moves
      from Average to Higher. Press Play (1,8), listen to two loops and press Play
      again to stop. Higher adds the spread (the highest minus the lowest degree)
      to the rounded average, so the four steps become degrees IV, VI, VIII and X:
      F, A, C and E in C major. Lock merged to pent. On snaps F to the nearer E, so
      the MIDI strip "MIDI sent in this step" shows 64, 69, 72, 76 at velocity 100.
      Compare the Off lesson, which plays F (65) on the first step.'
    citation: README.md#lock-merged-to-pentatonic
