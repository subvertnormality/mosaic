    case: M-PARAM-039
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs
      on steps 1 to 4 (the channel range) with notes C3, D3, E3 and F3 (MIDI 60, 62,
      64, 65) at velocities 127, 117, 107 and 97. Tempo is the default 90 BPM, Rate
      is /1 (sixteenth-note steps, one sixth of a second each) and the sequencer is
      stopped. The norns shows channel 1''s Device screen and every Mosaic option
      is at its default. Lock random to pent. and Lock merged to pent. are both On,
      and no trig params are assigned yet.'
    citation: README.md#lock-random-to-pentatonic
