  - id: build
    title: Build channel 2 and a two-slot song
    caption: "Give channel 2 its own MIDI output on the Device page, pattern 1 and\
      \ the range steps 1-3, then open Masks and set its values: Note 79, Vel 40 and\
      \ Len \xBD on every step, with step 2 locked to Note 81, Vel 60 and Len 1\xBC\
      . Select channel 1. Press Song (6,8), set the global length fader to 10 steps\
      \ and copy slot 1 into slot 2 (hold (1,1) and tap (2,1)). Each slot is now ten\
      \ steps long and both play the same four-against-three pair."
    citation: README.md#song-editor
