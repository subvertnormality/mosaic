  - id: queued-blink
    title: Queue slot 1 while slot 2 plays
    caption: 'Do these in order. 1: press Stop (1,8). 2: press Song (6,8) and select
      slot 1 at (1,1). 3: press Channel (3,8) and tap octave +1 at (11,8), so slot
      1 sounds an octave higher. 4: press Song (6,8) again, select slot 2 at (2,1)
      and press Play (1,8). 5: while slot 2 sounds, press slot 1 at (1,1) to queue
      it. Slot 1 now blinks between dim and mid-bright (a still shows one moment of
      the blink) while slot 2 stays bright. Song mode is Off, so playback continues
      on slot 2 until one pass of its sequence ends.'
