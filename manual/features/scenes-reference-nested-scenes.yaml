  feature_id: midi-controller-mapping
  title: A loaded map follows the selected or fixed channel
  behaviour_case: M-MAP-001
  requirements:
  - MAP-CONTROL
  - MAP-ROUTING
  - MAP-RANGES
  profile: base-midi
  session_ordinal: 1
  setup:
