  - id: selected-one-mask
    title: CC 20 on the selected channel 1
    caption: 'Open Channel tasks > Masks for channel 1 and select the Velocity cell,
      which reads X. Channel 1 is selected. Send CC 20 with value 65 eleven times
      (the strip shows eleven control changes). For a relative (binary offset) control,
      65 means one step up, 63 means one step down and 0 also counts as down. The
      velocity mask starts at X, so the first step reaches 0 and the eleventh reaches
      10: the Velocity cell now reads 10.'
    citation: README.md#midi-controller-mapping
