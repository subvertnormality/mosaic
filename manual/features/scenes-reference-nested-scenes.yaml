    case: M-MAP-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through the test MIDI device: four notes C,
      D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97 on steps
      1 to 4. Channel 2 does not play yet; in the next step you set it up on MIDI
      port 2, channel 2 with the same pattern. A saved MIDI map is loaded with two
      relative controls that both accumulate: CC 20 edits the velocity mask of the
      selected channel and CC 21 edits the velocity mask of channel 2. Both velocity
      masks are Off (X) and the norns shows channel 1''s Device page.'
    citation: README.md#midi-controller-mapping
