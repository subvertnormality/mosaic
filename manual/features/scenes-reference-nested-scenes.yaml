  - id: raw
    title: Hear both channels before any CC
    caption: 'Set up channel 2: select it (2,1), open its Device page and set its
      output to port 2, MIDI channel 2 with E2 and E3, press K3, give it pattern 1
      with (1,2) and hold step 1 then tap step 4 to loop four steps. Select channel
      1 (1,1), tap Play (1,8) and listen, then tap Play to stop. Channel 1 (port 1)
      and channel 2 (port 2) both play velocities 127, 117, 107 and 97: no control
      has been moved yet.'
