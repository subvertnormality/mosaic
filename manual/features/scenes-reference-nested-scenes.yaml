  - id: ahead
    title: Hear the slot announced early
    caption: 'With slot 1 selected, tap Play (1,8), let the two four-step slots alternate
      for about three seconds, then tap Play again. Play first sends the program change
      for the slot about to sound. After that each slot change is announced once,
      at least half a step (about 83 ms at 90 BPM) before the new slot''s first note,
      so the receiver has time to queue its pattern: compare the program-change times
      with the note times in the strip.'
    citation: README.md#elektron-program-changes
    inputs:
    - &id542
      type: grid
      x: 1
      y: 8
      state: 1
    - &id543
      type: grid
      x: 1
      y: 8
      state: 0
