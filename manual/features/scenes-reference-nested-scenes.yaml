  - id: selected-one
    title: Hear channel 1 at velocity 10
    caption: Tap Play. Channel 1 now plays every note at velocity 10. Channel 2 is
      unchanged.
    citation: README.md#midi-controller-mapping
    inputs:
    - type: grid
      x: 1
