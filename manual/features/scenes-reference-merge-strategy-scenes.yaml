  authored semantic selector; per-scene deltas include native encoder units and waits.
scenes:
- id: shared-merge-strategy-workflow
  feature_id: merge-modes
  title: Compare the five merge strategies
  behaviour_case: M-MERGE-STRATEGY-001
  requirements:
  - MERGE-FOUNDATION
  - MERGE-FRAGMENTS
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-MERGE-STRATEGY-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 has two patterns assigned in an eight-step loop. Pattern 1
      plays four notes (C, D, E, F on steps 1 to 4) and is saved as its Anchor; pattern
      2 plays MIDI 60 on steps 5 and 7. Merge strategy is Skip, the default. Channel
      2 has no anchor. Merge modes is open for channel 1. Terms used below: Strategy
      is the choice you make with E3 or grid key (14,8); Active is the strategy that
      is playing now; Pending is a choice waiting for its boundary and Boundary says
      when it will apply; Request says whether a choice was accepted, for example
      NEEDS ANCHOR.'
    citation: README.md#merge-modes
