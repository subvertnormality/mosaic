  details:
  - title: Reading the results
    text: Two patterns with notes 60 and 64 average to 62. Higher adds the difference between them (4) to the mean
      (62) to give 66; Lower gives 2 x 60 - 62 = 58. With the pentatonic snap on, these results are then moved onto
      the pentatonic scale, so switch it off in the Mosaic params when you want to hear the plain merge results.
      Tap grid (15,8) to cycle Average, Higher and Lower.
