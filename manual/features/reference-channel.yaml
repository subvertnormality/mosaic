    result: Set a channel default with no step held.
  - gesture: Hold a sequencer step → E2 attribute → E3
    result: Set an explicit override for that step.
  - gesture: Hold a step and play a MIDI keyboard
    result: Enter note-mask data from the played notes.
  details: []
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: '1. On Masks, set the channel Note default to G3.

