- id: chord-arpeggio
  title: Chord Arpeggio
  audience: all
  summary: Repeat chord slots at the selected division for the note’s duration. Arpeggio takes precedence over Strum.
  prose: 'Set Chord Arp to repeat the chord-mask slots at the selected step division for the current note’s length.
    Notes are quantised to the current scale. Empty chord masks are treated as rests, allowing for rhythmic patterns.
    Arpeggios also honour the Chord Velocity and Chord Shape modifiers. The Chord Arpeggio param overrules the chord
    strum param. Chord arpeggios can also be used as ratchets if no chord masks are set.


    With Chord Spread at zero, the first arp interval is one full selected division of the channel step. For example,
    a half-step arp on a two-step note advances through its slots at 0, 1/2, 1 and 1 1/2 steps; it does not start
    another note at the two-step endpoint. Each arp note lasts one selected division from its own onset, shortened
    when necessary to finish at the original note''s endpoint.


    Starting another arp on the same channel cancels the old arp''s future notes. Notes already sounding keep their
    remaining duration, capped by their original endpoint; the old arp''s endpoint does not cut notes from its replacement.
    Pattern resets likewise preserve the remaining duration of sounding notes. Stop releases sounding notes and
    cancels future arp notes. Overlapping notes of the same MIDI pitch still send a corresponding Note Off for each
    Note On; how a receiving instrument handles overlapping voices is unchanged.


    Chord Shape orders the root and four chord-mask slots. An empty mask slot, or a muted root slot, is a rest and
    keeps its position, including at the end of the sequence. Rest slots consume the same time and acceleration
    ordinal as sounding slots. If no chord masks are populated, an unmuted root instead forms a one-slot ratchet;
    if the root is also muted, the result is silence.'
  musical_use: Set a long note and populate two chord slots. Leave another slot empty to include a rest in the repeating
    arpeggio.
