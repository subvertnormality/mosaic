- id: adding-chords
  title: Adding Chords
  audience: all
  summary: Add up to four chord-mask voices to a root note. The selected output must support polyphony.
  prose: 'Use chord masks to add up to four voices to the root note. Select a device that supports polyphony. Open
    Masks, hold the required step, then select and set each chord note.


    Assign [Chord Strum](#chord-strum) to vary the timing of the chord components. Assign [Chord Velocity Modifier](#chord-velocity-modifier)
    to vary their dynamics.'
  musical_use: Set Chd1 to 3rd and Chd2 to 5th for a triad above each root. Assign Chord Note Strum with a half-step
    division to roll the chord upward instead of playing it at once, then compare the Chord Pattern shapes.
  related:
  - chord-strum
  - chord-velocity-modifier
  - masks
  sources:
    readme: manual/legacy/README-1.4.0.md#adding-chords
    behaviour_cases:
    - M-DASHBOARD-CHORD-001
    - M-MASK-006
    - M-MASK-010
    - M-MASK-013
    - M-MASK-014
    - M-MASK-015
    - M-MASK-016
    - M-MASK-018
    - M-MASK-022
    - M-MASK-024
    - M-MASK-025
    - M-MASK-026
    - M-MASK-027
    - M-MASK-028
    - M-MASK-029
    - M-MASK-CHORD-X-001
    - M-MEMORY-011
    - M-MEMORY-013
    code:
    - lib/pages/channel_edit_page/channel_edit_masks.lua
    - lib/musical_resolution/chord_order.lua
    - lib/step.lua
  controls:
  - gesture: Masks → hold step → E2 Chd1–Chd4 → E3
    result: Add up to four scale-relative chord voices to the root; the output must support them.
  - gesture: Assign Chord Strum or Chord Arp in Trig params
    result: Space the chord voices in time rather than playing them simultaneously.
  details:
  - title: Chord values
    text: Each Chd row sets a scale interval from the root, above it when E3 is right of X and below it when E3
      is left of X, up to 14 scale steps either way. Turn E3 two detents from X for 3rd, four for 5th, five for
      6th and seven for 8th (the octave). In C major with root C these give E, G, A and C. The values follow the
      scale; they are not MIDI note numbers.
  recipes:
  - title: Add a scale-third chord voice and override it on one step
    text: '1. On Masks, set Chd1 to 3rd; play the phrase to hear each root with its scale third.

      2. Hold step 1 and set Chd1 to 5th; release it and compare that step with the channel default.

      3. Clear step 1 with K2 so it inherits 3rd again.

      Outcome: Chord mask values are scale intervals. The step-specific fifth overrides the channel third only on
      step 1; clearing restores the third.'
