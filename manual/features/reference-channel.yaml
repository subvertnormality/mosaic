- id: chord-spread
  title: Chord Spread
  audience: all
  summary: Add a channel-step duration to Strum or Arpeggio spacing without changing note length.
  prose: Chord Spread adds a duration to the selected Strum or Arp division, measured in channel steps. For example,
    a half-step division with quarter-step Spread starts with a three-quarter-step gap. With Acceleration off, all
    gaps stay at that value. With Acceleration enabled, each following gap changes by Spread multiplied by Acceleration,
    as above. Spacing modifiers act only when Strum or Arpeggio is enabled and do not change the selected note length.
    Arp notes remain limited by their original note endpoint.
  musical_use: Set a half-step Strum division and quarter-step Spread. Set Acceleration to zero; each gap is three
    quarters of a step.
  related:
  - sequencer-params
  sources:
