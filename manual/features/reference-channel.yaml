    result: Assign Quantised Fixed Note to one of the ten slots.
  - gesture: E3 with no grid step held
    result: 'Edit the channel default: MIDI 0–127; X disables the override.'
  - gesture: Hold a sequencer step + E3
    result: Set that step’s parameter lock; clear it with held step + K2 to return to the channel default.
  details:
  - title: Why 63 can play 62
    text: Quantised Fixed Note moves the number to the nearest note of the active scale. In C major 63 (D sharp)
      lies between 62 and 64; ties go to the lower note, so it plays 62. Fixed Note would play 63.
