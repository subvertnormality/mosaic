- id: fixed-note
  title: Fixed Note
  audience: all
  summary: Override ordinary root pitch with an unquantised MIDI note from 0 to 127.
  prose: Set Fixed Note to a MIDI note number to override the channel’s ordinary root pitch. The note is not quantised.
    Use this parameter to hold a drum voice at its required MIDI note regardless of pattern note data. Fixed Note
    takes precedence over Quantised Fixed Note and random note values.
  musical_use: Set Fixed Note to the receiving drum machine’s kick note. Pattern note data no longer changes that
    root pitch.
  related:
  - sequencer-params
  sources:
    readme: manual/legacy/README-1.4.0.md#fixed-note
    behaviour_cases:
    - M-PARAM-004
    - M-PARAM-005
    - M-PARAM-006
    - M-PARAM-007
    - M-PARAM-008
    - M-PARAM-009
    - M-PARAM-010
    - M-PARAM-011
    - M-PARAM-016
    - M-PARAM-017
    - M-PARAM-018
    - M-PARAM-032
    - M-PARAM-033
    - M-PARAM-034
    - M-PARAM-035
    - M-PARAM-036
    code:
    - lib/devices/device_map.lua
    - lib/step.lua
  controls:
  - gesture: Channel tasks → Trig params → E2 slot → K2 → E3 Fixed Note → K3 → K2
