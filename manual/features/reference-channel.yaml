- id: length-merge-modes
  title: Length Merge Modes
  audience: all
  summary: Select Average, Longer, Shorter or a priority pattern for merged note durations.
  prose: 'These modes dictate how the duration of notes is calculated for overlapping steps:


    * **Average**: Average the contributing lengths and round to the nearest integer, choosing the greater integer
    at an exact half. One contributor passes through unchanged. Source lengths account for interruption by the next
    trig in that pattern.

    * **Longer**: Add the difference between the longest and shortest contributing lengths to their rounded average.
    One contributor passes through unchanged.

    * **Shorter**: Subtract the rounded average from twice the shortest contributing length: `2 * shortest - rounded_average`.
    One contributor passes through unchanged. Only the mean is rounded at this stage, so fractional source lengths
    can still produce fractional Longer or Shorter results.

    * **Pattern**: To apply a specific pattern''s length values, hold the length merge button and press the pattern''s
    select button.


    Length merge modes are set by holding shift (K1) and pressing the velocity merge mode button. Numeric merging
    retains zero and negative length results. For ordinary note playback, including delayed strums, a nonpositive
    effective length sends Note On followed by Note Off in the same scheduler pulse, without advancing musical time.
    This describes MIDI event order, not the sound or response of a connected instrument.'
  musical_use: Assign patterns with short and long notes. Compare Longer and Shorter. Nonpositive lengths send Note
    On then Note Off in one scheduler pulse; the receiving instrument determines the audible result.
  related:
  - merge-modes
  sources:
    readme: manual/legacy/README-1.4.0.md#length-merge-modes
    behaviour_cases:
    - M-MERGE-006
    - M-MERGE-007
