- id: adding-trig-masks
  title: Adding Trig Masks
  audience: all
  summary: Add or remove a step trig mask with K1 and the sequencer grid.
  prose: 'In Channel Editor, hold K1 and press a sequencer step to add or remove its trig mask. Assign note, velocity
    and length masks to supply the values required for an audible note.


    [Mask trig lock demo](https://www.youtube.com/watch?v=J1ckUZvhFJ0&t=1780s)'
  musical_use: Add a trig mask on an unused step. Set its note, velocity and length; reduce its velocity relative
    to the main hits.
  related:
  - masks
  sources:
    readme: manual/legacy/README-1.4.0.md#adding-trig-masks
    behaviour_cases:
    - M-MASK-023
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pages/channel_edit_page/channel_edit_masks.lua
  controls:
  - gesture: 'Channel Editor: hold K1 and tap a sequencer step'
    result: Toggle the step’s trig mask; supply note, velocity and length masks if no source pattern supplies them.
  details:
  - title: What a trig mask needs
    text: A trig mask switches a step on, or silences a step the pattern plays. A step with no source pattern has
      no note, velocity or length, so set the channel defaults Note, Vel and Len on Masks first (for example C3,
      80 and 1/2) or hold the step and set each one. Hold K1 and tap the same step again to remove or reverse the
      trig mask. To hand a silenced step back to the pattern, hold the step on Masks and press K2.
  recipes:
  - title: Add a melodic note to an empty step, then toggle only its trig
    text: '1. Set channel Note to C3, Vel to 80 and Len to 1/2.

