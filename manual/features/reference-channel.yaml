- id: quantised-fixed-note
  title: Quantised Fixed Note
  audience: all
  summary: Set MIDI pitch 0–127 and select the nearest playable pitch in the active scale. Ties choose the lower
    pitch.
  prose: Quantised Fixed Note supplies an absolute MIDI pitch, 0–127, and selects the nearest playable note in the
    active scale at its configured root (or the song root when unset). Equally close notes select the lower pitch.
    The number includes its octave; channel/step octave, transposition, chord degree/rotation and pentatonic switches
    do not modify this override. It replaces pattern, note-mask and random pitch calculations for the ordinary root
    voice; separately generated chord/arp voices have their own processing. Fixed Note takes precedence. A step
    lock set to Off inherits the channel value; when both are Off, ordinary pitch processing resumes. Off does not
    silence the trig.
  musical_use: Set an absolute MIDI note in the required register. Change the active scale and check the nearest
    playable pitch.
  related:
  - sequencer-params
  sources:
    readme: manual/legacy/README-1.4.0.md#quantised-fixed-note
    behaviour_cases:
