- id: norns-sound-sources-with-n-b
  title: Norns Sound Sources with n.b.
  audience: all
  summary: Select an installed supported n.b. voice for internal audio or Crow output.
  prose: 'Install a supported [n.b.](https://github.com/sixolet/nb/tree/main) mod to sequence internal sound sources
    or devices connected through Crow. Supported mods include:


    * [nb_ansible](https://github.com/sixolet/nb_ansible) for Ansible voices.

    * [emplaitress](https://github.com/sixolet/emplaitress/) offers four MI Plaits voices in parallel. Emplatress''s
    params can be locked in _Mosaic_. Emplaitress is sensitive to rapid notes. Check playback when using arpeggios,
    chords or small clock divisions.

    * [nb_jf](https://github.com/sixolet/nb_jf) accesses multiple voice modes from Just Friends, including individual
    mono voice (with slew), polysynth, kit, and unison modes.

    * [nb_crow](https://github.com/sixolet/nb_crow) for Crow v/8 and envelope functions.

    * [nb_drum_crow](https://github.com/entzmingerc/nb_drumcrow) turns a monome crow into a synthesizer.

    * [nb_polyperc](https://github.com/dstroud/nb_polyperc) poly perc. Poly perc''s params can be locked in _Mosaic_.

    * [nb_rudiments](https://github.com/entzmingerc/nb_rudiments) percussion synth.

    * [nb_doubledecker](https://github.com/sixolet/doubledecker) 2-layer synth. Doubledecker''s params can be locked
