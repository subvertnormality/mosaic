- id: device-parameters
  title: Device Parameters
  audience: all
  summary: Store MIDI parameter values and transmit them when loading Mosaic or starting playback.
  prose: 'Use the norns params menu to store a MIDI device’s patch parameters. All CC parameters defined by its
    configuration are available for editing. Set a parameter to its configured Off value (default -1) to leave the
    receiving device’s current value unchanged. Any other value sends that MIDI value to the device.


    Loading Mosaic or starting playback transmits the stored enabled MIDI parameter values. The values remain consistent
    across song patterns, preserving sound settings within the Mosaic patch. Use patch recall for devices with limited
    MIDI parameters or difficult parameter interfaces.


    NRPN encoding is explicit: new generic configurations use standard 14-bit values, while existing projects preserve
    their historical output. See [NRPN encoding and project conversion](docs/testing/NRPN_COMPATIBILITY.md) for
    device settings and deliberate conversion without rewriting numeric values.


    [Devices parameters demo](https://www.youtube.com/watch?v=J1ckUZvhFJ0&t=1454s)'
  musical_use: Set the MIDI parameters required for patch recall. Leave a parameter Off to preserve its current
    setting on the receiving instrument.
  related:
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#device-parameters
    behaviour_cases:
