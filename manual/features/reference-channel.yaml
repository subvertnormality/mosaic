  controls:
  - gesture: Channel tasks → Trig params → E2 slot → K2 → E3 Chord Pattern → K3 → K2
    result: Assign Chord Pattern to one of the ten slots.
  - gesture: E3 with no grid step held
    result: 'Edit the channel default: X, ->, <-, -><- or <-->.'
  - gesture: Hold a sequencer step + E3
    result: Set that step’s parameter lock; clear it with held step + K2 to return to the channel default.
  details:
  - title: Orders
    text: '-> plays the root then chord slots 1-4. <- reverses the order: it plays slots 4-1 then the root. X applies
      no shape: the root plays first. With no strum the voices start together, so a shape matters most with Strum
      or Arpeggio. A step lock set to X returns that step to root-first. -><- alternates between the start and the
      end of that order, working inward: root, slot 4, slot 1, slot 3, slot 2. <--> does the same starting from
      the end: slot 4, root, slot 3, slot 1, slot 2.'
