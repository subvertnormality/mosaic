- id: velocity-merge-modes
  title: Velocity Merge Modes
  audience: all
  summary: Select Average, Higher, Lower or a priority pattern for merged velocity values.
  prose: 'These settings affect how velocity values are calculated for overlapping steps:


    * **Average**: Average the contributing velocities and round to the nearest integer, choosing the greater integer
    at an exact half. One contributor passes through unchanged.

    * **Higher**: Add the difference between the highest and lowest contributing velocities to their rounded average.

    * **Lower**: Subtract the rounded average from twice the lowest contributing velocity: `2 * lowest - rounded_average`.

    * **Pattern**: To use a specific pattern''s velocity values, hold the velocity merge button and press the pattern''s
    select button.'
  musical_use: Assign two patterns with different velocities. Compare Average, Higher and Lower; Higher and Lower
    use the mean and range rather than selecting a source extreme.
  related:
  - merge-modes
  sources:
    readme: manual/legacy/README-1.4.0.md#velocity-merge-modes
    behaviour_cases:
