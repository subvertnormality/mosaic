  audience: all
  summary: Set a trig’s playback probability from 0 to 100, globally or per step.
  prose: Set Trig Probability globally or per step. A value of 100 always plays the trig; 0 never plays it. A value
    of 50 gives it a fifty-percent playback probability.
  musical_use: Set the main hits to 100. Set a lower probability on selected quieter hits.
  related:
  - sequencer-params
  sources:
    readme: manual/legacy/README-1.4.0.md#trig-probability
    behaviour_cases:
    - M-PARAM-018
    - M-PARAM-019
    - M-PARAM-020
    - M-PARAM-021
    - M-PARAM-022
    - M-PARAM-023
    - M-PARAM-024
    - M-PARAM-025
    - M-REC-PARAM-029
    - M-SCALE-LOCK-003
    code:
    - lib/devices/device_map.lua
    - lib/step.lua
  controls:
  - gesture: Channel tasks → Trig params → E2 slot → K2 → E3 Trig Probability → K3 → K2
    result: Assign Trig Probability to one of the ten slots.
  - gesture: E3 with no grid step held
    result: 'Edit the channel default: 0–100.'
  - gesture: Hold a sequencer step + E3
    result: Set that step’s parameter lock; clear it with held step + K2 to return to the channel default.
  details:
  - title: Probability
    text: A value of 50 gives each eligible trig a fifty-percent playback probability. It does not require exactly
      half the hits in a short loop to play. Set 0 for silence or 100 for certain playback.
