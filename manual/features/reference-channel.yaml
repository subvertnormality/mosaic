  controls:
  - gesture: Norns params → the assigned MIDI device parameter
    result: Edit stored patch values; a configured Off value sends nothing.
  - gesture: Load Mosaic or start playback
    result: Transmit the stored enabled MIDI parameters to recall the patch.
  details:
  - title: Stored value and step lock
    text: The stored value is the one in the norns params; a step lock set in Trig params only applies to that step.
      Locking step 1 of CC 1 to 99 sends 99 before that step's note, while the stored 63 is used on the other steps
      and still reads 63 afterwards.
  - title: Off reads X
    text: In the params menu an Off parameter reads X. This is the configured Off value (default -1) and nothing
      is sent for it.
  - title: Which example to read
    text: The examples below run in this order. Move between parameter locks and Slide only one source lock show
      a parameter ramping between two locked steps, first for every source and then for one. Set a configured device
      parameter shows the values a configured control accepts, from 0 up to its 127 limit. Keep a stored value while
      locking a step shows the stored value and a step lock together.
  recipes:
  - title: Shape a CC ramp between two step locks
    text: '1. Store CC 1 at 63 and assign CC 1 to a Trig Params slot.

      2. Lock step 1 to 24, step 3 to 96 and step 4 to 48.

      3. Enable the slide on step 1, then play and stop the phrase.

      4. Reopen PARAMS and verify the stored CC 1 value remains 63.

      Outcome: The slide interpolates step-local values from 24 toward 96 before stepping to 48; it changes emitted
      CC messages, not the stored default.'
  - title: Compare a stored device value with one step-local CC lock
    text: '1. Store CC 1 at 63 in the test device and assign it to a Trig Params slot.

      2. Hold step 1 and set its lock to 99; release the step and play the phrase.

      3. Compare the first step’s lock output with the stored value on the remaining steps, then reopen the device
      menu to verify 63 is still stored.

      Outcome: The step lock sends 99 on step 1 while the device default remains 63. A lock changes the sequenced
      output without overwriting the stored parameter.'
