- id: clocks-swing-and-shuffle
  title: Clocks, Swing and Shuffle
  audience: all
  summary: Set independent channel rates and Swing or Shuffle. Channel X settings inherit global feel settings.
  prose: 'Set the composition tempo on the Song Editor’s norns screen. Each sequence can have its own tempo. Open
    Channel tasks → Clock to set division or multiplication independently for each channel; use different rates
    for polyrhythms.


    Set channel Swing to move notes closer together or farther apart. Swing ranges from -50 to 50. Use it to vary
    off-grid timing, including jazz or funk rhythms. Shuffle uses more complex patterns based on 21echoes’ [Cyrene](https://github.com/21echoes/cyrene),
    with selectable feel and basis. Channels can use independent settings.


    If a channel''s swing/shuffle settings are not set ("X"), they will take the global setting, which is set on
    the Song page''s Tempo and feel screen. Selecting "X" again after choosing a local Swing or Shuffle mode restores
    global mode inheritance, just like an untouched channel; choosing either mode explicitly overrides the global
    mode. While playback is running, confirmed changes on this channel page take effect at the next global song-pattern
    boundary, including a repeat of the same pattern. They do not take effect immediately or at the next step of
    a shorter channel loop. While stopped, confirmed changes apply immediately.


    [Clocks, swings and shuffle demo](https://www.youtube.com/watch?v=J1ckUZvhFJ0&t=2623s)'
  musical_use: Keep the drum channel at its current rate. Change the bass or lead rate, then apply channel Swing.
    Compare Shuffle separately before changing additional timing settings.
  related:
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#clocks-swing-and-shuffle
