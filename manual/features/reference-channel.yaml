  controls:
  - gesture: Channel tasks → Trig params → E2
    result: Choose one of ten parameter slots.
  - gesture: K2 → E3 parameter → K3 → K2
    result: Open the assignment list, assign a parameter and return to the slot overview.
  - gesture: E3; hold K1 for fine adjustment
    result: Change the selected slot’s default value.
  - gesture: Hold step + E3
    result: Set an explicit step lock that overrides its channel default.
  - gesture: Hold step + K2
    result: Clear held steps’ trig locks; K1 + K2 with no held grid key clears channel step locks.
  details:
  - title: Fine adjustment
    text: Hold K1 while turning E3 for fine adjustment on Trig params. For non-norns parameters with a range greater
      than 126, unshifted encoder input can use larger increments; K1 prevents that range-based acceleration. Norns
      parameters use their own parameter behaviour. This is not a guarantee that K1 changes the increment on every
      screen.
  - title: Off is not zero
    text: An explicit Off lock on a step sends nothing for that parameter. It does not resend the previous lock
      or restore the default, so the device keeps the last value it received, and it is different from 0, which
      sends 0. An Off lock does not cancel a parameter slide that is already running; the slide may keep sending
      values.
  - title: Per song pattern
    text: Sequencer trig params such as Strum, Arp and Probability keep their own channel settings in each song
      pattern; select a slot and the Trig params dials show that slot's values. Device sound params are shared by
      every song pattern, so a patch sounds the same in each section.
