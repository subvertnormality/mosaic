- id: muting-channels
  title: Muting Channels
  audience: all
  summary: Toggle channel mute for the current song pattern by holding its selector or using K1.
  prose: 'Hold a channel-select button for one second to toggle that channel’s mute. Alternatively, hold K1 and
    press the channel-select button to toggle mute immediately. A muted channel button dims and, on a running channel,
    its notes stop and sounding notes are released. To bring the channel back while playing, hold K1 and tap its
    channel button; the button brightens and the phrase continues. If a channel is silent, check whether its button
    is dimmed.


