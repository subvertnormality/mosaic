- id: fully-quantise-mask
  title: Fully Quantise Mask
  audience: all
  summary: Set whether note masks follow scale degree and rotation, overriding global quantisation when explicitly
    Off or On.
  prose: The Fully Quantise Mask param controls whether note masks on a step are fully quantised to the current
    scale, including scale degree and rotation adjustments. When enabled, note masks will be quantised to match
    the current scale's settings exactly. Set this parameter per channel or step to override global quantisation.
    Channel X uses the global Quantise note masks setting; explicit Off and On override it. An explicit step X uses
    the global setting directly, bypassing the channel value. Clearing that step lock instead restores the channel
    value (and therefore the global setting if the channel is X).
  musical_use: Enable Quantise Note Mask for masks that should follow scale changes. Set a step OFF when it should
    not use full quantisation.
  related:
  - sequencer-params
  sources:
    readme: manual/legacy/README-1.4.0.md#fully-quantise-mask
    behaviour_cases:
    - M-MASK-021
    - M-MASK-022
    code:
    - lib/devices/device_map.lua
    - lib/step.lua
    - lib/quantiser.lua
  controls:
  - gesture: Channel tasks → Trig params → E2 slot → K2 → E3 Quantise Note Mask → K3 → K2
    result: Assign Quantise Note Mask to one of the ten slots.
  - gesture: E3 with no grid step held
    result: 'Edit the channel default: X, OFF or ON.'
  - gesture: Hold a sequencer step + E3
    result: Set that step’s parameter lock; clear it with held step + K2 to return to the channel default.
  details:
  - title: How the three levels combine
    text: 'The most specific setting wins: an explicit step lock first, then the channel value, then the global
      Quantise note masks option. X means no choice at that level. A channel X uses the global option. A step X
      skips the channel value and uses the global option directly. Use On when written masks should follow Degree,
      Rotation and scale changes; leave it Off or X when masks should stay as written.'
  recipes: []
  scene_refs:
  - full-quantisation-precedence
  - full-quantisation-inherit-and-step-off
  - full-quantisation-channel-beats-global
