- id: merge-modes
  title: Merge Modes
  audience: all
  summary: Set how assigned patterns supply trigs, notes, velocities and note lengths to a channel.
  prose: 'Use one shared Strategy selector for channel output. Press grid (14,8) to cycle Skip → Only → All → Foundation
    → Fragments, wrapping after Fragments. On Merge modes, select Strategy with E2 and turn E3 through the same
    choices; E3 stops at the first and last choice. A successful choice requests immediately, without K3 Apply.


    Strategy is the requested choice. Active is what is sounding; Pending is an accepted change waiting for its
    boundary, or NONE. While stopped, a valid choice applies immediately. During playback, Boundary names NEXT CYCLE
    or NEXT PATTERN.


    Foundation controls trigs only. Note, velocity and length merge settings remain active. Fragments controls all
    four attributes. Retained note, velocity and length settings are labelled inactive and their values read as
    the saved mode followed by SAVED, for example AVERAGE SAVED. Those rows and their grid buttons do not edit saved
    values while Fragments is active. Select Skip, Only or All to restore the retained settings.


    Foundation needs a valid assigned anchor. A refused request leaves the cursor at FOUNDATION and shows NEEDS
    ANCHOR, while Active and Pending keep their accepted values. The next forward detent or grid press reaches Fragments.


    [Merge modes demo](https://www.youtube.com/watch?v=J1ckUZvhFJ0&t=2065s)'
  musical_use: Choose a strategy, then compare channel playback. In a legacy strategy or Foundation, set the active
    note, velocity and length merge settings separately. In Fragments, compare its source fragments while the saved
    legacy settings remain inactive.
  related:
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#merge-modes
    behaviour_cases:
    - M-LIVEUI-MERGEMODES-001
    - M-LIVEUI-SHAPETRIG-001
    - M-UIACC-A10-001
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pattern.lua
  controls:
  - gesture: In Channel Editor, press grid (14,8).
    result: Cycle the shared Strategy through Skip, Only, All, Foundation and Fragments; the sequence wraps.
  - gesture: On Merge modes, select Strategy with E2 and turn E3.
    result: Request the same strategy; the list is clamped and needs no extra K3 Apply.
  - gesture: Press grid (15,8) or (16,8), or hold K1 and press (16,8).
    result: Change note, velocity or length merge respectively when the active strategy permits it. Fragments leaves
      saved settings unchanged.
  - gesture: Hold note, velocity or length merge button and tap a pattern in row 2.
    result: Choose a source pattern for that attribute when the active strategy permits it.
  details:
  - title: Accepted state and refusal
    text: Active and Pending identify accepted output, separately from the requested Strategy cursor. Foundation
      without a valid assigned anchor shows NEEDS ANCHOR and does not apply; the cursor remains at Foundation so
      the next forward choice reaches Fragments.
  - title: Attribute ownership
    text: Foundation owns trigs only. Fragments owns trigs, notes, velocity and length. Its retained note, velocity
      and length settings are inactive and read, for example, AVERAGE SAVED; selecting Skip, Only or All restores
      them. The saved trig merge (Skip, Only or All) is kept while Foundation is Active and is restored from the
      Strategy selector.
  recipes: []
  scene_refs:
  - merge-overlap-and-union
  - note-merge-numeric-output
  - velocity-merge-numeric-output
  - length-merge-numeric-output
  - shared-merge-strategy-workflow
