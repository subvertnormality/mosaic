- id: memory-undo-and-redo
  title: Memory (undo and redo)
  audience: all
  summary: Undo or redo the selected channel’s mask and trig-lock edits, including recorded edits.
  prose: 'Memory retains all mask and trig-lock actions, including recorded actions. Use the norns encoder to navigate
    the selected channel’s history.


    Open Channel Editor and choose History from Channel tasks. The Memory screen shows your position in the channel''s
    memory, the selected action, and how many actions you can still undo and redo.


    - Use E3 to step back through past actions or forward towards more recent ones.

    - Press K3 to jump directly to the latest action.

    - Press K2 to return to the beginning of the memory.


    To jump to the latest action and erase all subsequent memory, hold shift (K1) and press K3. To jump to the first
    action and erase all memory recorded after it, hold K1 and press K2.


    [Memory demo](https://www.youtube.com/watch?v=iGx5fmrbatA&t=202s)'
  musical_use: Record an edit and open History. Use E3 to compare earlier and later versions. Clear the retained
    history only after selecting the version to keep.
  related:
  - channel-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#memory-undo-and-redo
    behaviour_cases:
    - M-MAP-003
    - M-MASK-032
    - M-MEMORY-001
    - M-MEMORY-002
    - M-MEMORY-003
    - M-MEMORY-004
    - M-MEMORY-005
    - M-MEMORY-006
    - M-MEMORY-007
    - M-MEMORY-008
    - M-MEMORY-009
    - M-MEMORY-010
    - M-MEMORY-011
    - M-MEMORY-012
    - M-MEMORY-013
    - M-MEMORY-014
    - M-MERGE-STRUCTURE-005
    - M-PARAM-034
    - M-PARAM-035
    - M-PARAM-047
    - M-REC-PARAM-025
    - M-REC-PARAM-026
    - M-REC-PARAM-027
    code:
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/memory.lua
    - lib/ui_components/memory_history_navigator.lua
  controls:
  - gesture: Channel tasks → History → E3
    result: Move backward or forward through the selected channel’s mask and trig-lock history.
  - gesture: K2 / K3
    result: Undo all / redo all retained actions.
  - gesture: K1 + K2
    result: Jump to the first action and erase everything recorded after it.
  - gesture: K1 + K3
    result: Jump to the latest action and erase the memory after it.
  details:
  - title: Position, floor and branching
    text: 'The counter shows the current position and the total, for example 2 of 2. 0 of 2 is the floor: the oldest
      state, before any retained edit. Turn E3 left to undo and right to redo; E3 stops at 0 and at the last action.
      If you undo and then make a new edit, the undone edits are replaced by the new one and the counter stays at
      the end. Edits made from a MIDI keyboard while holding a step count as edits too.'
  - title: Counts and channels
    text: The Memory screen also shows how many actions you can still undo and how many you can redo. Each channel
      has its own history, so a channel you have not edited shows an empty one.
  recipes: []
  scene_refs:
  - memory-undo-redo-and-branch
  review:
