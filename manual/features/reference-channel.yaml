    - M-MERGE-042
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pattern.lua
  controls:
  - gesture: Hold K1 and tap grid (16,8)
    result: Cycle Average, Longer and Shorter note lengths.
  - gesture: Hold K1 and grid (16,8), then tap pattern in row 2
    result: Choose that pattern as the length source.
  details:
  - title: 'Worked example: lengths 2 and 4'
    text: Two patterns play notes 2 steps and 4 steps long on the same steps. Average gives 3 steps (the mean).
      Longer gives 3 + (4 - 2) = 5 steps. Shorter gives 2 x 2 - 3 = 1 step. Longer is therefore not simply the longest
      source, and Shorter not simply the shortest. Hold K1 and tap grid (16,8) to cycle Average, Longer and Shorter;
      the cycle wraps back to Average.
