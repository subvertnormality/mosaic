  controls: []
  details:
  - title: Complete lesson
    text: Open [Add a second part](#sequence-composition/course) for the ordered actions, their results and the matching listening example. Start with the softer C, C, C, D ending from chapter 5 and an independent second sound. Add a root-and-fifth bass beneath it.
  - title: Recovery
    text: If the first part changes, return to CH01 and inspect its route; channel selection does not erase the first part.
  - title: Course continuity
    text: Continue at [Add a second part](#sequence-composition/course). The independent examples have separate starting states; use another project after saving your course piece.
  - title: Independent controls example
    text: 'Before starting: Use a 16-step CH01 phrase with pattern 1 assigned: attacks 1,5,9,13; channel Note 60, Vel 80, Len 1/2; step 13 Note 62 and Vel 50. Use C major at 90 BPM and Rate /1. Playback is stopped. [Make a piece](#learn) chapters 2–5 supply this project. An independent project with the same state also works; pattern 2 must be empty.


      The Channel editor is where patterns are combined into rhythm and harmony sections.


      ### Enter two bass notes


      1. Tap Pattern (5,8) until Trig is shown; select pattern 2 at (2,1).

      2. Add attacks at (1,4) and (9,4).

      3. Tap Pattern once to open Note.

      4. Tap (1,7) for degree 0 and (9,3) for degree 4.


      Pattern 2 supplies a root and fifth.


      ### Route channel2


      1. Tap Channel (3,8); select channel 2 at (2,1).

      2. Open Channel tasks → Device; select an independent output and press K3 to apply.

      3. Tap pattern slot 2 at (2,2).

      4. Hold (1,4), tap (16,4), release.

      5. Tap (9,8) to set channel octave −1.


      The bass uses MIDI 48 and55 in the default C-major scale. Both channels repeat in16 steps.


      ### Hear the two parts


      Play two bars and stop.


      C–C–C–D sounds above a C–G bass pulse. Both parts retain independent settings.


      ### Compare overlapping rhythms


      1. Select CH01 and temporarily assign pattern 2 alongside pattern 1.

      2. Open Merge modes. Compare Skip and All for Trig.

      3. Play and stop after each comparison.

      4. Unassign pattern 2 from CH01 before continuing.


      Skip removes overlapping attacks 1 and9, leaving5 and13. All restores the four attacks. The existing Note 60 default and step 13Note62 exception keep the pitch comparison fixed. Unassigning pattern 2 returns the original phrase; CH02 keeps its bass pattern.


      Resulting project: CH01 remains C–C–C–D. CH02/P2 attacks 1/9, relative degrees0/4, range 16, octave−1, inherited notes/velocity, no masks.'
  - title: 'Separate demonstration: four neighbouring notes'
    text: 'The independent screen/grid demonstration starts with its own four-step example: C, D, E, F at velocities 127, 117, 107 and 97. It explains these controls on a different phrase. Follow the complete lesson above for the continuing sixteen-step piece and its matching sound; do not replace your course project with this setup.'
