        kind: tap-grid
        x: 1
        y: 8
        label: Play the captured phrase and listen for 76, 69, 66, 64.
      - id: preview
        kind: preview-recorded-result
        target_step_id: two-channels
        label: Preview the captured result
      semantic_requires:
        midi_events_at_target:
        - port: 2
          bytes:
          - 145
          - 76
          - 90
        - port: 2
          bytes:
          - 145
          - 69
          - 100
        - port: 1
          bytes:
          - 144
          - 66
          - 127
        - port: 1
          bytes:
          - 144
          - 64
          - 117
      human_outcome: Both channels play on their own ports; channel 2 adds MIDI 76 on step 3.
      practice_prompt: '1. Hold step 3 at (3,4) and play MIDI note 76 at velocity 90 on a MIDI keyboard or controller. This sets the held step''s Note and Vel masks.

        2. Release (3,4), then tap channel 1 at (1,1).

        3. Press Play at (1,8), compare the two parts for two passes, then press Play again to stop. Channel 2 plays its first note and the note you entered on step 3, while channel 1 keeps its melody.'
    title: Add a melody on the second output
    goal: Keep the first melody and add two notes on channel 2, using its own MIDI output.
    starting_point: Playback is stopped. Channel 2 is selected on NOTE MASKS CH02, with pattern 2 assigned and its separate output configured. Channel 1 retains its four-note melody.
  - id: mask-default-exceptions-and-clear
