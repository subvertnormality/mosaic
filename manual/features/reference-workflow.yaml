          - 67
          - 127
        - port: 1
          bytes:
          - 144
          - 67
          - 117
        - port: 1
          bytes:
          - 144
          - 67
          - 107
        - port: 1
          bytes:
          - 144
          - 67
          - 97
      human_outcome: All four steps return to G3; the channel default remains after the exceptions clear.
      practice_prompt: "This is a short field exercise for the Note default and local exception rules. After restoring the default, continue with “Add a melody on the second output” to apply a local note to channel 2 while channel 1 keeps its melody.\n\n1. With no step held on Note Masks, turn E3 clockwise until Note reads G3 (MIDI 67). All four steps use this channel default.\n2. Hold step 1 at (1,4), turn E3 clockwise to C4 (MIDI 72), then release it. Hold step 2 at (2,4), turn E3 clockwise to D4 (MIDI 74), then release it. These two exceptions override the default.\n3. Hold step 1 again, press K2 and release the step. Only its exception clears: step 1 returns to G3, while step 2 keeps D4.\n4. With no step held, hold K1, press K2 and release K1. All step exceptions clear together; the channel default remains G3.\n\nContinue to “Add a melody on the second output” when you are ready to use a local note mask in a second part."
    title: Set note exceptions, then clear them
    goal: Compare step Note masks with a channel default, then remove the exceptions while keeping the default.
