- id: modulation-movement-and-interest
  title: Adding Parameter Variation
  audience: all
  summary: Continue the phrase and bass in C major restored at the end of chapter 7. Add a quiet C pickup before the next bar.
  prose: '[Add a pickup](#modulation-movement-and-interest/course) is the complete continuing lesson.


    Start here: Continue the stopped phrase and bass from chapter 7 in C major. That chapter compares D major, then restores slot 1 to C major before it ends. Add a quiet C between the last beat and the next bar.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: Increase brightness or length on the final note. Apply probability to a quiet pickup while retaining the main attacks.
  related:
