- id: typical-workflow
  title: Composition Workflow
  audience: all
  summary: Make your first piece. Start with an empty project. Keep it through all ten chapters; you finish with a saved bass-only/full-phrase arrangement.
  prose: '[Make your first piece](#getting-started/course) is the complete continuing lesson.


    Start here: Start with an empty project. Keep it through all ten chapters; you finish with a saved bass-only/full-phrase arrangement.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: Use a short phrase to compare changes before expanding the arrangement.
  related:
  - dig-deeper
  - build-a-phrase
  sources:
    readme: manual/legacy/README-1.4.0.md#typical-workflow
    behaviour_cases:
    - M-LIVEUI-MERGEMODES-001
    - M-SCALE-001
    - M-MASK-007
    - M-WORKFLOW-001
    - M-MERGE-PHRASE-001
    code:
    - tests/behaviour/composition_workflow.py
  controls: []
  details:
  - title: Complete lesson
    text: Open [Make your first piece](#getting-started/course) for the ordered actions, their results and the matching listening example. Start with an empty project. Keep it through all ten chapters; you finish with a saved bass-only/full-phrase arrangement.
  - title: Independent controls example
    text: '1. Configure one output and create a short pattern.

      2. Assign the pattern to a channel.

      3. Select and apply a scale.

      4. Add melody using masks or MIDI recording.

      5. Apply velocity changes or parameter locks.

      6. Copy the sequence into song slots and edit each variation.

      7. Save a named project.


      Patterns supply musical material. Channels combine that material and apply exceptions. Song slots store sequence variations. See [Build a phrase](#build-a-phrase) for the complete procedure.


      This page is the overview; each stage links to the detailed reference.'
  recipes: []
  scene_refs:
