      - id: mask-priority-clear-all-release
        kind: release-key
        n: 1
        label: Release K1
      - id: mask-priority-preview
        kind: preview-recorded-result
        target_step_id: clear-channel
        label: Preview the restored G3 pattern
      semantic_requires:
        public_readout_equals:
          mask_fields:
          - field: note
            value: G3
            layout: overview_masks
        midi_phrase_contains:
        - port: 1
          bytes:
