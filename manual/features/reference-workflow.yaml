- id: song-composition
  title: Arranging Song Slots
  audience: all
  summary: Arrange two sections. Start with the completed phrase, bass and pickup from chapter 8. Use empty slots 2 and 3; copying overwrites the destination with no undo.
  prose: '[Arrange two sections](#song-composition/course) is the complete continuing lesson.


    Start here: Start with the completed phrase, bass and pickup from chapter 8. Use empty slots 2 and 3; copying overwrites the destination with no undo.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: 'Create three sections: bass alone, bass with chords, then bass, chords and lead. Remove the lead for the final section.'
  related:
