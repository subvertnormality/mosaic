- id: sound-design
  title: Assigning Instruments to Channels
  audience: all
  summary: Choose one sound. Start with an empty channel and playback stopped. Choose and apply its output before entering notes.
  prose: '[Choose one sound](#setup/course) is the complete continuing lesson.


    Start here: Start with an empty channel and playback stopped. Choose and apply its output before entering notes.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: Use Polyperc for bass or a plucked melody and Doubledecker for chords. Add Oilcan on a separate channel for percussion.
  related:
  - channel-editor
  - devices
  - typical-workflow
  sources:
    readme: manual/legacy/README-1.4.0.md#sound-design
    behaviour_cases:
    - M-ENDURANCE-001
    - M-WORKFLOW-001
    - M-LIVEUI-CHSELECT-001
    code:
    - tests/behaviour/composition_workflow.py
  controls: []
  details:
  - title: Complete lesson
    text: Open [Choose one sound](#setup/course) for the ordered actions, their results and the matching listening example. Start with an empty channel and playback stopped. Choose and apply its output before entering notes.
  - title: Independent controls example
    text: '1. Press Grid `(3,8)` and select a channel.

      2. Open Channel tasks → Device.

      3. Select a MIDI device or installed n.b. player.

      4. For MIDI, set port and channel to match the instrument.

      5. Press K3 to apply.

      6. Assign a pattern and start playback to verify the output.


      Use separate channels for parts that need independent notes, masks or clock settings. Channel numbers have no reserved musical roles. A useful grouping is drums on channels 1–6, harmonic and textural parts on 7–10, melodic parts on 11–14, and channels 15 and 16 kept for modulation. Adapt it to your own setup.


      A device can be an internal norns player, an external drum machine or synth, or part of a modular patch. Early sound choices may change later; a basic foundation is enough to start the rhythm and harmony work.'
  recipes: []
  scene_refs: []
  review:
    status: verified
    cases:
    - M-LIVEUI-CHSELECT-001
    source_status: code-and-case-reviewed
    applicability: native-ui
    native_gap: Device and clock scope are asserted. Physical MIDI receiver sound and every instrument map are outside this native example.
  category: workflow
  parent: typical-workflow
  level: 3
- id: rhythm-section-design
  title: Creating a Rhythm Pattern
  audience: all
  summary: Spread the rhythm across a bar. Start with the four-note loop from chapter 3. Move its trigs onto beats 1, 2, 3 and 4.
  prose: '[Spread the rhythm across a bar](#build-a-phrase/course) is the complete continuing lesson.


    Start here: Start with the four-note loop from chapter 3. Move its trigs onto beats 1, 2, 3 and 4.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: For a 16-step pulse, use steps 1, 5, 9 and 13. Add step 15 for a pickup. For a 3–3–2 rhythm over eight steps, use 1, 4 and 7.
  related:
  - pattern-editor
  - adding-trigs
  - adding-notes
  - adding-velocity
  - typical-workflow
  sources:
