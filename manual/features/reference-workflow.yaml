- id: melody-composition
  title: Entering a Melody
  audience: all
  summary: Give the phrase an ending. Start with four equal notes on the beats. Raise only the last beat and make it softer.
  prose: '[Give the phrase an ending](#masks/course) is the complete continuing lesson.


    Start here: Start with four equal notes on the beats. Raise only the last beat and make it softer.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: Repeat three notes and change the fourth. Compare a longer final note or a quiet pickup before adding more pitches.
  related:
  - masks
  - sequence-composition
  sources:
    readme: manual/legacy/README-1.4.0.md#melody-composition
    behaviour_cases:
    - M-ENDURANCE-001
    - M-WORKFLOW-001
    - M-MASK-007
    - M-MASK-008
    code:
    - tests/behaviour/composition_workflow.py
  controls: []
  details:
  - title: Complete lesson
    text: Open [Give the phrase an ending](#masks/course) for the ordered actions, their results and the matching listening example. Start with four equal notes on the beats. Raise only the last beat and make it softer.
  - title: Independent controls example
    text: '1. Select the destination channel.

      2. Open Channel tasks → Masks.

      3. Select Note with E2.

      4. Hold the destination step and turn E3 to change its note.

      5. Release the step and start playback to check the phrase.


      Without a held step, E3 changes the channel default. A held step can also receive a note or chord from MIDI input; set its length manually. For live entry, arm Record `(2,8)` and play during playback. While recording, turning a trig param records it as automation; see [Arm live record](#arm-live-record).


      Masks can overwrite pattern values or create steps the patterns do not have. They accept trigs, notes, velocities and chords.'
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: '1. On Masks, set the channel Note default to G3.

      2. Hold step 1 and set its Note to C4; release the step and check that the channel readout returns to G3 while step 1 keeps its exception.

      3. Add a D4 exception on step 2, then clear step 1 and finally clear all step exceptions with K1+K2.

      Outcome: A held-step Note value overrides the channel default for that step. Clearing exceptions restores the channel Note to G3 across the pattern.'
  - title: Contrast inherited velocity with explicit zero and a cleared exception
    text: '1. Set the channel Vel mask to 50 and add a step-1 accent at 90.

      2. Hold step 2 and set Vel to 0; read zero while held, then release and inspect the phrase with step 2 silent.

      3. Hold step 2, press K2 and release it; the step inherits 50 again while the step-1 accent remains.

      Outcome: X inherits the channel velocity; an explicit 0 silences the step. Clearing the step mask restores 50 without erasing the 90 accent.'
  scene_refs:
  - mask-precedence
  - mask-expression
  - workflow-second-channel
  review:
