  controls: []
  details:
  - title: Complete lesson
    text: Open [Arrange two sections](#song-composition/course) for the ordered actions, their results and the matching listening example. Start with the completed phrase, bass and pickup from chapter 8. Use empty slots 2 and 3; copying overwrites the destination with no undo.
  - title: Recovery
    text: Stop before editing the wrong section; select its slot and check the header.
  - title: Course continuity
    text: Continue at [Arrange two sections](#song-composition/course). The independent examples have separate starting states; use another project after saving your course piece.
  - title: Independent controls example
    text: 'Before starting: Use one populated Song slot with two independently routed, audible channels and a 16-step loop. Slot 1 is selected; slots 2 and 3 are empty; playback is stopped. The example mutes CH01 while retaining CH02. [Make a piece](#learn) chapters 2–8 prepare the exact phrase and bass; an existing two-part loop with these conditions also works.


      Song (6,8) is the last key of the menu cluster. Slot 1 is dimly lit to show the sequence you are on. In a copy you can mute channels, change scale locks, pattern assignments and merge modes, or edit masks, then chain slots.


      ### Copy the complete section


      1. Open Song (6,8).

      2. Hold slot 1 (1,1), tap slot 2 (2,1), release slot 1.

      3. Select slot 2.


      Slot 2 stores the same phrase, bass and channel settings.


      ### Make the first section sparse


      1. Open Song (6,8); select slot 1 at (1,1).

      2. Tap Channel (3,8).

      3. Hold K1, tap channel 1 at (1,1), then release K1.

      4. Return to Song and select slot 2 at (2,1).

      5. Open Channel and check channel 1 is unmuted in this copy.


      Slot 1 contains bass only; slot 2 adds the upper phrase and pickup.


      ### Set the section boundary


      1. Open Song (6,8); select slot 1 at (1,1).

      2. With transport stopped, tap (3,7), then tap (8,7) three times. Check Global length reads 16.

      3. Open Song tasks → Slot setup. Select Repeats with E2, set 1 with E3 and press K3 to apply.

      4. Return to Song; select slot 2 and repeat the Global length and Repeats settings.

      5. In Slot setup select Song mode, set On and press K3 to apply.

      6. Leave slot 3 empty and select slot 1.


      The contiguous group contains slots1 and2, one16-step pass each.


      ### Hear the arrangement


      Play four section passes and stop.


      Bass alone → bass and phrase → bass alone → bass and phrase. The highlighted Song slot changes at each boundary.


      Resulting project: Slot 1 CH01 muted/CH02 audible; slot 2 both channels audible. Global length 16; repeats1; Song modeOn; slot 3empty; selectedslot1; stopped.'
  - title: 'Separate demonstration: four neighbouring notes'
    text: 'The independent screen/grid demonstration starts with its own four-step example: C, D, E, F at velocities 127, 117, 107 and 97. It explains these controls on a different phrase. Follow the complete lesson above for the continuing sixteen-step piece and its matching sound; do not replace your course project with this setup.'
