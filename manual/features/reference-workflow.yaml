- id: harmony-design
  title: Applying a Scale
  audience: all
  summary: Compare C and D major on the chapter 6 phrase and bass, then restore C major at the end for chapter 8.
  prose: '[Change harmony without changing the rhythm](#harmony-design/course) is the complete continuing lesson for the phrase and bass from chapter 6. Follow it to move that piece from C major to D major while preserving its rhythm.


    The first screen/grid capture below is a separate scale-slot example. It starts with channel 1 playing C, D, E, F (MIDI 60, 62, 64, 65) on steps 1 to 4 at velocities 127, 117, 107 and 97; slot 1 C major is applied and playback is stopped. Save D major in slot 2, then apply it: the phrase becomes D, E, F sharp and G at the same rhythm and velocities. Open [Save D major, then apply it](#harmony-design/scale-save-d-and-apply) to see those steps and results.


    Keep the course project open while continuing the lesson. Each independent example below has its own stated starting point.'
  musical_use: Save D major in slot 2 and apply it to move the four-note phrase from C, D, E, F to D, E, F sharp, G; the rhythm and velocities stay the same.
  related:
  - scale-editor
  - scale-locks
  - typical-workflow
  sources:
    readme: manual/legacy/README-1.4.0.md#harmony-design
    behaviour_cases:
    - M-ENDURANCE-001
    - M-WORKFLOW-001
    - M-SCALE-001
    - M-HARMONY-REVOICE-001
    code:
    - tests/behaviour/composition_workflow.py
  controls: []
  details:
  - title: Continue the course piece
    text: Open [Change harmony without changing the rhythm](#harmony-design/course) for the ordered actions, their results and the matching listening example. Start with the phrase and bass from chapter 6. Remove fixed Note masks, write the same melody as relative notes, then compare C and D major.
  - title: Recovery
    text: If pattern notes do not change the sounding pitch, inspect channel and step Note masks before editing the pattern again.
  - title: 'Separate listening comparison: Changing Harmony with Scale Slots'
    text: '[Listen to Changing Harmony with Scale Slots](#recording/scale-slot-comparison) for the independent audio example. Its [Make the relative-note scale comparison recipe](#tilting-harmony/recipe/1) uses the same upper relative degrees 0,0,0,1 and bass degrees 0,4 under C major for two bars and D major for two bars. Its internal-player bass is velocity 60 and length 1/2; the continuing MIDI course keeps inherited velocity 100 and length 1.'
  - title: 'Independent controls example: C-C-C-D over a bass'
    text: 'Before starting: Start with stopped channel 1 assigned pattern 1, range 16, attacks 1,5,9,13, channel Note 60/Vel 80/Len 1/2 and step 13 Note 62/Vel 50. A second channel can use pattern 2 with attacks 1,9, relative degrees 0,4 and octave −1. Apply C major. [Make a piece](#learn) chapters 2–6 give the full preparation. If using only one channel, ignore the bass comparison.


      Harmony can apply globally, moving every channel to the same key, degree and rotation, or per channel. Because patterns store relative notes, you can change the global scale on a different cycle from a the channel note data for polyrhythmic tonal movement. A project has 16 scale slots, each with a root, scale type, degree, transposition and rotation. Sequence them with Scale locks, globally from the Scale editor or per channel in the Channel editor. See [Scale editor](#scale-editor) and [Scale locks](#scale-locks).


      ### Restore note inheritance


      1. Select CH01 and open Masks.

      2. With no step held, set Note to X.

      3. Hold step 13 and press K2, then release.

      4. Select Vel, hold step 13, set 50 and release.


      All Note exceptions are cleared. K2 also cleared the velocity exception, which is deliberately restored.


      ### Retain the same melody in the pattern


      1. Tap Pattern (5,8) until Note is shown; select pattern 1 at (1,1).

      2. Tap (1,7), (5,7) and (9,7) for degree 0.

      3. Tap (13,6) for degree 1.

      4. Play two bars and stop.


      C–C–C–D returns through relative notes. The quieter ending stays in the channel mask.


      ### Prepare a second scale


      1. Open Scale (4,8).

      2. Select scale slot 2.

      3. Play two bars and stop to hear its stored C-major setting.

      4. Select Root with E2; set D with E3.

      5. Select Scale and choose Major.


      The melody and bass still use C major during the comparison. D major is now prepared in the draft; press K3 before using the grid.


      ### Compare the transposition


      1. Press K3 to apply D major.

      2. Play two bars and stop.

      3. Select the unchanged C-major slot 1 and press K3.


      The phrase becomes D–D–D–E and bass D–A. Rhythm and velocity are preserved. C major is restored for the arrangement.


      Resulting project: CH01 P1 degrees0/0/0/1; Note defaultX; step 13NoteX/Vel 50; Vel 80/Len1/2 defaults retained. CH02 unchanged. Applied C major restored.'
  - title: 'Independent screen/grid example: Save D major, then apply it'
    text: The selected independent screen/grid example starts with channel 1 playing C, D, E, F (MIDI 60, 62, 64, 65) on steps 1 to 4 at velocities 127, 117, 107 and 97, with slot 1 C major applied and playback stopped. Open [Save D major, then apply it](#harmony-design/scale-save-d-and-apply) for the captured actions. The four-note scale example has its own setup; use [the continuing course piece](#harmony-design/course) for the phrase and bass from chapter 6.
  recipes: []
  scene_refs:
  - scale-save-d-and-apply
  - workflow-patterns-and-scale
  - harmony-revoice-two-voices
  review:
    status: verified
    cases:
    - M-SCALE-001
    - M-WORKFLOW-001
    - M-HARMONY-REVOICE-001
    source_status: code-and-case-reviewed
    applicability: native-ui
    native_gap: Native scenes show scale edit/apply, two-channel harmony and revoiced output. Sequenced scale-lock variations retain their own feature evidence.
    audio_refs:
    - scale-slot-comparison
    - bass-and-intervals
    audio_cases:
    - MA-AUDIO-scale-slot-comparison
    - MA-AUDIO-bass-and-intervals
    course_status: awaiting-continuous-native-capture
    course_scope: Existing reference-scene evidence proves its own configured example only. The new authored chapter sequence needs its own continuous capture.
    audio_comparison_status: pending-native-capture
  category: workflow
  parent: typical-workflow
  level: 3
