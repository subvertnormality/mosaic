- id: octave-locks
  title: Octave Locks
  audience: all
  summary: Place one step in a different octave from the channel's octave.
  prose: 'Set an octave lock:


    1. Hold a step on the channel sequencer.

    2. Press an octave button on Grid row 8, columns 8–12: (8,8) is -2, (9,8) is -1, (10,8) is 0, (11,8) is +1 and
    (12,8) is +2.

    3. Release the step.


    With no step held, the same five buttons set the channel octave. A step''s octave lock replaces the channel
    octave for that step. With the channel at -2, a lock of 0 puts that step back at its written octave, two octaves
    above its neighbours.


    Clear an octave lock:


    1. Hold the step.

    2. Press K2 on Trig params, or press the same octave button again.'
  musical_use: Move individual notes up or down in register, for example lift one note of a low bass line by an
    octave.
  related:
  - locks
  sources:
