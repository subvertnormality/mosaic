- id: transposition-locks
  title: Transposition Locks
  audience: all
  summary: Transpose the song from a chosen scale-track step. The lock is added to the selected scale's Transpose
    value.
  prose: 'Transposition locks belong to the global scale track on the Scale page. Reach the Scale page from the
    Channel editor with Grid (4,8) and set the lock on a scale-track step there, not on a channel step.


    Set a transposition lock:


    1. Press Grid (4, 8) to open the Scale Editor.

    2. Hold a step on the scale track.

    3. Press the required value on the transposition fader, Grid row 8, columns 8–16.

    4. Release the step. The norns screen shows Scale overview.


    From that step, the lock replaces the global transposition fader value. It is added to the selected scale''s
    own Transpose value. It stays in force on the following steps until a later transposition lock replaces it.


    A lock of 0 is a real lock. It cancels the global transposition from that step. It is not the same as having
    no lock.


    Clear a transposition lock:


    1. Hold the step on the Scale page.

    2. Press K2, or press the same fader value again.'
  musical_use: Transpose a passage up or down for a few steps without editing any notes, for example lift the last
    bar by an octave.
  related:
  - locks
  sources:
    readme: manual/legacy/README-1.4.0.md#transposition-locks
    behaviour_cases:
    - M-LIFECYCLE-001
    - M-TRANS-001
    - M-TRANS-002
    - M-TRANS-003
    - M-TRANS-004
    - M-TRANS-005
    code:
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: Open the Scale grid workspace, hold a scale-track step and press a transposition value
    result: Sets a transposition lock for that step; the global scale track supplies song transposition.
  - gesture: Hold that step and press the same transposition value again
    result: Removes that lock, including an explicit zero lock.
  - gesture: Hold the scale-track step and press K2 in the Scale workspace
    result: Clears the held scale-track locks.
  details:
  - title: Fader values
    text: 'Pressing a fader button sets a value: (9,8) -12, (10,8) -8, (11,8) -4, (12,8) 0, (13,8) +4, (14,8) +8
      and (15,8) +12. The end buttons (8,8) and (16,8) step down or up by one semitone each press.'
  - title: Example
    text: Global transposition is +4 and the melody is 60, 62, 64, 65. A lock of 0 on scale-track step 2 plays steps
      2 to 4 untransposed (62, 64, 65). A lock of +12 on step 1 makes the first note 72. Clearing the lock on step
      1 returns it to the global +4, so it plays 64.
  recipes: []
  scene_refs:
