  controls:
  - gesture: Select an assigned parameter in Trig params and press K3 with no grid step or K1 held.
    result: Toggle channel-wide sliding for that parameter. Enabled cells show S.
  - gesture: Hold a channel step and press K3 on the selected parameter.
    result: Toggle a slide from that step to the next lock of the same parameter. Other locks are unchanged.
  - gesture: Open PARAMS > MOSAIC and change Wrap param slides.
    result: On lets an eligible final slide reach the first lock across the repeat of the same pattern. It never
      slides into another song pattern.
  details: []
  recipes:
  - title: Open a filter over two steps
    text: 'Start with a channel with trigs on steps 1 to 4, a controller assigned to a Trig params slot (CC 1 as
      in the scenes, or the CC that drives your filter), and playback stopped (see the Brighten the last note recipe
      on Trig Param Locks).

      1. Open Trig params and turn E2 to that slot.

      2. Hold step 1, turn E3 to 24 and release. Hold step 3, turn E3 to 96 and release.

      3. Release all steps and press K3. The cell shows S. Press Play: the value leaves 24 at step 1 and reaches
      96 as step 3''s note starts (the CC strip in the scene lists 36, 48, 60, 72, 84, 96). Press Play again to
      stop.

      4. To slide only the first lock, first add a third lock: hold step 4, turn E3 to 48 and release. Press K3
      with no step held to switch the channel-wide slide off, then hold step 1 and press K3 (the cell shows S while
      step 1 is held). Press Play: 24 glides to 96 between steps 1 and 3, then jumps to 48 at step 4. With only
      two locks, a slide on step 1 alone and a slide on every lock sound the same; the third lock is what separates
      them. Stop.

      5. To loop the sweep, open PARAMS > MOSAIC and turn Wrap param slides On.

      6. Release all steps and press K3 to switch the channel-wide slide on again. The last lock, step 4, now slides
      back towards 24 across the loop boundary instead of holding at 48.'
