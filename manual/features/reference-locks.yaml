- id: scale-locks
  title: Scale Locks
  audience: all
  summary: Change the scale on a step, for one channel or for every channel. A channel lock overrides the global
    scale.
  prose: 'Scale slots are the 16 buttons on Grid row 3. A scale lock applies a slot from a chosen step. Set it on
    a channel page for that channel only, or on the Scale page for every channel that has no channel scale lock.


    Set a channel scale lock:


    1. Select the channel and hold a step on the channel sequencer.

    2. Press the required scale slot on Grid row 3. The norns screen shows Scale source.


    Set a global scale lock:


    1. Press Grid (4, 8) to open the Scale Editor.

    2. Hold a step on the scale track and press the required scale slot on Grid row 3. The norns screen shows Scale
    overview.


    Clear a step lock:


    1. Hold the step.

    2. Press K2, or press the same scale slot again.


    A channel scale lock overrides the global scale and global locks.


    With Scales lock until ptn end On (the default), a channel scale lock lasts until the channel wraps to its start
    or another channel scale lock replaces it.


    With the option Off, the lock lasts until the next active trig that passes its probability check. A trig that
    fails its probability check does not clear it. A scale lock on the next accepted trig replaces the previous
    lock.


    Global scale-track locks ignore this option. They last until another global lock replaces them or the global
    scale track wraps.


    Video: [Scale locks demo](https://youtu.be/J1ckUZvhFJ0?t=2854)'
  musical_use: Move a channel to a different scale for part of a phrase, or run a chord progression across all channels
    from the global scale track.
  related:
  - locks
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-locks
    behaviour_cases:
    - M-GESTURE-ORDER-001
    - M-RANGE-GLOBAL-004
    - M-SCALE-002
    - M-SCALE-004
    - M-SCALE-DISPLAY-001
    - M-SCALE-LOCK-003
    - M-SCALE-ORDER-001
    - M-TRANS-004
    - M-TRANS-005
    - M-TRIPLE-001
    code:
    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: Hold a channel sequencer step, then press a scale slot on Grid row 3.
    result: Set a channel scale lock at that step. It overrides the global scale track. The norns screen shows Scale
      source.
  - gesture: On the Scale page, hold a scale-track step, then press a scale slot on Grid row 3.
    result: Set a global scale lock. It lasts until a later global lock replaces it or the global scale track wraps.
      The norns screen shows Scale overview.
  - gesture: Hold the step and press its currently locked scale slot again.
    result: Remove that scale lock.
  - gesture: Hold the step and press K2 in the relevant Scale or channel workspace.
    result: Clear the locks on that step in that workspace. This clears the step; it does not undo one field.
  details:
  - title: Scale source screen
    text: After a channel scale lock, Scale source lists the channel lock, the global lock, the selected scale and
      the effective scale. Use it to see which lock is winning. It is read-only.
  recipes: []
  scene_refs:
  - scale-lock-scope-and-lifetime
  - scale-lock-skipped-trig
  - scale-lock-replacement
  review:
    status: verified
    cases:
