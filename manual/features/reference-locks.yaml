- id: mask-locks
  title: Mask Locks
  audience: all
  summary: Give one step its own note, velocity, length or other mask value. Step locks override the channel default
    masks.
  prose: 'A mask has a channel default and, for each step, an optional step lock. With no step held, E3 changes
    the channel default. With a step held, E3 changes the lock on that step only.


    Set a mask lock:


    1. Open Masks from Channel tasks with E1.

    2. Turn E2 to the mask you want, for example Note or Vel.

    3. Hold a step on the channel sequencer.

    4. Turn E3 to the value for that step.

    5. Release the step. The screen shows the channel default again; the step keeps its lock.


    Clear a step''s mask locks:


    1. Open Masks.

    2. Hold the step and press K2.


    Clear all step-mask locks on the channel:


    1. Open Masks.

    2. Release all steps.

    3. Hold K1 and press K2.

    Channel default masks are retained.


    Video: [Mask locks demo](https://youtu.be/J1ckUZvhFJ0?t=1780)'
  musical_use: 'Vary single steps while the rest of the channel keeps its default: raise one note, accent one hit,
    shorten one gate.'
  related:
  - locks
  sources:
    readme: manual/legacy/README-1.4.0.md#mask-locks
    behaviour_cases:
    - M-PATCH-041
    - M-PATCH-042
    - M-UIACC-A02-001
    code:
    - lib/pages/channel_edit_page/channel_edit_masks.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/models/program.lua
    - lib/ui_adapters/masks.lua
    - lib/step.lua
  controls:
  - gesture: On Channel tasks > Masks, select a mask with E2
    result: The highlighted cell identifies the field to edit.
  - gesture: Hold a channel sequencer step and turn E3
    result: Sets that mask for the held step instead of changing the channel default.
  - gesture: Hold the step and press K2 on Masks
    result: Clears the held step’s mask locks so its channel defaults can apply again.
  - gesture: Release all steps, then hold K1 and press K2 on Masks
    result: Clears channel step-mask locks while keeping channel default masks.
  details:
  - title: Example
    text: With a channel velocity of 50, hold step 1 and turn E3 to 90. Step 1 plays at velocity 90 and the other
      steps play at 50. Holding step 1 and pressing K2 returns it to 50.
  - title: X and zero
    text: 'X means no mask: the step inherits the pattern''s value. A velocity of 0 is a mask that silences the
      step. The two are different.'
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: '1. On Masks, set the channel Note default to G3.

      2. Hold step 1 and set its Note to C4; release the step and check that the channel readout returns to G3 while
      step 1 keeps its exception.

      3. Add a D4 exception on step 2, then clear step 1 and finally clear all step exceptions with K1+K2.

      Outcome: A held-step Note value overrides the channel default for that step. Clearing exceptions restores
      the channel Note to G3 across the pattern.'
  - title: Contrast inherited velocity with explicit zero and a cleared exception
    text: '1. Set the channel Vel mask to 50 and add a step-1 accent at 90.

      2. Hold step 2 and set Vel to 0; read zero while held, then release and inspect the phrase with step 2 silent.

      3. Hold step 2, press K2 and release it; the step inherits 50 again while the step-1 accent remains.

      Outcome: X inherits the channel velocity; an explicit 0 silences the step. Clearing the step mask restores
      50 without erasing the 90 accent.'
