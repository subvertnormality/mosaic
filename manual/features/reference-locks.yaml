- id: param-slides
  title: Param Slides
  audience: all
  summary: Make a parameter move gradually from one lock to the next instead of jumping.
  prose: 'A slide needs at least two parameter locks of the same parameter on the channel. Set them first (see [Trig
    Param Locks](#trig-param-locks)).


    Slide a parameter across the whole channel:


    1. Open Trig params and select the parameter with E2.

    2. Release all steps and press K3. The cell shows S.


    Between every pair of locks of that parameter the value now moves gradually. Press K3 again with no step held
    to switch it off.


    Slide from one step only:


    1. Hold the step that has the lock you want to slide from.

    2. With the parameter selected, press K3.


    The held step slides to the next lock of that parameter. Other locks of the parameter still jump.


    Slides do not cross into a different song pattern. Turn on Wrap param slides to let the last lock of a repeating
    pattern slide back to the first lock (see [Parameter Slides Wrap](#parameter-slides-wrap)). Slides use extra
    processing, so use them only where you need them.


    Video: [Param slides demo](https://youtu.be/iGx5fmrbatA?t=515)'
  musical_use: Open or close a filter, raise a send level or bend a modulation amount over a few steps, rather than
    in one jump.
  related:
  - trig-param-locks
  sources:
