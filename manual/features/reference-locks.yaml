features:
- id: locks
  title: Locks
  audience: all
  summary: Store a different value on one step. Hold the step, then change the same control you use for the whole
    channel.
  prose: 'A lock stores a value on one step, so that step differs from the channel default. Hold the step on the
    grid, change the value, then release the step. The lock stays in place and the screen returns to the channel
    default.


    Each lock type has its own control:


    1. Parameter lock: on Channel tasks > Trig params, hold a step and turn E3. See [Trig Param Locks](#trig-param-locks).

    2. Mask lock: on Channel tasks > Masks, hold a step and turn E3. See [Mask Locks](#mask-locks).

    3. Octave lock: hold a step and press an octave button on Grid row 8, columns 8–12. See [Octave Locks](#octave-locks).

    4. Scale lock: hold a step and press a scale slot on Grid row 3. On a channel page the lock affects that channel.
    On the Scale page it is global. See [Scale Locks](#scale-locks).

    5. Transposition lock: on the Scale page, hold a scale-track step and press the transposition fader on Grid
    row 8. See [Transposition Locks](#transposition-locks).


    Parameter, mask and octave locks change their own step only. A transposition lock stays in force on the steps
    that follow it until a later transposition lock replaces it. A channel scale lock lasts as set by Scales lock
    until ptn end (see [Scale Locks](#scale-locks)). A global scale lock lasts until another global lock replaces
    it or the scale track wraps.


    To remove a lock, hold its step and press K2 on the screen where you set it. For octave, scale and transposition
    locks you can also press the same button again.'
  musical_use: 'Change one step without editing the pattern: lift a single bass note an octave, accent one hit,
    open a filter on the last note, or change the scale for one part of the phrase.'
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#locks
    behaviour_cases: []
    code:
    - lib/models/program.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/step.lua
  controls:
  - gesture: Hold a sequencer step, then change a value (E3 on Trig params or Masks, or a grid button for octave,
      scale and transposition).
    result: The value is written to that step. The channel default does not change.
  - gesture: Release the step.
    result: The screen shows the channel default again. The lock remains on the step.
  - gesture: Hold the step and press K2 on the screen where the lock was set.
    result: The lock is removed and the step uses the channel default again.
  details: []
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: '1. On Masks, set the channel Note default to G3.

      2. Hold step 1 and set its Note to C4; release the step and check that the channel readout returns to G3 while
      step 1 keeps its exception.

      3. Add a D4 exception on step 2, then clear step 1 and finally clear all step exceptions with K1+K2.

      Outcome: A held-step Note value overrides the channel default for that step. Clearing exceptions restores
      the channel Note to G3 across the pattern.'
  - title: Compare a stored device value with one step-local CC lock
    text: '1. Store CC 1 at 63 in the test device and assign it to a Trig Params slot.

      2. Hold step 1 and set its lock to 99; release the step and play the phrase.

      3. Compare the first step’s lock output with the stored value on the remaining steps, then reopen the device
      menu to verify 63 is still stored.

      Outcome: The step lock sends 99 on step 1 while the device default remains 63. A lock changes the sequenced
      output without overwriting the stored parameter.'
  - title: Use a channel octave for a bass line and a local octave exception
    text: '1. Set the channel octave to -2 and verify the four-note line moves into the lower register.

      2. Hold step 2 and set its octave to -1, then compare the local note with its neighbours.

      3. Clear the lock to inherit -2; set a zero lock and clear it again to distinguish local override from inheritance.

      Outcome: The channel octave shifts the whole line. A step octave lock replaces that channel value for one
      step; clearing it restores the channel setting.'
  - title: Distinguish an explicit zero transpose lock from inheritance
    text: '1. With global transpose at +4, hold step 1 and move its transpose lock to 0.

      2. Keep the held-step readout as the lock proof; do not infer exact MIDI output from the truncated intermediate
      stream.

      3. Press K2 to clear the lock and use the complete clear checkpoint: step 1 follows +4 while the separate
      explicit-zero lock on step 2 remains.

      Outcome: Zero is an explicit step transpose that overrides +4. Clearing step 1 makes it inherit +4; the captured
      final phrase is complete and retains the other zero lock.'
  scene_refs:
  - mask-precedence
  - parameter-slot-endpoints
  - trig-parameter-locks
  - device-stored-value-and-step-lock
  - global-parameter-slide
  - transpose-explicit-zero-and-clear
  - octave-local-over-global
