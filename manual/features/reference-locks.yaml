  controls:
  - gesture: On Channel tasks > Trig params, use E2 to select an assigned slot
    result: The selected parameter cell is highlighted.
  - gesture: Hold a channel sequencer step and turn E3
    result: Sets that assigned parameter for the held step; the cell shows its held value and L marker.
  - gesture: Hold the step and press K2 on Trig params
    result: Clears parameter trig locks for the held step, rather than only the selected slot.
  - gesture: Release all steps, then hold K1 and press K2 on Trig params
    result: Clears the channel parameter trig locks.
  details:
  - title: Ten slots
    text: Each channel has ten Trig params slots. Turn E2 to move between them; it stops at slot 1 and at slot 10.
      Each slot keeps its own default and its own step locks, and the scene below assigns CC 1 to CC 10 and locks
      one step on slot 10 and another on slot 1.
  - title: Clearing is per step
    text: Hold the step and press K2 on Trig params clears every parameter lock on that step, not only the selected
      slot.
  recipes:
  - title: Brighten the last note with a cutoff lock
    text: 'Start with a channel that has trigs on steps 1 to 4 (see Build a phrase), sends to a device that lists
      a controller you can hear on a filter, and is stopped. This recipe uses CC 74, the usual filter cutoff controller:
      a generic CC device lists it as CC 74, and a device whose configuration names it shows it as Cutoff. The scenes
      on this page use CC 1 the same way.

      1. Open Trig params: turn E1 to Channel tasks, turn E2 to Trig params, press K3.

      2. Turn E2 to slot 1, press K2, turn E3 to CC 74 (Cutoff), press K3 to assign it, then press K2 to return
      to the slot view.

      3. With no step held, turn E3 to 40, the channel default: every step sends CC 74 = 40 before its note.

      4. Hold step 4, the last trig, and turn E3 to 100 (the cell shows 100 and the L marker). Release step 4 and
      the cell shows 40 again.

      5. Press Play. Steps 1 to 3 sound with cutoff 40 and step 4 sends CC 74 = 100 just before its note, so the
      last note of each loop is brighter.

      6. To remove the accent, hold step 4 and press K2.

      On this page, the scene Lock a value, then clear just that step shows the same gestures with Fixed Note, the
      MIDI strip of Use the first and last Trig params slots shows CC values arriving just before their notes, and
      Keep a stored value while locking a step shows one locked CC value ahead of a step''s note while the other
      steps send the stored value. For a smooth rise instead of a jump, see Param Slides.'
