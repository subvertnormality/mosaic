    - lib/pages/channel_edit_page/channel_edit_page.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: Hold a channel sequencer step and press an octave button on Grid row 8, columns 8–12.
    result: Set the held step's octave lock to -2, -1, 0, +1 or +2.
  - gesture: Hold that step and press the same octave button again.
    result: Remove the octave lock. An explicit 0 is a lock; no lock is different.
  - gesture: Hold the step and press K2 on Trig params.
