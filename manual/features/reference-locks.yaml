- id: save-and-load
  title: Save and Load
  audience: all
  summary: Save named projects and load saved projects from PARAMS > MOSAIC. Stopped, idle projects normally autosave
    after 60 seconds.
  prose: 'Save a named project:


    1. Press K1 to open PARAMS and choose MOSAIC.

    2. Choose Save project.

    3. Enter a descriptive name on the text entry screen and press K3 to confirm. The suggested name is new.


    Mosaic writes a project file (.ptn) and a parameter file under that name. Saving under a name that already exists
    replaces that save. Press K2 in the dialog to cancel; no file changes.


    Load a project: open PARAMS > MOSAIC, choose Load, pick the file in the file picker and press K3.


    Use named saves for versions that autosave must not overwrite. When playback is stopped, 60 seconds of inactivity
    normally saves the current project as autosave. Mosaic loads the most recent autosave at startup. Named saves
    are separate files and autosave does not change them.


    Before replacing the current project, Mosaic checks saved song slots, global lengths, channel ranges and scale-track
    ranges. If a check fails, the screen identifies the problem. The current project and playback are retained.


    A rejected load suspends autosave to protect the rejected file. Editing, playing and cancelling a dialog do
    not resume autosave. A successful valid load, a successful named save or New resumes the normal idle autosave
    interval. A failed save leaves autosave suspended.


    Valid saved one-step ranges are supported. There is no one-step range gesture. Validation covers the saved range
    structure; it does not check every possible corrupted project field.'
  musical_use: Save a named project before trying a change, so you can return to the earlier version. Autosave is
    a safety net, not a version history.
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#save-and-load
