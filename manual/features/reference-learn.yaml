- id: mods-and-software-devices
  title: Selecting an n.b. Player
  audience: all
  summary: Install and enable a supported player before assigning it to a channel.
  prose: '1. Install the player’s n.b. mod.

    2. Enable the mod in the norns MODS menu and restart as required by the mod.

    3. Start Mosaic.

    4. Open Channel tasks → Device. Turn E3 to the player. The row shows its name as a draft. Press K3
    to apply it.


    Supported, enabled players appear in the Device list. A mod that is installed but not on Mosaic''s
    list of supported players does not appear. The researched and pinned voices are Doubledecker, Oilcan,
    Polyperc and Emplaitress. Recorded examples use Doubledecker, Oilcan and Polyperc; Emplaitress has
    no recording because the installed runtime lacks MiPlaits. Availability depends on the installed player
    and its dependencies. Crow, Just Friends and Ansible also require their corresponding hardware.


    A channel has one device, so give each player its own channel. The audio example Rhythm, bass and
    a changing chord assigns Oilcan 1 (percussion) to channel 1, Polyperc 1 (bass) to channel 2 and Doubledecker
    (chords) to channel 3. The three audio-route examples show each selection before K3 is pressed. The
    Apply examples show the pending confirmation, the applied Device value, and that value after reopening
    the page. Listen to the audio example to hear what the three players sound like together.


    Do not overload norns with too many internal sound engines on different channels.'
  musical_use: ''
