- id: grid-menu-navigation
  title: Selecting a Grid Page
  audience: beginner
  summary: Grid (3,8) through (6,8) select the four editors.
  prose: 'Press Grid `(3,8)` for Channel, `(4,8)` for Scale, `(5,8)` for Pattern or `(6,8)` for Song.
    The norns screen follows the selected page, and selecting a channel on the Channel page shows that
    channel on the screen.


    Press Pattern repeatedly to cycle Trig → Note → Velocity. Channels hold output settings and masks.
    Patterns hold source material. Scales hold pitch collections. Song slots hold variations of the sequence.


    Press and hold one or more channel steps to edit exactly those steps on their own. The screen shows
    the step''s Masks and the header reads the step, for example `CH03 ST05`. Release the step and the
    screen returns to the page you were on. The example below taps through the page keys, holds step 5
    and then holds step 9 from the Clock page.'
