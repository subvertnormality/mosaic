    text: '1. Open Song view so Channel is an inactive page button.

      2. Hold Channel until the panic gesture fires, then release it.

      3. Confirm the source case records the full all-notes-off stream and that output has no unmatched
      notes.

      Outcome: The Channel panic gesture emits the captured all-notes-off stream across connected MIDI
      destinations; this lesson makes no audio or physical-device timing claim.'
