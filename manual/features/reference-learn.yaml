- id: midi-controller-mapping
  title: MIDI Controller Mapping
  audience: all
  summary: Assign MIDI controls to channel parameters through the norns MIDI Map menu.
  prose: 'Use a MIDI controller that supports relative (binary offset) messages.


    1. Open the norns PARAMS menu and select Mosaic Midi Mapping.

    2. Choose selected channel parameters for the currently selected channel, or channel parameters for
    a fixed channel. Select the required parameter.

    3. Hold K1 and press K3 to switch from EDIT to MAP mode.

    4. Press K3 to open the parameter’s map editor. Select Learn and press K3 to arm it.

    5. Operate the MIDI control. The editor learns its CC, input channel and device.

    6. Set Input low to 1, Input high to 2 and Accum to Yes. Check that Output low is −1.0 and Output
    high is 1.0, and set them if not. Use E2 to select a row and E3 to change it.

    7. Press K2 to leave the editor and save the assignment.

    8. Hold K1 and press K3 to return to EDIT mode, then leave the parameter menu.

    9. Operate the mapped MIDI control. The selected Mosaic value changes.


    Trig parameters, masks and channel memory can be mapped. The first MIDI message used by Learn identifies
    the control; it does not perform the mapped parameter change.


    ### How relative messages change a value


    A relative (binary offset) control sends 64 for no change. A value above 64 means up and a value below
    64 means down. In the examples, 65 is one step up and 63 is one step down, and 0 is also a decrease.
    The settings above (Input 1 to 2, Accum Yes) make each message move the mapped value one step and
    add up. Messages that arrive quickly one after another move it further.


    A value that can be Off starts at X, one step below 0. The first increase from X reaches 0. A velocity
    mask at X, sent eleven messages of 65, reads 10. Two messages of 63 then bring it to 8.


    ### Selected and fixed channel maps


    A selected-channel map edits whichever channel is selected when you turn the control. A fixed-channel
    map always edits its own channel. The first example below maps CC 20 to the selected channel''s velocity
    mask and CC 21 to channel 2''s, and shows both. The second example builds the CC 20 map in the norns
    menu and then uses it.


    [MIDI controller mapping demo](https://www.youtube.com/watch?v=iGx5fmrbatA&t=802s)'
