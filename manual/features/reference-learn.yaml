- id: stock-devices
  title: Installing Stock Device Configurations
  audience: all
  summary: Copy selected stock JSON files into data/mosaic/config.
  prose: '1. In maiden, open `code/mosaic/lib/config`. Digitone, Digitakt 2, Syntakt and Nord Drum 2 have
    fully tailored mappings. The folder also holds further maps, including Digitakt, Vermona DRM voices,
    OP-1, Plaits, Braids and MIDI SID.

    2. Create `data/mosaic/config` if it does not exist.

    3. Copy the required JSON files into that folder.

    4. Restart Mosaic.

    5. Open Channel tasks → Device, select the map and press K3. The device becomes available to the channel.


    Check its MIDI output port and channel. The receiving instrument must use the matching setup.


    Only the files you copy become devices, so the Device list holds just your own instruments. Once a
    configured device is applied, its parameters behave as in the example below: Control 1 sends CC 1
    from 0 to 127, and X means Off.'
  musical_use: ''
