- id: adding-custom-devices
  title: Creating a Custom Device Configuration
  audience: beginner
  summary: Create a JSON map from the instrument’s MIDI implementation.
  prose: '1. Open the [Mosaic Config Creator](https://subvertnormality.github.io/mosaic/config_creator.html).


    2. Enter the instrument’s port, MIDI channel, note policy and CC/NRPN addresses.


    3. Save the JSON file in `data/mosaic/config`.


    4. Restart Mosaic.


    5. Select the device in Channel tasks → Device and press K3.


    Invalid configurations are skipped so valid devices can still load. Mosaic reads configurations from
    `data/mosaic/config`. Ignore any older instruction that names a `dust > mosaic > config` folder.


    You can also copy a stock configuration into `data/mosaic/config` and edit it, for example to set
    the default MIDI output device. Without any configuration a MIDI channel can still use CC Device:
    it plays notes and offers CC 1 to 127, and you look up the CC numbers yourself.


    The example below shows what a configured parameter does once its device is applied: Control 1 sends
    CC 1 from 0 to 127, and X means Off.'
  musical_use: ''
