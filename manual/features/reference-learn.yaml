- id: midi-device-configuration
  title: MIDI Device Configuration
  audience: beginner
  summary: Device configurations define output defaults and mapped parameters.
  prose: 'A device configuration supplies parameter names, CC/NRPN assignments and output defaults. Basic
    MIDI note output does not require a custom configuration.


    1. Put the required JSON device files in `data/mosaic/config`.

    2. Restart Mosaic to discover the files.

    3. Open Channel tasks → Device.

    4. Select the device and press K3 to apply.

    5. Check the MIDI port and channel against the receiving instrument.


    Use a [stock configuration](#stock-devices), or [create a custom configuration](#adding-custom-devices)
    from the instrument’s MIDI implementation.


    After a configured device is applied, its parameters appear in the norns PARAMS menu under MOSAIC,
    in that channel''s device parameters, and can be assigned to trig parameter slots. Each parameter
    holds a value from its minimum to its maximum, or X for Off. X sends no value and leaves the instrument''s
    own setting alone. The example below uses a test device with a parameter named Control 1 (CC 1) to
    show the value range, clamping at both ends and the Off position.'
  musical_use: ''
  related:
  - stock-devices
  - adding-custom-devices
  - devices
  - lock-lead-time
