  details:
  - title: Parameter recording interactions
    text: 'To enable record mode, press the second button from the left on the grid.


      When record mode is active, any notes played on a MIDI keyboard will be captured as note masks on
      the currently selected channel. This includes note lengths and chords. All recordings are quantised
      to align with the current step: the step active when Mosaic processes the note-on, rather than the
      nearest step. An incoming MIDI clock pulse and a sequencer step transition are separate events;
      a note processed before the transition still belongs to the preceding active step. A recorded chord
      has one shared note length, measured from the first key press to the final key release and quantised
      to the nearest supported note length. This applies even when the chord keys are pressed or released
      at different times. Disarming recording prevents new notes from being recorded. Notes that began
      while recording was armed are kept, and their full note lengths are measured and committed when
      you release them, even if recording has since been disarmed.


      While recording is armed, editing a trig parameter starts recording that parameter’s value on subsequent
      eligible steps processed for the selected channel. Already-processed steps are unchanged. Only edited
      parameters are recorded, overwriting their existing locks through the channel’s final step; recording
      clears before its next starting step is processed while the channel remains selected. Further encoder
      edits update or restart recording. Grid Stop or disarm clears pending parameter recording. Active
      MIDI values are sent again before each eligible step’s note, even when the value has not changed.
      Selecting another channel or the Scale Editor pauses this parameter recording; returning resumes
      on the next eligible step unless that step clears recording at the selected channel’s wrap. Wraps
      while the channel is not selected leave its pending values intact. An active recorded value cancels
      that slot’s existing slide at the next eligible step. Off sends nothing and leaves an existing slide
      running. Changing a parameter assignment clears its pending recording; confirming the same assignment
      preserves it. Applying a MIDI device, channel or port change resets the device locks, assignments,
      defaults and pending parameter recording. Unconfirmed changes and cancellation leave the original
      recording intact.


      With Trigless Locks off, parameter values are recorded only on active steps. When it is on, every
      step is eligible. Trigless Locks is enabled by default.'
