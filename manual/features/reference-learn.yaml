- id: midi-keyboard-input
  title: MIDI Keyboard Input
  audience: all
  summary: Hold a step to enter it, or arm recording and play.
  prose: 'To audition the selected channel without recording:


    1. Select the channel and apply its output device.

    2. Leave Record disarmed and release all grid steps.

    3. Play and release MIDI keys. The channel’s selected output plays the notes; no step masks are entered.


    To enter a step:


    1. Select the destination channel.

    2. Hold the destination channel step.

    3. Play a MIDI note or chord. On the Masks screen the entered values appear as locks on the held step.

    4. Release the MIDI keys, then release the grid step.

    5. Set the note length manually.


    For live entry, arm Record `(2,8)` and play during playback. Notes are assigned to the active step
    when processed. A recorded chord shares one length from its first key press to its final release.


    By default, MIDI input plays the pressed keys. Map scale to white keys maps the selected scale onto
    white keys with its root at C. The scale-degree and rotation options affect this mapping.


    ### Map scale to white keys


    With the option on, the white keys play the selected scale from its root on C, one scale note per
    white key. Keys C D E F G A B C play:


    - C major: 60, 62, 64, 65, 67, 69, 71, 72.

    - Natural minor from C: 60, 62, 63, 65, 67, 68, 70, 72.


    A black key plays the same pitch as the white key above it. With the option off, every key plays its
    own pitch whatever the scale. The example below turns the option on in C major, changes the scale
    to natural minor, then turns it off.


    ### Channel and step masks


    Keyboard entry writes masks. A mask replaces the pattern''s value for that channel or step: Note,
    Vel (velocity), Len (length) and Trig. A channel mask applies to every step. A step mask, set while
    the step is held, overrides the channel mask. X means no mask is set, so the pattern''s value is used.
    Velocity 0 is silent and is different from X. Hold a step and press K2 to clear that step''s masks.
    The two Masks examples below show channel masks, step masks and clearing.'
  musical_use: ''
  related:
  - arm-live-record
  - masks
  - map-scale-to-white-keys
