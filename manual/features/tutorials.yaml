  controls:
  - gesture: Short K1 → PARAMS → MOSAIC → Save project
    result: Enter and confirm a project name.
  - gesture: PARAMS → MOSAIC → Load project
    result: Choose a saved project; K2 cancels the dialog.
  details:
  - title: Complete lesson
    text: Open [Save, reload and perform](#keep-your-work/course) for the ordered actions, their results and the matching listening example. Start with the two-section arrangement from chapter 9, stopped with slot 1 selected. Save it, make a temporary change, and reload the saved version.
  - title: Recovery
    text: K2 cancels Load without replacing the current project. Keep the saved name before trying optional variations.
  - title: Course continuity
    text: Continue at [Save, reload and perform](#keep-your-work/course). The independent examples have separate starting states; use another project after saving your course piece.
  - title: Independent controls example
    text: 'Before starting: Use any stopped project containing a named arrangement. The worked reload check uses slot 1 with channel 1 muted and another channel audible. For another project, make a reversible visible change before loading and confirm the saved state returns.


      ### Save the arrangement


      1. Tap K1 briefly to enter the norns system menu.

      2. Open PARAMS → MOSAIC → Save project.

      3. Press K3 to open text entry. Turn E2 left to DEL and press K3 three times to remove new. Turn E3 left to the character row; use E2 to select each character of Four notes and K3 to enter it, including the space. Turn E3 right to the bottom row, turn E2 right to OK, and press and release K3. K2 cancels text entry.


      The named project stores the two-section arrangement.


      ### Prove the saved version


      1. Return to Mosaic, select Song slot 1, then open Channel.

      2. Hold K1, tap channel 1 at (1,1), release K1 to unmute it temporarily.

      3. With playback stopped, open PARAMS → MOSAIC → Load project.

      4. Select Four notes and confirm.


      Slot 1 returns to bass alone; the temporary change is removed.


      ### Replay the restored sections


      1. Select slot 1.

      2. Play four section passes and stop.


      The saved bass-only/full-phrase alternation is restored. Continue with merge, recording or modulation task guides without replacing this saved version.


      Resulting project: Named project Four notes contains both sections and restores their exact playback. Transport stopped with no held notes.'
