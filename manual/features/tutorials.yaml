- id: keep-your-work
  title: Saving and Loading a Project
  audience: beginner
  summary: Save, reload and perform. Start with the two-section arrangement from chapter 9, stopped with slot 1 selected. Save it, make a temporary change, and reload the saved version.
  prose: '[Save, reload and perform](#keep-your-work/course) is the complete continuing lesson.


    Start here: Start with the two-section arrangement from chapter 9, stopped with slot 1 selected. Save it, make a temporary change, and reload the saved version.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: ''
  related:
  - save-and-load
  - song-composition
