    - tests/behaviour/ui.py
    - tests/behaviour/ui_map.py
  controls: []
  details:
  - title: Complete lesson
    text: Open [Spread the rhythm across a bar](#build-a-phrase/course) for the ordered actions, their results and the matching listening example. Start with the four-note loop from chapter 3. Keep its pitch and move the attacks onto the beats.
  - title: Restore Pattern Note Inheritance
    text: 'The first loop leaves CH01 Note C3 (MIDI 60), Vel 80 and Len 1/2 channel masks. These still override matching pattern values. Before editing relative pattern notes, stop playback. Tap Channel (3,8), turn E1 to Channel tasks, select Masks with E2 and press K3. With no step held, select Note with E2 and turn E3 until the field reads X. X is unset, not zero; on steps without a step-specific note mask, the merged pattern note now plays. Keep Vel and Len at 80 and 1/2, or set them to X if pattern values should control them too.

      K1+K2 with no step held clears channel step overrides but preserves defaults; it does not clear Note C3. To clear all masks on one step, hold that step and press K2. See Masks: Unset values and precedence.'
  - title: Recovery
    text: Remove an accidental attack by tapping it again in Pattern Trig.
  - title: Course continuity
    text: Continue at [Spread the rhythm across a bar](#build-a-phrase/course). The independent examples have separate starting states; use another project after saving your course piece.
  - title: Independent controls example
    text: 'Before starting: Use channel 1 with pattern 1 assigned, active attacks at steps 1–4 and range 1–4. Set channel Masks Note to MIDI 60, Vel to 80 and Len to 1/2; clear existing step exceptions. Stop playback. [Creating a First Loop](#first-sound) gives the complete preparation route.


      ### Extend the range


      1. Tap Channel (3,8).

      2. Hold (1,4), tap (16,4), release.

      3. Turn E1 to Channel tasks; select Clock with E2 and press K3.

      4. Select Rate with E2; set /1 with E3 (sixteenth notes, the default).

      5. Press K3 to apply while stopped.


      The channel traverses16 steps before repeating.


      ### Move the attacks


      1. Open Pattern Trig, pattern 1.

      2. Remove steps 2,3,4.

      3. Add steps 5,9,13; keep step 1.


      Four attacks now sit on the four beats. The old attacks have been removed explicitly.


      ### Hear the longer phrase


      1. Play two bars.

      2. Stop.


      C–C–C–C remains the pitch sequence; the space between attacks has increased.


      Resulting project: P1 attacks 1/5/9/13; CH01 range 1–16; sixteenth-note rate; Note 60/Vel 80/Len1/2 unchanged.


      The examples below extend this phrase. Set channel and step note masks shows how a step''s own note beats the channel default. Save D major, then apply it shows how a scale slot can be edited and saved without changing what plays until you apply it. The last three examples walk through the whole workflow in order: Add a second pattern in D major merges two patterns on channel 1, Add a second channel with its own output gives channel 2 its own MIDI port, and Chain song slots an octave apart plays two song slots.'
