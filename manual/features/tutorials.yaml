- id: build-a-phrase
  title: Creating a Phrase and Arrangement
  audience: beginner
  summary: Spread the rhythm across a bar. Start with the four-note loop from chapter 3. Keep its pitch and move the attacks onto the beats.
  prose: '[Spread the rhythm across a bar](#build-a-phrase/course) is the complete continuing lesson.


    Start here: Start with the four-note loop from chapter 3. Keep its pitch and move the attacks onto the beats.


    If you are joining with your own project, match that starting state first. Keep the course project open while following the course; the independent examples below use their own stated setup.'
  musical_use: ''
  related:
  - rhythm-section-design
  - harmony-design
  - melody-composition
  - modulation-movement-and-interest
  - song-composition
  - small-hours
  sources:
