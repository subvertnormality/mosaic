features:
- id: scale-editor
  title: Scale Editor
  audience: all
  summary: Choose the scale the song plays in. Edit any of the 16 scale slots (Root, Scale, Degree, Transpose, Rotation) without changing playback until you apply it.
  prose: 'The Scale Editor sets the harmony of the whole song and holds 16 scale slots. Changing the scale changes the pitches that pattern degrees produce; it does not change rhythm or pattern degrees.


    Apply a scale:


    1. Press Grid (4, 8) to open the Scale Editor. The scale slots are the 16 buttons on Grid row 3. The applied slot is brightly lit.

    2. Short-press a slot. It is applied to every channel and selected for editing.

    3. To turn global scale off, short-press the applied slot again. The slot stays selected for editing. With global scale off and no scale lock, pattern degrees play as chromatic semitone offsets. Press the slot again to apply it.


    A pattern uses the applied scale unless a global scale lock or a channel scale lock overrides it.


    Edit a slot:


    1. Turn E2 to select Root, Scale, Degree, Transpose or Rotation. Scale tasks are Scale, Scale clock and Overview.

    2. Turn E3 to change the value of the selected row. The title row names the slot you are editing.

    3. Release all grid keys, then press K3 to apply the changes or K2 to cancel. Tapping any grid key, including Play/Stop, cancels an unapplied edit, so press K3 first.


    Edit a slot without playing it:


    1. Hold K1 and press the slot, or long-press a slot that is not selected for editing.

    2. Edit the slot as above and press K3. Playback does not change. A dim indicator marks the editing slot when it differs from the applied slot.

    3. Long-press the slot already selected for editing to turn global scale off and clear the editing selection.


    Applying changes to the slot that is playing changes the sound immediately.


    Set a scale lock: hold a step and press a scale slot. On the Scale page the lock is global for channels without a channel scale lock; on a channel page it applies to that channel. See [Scale Locks](#scale-locks).


    The global scale track has its own rate and length, so a chord progression can run over a different number of steps from the patterns. On the Scale clock task, E2 selects Rate and E3 changes it; K3 applies. The same screen shows the selected range, the global cap and the playable range as read-only values. To change the length, hold the first step of the range on the scale track and press its last step. The end must come after the start: a reversed selection is rejected with the tooltip End must follow start and the previous range stays, and ranges do not wrap from the last step back to the first.


    Video: [Scale editor demo](https://youtu.be/J1ckUZvhFJ0?t=2741)'
  musical_use: Change the harmony of a melody without changing its rhythm or pattern degrees. Prepare a different scale in an unused slot, then apply it when you want to hear it.
  related:
  - scale-locks
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-editor
    behaviour_cases:
    - M-SCALE-001
    - M-SCALE-002
    - M-SCALE-003
    - M-SCALE-004
    - M-SCALE-DISPLAY-001
    code:
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/ui_adapters/scale.lua
    - lib/models/program.lua
    - lib/quantiser.lua
    - lib/step.lua
  controls:
  - gesture: Press Grid (4, 8).
    result: The Scale Editor opens. Scale slots are the 16 buttons on Grid row 3.
  - gesture: Short-press a scale slot on row 3.
    result: Apply it globally and select it for editing. Press the applied slot again to turn global scale off while it stays selected for editing.
  - gesture: Hold K1 and press a scale slot, or long-press a different editing slot.
    result: Select the slot for editing without changing which scale playback uses.
  - gesture: Long-press the slot already selected for editing.
    result: Turn global scale off and clear the editing selection.
  - gesture: On the Scale screen, turn E2 to select Root, Scale, Degree, Transpose or Rotation. Turn E3 to change its value.
    result: The value changes in the draft for the slot named in the title row. Nothing sounds different yet.
  - gesture: Release all grid keys, then press K3 or K2.
    result: K3 applies the draft. K2 cancels it. Applying changes to a scale used by playback changes its harmony immediately.
  - gesture: On the Scale clock task, turn E2 to Rate and E3 to the rate, then press K3.
    result: Set the rate of the global scale track. Selected range, Global cap and Playable range are shown for reference and cannot be edited there.
  - gesture: On the Scale page, hold the first step of a range on the scale track and press its last step.
    result: Set the length of the scale track independently of the channels. The tooltip reads Channel 17 length changed.
  - gesture: Hold a sequencer step, then press a scale slot.
    result: 'Set or toggle a scale lock at that step: global on the Scale page, channel-specific on a channel page.'
  details:
  - title: Editing selection and applied scale
    text: The title row names the slot selected for editing. The editing indicator is dim when that slot differs from the applied scale. With global scale off and no scale lock, pattern degrees play as chromatic semitone offsets. An active channel scale lock takes precedence over the global scale.
  - title: Vertical list controls
    text: Scale settings appear as vertical rows. Turn E2 to select a row and bring later fields into view. E3 edits the selected slot's draft; K3 applies it and K2 cancels it. Selecting another row does not apply a draft. Tapping a grid key, including Play/Stop, cancels an unapplied draft, so press K3 before using the grid to keep your edit. A long scale name uses a separate full-width value row.
  - title: Scale lock lifetime
    text: A global scale lock lasts until another global lock or until the global scale track wraps. A channel scale lock follows PARAMS > MOSAIC > Scales lock until ptn end, which is On by default. See Scale Locks.
  - title: Scale clock and Overview
    text: 'Scale clock sets the rate of the global scale track. Overview is a read-only dashboard: it lists the playing scale, the scale being edited, the step range, the transposition and any step lock. Both are Scale tasks beside Scale.'
  recipes:
  - title: Prepare and apply a second scale
    text: 'Starting point: use a channel with a four-step melody on pattern degrees 1 to 4 and scale slot 1 applied as C major. It sounds MIDI 60, 62, 64 and 65 (C, D, E, F). If you need to build that pattern, follow [Build a phrase](#build-a-phrase). The captured examples below start from the same setup: Save D major, then apply it follows steps 1 to 5, and Prepare a scale before applying it adds browsing a slot with a long press, editing the applied slot and turning the global scale Off.


      1. Press Grid (4, 8) to open the Scale Editor. Slot 1, the left button on row 3, is bright.


      2. Hold K1, press slot 2 at (2, 3), then release both. The title row names slot 2 and a dim indicator marks it. Playback is still in C major.


      3. Prepare slot 2: turn E2 to Root and turn E3 two clicks to D. Release all grid keys and press K3 to save the draft. Checkpoint: tap Play (1,8), listen, then tap Stop. The melody still plays C, D, E, F because slot 1 remains applied.


      4. Apply the draft: short-press slot 2 at (2, 3). It becomes the bright applied slot. Tap Play (1,8), listen, then tap Stop: the melody plays D, E, F sharp, G (MIDI 62, 64, 66, 67). The rhythm has not changed.


      5. Restore the comparison: short-press slot 1 at (1, 3), tap Play and listen. C, D, E, F are restored.'
