features:
- id: scale-editor
  title: Scale Editor
  audience: all
  summary: Choose the scale the song plays in. Edit any of the 16 scale slots (Root, Scale, Degree, Transpose,
    Rotation) without changing playback until you apply it.
  prose: 'The Scale Editor sets the harmony of the whole song and holds 16 scale slots. Changing the scale
    changes the pitches that pattern degrees produce; it does not change rhythm or pattern degrees.


    Apply a scale:


    1. Press Grid (4, 8) to open the Scale Editor. The scale slots are the 16 buttons on Grid row 3. The
    applied slot is brightly lit.

    2. Short-press a slot. It is applied to every channel and selected for editing.

    3. To turn global scale off, short-press the applied slot again. The slot stays selected for editing.
    With global scale off and no scale lock, pattern degrees play as chromatic semitone offsets. Press
    the slot again to apply it.


    A pattern uses the applied scale unless a global scale lock or a channel scale lock overrides it.


    Edit a slot:


    1. Turn E2 to select Root, Scale, Degree, Transpose or Rotation. Scale tasks are Scale, Scale clock
    and Overview.

    2. Turn E3 to change the value of the selected row. The title row names the slot you are editing.

    3. Release all grid keys, then press K3 to apply the changes or K2 to cancel. Tapping any grid key,
    including Play/Stop, cancels an unapplied edit, so press K3 first.


    Edit a slot without playing it:


    1. Hold K1 and press the slot, or long-press a slot that is not selected for editing.

    2. Edit the slot as above and press K3. Playback does not change. A dim indicator marks the editing
    slot when it differs from the applied slot.

    3. Long-press the slot already selected for editing to turn global scale off and clear the editing
    selection.


    Applying changes to the slot that is playing changes the sound immediately.


    Set a scale lock: hold a step and press a scale slot. On the Scale page the lock is global for channels
    without a channel scale lock; on a channel page it applies to that channel. See [Scale Locks](#scale-locks).


    The global scale track has its own rate and length, so a chord progression can run over a different
    number of steps from the patterns. On the Scale clock task, E2 selects Rate and E3 changes it; K3
    applies. The same screen shows the selected range, the global cap and the playable range as read-only
    values. To change the length, hold the first step of the range on the scale track and press its last
    step. The end must come after the start: a reversed selection is rejected with the tooltip End must
    follow start and the previous range stays, and ranges do not wrap from the last step back to the first.


    Video: [Scale editor demo](https://youtu.be/J1ckUZvhFJ0?t=2741)'
  musical_use: Change the harmony of a melody without changing its rhythm or pattern degrees. Prepare
    a different scale in an unused slot, then apply it when you want to hear it.
  related:
  - scale-locks
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-editor
    behaviour_cases:
    - M-SCALE-001
    - M-SCALE-002
    - M-SCALE-003
    - M-SCALE-004
    - M-SCALE-DISPLAY-001
    code:
