- id: transposition
  title: Transposition
  audience: all
  summary: Transpose the whole selected Song Sequence by -12 to +12 semitones with one fader. Locks change
    it from chosen steps.
  prose: 'Use the transposition fader on the Scale page to transpose every channel of the selected Song
    Sequence without editing any note. Rhythm and intervals stay the same.


    Set global transposition:


    1. Press Grid (4, 8) to open the Scale Editor.

    2. Press a button on the transposition fader, Grid row 8, columns 8–16. The tooltip shows Transpose
    and the new value.


    The fader buttons set these values: (9,8) is -12, (10,8) -8, (11,8) -4, (12,8) 0, (13,8) +4, (14,8)
    +8 and (15,8) +12. The end buttons, (8,8) and (16,8), lower or raise the value by one semitone each
    press.


    The global value is added to the active scale slot''s Transpose value. With scale slot 1 as C major
    and the melody 60, 62, 64, 65, +2 plays 62, 64, 66, 67.


    You can change transposition while playing. A note that is already sounding keeps its pitch and length.
    The next notes use the new value.


    To change transposition from a certain step onwards, use [transposition locks](#transposition-locks).


    Video: [Global transposition demo](https://youtu.be/J1ckUZvhFJ0?t=2905)'
  musical_use: Move a section up or down while keeping its rhythm and intervals, for example repeat a
    verse a tone higher in a copied Song slot.
  related:
  - transposition-locks
  - scale-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#transposition
    behaviour_cases:
    - M-TRANS-006
    - M-TRANS-007
    - M-TRANS-008
    - M-TRANS-009
    code:
    - lib/pages/scale_edit_page/scale_edit_page.lua
    - lib/controls/fader.lua
    - lib/models/program.lua
    - lib/step.lua
  controls:
  - gesture: On the Scale page, press a button on the transposition fader, Grid row 8, columns 8–16.
    result: Set the selected Song Sequence's global transposition within -12 to +12 semitones.
  - gesture: Press the left end button (8,8) or the right end button (16,8).
    result: Lower or raise by one semitone. The centre button (12,8) returns to zero.
  - gesture: Hold a scale-track step and press a fader button.
    result: Set a transposition lock for that step. Repeating the same value removes the lock.
  details:
  - title: Transposition precedence
    text: The current global value, or the persistent step-lock value, is added to the active scale slot's
      Transpose value. For its lifetime, a step lock replaces the global fader value.
  - title: Each Song slot has its own transposition
    text: Transposition belongs to the selected Song Sequence. Copying a Song slot copies its transposition,
      and changing the copy leaves the original as it was.
  - title: Edits during playback
    text: A change made while notes sound does not cut the sounding note or change its length. The next
      onset uses the new value. In the captured example, +1 and then -12 raise the following notes by
      one semitone and then drop them an octave from the written pitch.
  recipes:
  - title: Play a copied Song slot a tone higher
    text: 'This recipe changes the transposition fader on a copy of a slot, so the copy plays a tone higher
      while the original stays put. It is a different workflow from the captured example below, which
      shows the fader being pressed while a note is sounding.


      Start with Song slot 1 holding a finished sequence, such as a four-note melody on MIDI 60, 62, 64,
      65, with playback stopped and Song mode at its default (On).


      1. Press Grid (6, 8) to open the Song Editor. Slot 1 at (1, 1) is lit: it is the slot you are working
      on.


      2. Hold slot 1 at (1, 1) and press slot 2 at (2, 1), then release both. Slot 2 now holds a copy
      of slot 1 (copying overwrites whatever slot 2 held).


      3. Press slot 2 at (2, 1) to select it while stopped.


      4. Press Grid (4, 8) to open the Scale Editor.


      5. Press the right end of the transposition fader, (16, 8), twice. Each press adds one semitone
      and the tooltip shows Transpose: 2.


      6. Press Play. Slot 2 plays 62, 64, 66, 67. With Song mode On, playback moves on to the next slot
      after the repeats set in Slot setup; to hold on one slot, open PARAMS > MOSAIC and turn Song mode
      Off (E3). Press Stop.


      7. Press Grid (6, 8), then slot 1 at (1, 1), and press Play to hear the original at 60, 62, 64,
      65, because slot 1 kept its transposition of 0.


      Check that the raised notes are still inside the usable range of the sound you are playing.'
