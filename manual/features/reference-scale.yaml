    - lib/pages/scale_edit_page/scale_edit_page_ui.lua
    - lib/ui_adapters/scale.lua
    - lib/models/program.lua
    - lib/quantiser.lua
    - lib/step.lua
  controls:
  - gesture: Press Grid (4, 8).
    result: The Scale Editor opens. Scale slots are the 16 buttons on Grid row 3.
  - gesture: Short-press a scale slot on row 3.
    result: Apply it globally and select it for editing. Press the applied slot again to turn global scale
      off while it stays selected for editing.
  - gesture: Hold K1 and press a scale slot, or long-press a different editing slot.
    result: Select the slot for editing without changing which scale playback uses.
  - gesture: Long-press the slot already selected for editing.
    result: Turn global scale off and clear the editing selection.
  - gesture: On the Scale screen, turn E2 to select Root, Scale, Degree, Transpose or Rotation. Turn E3
      to change its value.
    result: The value changes in the draft for the slot named in the title row. Nothing sounds different
      yet.
  - gesture: Release all grid keys, then press K3 or K2.
    result: K3 applies the draft. K2 cancels it. Applying changes to a scale used by playback changes
      its harmony immediately.
  - gesture: On the Scale clock task, turn E2 to Rate and E3 to the rate, then press K3.
    result: Set the rate of the global scale track. Selected range, Global cap and Playable range are
      shown for reference and cannot be edited there.
  - gesture: On the Scale page, hold the first step of a range on the scale track and press its last step.
    result: Set the length of the scale track independently of the channels. The tooltip reads Channel
      17 length changed.
  - gesture: Hold a sequencer step, then press a scale slot.
    result: 'Set or toggle a scale lock at that step: global on the Scale page, channel-specific on a
      channel page.'
  details:
  - title: Editing selection and applied scale
    text: The title row names the slot selected for editing. The editing indicator is dim when that slot
      differs from the applied scale. With global scale off and no scale lock, pattern degrees play as
      chromatic semitone offsets. An active channel scale lock takes precedence over the global scale.
  - title: Vertical list controls
    text: Scale settings appear as vertical rows. Turn E2 to select a row and bring later fields into
      view. E3 edits the selected slot's draft; K3 applies it and K2 cancels it. Selecting another row
      does not apply a draft. Tapping a grid key, including Play/Stop, cancels an unapplied draft, so
      press K3 before using the grid to keep your edit. A long scale name uses a separate full-width value
      row.
  - title: Scale lock lifetime
    text: A global scale lock lasts until another global lock or until the global scale track wraps. A
      channel scale lock follows PARAMS > MOSAIC > Scales lock until ptn end, which is On by default.
      See Scale Locks.
  - title: Scale clock and Overview
    text: 'Scale clock sets the rate of the global scale track. Overview is a read-only dashboard: it
      lists the playing scale, the scale being edited, the step range, the transposition and any step
      lock. Both are Scale tasks beside Scale.'
  recipes:
  - title: Prepare and apply a second scale
    text: 'Start with a channel that plays a four-step melody on pattern degrees 1 to 4 (see [Build a
      phrase](#build-a-phrase)) and scale slot 1 applied as C major. The melody sounds MIDI 60, 62, 64
      and 65 (C, D, E, F). The captured examples below start from the same setup: Save D major, then apply
      it follows steps 1 to 5, and Prepare a scale before applying it adds browsing a slot with a long
      press, editing the applied slot and turning the global scale Off.


      1. Press Grid (4, 8) to open the Scale Editor. Slot 1, the left button on row 3, is bright.


      2. Hold K1, press slot 2 at (2, 3), then release both. The title row names slot 2 and a dim indicator
      marks it. Playback is still in C major.


      3. Turn E2 to Root and turn E3 two clicks to D. Release all grid keys and press K3. The draft is
      saved to slot 2. Tap Play (1,8), listen, then tap Stop: the melody still plays C, D, E, F because
      slot 1 is still applied.


      4. Short-press slot 2 at (2, 3). It becomes the bright applied slot. Tap Play (1,8), listen, then
      tap Stop: the melody plays D, E, F sharp, G (MIDI 62, 64, 66, 67). The rhythm has not changed.


      5. Short-press slot 1 at (1, 3), tap Play and listen: C, D, E, F are restored.'
