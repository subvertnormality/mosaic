- id: loops-that-meet
  title: Combining Four-Step and Three-Step Loops
  audience: intermediate
  summary: Use independent channel lengths to create a 12-step repeating relationship.
  prose: 'Run two channels at the same clock rate with different lengths: channel 1 loops a four-step
    phrase and channel 2 loops a three-step phrase. Both channels start together on step 1, drift apart,
    and meet again after 12 steps, the smallest number that both 4 and 3 divide into. At the default Rate
    /1 and 90 BPM, 12 steps last two seconds. Playback is continuous: each channel simply starts its own
    loop again when it reaches the end of its range.


    1. On channel 1, assign a pattern with active steps 1–4. Using the default C-major scale, set relative
    pattern notes 0, 1, 2 and 3, which produce MIDI 60, 62, 64 and 65. Set the velocities to 127, 117,
    107 and 97 and each note length to one step. Set the range to steps 1–4 (hold step 1, tap step 4,
    release step 1).


    2. On channel 2, assign the same pattern and set the range to steps 1–3.


    3. Open channel 2 Masks. With no step held, set the channel defaults to Note MIDI 79, Vel 40 and Len
    ½.


    4. Hold step 2 and set Note MIDI 81, Vel 60 and Len 1¼. Release the step. Channel 2 now repeats MIDI
    79, 81, 79, independent of the four notes on channel 1.


    5. Start playback. Both channels begin together. Compare their first steps again after 12 steps (about
    two seconds).


    6. Stop playback before changing the arrangement.


    Use separate MIDI routes for the two instruments. For internal sound, assign different supported players,
    for example Polyperc 1 for channel 1 and Doubledecker for channel 2. Song transitions and reset options
    can restart channels earlier than 12 steps; the second recipe shows how.'
  musical_use: Give two channels different lengths so a short and a long phrase drift apart and realign.
    Use it for evolving rhythmic patterns from simple loops, and use song reset options when each section
    should restart together.
  related:
  - channel-length
  - clocks-swing-and-shuffle
  - reset-at-song-editor-pattern-change
  - reset-at-pattern-repeat
  - song-composition
  sources:
    readme: manual/legacy/README-1.4.0.md#typical-workflow
    behaviour_cases:
    - M-WORKFLOW-001
    - M-RANGE-REJECT-005
    - M-RANGE-REJECT-006
    code:
    - tests/behaviour/composition_workflow.py
    - lib/devices/device_descriptors.lua
    - tests/behaviour/range_rejection.py
  controls: []
  details:
  - title: Example Scope
    text: These recipes specify suggested musical settings. Attached audio demonstrates only its authored
      version. Suggested variations are not covered by that recording.
  recipes:
  - title: Comparing the Loop Alignment
    text: 'Starting point: the six steps above are done and playback is stopped. Both channels run at
      the same rate. At 90 BPM and Rate /1 one step is a sixth of a second, so you can count 12 steps
      in two seconds.


      1. Press Play and count steps. Channel 1 plays MIDI 60, 62, 64, 65 and then repeats, so it completes
      three phrases in 12 steps. Channel 2 plays MIDI 79, 81, 79 and repeats, so it completes four phrases
      in the same 12 steps.


      2. Listen at step 1: MIDI 60 and MIDI 79 sound together. They do not coincide again on steps 2 to
      12: for example, on step 4 channel 1 plays MIDI 65 while channel 2 starts a new phrase with MIDI
      79.


      3. Listen at step 13, two seconds after step 1: MIDI 60 and MIDI 79 sound together again, and the
      pattern repeats every 12 steps. Press Stop when you have heard the alignment.


      4. Optional extra check, unrelated to the alignment: with both channels playing, try a reversed
      range on channel 1. Hold step 4 as the start, press step 2 as the end and release both. The reversed
      range is rejected with a message, the ranges stay 1–4 and 1–3, and neither phrase changes timing.'
  - title: Comparing Song Boundary Resets
    text: 'Starting point: the two looping channels above (channel 1 range 1–4, channel 2 range 1–3),
      with Song slot 1 holding them and playback stopped. Song mode is On by default, so the slots play
      in turn, and Reset on song seq change (PARAMS > MOSAIC) is On by default while Reset on pattern
      repeat is Off. This comparison hears how the first option changes both channels at a slot boundary.


      1. Copy the slot. Open the Song Editor, hold slot 1 at (1,1), tap slot 2 at (2,1) and release slot
      1. Slot 2 is now a copy of slot 1, so slots 1 and 2 play one after the other.


      2. Set the slot length. Use the global length fader at the lower left of the Song Editor (see Adjusting
      Song Sequence Length) to set 10 steps. The length belongs to the whole song, so both slots get it.
      10 is not a multiple of 4 or of 3, so each channel is part-way through its loop when a slot ends.


      3. Open PARAMS > MOSAIC and check that Reset on song seq change reads On. Play both slots. At the
      start of slot 2 both channels restart from step 1: channel 1 plays MIDI 60 and channel 2 plays MIDI
      79. The 4-against-3 pattern starts again from the beginning in every slot. Press Stop.


      4. Set Reset on song seq change to Off and play both slots again. Now neither channel restarts:
      at the start of slot 2 channel 1 continues with MIDI 64, the third note of its phrase (10 steps
      is two phrases and two steps), and channel 2 continues with MIDI 81, the second note of its phrase
      (10 steps is three phrases and one step). The two channels no longer meet at the slot boundary.
      Press Stop.


      5. Set Reset on song seq change back to On to restore the default.


      Use Off when you want the 12-step relationship to carry across slots without a restart; use On when
      each slot should begin with both loops on their first step.'
  - title: Run two channels at different lengths
    text: 'Starting point: two channels with audible notes. Give each channel a voice (for example Oilcan
      1 on channel 1 and Polyperc 1 on channel 2, or any two MIDI outputs) and set Note, Vel and Len on
      each channel''s Masks page as in Make your first loop (a channel needs at least one audible note
      to be heard).


      Enter the two patterns. Tap Pattern (5,8) for the Trig view. In pattern 1 tap steps (1,4), (5,4),
      (9,4) and (13,4): a drum pattern with trigs on steps 1, 5, 9 and 13. In pattern 2 tap steps (1,4),
      (3,4) and (4,4): a short figure with trigs on steps 1, 3 and 4.


      1. Channel 1: tap (1,1) and assign pattern 1 at (1,2). Hold step 1 (grid (1,4)), tap step 16 ((16,4)),
      then release step 1. Steps 1-16 on row 4 are now brighter.


      2. Channel 2: tap (2,1) and assign pattern 2 at (2,2). Hold step 1, tap step 5 ((5,4)), then release
      step 1. On this channel only steps 1-5 are brighter.


      3. Tap Play at (1,8). The drum channel repeats every 16 steps (four hits per bar) and the figure
      repeats every 5 steps, so its three notes slide across the drum hits. Listen for the figure landing
      on a different drum beat each bar.


      4. Keep listening until the start of drum bar 6. After 80 steps (five drum bars, sixteen figure
      passes) both channels start together again. 80 is the first step count that both 16 and 5 divide.
      Tap Play again to stop.


      If the song moves to another song pattern, channels are reset together while Reset at Song Sequence
      Change (on by default) is enabled, so the 80-step cycle only completes while the same song pattern
      keeps playing. Use the Options page to change how channels of different length behave. The captured
      example [Play sixteen steps against five](#loops-that-meet/loops-sixteen-against-five) builds this
      setup and plays the 80 steps until both channels start together again. The captured example "Keep
      a valid range when a gesture is reversed" shows the range gesture and what happens when the end
      comes before the start.'
