- id: pocket-rhythm
  title: Adding a Ghost Note
  audience: intermediate
  summary: Compare two bars of main hits with two bars that add a quiet hit before an accent.
  prose: 'Compare two ways of playing the same four-beat drum figure on Oilcan 1. Bars 1 and 2 contain only the main hits (MIDI 36 on steps 1 and 9, MIDI 37 on steps 5 and 13, all at velocity 90). Bars 3 and 4 add one quiet hit, MIDI 38 at velocity 35, on step 12 of the bar, just before the accent on step 13. This is a ghost note: a soft hit that adds movement without changing the main hits.


    Settings: 90 BPM, Rate /1 (the default, one step is a sixteenth note), range 1–64 and length ½ step on all notes. Play "Adding a Ghost Note" under Listen to hear the target, then build it with the first recipe.


    Two further recipes follow: an optional probability variation of the ghost notes, and a separate, denser drum pattern at velocity 48 (the "Three sounds, one pocket" recording) that does not use ghost notes.'
  musical_use: Add one quiet hit just before an accent and compare the bar with and without it. Use a ghost note to add movement to a drum pattern without changing the main hits.
  related:
  - adding-trigs
  - adding-velocity
  - trig-probability
  - clocks-swing-and-shuffle
  sources:
    readme: manual/legacy/README-1.4.0.md#typical-workflow
    behaviour_cases:
    - M-WORKFLOW-001
    - M-EDIT-002
    - M-PARAM-018
    code:
    - tests/behaviour/composition_workflow.py
    - lib/devices/device_descriptors.lua
  controls: []
  details:
  - title: Complete example
    text: Start at [Adding a Ghost Note](#pocket-rhythm). Follow its Before you start instructions and recipes in order. This is an independent project; save your course piece before trying it.
  - title: Comparison settings
    text: The ghost-note comparison uses Oilcan 1. Every bar has four main attacks at velocity 90. Bars 3 and 4 each add one velocity-35 hit. The "Three sounds, one pocket" recording is an independent pattern at a constant velocity of 48. MIDI note mappings can differ on another instrument.
  recipes:
  - title: Make the recorded ghost-note comparison
    text: 'Starting point: an empty project with playback stopped and channel 1 selected. The numbers 1–64 are step numbers across four bars: bar 1 is steps 1–16, bar 2 is 17–32, bar 3 is 33–48 and bar 4 is 49–64. The grid shows sixteen steps at a time, so move to the sixteen-step page of the bar you are editing.



      Setup (steps 1 to 3 prepare the instrument; do them once).


      1. Assign Oilcan 1 to channel 1 and set its range to steps 1–64 (see Channel Length). Leave Rate at /1.


      2. Set 90 BPM: open Song tasks, choose Tempo & feel, turn E3 to 90 and press K3.


      3. Open PARAMS > MOSAIC and set Snap note masks to scale to Off, then return to Mosaic. MIDI 37 (C#1) is not in C major and would otherwise be snapped to a scale note.



      Main hits (steps 4 to 7 build and audition the bar without ghost notes).


      4. Add the main hits. Open Pattern Trig on pattern 1 and tap steps 1, 5, 9 and 13 in each bar: bar 1 uses 1, 5, 9, 13; bar 2 uses 17, 21, 25, 29; bar 3 uses 33, 37, 41, 45; bar 4 uses 49, 53, 57, 61. Sixteen trigs are lit.


      5. Open Masks (grid (3,8), E1 to tasks, E2 to Masks, K3). With no step held, select Note and set MIDI 36 (C1), select Vel and set 90, select Len and set ½. All sixteen hits now play MIDI 36 at velocity 90.


      6. Select Note. Hold step 5 and turn E3 to MIDI 37 (C#1), then release. Do the same for steps 13, 21, 29, 37, 45, 53 and 61, so that the second and fourth beat of each bar play MIDI 37.


      7. Press Play and listen to four bars of main hits only, then press Stop. You hear two timbres alternating on beats 1 to 4 of every bar.



      Ghost notes (steps 8 to 10 add the quiet hit to bars 3 and 4).


      8. Return to Pattern Trig and tap step 44 (step 12 of bar 3) and step 60 (step 12 of bar 4).


      9. Open Masks and hold step 44. Select Note and turn E3 to MIDI 38 (D1), then select Vel and set 35, then release step 44. Repeat both edits on step 60: first Note 38, then Vel 35.


      10. Press Play. Bars 1 and 2 are unchanged. In bars 3 and 4 you hear a quiet third timbre one step before each MIDI 37 accent. Press Stop.



      Undo (step 11 returns to the main-only phrase).


      11. Open Masks, hold step 44 or 60 and press K2 to remove the values you set, then remove its trig on Pattern Trig.'
  - title: Optional probability variation
    text: "Starting point: Finish the ghost-note comparison above with ghost trigs on steps 44 and 60. This is an optional, player-run probability exercise, not a reconstruction of the recording. At probability 50, each ghost onset may play or be skipped on each pass, so evaluate the range of outcomes over several loops instead of expecting a fixed recording.\n\n**Set a dependable main beat.** Select channel 1 and open Channel tasks → Trig params. Turn E2 to a slot, press K2, turn E3 to Trig Probability, press K3. With no step held, set the channel default to 100. Check: every main hit remains eligible on every pass.\n\n**Check both boundaries.** Move to the sixteen-step page for steps 33–48, hold step 44, set its probability to 0, and release. Move to steps 49–64 and set step 60 to 0 the same way. Play: neither ghost note sounds in bars 3 or 4; the main hits continue. Stop. Set both ghost steps to 100 and play again: both ghost notes play on every pass, matching the fixed comparison. Stop.\n\n**Try the optional variation.** Set steps 44 and 60 to 50 and play several loops. The musical result to listen for is a quiet pickup that appears on some passes and leaves space on others, while the main hits stay present. Which ghost hit appears can differ each loop; no particular pass or captured result is promised.\n\nRestore the fixed comparison by setting both steps to 100, or remove a lock by holding its step and pressing K2. For a captured 0/100 probability example, see Trig Probability, “Turn chance into explicit rests.”"
  - title: Separate fixed percussion example
    text: 'This is the "Three sounds, one pocket" recording. It is a different, denser four-bar drum pattern and does not use ghost notes. It teaches one idea: a third sound (MIDI 38) fills the gaps between the two accents. Every hit is at velocity 48, a constant quiet level chosen so you hear rhythm and timbre only, with no accent or quiet ghost hit. Starting point: the ghost-note comparison recipe''s steps 1 to 3 (Oilcan 1 on channel 1, range 1–64, 90 BPM, Snap note masks to scale Off) and an empty channel.


      The bar template, as step/MIDI note: 1/36, 4/38, 5/37, 7/38, 9/36, 12/38, 13/37 and 15/38.


      Step:  1   4   5   7   9   12  13  15


      Note:  36  38  37  38  36  38  37  38


      1. Open Masks. With no step held, set Note to MIDI 36, Vel to 48 and Len to ½.


      2. Enter the trigs. In bar 1, hold K1 and tap steps 1, 4, 5, 7, 9, 12, 13 and 15 to add eight trigs.


      3. Edit the notes. Select Note and give steps 4, 7, 12 and 15 MIDI 38, and steps 5 and 13 MIDI 37, holding each step and turning E3. Steps 1 and 9 keep MIDI 36.


      4. Repeat steps 2 and 3 in bars 2 to 4, adding 16 to each step number.


      Play four bars. Listen for MIDI 36 on beats 1 and 3, MIDI 37 on beats 2 and 4, and the MIDI 38 hits filling the gaps between them. Unlike the ghost-note comparison, every hit has the same velocity, so nothing sounds accented or quiet. Listen to "Three sounds, one pocket" under Listen to compare.'
