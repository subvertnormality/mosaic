- id: tilting-harmony
  title: Changing Harmony with Scale Slots
  audience: intermediate
  summary: Compare the same relative patterns under C major for two bars and D major for two bars.
  prose: 'Hear one pair of relative-note patterns in two keys. Doubledecker on channel 1 plays an upper phrase and Polyperc 1 on channel 2 plays a bass. For bars 1 and 2 the global scale is C major (scale slot 1); for bars 3 and 4 it is D major (scale slot 2). The patterns hold scale degrees, not fixed pitches, and the Note masks stay X (unset), so changing the applied scale moves every pitch while rhythm, velocity and length stay the same. Play "Changing Harmony with Scale Slots" under Listen to hear the target.


    Settings: 90 BPM, Rate /1 (the default, one step is a sixteenth note) and a 16-step range that loops once per bar. The bass velocity is 60 and its notes last ½ step in this comparison. The "A bass with room above it" recording is a different example, in fixed notes in C major.'
  musical_use: Change the applied scale slot to move a whole phrase and bass to a new key while keeping its rhythm. Use it to make a simple pattern sound like a chord progression.
  related:
  - scale-editor
  - scale-locks
  - adding-notes
  - adding-chords
  - chord-strum
  sources:
    readme: manual/legacy/README-1.4.0.md#scale-editor
    behaviour_cases:
    - M-WORKFLOW-001
    - M-SCALE-001
    - M-MASK-010
    - M-PARAM-001
    - M-HARMONY-REVOICE-001
    code:
    - tests/behaviour/composition_workflow.py
    - lib/devices/device_descriptors.lua
  controls: []
  details:
  - title: Complete example
    text: Start at [Changing Harmony with Scale Slots](#tilting-harmony). Follow its Before you start instructions and recipes in order. This is an independent project; save your course piece before trying it.
  - title: Continue your course piece
    text: For the phrase and bass you already made, open [Change harmony without changing the rhythm](#harmony-design/course). The independent comparison below uses Doubledecker for the upper phrase and Polyperc 1 for the bass, with two bars per key. Its voice assignments and section lengths differ from the course.
  - title: Pitch and output scope
    text: This comparison uses relative pattern notes (scale degrees) with the Note masks left at X. A Note mask would replace the pattern note and fix the pitch, so no scale change could move it. Polyperc 1 is assigned once, to the bass. Numeric MIDI notes are used for expected results because the controls label octaves differently.
  recipes:
  - title: Make the relative-note scale comparison
    text: 'Starting point: an empty project with playback stopped. Part 1 builds the upper phrase on channel 1, part 2 builds the bass on channel 2, part 3 prepares the second key and part 4 performs the change. In the note page, the column is the step and the row is the degree: y=7 is degree 0 (I), y=6 is degree 1 (II) and y=3 is degree 4 (V).


      Part 1: upper phrase


      1. Set 90 BPM (Song tasks, Tempo & feel, E3, K3). Leave Rate at /1.


      2. Open the Scale editor (4,8). Slot 1 at (1,3) is the applied slot. Check Root C and Scale Major on the Scale screen; if you change either, press K3 to save it.


      3. Assign Doubledecker to channel 1. Open Pattern Trig, select pattern 1 and tap steps 1, 5, 9 and 13.


      4. Open Pattern Note (tap Pattern (5,8) until Note is shown) and set the degrees: tap (1,7), (5,7) and (9,7) for degree 0, and (13,6) for degree 1. Set the channel range to steps 1-16.


      5. Open Masks. Leave Note at X. Set Vel to 80 and Len to ½. Hold step 13 and set Vel to 50, then release. The phrase ends with a softer last note. Checkpoint: press Play and listen. In C major the upper phrase is MIDI 60, 60, 60, 62. Press Stop before building the bass channel.


      Part 2: bass


      6. Assign Polyperc 1 to channel 2 and select pattern 2 for the channel. On pattern 2, tap steps 1 and 9 on Pattern Trig, then on Pattern Note tap (1,7) for degree 0 and (9,3) for degree 4. Set the range to steps 1-16 and the channel octave to -1 with (9,8).


      7. Open Masks with channel 2 selected, leave Note at X, set Vel to 60 and Len ½. Checkpoint: press Play. The bass adds MIDI 48 on beat 1 and MIDI 55 on beat 3 under the upper phrase. Press Stop before preparing slot 2.


      Part 3: prepare the second key


      8. While stopped, open the Scale editor. Hold K1 and press slot 2 at (2,3) to select it for editing without applying it. On the Scale screen set Root to D and Scale to Major with E2 and E3, and press K3 to save the slot. Slot 1 stays applied, so playback is still C major.


      Part 4: perform the change (choose one)


      9a. Stopped: play two bars in C major and stop. Short-press slot 2 at (2,3) to apply D major and play two more bars.


      9b. Live: while playing, short-press slot 2 at (2,3) at the end of bar 2.


      Result check: in D major the upper phrase becomes MIDI 62, 62, 62, 64 and the bass becomes MIDI 50 and 57: the same rhythm moved up a whole tone. Short-press slot 1 at (1,3) to restore C major.'
  - title: Separate fixed bass-and-chord example
    text: 'Goal and contrast: this example uses fixed Note masks, so its pitches do not move when the scale changes. It is the counterpart of the scale-slot comparison above, where the notes are relative degrees that move with the scale, and it shows how to layer quiet chords above a bass. It is the "A bass with room above it" recording and stays in C major.


      Starting point: an empty project, 90 BPM, Rate /1, Snap note masks to scale at its default, and channels 1 and 2 with their range set to steps 1-16 (hold step 1 and tap step 16 on the channel page).


      1. Assign Polyperc 1 to channel 1. Open Masks and set Note to MIDI 48, Vel to 48 and Len to ½.


      2. Hold K1 and tap steps 1, 5, 9 and 13. Hold step 9 and set Note to MIDI 55.


      3. Assign Doubledecker to channel 2. Open Masks and set Note to MIDI 60, Vel to 32 and Len to 3 steps. Set Chd1 to 3rd and Chd2 to 5th.


      4. Hold K1 and tap steps 1 and 9, then hold step 9 and set Note to MIDI 62.


      5. Result check: press Play. The bass plays C2, C2, G2, C2 on beats 1 to 4; the chords sound C-E-G on beat 1 and D-F-A on beat 3. Chord velocity 32 is quieter than bass velocity 48. If the chord is missing, verify channel 2 uses a polyphonic device and Chd1=3rd and Chd2=5th.'
  scene_refs:
  - scale-edit-versus-apply
  - mask-chords
  - harmony-revoice-two-voices
  scene_context_links:
  - scene_id: mask-chords
    canonical_route: adding-chords/mask-chords
    label: Open the chord-mask example in Adding Chords
    reason: Tilting Harmony compares scale slots; chord-mask editing belongs to the chord reference.
  - scene_id: harmony-revoice-two-voices
    canonical_route: harmony/harmony-revoice-two-voices
    label: Open the two-voice revoicing example in Harmony
    reason: Tilting Harmony compares keys with relative patterns; voice revoicing belongs to the Harmony reference.
  scene_milestones:
  - scene_id: scale-edit-versus-apply
    groups:
    - id: core-edit-then-apply
      label: 'Core: edit slot 2, hear no change, apply it'
      step_ids:
      - start
      - select-slot-2
      - edit-root
      - save-unused
      - apply-slot-2
      - apply-d
    - id: optional-active-slot-and-global-off
      label: 'Optional: edit the active slot, turn the global scale off, restore it'
      step_ids:
      - browse-slot-3
      - select-applied
      - edit-applied
      - edit-slot-3
      - global-off
      - turn-off
      - reapply
