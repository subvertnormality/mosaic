        kind: tap-grid
        x: 1
        y: 8
        label: Play the captured phrase and listen for 79, 60, 81, 62.
      - id: preview
        kind: preview-recorded-result
        target_step_id: step-4-offset
        label: Preview the captured result
      semantic_requires:
        midi_events_at_target:
        - port: 2
          bytes:
          - 145
          - 79
          - 40
        - port: 1
