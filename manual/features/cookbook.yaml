          bytes:
          - 144
          - 62
          - 117
      human_outcome: On the fourth pulse, channel 1 plays F (MIDI 65) and channel 2 plays its first note again (MIDI 79). Their four-step and three-step loops continue at the same pulse, with channel 2's second note retaining its stronger, longer setting.
      practice_prompt: '1. Set channel 2''s Device to CC Device, MIDI channel to CC2 and MIDI port to OUT 2 with E2 selecting each field and E3 turning to its value; press K3 to apply.

        2. Assign pattern 1 to channel 2. Hold step 1 at (1,4), tap step 3 at (3,4), then release step 1. Channel 2 now loops steps 1–3.

        3. Turn E1 to Channel tasks, select Masks with E2 and press K3. With no step held, select Note, Vel and Len with E2 and turn E3 to MIDI 79, velocity 40 and length 1/2 respectively.

        4. Hold step 2 at (2,4). Select each field with E2 and turn E3 to MIDI 81, velocity 60 and length 1 1/4, then release the step.

        5. Tap channel 1 at (1,1) and press Play at (1,8). At the fourth shared pulse, channel 1 reaches its last note while channel 2 restarts at its first. Press Play again to stop.'
    title: Play four steps against three
    goal: Run two different channel lengths and compare their notes when the shorter loop restarts.
    starting_point: Playback is stopped. Channel 1 has the four-step C, D, E, F phrase. Channel 2 is selected on its Device page, ready for a separate MIDI output and a three-step range.
