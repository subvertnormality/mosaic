      human_outcome: When slot 2 begins on the eleventh shared pulse, channel 1 restarts on C (MIDI 60) and channel 2 restarts on MIDI 79. Reset on song seq change remains On, so each section starts the two loops together.
      practice_prompt: '1. Close PARAMS with K1 and tap song slot 1 at (1,1).

        2. Press Play at (1,8). Continue through the ten steps of slot 1 and the first four steps of slot 2.

