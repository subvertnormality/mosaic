features:
- id: small-hours
  title: Four-Bar Percussion, Bass and Chord Example
  audience: intermediate
  summary: Build a four-bar loop of drums, bass and a moving chord on three channels at 90 BPM in C major.
  prose: 'Build a four-bar loop on three channels: Oilcan 1 plays drums on channel 1, Polyperc 1 plays
    a bass line on channel 2 and Doubledecker plays chords on channel 3. The drum and bass phrases repeat
    unchanged in every bar. Only the chord roots change, in bar 4, so you hear the harmony move while
    the groove stays put. Play "Rhythm, bass and a changing chord" under Listen to hear the finished result
    first.


    Before you start:


    1. Set 90 BPM in Song tasks → Tempo & feel (E3, then K3). Keep the default Rate /1 on every channel:
    one step is a sixteenth note, 16 steps are one bar and 64 steps are four bars.


    2. Set the range of channels 1–3 to steps 1–64.


    3. Open PARAMS > MOSAIC and set Snap note masks to scale to Off, so that MIDI 37 (C#1) in the drum
    channel is not snapped to C major.


    How notes are entered in these recipes: open Masks (grid (3,8), E1 to tasks, E2 to Masks, K3). E2
    chooses the value (Trig, Note, Vel, Len, Chd1–Chd4). With no step held, E3 sets the channel default,
    which every step uses unless it has its own value. Hold K1 and tap a step to add or remove a trig
    on it. Hold a step and turn E3 to give that step its own value. Hold a step and press K2 to remove
    its own values. The grid shows sixteen steps at a time: bar 1 is steps 1–16, bar 2 is steps 17–32,
    bar 3 is steps 33–48 and bar 4 is steps 49–64, so move to the right sixteen-step page before you tap
    steps in a later bar. In bars after the first, add 16 to each step number of bar 1.


    Build the channels in order: Percussion Channel, Bass Channel, Chord Channel. Press Play after each
    one to hear the loop grow before you add the next channel.


    Finish with a contrasting section: open the Song Editor, copy the song slot and mute one channel in
    the copy (see Song Composition). Numeric MIDI notes are used throughout, because Masks shows MIDI
    36, 48 and 60 as C1, C2 and C3 while other controls label octaves differently. Each n.b. player is
    unique: Polyperc 1 cannot be assigned to another channel once it is assigned to the bass.'
  musical_use: Build the rhythm, bass and chords as separate channels and play the loop after each one.
    Then change only the chord roots in bar 4 and listen to the harmony move over an unchanged groove.
  related:
  - masks
  - channel-length
  - song-composition
  - norns-sound-sources-with-n-b
  sources:
    readme: manual/legacy/README-1.4.0.md#typical-workflow
    behaviour_cases:
    - M-WORKFLOW-001
    - M-MASK-007
    - M-MASK-010
    - M-MASK-008
    code:
    - tests/behaviour/composition_workflow.py
    - lib/devices/device_descriptors.lua
    - lib/devices/device_map.lua
    - lib/clock/divisions.lua
  controls: []
  details:
  - title: Example Scope
    text: 'The recipes give the exact settings of the recorded example, so you can reproduce it. The recording
      is the authored version only: other values you try are not part of it. Listen to the recording first
      if you want a target for each channel.'
  - title: 'Recorded Example: Rhythm, bass and a changing chord'
    text: 'Four bars at 90 BPM.


      Channel 1, Oilcan 1, velocity 38: in every bar MIDI 36 on steps 1 and 9, MIDI 38 on steps 4 and
      12 and MIDI 37 on steps 5 and 13.


      Channel 2, Polyperc 1, velocity 42: in every bar MIDI 48 on steps 1, 5 and 13 and MIDI 55 on step
      9.


      Channel 3, Doubledecker, velocity 26, three steps long, Chd1 3rd and Chd2 5th: in bars 1 to 3 the
      chord roots are MIDI 60 on step 1 and MIDI 62 on step 9 of the bar. In bar 4 they are MIDI 67 on
      step 49 and MIDI 60 on step 57.


      Play the loop and listen for the chord at the start of bar 4: the drums and bass are unchanged,
      while the chords move from C and D to G and C.'
  recipes:
  - title: Percussion Channel
    text: 'Starting point: the three settings under Before you start are done (90 BPM, steps 1-64, Snap
      note masks to scale Off) and channel 1 is empty. The steps below build a six-hit drum bar and repeat
      it in all four bars.


      1. Select channel 1 (1,1). Press E1 to Channel tasks, turn E2 to Device, press K3, turn E3 to Oilcan
      1 and press K3 to assign it.


      2. Open Masks (grid (3,8), E1 to tasks, E2 to Masks, K3). With no step held, turn E2 to Note and
      turn E3 to MIDI 36 (C1). Turn E2 to Vel and set 38. Turn E2 to Len and set ½ step. Every trig you
      add now plays MIDI 36 at velocity 38 for half a step. In the default Oilcan kit MIDI 36, 37 and
      38 trigger three different drum timbres.


      3. In bar 1 (steps 1-16), hold K1 and tap steps 1, 4, 5, 9, 12 and 13. Six trigs light on the grid.


      4. Turn E2 back to Note. Hold step 4 and turn E3 to MIDI 38 (D1), then release. Do the same for
      step 12. Hold step 5 and turn E3 to MIDI 37 (C#1), then release, and do the same for step 13. Steps
      1 and 9 keep the default MIDI 36.


      5. Listen: press Play and hear bar 1 loop. MIDI 36 falls on beats 1 and 3, MIDI 37 on beats 2 and
      4, and each MIDI 38 hit sounds one step before a MIDI 37 hit. Press Stop.


      6. Repeat steps 3 and 4 in each of the other three bars, moving the grid to that bar''s sixteen-step
      page first. Each pair below is a step number and its MIDI note:

      Bar 2: 17/36, 20/38, 21/37, 25/36, 28/38, 29/37.

      Bar 3: 33/36, 36/38, 37/37, 41/36, 44/38, 45/37.

      Bar 4: 49/36, 52/38, 53/37, 57/36, 60/38, 61/37.


      The channel now has 24 trigs in a repeating one-bar (four-beat) drum figure. Press Play and listen
      before you continue: the same bar repeats four times. Press Stop.'
  - title: Bass Channel
    text: 'Starting point: channel 1 plays the drums and channel 2 is empty. Masks work as in the percussion
      recipe: E2 chooses the value, E3 sets it, and holding a step gives that step its own value.


      1. Select channel 2 (2,1). Press E1 to Channel tasks, turn E2 to Device, press K3, turn E3 to Polyperc
      1 and press K3 to assign it.


      2. Open Masks. With no step held, turn E2 to Note and set MIDI 48 (C2), turn E2 to Vel and set 42,
      and turn E2 to Len and set ½ step.


      3. In bar 1, hold K1 and tap steps 1, 5, 9 and 13.


      4. Select Note with E2, hold step 9 and turn E3 to MIDI 55 (G2), then release. Steps 1, 5 and 13
      keep the default MIDI 48.


      5. Listen: press Play. The bass plays C2 on beats 1, 2 and 4 and G2 on beat 3, under the drums.
      Press Stop.


      6. Repeat steps 3 and 4 in bars 2 to 4, adding 16 to each step number of bar 1. Each trig list is
      followed by the step that takes MIDI 55:

      Bar 2: trigs on 17, 21, 25, 29; 25 is MIDI 55.

      Bar 3: trigs on 33, 37, 41, 45; 41 is MIDI 55.

      Bar 4: trigs on 49, 53, 57, 61; 57 is MIDI 55.


      Listen for the pitch pattern C, C, G, C repeating once per bar under the drums.'
  - title: Chord Channel
    text: 'Starting point: channels 1 and 2 play the drums and bass; channel 3 is empty. Doubledecker
      plays several notes at once, so it can sound the chord. The grid shows sixteen steps at a time:
      bar 1 is steps 1-16, bar 2 steps 17-32, bar 3 steps 33-48 and bar 4 steps 49-64, so move to that
      bar''s page before tapping its steps. Hold K1 and tap a step to add or remove a trig; hold a step
      and turn E3 to give that step its own value.


      1. Select channel 3 (3,1). Press E1 to Channel tasks, turn E2 to Device, press K3, turn E3 to Doubledecker
      and press K3 to assign it.


      2. Open Masks. With no step held, set Note to MIDI 60 (C3), Vel to 26 and Len to 3 steps. Select
      Chd1 and set 3rd; select Chd2 and set 5th. Every chord now plays the root plus the notes a third
      and a fifth above it in the scale.


      3. In bar 1, hold K1 and tap steps 1 and 9. Select Note, hold step 9 and turn E3 to MIDI 62 (D3),
      then release. Step 1 keeps the default MIDI 60. Press Play: the chord alternates C-E-G and D-F-A,
      two chords a bar, quietly above the bass. Press Stop.


      4. In bar 2, add trigs on steps 17 and 25, and set step 25 to MIDI 62 as in step 3.


      5. In bar 3, add trigs on steps 33 and 41, and set step 41 to MIDI 62.


      6. In bar 4, hold K1 and tap steps 49 and 57. Hold step 49 and set Note to MIDI 67 (G3). Step 57
      keeps the default MIDI 60.


      7. Listen to the whole four bars: press Play and wait for bar 4. The drums and bass repeat unchanged,
      but the chords move to G-B-D and then back to C-E-G. The chord intervals follow the C-major scale,
      so the 3rd above D is F and the 3rd above G is B. Press Stop.'
  scene_refs:
  - mask-precedence
  - mask-chords
  - mask-expression
  review:
    status: verified
    cases:
    - M-MASK-007
    - M-MASK-010
    - M-MASK-008
    source_status: code-and-case-reviewed
    applicability: native-ui
    native_gap: Mask controls and the authored three-player recording are demonstrated. Each player contributes
      verified solo PCM before the mix publishes. Suggested song-slot mutes use their own native workflow
      evidence; physical norns output and player installation are separate.
    audio_refs:
    - three-voice-conversation
    audio_cases:
    - MA-AUDIO-three-voice-conversation
  category: workflow
  parent: typical-workflow
  level: 3
- id: pocket-rhythm
  title: Adding a Ghost Note
  audience: intermediate
  summary: Compare two bars of main hits with two bars that add a quiet hit before an accent.
  prose: 'Compare two ways of playing the same four-beat drum figure on Oilcan 1. Bars 1 and 2 contain
    only the main hits (MIDI 36 on steps 1 and 9, MIDI 37 on steps 5 and 13, all at velocity 90). Bars
    3 and 4 add one quiet hit, MIDI 38 at velocity 35, on step 12 of the bar, just before the accent on
    step 13. This is a ghost note: a soft hit that adds movement without changing the main hits.


    Settings: 90 BPM, Rate /1 (the default, one step is a sixteenth note), range 1–64 and length ½ step
    on all notes. Play "Adding a Ghost Note" under Listen to hear the target, then build it with the first
    recipe.


    Two further recipes follow: an optional probability variation of the ghost notes, and a separate,
    denser drum pattern at velocity 48 (the "Three sounds, one pocket" recording) that does not use ghost
    notes.'
  musical_use: Add one quiet hit just before an accent and compare the bar with and without it. Use a
    ghost note to add movement to a drum pattern without changing the main hits.
  related:
  - adding-trigs
  - adding-velocity
  - trig-probability
  - clocks-swing-and-shuffle
  sources:
    readme: manual/legacy/README-1.4.0.md#typical-workflow
    behaviour_cases:
    - M-WORKFLOW-001
    - M-EDIT-002
    - M-PARAM-018
    code:
    - tests/behaviour/composition_workflow.py
    - lib/devices/device_descriptors.lua
  controls: []
  details:
  - title: Comparison settings
    text: The ghost-note comparison uses Oilcan 1. Every bar has four main attacks at velocity 90. Bars
      3 and 4 each add one velocity-35 hit. The "Three sounds, one pocket" recording is an independent
      pattern at a constant velocity of 48. MIDI note mappings can differ on another instrument.
  recipes:
  - title: Make the recorded ghost-note comparison
    text: 'Starting point: an empty project with playback stopped and channel 1 selected. The numbers
      1–64 are step numbers across four bars: bar 1 is steps 1–16, bar 2 is 17–32, bar 3 is 33–48 and
      bar 4 is 49–64. The grid shows sixteen steps at a time, so move to the sixteen-step page of the
      bar you are editing.



      Setup (steps 1 to 3 prepare the instrument; do them once).


      1. Assign Oilcan 1 to channel 1 and set its range to steps 1–64 (see Channel Length). Leave Rate
      at /1.


      2. Set 90 BPM: open Song tasks, choose Tempo & feel, turn E3 to 90 and press K3.


      3. Open PARAMS > MOSAIC and set Snap note masks to scale to Off, then return to Mosaic. MIDI 37
      (C#1) is not in C major and would otherwise be snapped to a scale note.



      Main hits (steps 4 to 7 build and audition the bar without ghost notes).


      4. Add the main hits. Open Pattern Trig on pattern 1 and tap steps 1, 5, 9 and 13 in each bar: bar
      1 uses 1, 5, 9, 13; bar 2 uses 17, 21, 25, 29; bar 3 uses 33, 37, 41, 45; bar 4 uses 49, 53, 57,
      61. Sixteen trigs are lit.


      5. Open Masks (grid (3,8), E1 to tasks, E2 to Masks, K3). With no step held, select Note and set
      MIDI 36 (C1), select Vel and set 90, select Len and set ½. All sixteen hits now play MIDI 36 at
      velocity 90.


      6. Select Note. Hold step 5 and turn E3 to MIDI 37 (C#1), then release. Do the same for steps 13,
      21, 29, 37, 45, 53 and 61, so that the second and fourth beat of each bar play MIDI 37.


      7. Press Play and listen to four bars of main hits only, then press Stop. You hear two timbres alternating
      on beats 1 to 4 of every bar.



      Ghost notes (steps 8 to 10 add the quiet hit to bars 3 and 4).


      8. Return to Pattern Trig and tap step 44 (step 12 of bar 3) and step 60 (step 12 of bar 4).


      9. Open Masks and hold step 44. Select Note and turn E3 to MIDI 38 (D1), then select Vel and set
      35, then release step 44. Repeat both edits on step 60: first Note 38, then Vel 35.


      10. Press Play. Bars 1 and 2 are unchanged. In bars 3 and 4 you hear a quiet third timbre one step
      before each MIDI 37 accent. Press Stop.



      Undo (step 11 returns to the main-only phrase).


      11. Open Masks, hold step 44 or 60 and press K2 to remove the values you set, then remove its trig
      on Pattern Trig.'
  - title: Optional probability variation
    text: 'Starting point: the ghost-note comparison above, with ghost trigs on steps 44 and 60. This
      variation is not part of the recording because its random result changes from loop to loop. The
      extremes 0 and 100 are predictable, so check those first and then listen to 50.


      1. Select channel 1 and open Channel tasks → Trig params. Turn E2 to a slot, press K2, turn E3 to
      Trig Probability and press K3. With no step held, turn E3 until the channel default reads 100, so
      every main hit plays every time.


      2. Check 0 and 100 on the ghost notes. Move to the sixteen-step page for steps 33–48, hold step
      44, turn E3 to 0 and release. Move to the page for steps 49–64 and set step 60 to 0 in the same
      way. Play: the ghost note never sounds in bars 3 and 4. Stop, set both steps to 100 and play again:
      it always sounds, exactly as in the recording.


      3. Now set both steps to 50 in the same way. Play several loops. In bars 3 and 4 the quiet hit is
      sometimes present and sometimes missing, while the main hits always play. No two runs need match.


      Return the two steps to 100 or remove the lock (hold the step and press K2) to restore the fixed
      comparison. For a captured example of probability at 0 and 100, see Trig Probability, "Turn chance
      into explicit rests".'
  - title: Separate fixed percussion example
    text: 'This is the "Three sounds, one pocket" recording. It is a different, denser four-bar drum pattern
      and does not use ghost notes. It teaches one idea: a third sound (MIDI 38) fills the gaps between
      the two accents. Every hit is at velocity 48, a constant quiet level chosen so you hear rhythm and
      timbre only, with no accent or quiet ghost hit. Starting point: the ghost-note comparison recipe''s
      steps 1 to 3 (Oilcan 1 on channel 1, range 1–64, 90 BPM, Snap note masks to scale Off) and an empty
      channel.


      The bar template, as step/MIDI note: 1/36, 4/38, 5/37, 7/38, 9/36, 12/38, 13/37 and 15/38.


      Step:  1   4   5   7   9   12  13  15


      Note:  36  38  37  38  36  38  37  38


      1. Open Masks. With no step held, set Note to MIDI 36, Vel to 48 and Len to ½.


      2. Enter the trigs. In bar 1, hold K1 and tap steps 1, 4, 5, 7, 9, 12, 13 and 15 to add eight trigs.


      3. Edit the notes. Select Note and give steps 4, 7, 12 and 15 MIDI 38, and steps 5 and 13 MIDI 37,
      holding each step and turning E3. Steps 1 and 9 keep MIDI 36.


      4. Repeat steps 2 and 3 in bars 2 to 4, adding 16 to each step number.


      Play four bars. Listen for MIDI 36 on beats 1 and 3, MIDI 37 on beats 2 and 4, and the MIDI 38 hits
      filling the gaps between them. Unlike the ghost-note comparison, every hit has the same velocity,
      so nothing sounds accented or quiet. Listen to "Three sounds, one pocket" under Listen to compare.'
  scene_refs:
  - pocket-ghost-bar
  review:
    status: verified
    cases:
    - M-EDIT-002
    - M-PARAM-018
    - M-MANUAL-CLOSURE-GHOST-001
    source_status: code-and-case-reviewed
    applicability: native-ui
    native_gap: The new exact main-only/ghost comparison is authored and awaiting native capture. Existing
      fixed Oilcan evidence and probability endpoint scenes retain their separate scope. The optional
      50% version is not a matching recording.
    audio_refs:
