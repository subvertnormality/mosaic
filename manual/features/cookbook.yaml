      human_outcome: The drums play MIDI 36 four times per sixteen-step range and the figure plays MIDI 72 three times per five-step range. Their starting steps coincide at step 1 and again at step 81, after eighty pulses. The optional sixteen-against-twelve recording is a separate example with different ranges and voices.
      practice_prompt: '1. Tap channel 1 at (1,1).

        2. Press Play at (1,8). The drums repeat every sixteen steps, while the figure repeats every five; compare where the figure falls against successive drum hits.

        3. Continue through eighty shared pulses. The next pulse, step 81, is the first time both channels start their ranges together again.

        4. Press Play again to stop. Select Show result to compare the drum and figure note events across that cycle.'
    title: Play sixteen steps against five
    goal: Let a five-step figure move across a sixteen-step drum pattern and identify their next shared beginning.
    starting_point: Playback is stopped. Channel 1 has a sixteen-step drum range with hits on steps 1, 5, 9 and 13. Channel 2 has pattern 2 assigned, with figure notes on steps 1, 3 and 4 and its range set to steps 1–5.
