- id: pattern-note-range
  feature_id: adding-notes
  title: Shape notes across the grid range
  behaviour_case: M-EDIT-001
  requirements:
  - PAT-NOTE-RANGE
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-EDIT-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays a four-step phrase on steps 1-4 (MIDI 60, 62, 64, 65
      at velocities 127, 117, 107, 97) through a MIDI device on OUT 1, in C major
      at 90 BPM with sixteenth-note steps (Rate /1). The Channel editor is open and
      the Pattern editor has not been opened. On Pattern Note the range buttons on
      row 8 are range-up (14,8), centre (15,8) and range-down (16,8). A press moves
      the window one degree up or down, a long press jumps to the top or bottom, and
      the centre button returns to the root page. Pattern Velocity has only two range
      buttons, (15,8) toward the top page and (16,8) toward the lower page, as the
      next lesson shows.
    citation: README.md#adding-notes
