  - id: open-song
    title: Open the Song editor
    caption: 'Tap Song (6,8). The Playback screen lists Playing SONG 01, Next SONG
      01, Pass 1/1, Global length 64 and Song mode AUTO. The global length fader is
      on grid row 7: (1,7) subtracts one step, (8,7) adds one, and the buttons between
      jump to 1, 13, 32, 38, 51 and 64.'
    citation: README.md#adjusting-song-sequence-length
    inputs:
    - type: grid
      x: 6
      y: 8
      state: 1
    - type: grid
      x: 6
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: screen-header
        expected: SONG PLAYBACK SONG 01
        matched: true
  - id: shorten
    title: Shorten by one step
    caption: Tap the fader's left end (1,7). It takes one step off the length and
      the Playback screen shows Global length 63. To loop a short fragment instead,
      jump with (2,7) to 1 step and add steps with (8,7); see the recipe on this page.
    citation: README.md#adjusting-song-sequence-length
    inputs:
    - type: grid
      x: 1
      y: 7
      state: 1
    - type: grid
      x: 1
      y: 7
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: dashboard
        rows:
        - - Playing
          - SONG 01
        - - Next
          - SONG 01
        - - Pass
          - 1 / 1
        - - Global length
          - '63'
        - - Song mode
          - AUTO
        passed: true
  - id: restore
    title: Return to 64 steps
    caption: Tap the fader's right end (8,7), which adds one step. Global length reads
      64 again, so the whole phrase plays.
    citation: README.md#adjusting-song-sequence-length
    inputs:
    - type: grid
      x: 8
      y: 7
      state: 1
    - type: grid
      x: 8
      y: 7
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: dashboard
        rows:
        - - Playing
          - SONG 01
        - - Next
          - SONG 01
        - - Pass
          - 1 / 1
        - - Global length
          - '64'
        - - Song mode
          - AUTO
        passed: true
  - id: length-two
    title: Set the length to 2 steps and play
    caption: 'Tap (2,7), which jumps to 1 step, then tap (8,7) once to add one. Global
      length reads 2. Press Play (1,8): the song plays only its first two steps and
      starts again, so the MIDI sent in this step is C and D (60, 62) over and over,
