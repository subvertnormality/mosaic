schema_version: 1
fixture_kind: behaviour-case
trace_contract: The original pinned case replays public inputs and verifies every
  authored semantic selector; per-scene deltas include native encoder units and waits.
scenes:
- id: algorithm-choose-and-preview
  feature_id: adding-trigs
  title: Choose a trig algorithm
  behaviour_case: M-LIVEUI-ALGO-001
  requirements:
  - UI-FEEDBACK-ALGORITHM
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-LIVEUI-ALGO-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: euclidean
    title: Choose Euclidean
    caption: 'In a new empty project with playback stopped and Record off, tap Pattern
      (5,8), then tap the third algorithm button (14,2). The five algorithm buttons
      on row 2 are, from the left: Drum (12,2), a library of classic bass, snare and
      hi-hat patterns; Tresillo (13,2), a 3-3-2 grouping; Euclidean (14,2), trigs
      spread as evenly as a mathematical rule allows; Numeric (15,2), patterns from
      Noise Engineering''s Numeric Repetitor; and Rhythm Doctor (16,2). The Trig Algorithm
      screen marks Euclidean as SELECTED and the fader on grid row 2 lights its third
      position.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 5
      y: 8
      state: 1
    - type: grid
      x: 5
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: grid
      x: 14
      y: 2
      state: 1
    - type: grid
      x: 14
      y: 2
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Euclidean
        value: SELECTED
        matched: true
  - id: focus-drum
    title: Browse without applying
    caption: 'Turn E2 left. The screen passes Tresillo and stops on Drum, the first
      algorithm (a further turn stays on Drum). Drum shows no SELECTED mark and the
      third fader position stays lit: turning E2 only browses. Euclidean is still
      the algorithm in use until you press K3.'
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    expect:
      assertion:
        kind: selected-field
        label: Drum
        value: ''
        matched: true
  - id: apply-drum
    title: Apply Drum
    caption: Press K3. Drum now reads SELECTED and the fader lights its first position.
      Drum draws on classic drum patterns, so it suits a kick, snare or hi-hat lane,
      where Euclidean suits an even pulse.
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Drum
        value: SELECTED
        matched: true
  - id: prime-drum
    title: Prime with Drum selected
    caption: 'Tap Prime (16,8). The Paint Preview screen opens on Algorithm Drum with
      Shift 0, but no step flashes on the pattern grid: at its default settings Drum
      previews no steps. Prime previews whichever algorithm is selected.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-preview
        stage: drum-prime
        painting: true
        algorithm: Drum
        shift: '0'
        passed: true
  - id: cancel-drum
    title: Cancel the empty preview
    caption: Tap Cancel (14,8). The preview closes and nothing was painted.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 14
      y: 8
      state: 1
    - type: grid
      x: 14
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-preview
        stage: drum-cancel
        painting: false
        algorithm: Drum
        shift: '0'
        passed: true
  - id: reopen-algorithm
    title: Return to the algorithm list
    caption: Turn E1 to open Pattern tasks, turn E2 to Algorithm and press K3. The
      Trig Algorithm screen returns (a Painting cancelled tip may still show) and
      Drum is still SELECTED.
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 1
      delta: 2
    - type: wait
      seconds: 0.15
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: -2
    - type: wait
      seconds: 0.15
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: 2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: 2
    - type: wait
      seconds: 0.15
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Drum
        value: SELECTED
        matched: true
  - id: browse-euclidean
    title: Browse back to Euclidean
    caption: Turn E2 two detents right, past Tresillo. Euclidean is highlighted but
      carries no SELECTED mark yet, and the fader still shows Drum.
    citation: README.md#adding-trigs
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: 2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 2
      delta: 2
    - type: wait
      seconds: 0.15
    expect:
      assertion:
        kind: selected-field
        label: Euclidean
        value: ''
        matched: true
  - id: apply-euclidean
    title: Apply Euclidean
    caption: Press K3. Euclidean reads SELECTED and the fader lights its third position
      again.
    citation: README.md#adding-trigs
    inputs:
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Euclidean
        value: SELECTED
        matched: true
  - id: preview-differs
    title: Prime now previews Euclidean
    caption: 'Tap Prime (16,8) again. Now every step on the pattern grid flashes and
      Paint Preview reads 64 trigs: at the default settings Euclidean fills all 64
      steps, where Drum previewed none. Prime always previews the algorithm that is
      selected, so changing the algorithm changes what Prime shows.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: prime-uses-selected-algorithm
        passed: true
  - id: prime-tresillo
    title: Prime Tresillo for a 3-3-2 preview
    caption: 'Tap Cancel (14,8) to close the Euclidean preview and tap Tresillo (13,2),
      the second algorithm button. Like Drum, Tresillo previews nothing until you
      choose a pattern: tap drum bank 1 at (12,3), then tap both ends of the first
      fader on row 2, (2,2) and (10,2), and of the second fader on row 3, (2,3) and
      (10,3). Tap Prime (16,8). The algorithm fader lights its second position and
      Paint Preview reads Algorithm Tresillo with 8 trigs. The flashing steps are
      spaced 9, 9 and 6 steps apart, over and over: the 3-3-2 grouping, scaled up.
      Nothing is painted yet.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 14
      y: 8
      state: 1
    - type: grid
      x: 14
      y: 8
      state: 0
