- id: structure-every-4-markers
  feature_id: structure
  title: Mark every fourth step
  behaviour_case: M-MERGE-STRUCTURE-004
  requirements:
  - MERGE-STRUCTURE
  - HARMONY-PATTERN
  - HARMONY-REVOICE
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-MERGE-STRUCTURE-004
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 loops eight steps: pattern 1 plays C, D, E, F (MIDI 60, 62,
      64, 65) on steps 1 to 4, and pattern 2 adds trigs on steps 5 and 7. Merge Shape
