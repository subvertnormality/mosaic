- id: paint-shift-and-cancel
  feature_id: adding-trigs
  title: Move a rhythm before committing
  behaviour_case: M-LIVEUI-PAINT-001
  requirements:
  - UI-FEEDBACK-PAINT
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-LIVEUI-PAINT-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: numeric
    title: Choose Numeric
    caption: In a new empty project with playback stopped and Record off, tap Pattern
      (5,8), then tap the fourth algorithm button (15,2) for Numeric. The Trig Algorithm
      screen marks Numeric as SELECTED. Numeric gives a sparse pattern, which makes
      shifts easy to see. The controls you will use on grid row 8 are Prime (16,8),
      Move left (10,8), Reset (11,8), Move right (12,8) and Cancel (14,8).
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 5
      y: 8
      state: 1
    - type: grid
      x: 5
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: grid
      x: 15
      y: 2
      state: 1
    - type: grid
      x: 15
      y: 2
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: selected-field
        label: Numeric
        value: SELECTED
        matched: true
  - id: prime
    title: Prime the pattern
    caption: Tap Prime (16,8). The Numeric pattern flashes on the grid and Paint Preview
      reads Preview PAINTING, Algorithm Numeric, Shift 0 and 8 trigs, on steps 5,
      13, 21, 29 and so on. Nothing is painted yet.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-preview
        stage: prime
        painting: true
        algorithm: Numeric
        shift: '0'
        passed: true
  - id: right
    title: Shift right
    caption: Tap Move right (12,8). Every flashing step moves one step to the right,
      from step 5 to step 6 and so on, and the Paint Preview screen reads Shift +1.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 12
      y: 8
      state: 1
    - type: grid
      x: 12
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_right
        shift: '+1'
        passed: true
  - id: before
    title: Two taps left
    caption: Tap Move left (10,8) twice. The first tap takes the flashing steps back
      to where Prime put them (Shift 0); the second moves them one step left of that,
      from step 5 to step 4 and so on. The screen reads Shift -1.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 10
      y: 8
      state: 1
    - type: grid
      x: 10
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    - type: grid
      x: 10
      y: 8
      state: 1
    - type: grid
      x: 10
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_left
        shift: '-1'
        passed: true
  - id: reset
    title: Reset the shift
    caption: Tap Reset (11,8). The shift returns to 0 in one tap and the flashing
      steps are back where Prime put them.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 11
      y: 8
      state: 1
    - type: grid
      x: 11
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-shift-cells
        control: shift_reset
        shift: '0'
        passed: true
  - id: cancel
    title: Cancel the preview
    caption: Tap Cancel (14,8). Paint Preview reads Preview OFF and Trigs NONE, and
      no flashing steps remain. Nothing was painted, so the pattern is unchanged.
      To keep a shifted rhythm instead, tap Prime again while the steps are flashing;
      the next two steps do that.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 14
      y: 8
      state: 1
    - type: grid
      x: 14
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-preview
        stage: cancel
        painting: false
        algorithm: Numeric
        shift: '0'
        passed: true
  - id: prime-again
    title: Prime again
    caption: Tap Prime (16,8) again. The same Numeric steps flash again at Shift 0.
      Prime always starts a new preview, so you can try a rhythm, cancel it and come
      back to it.
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    expect:
      assertion:
        kind: paint-preview
        stage: prime-2
        painting: true
        algorithm: Numeric
        shift: '0'
        passed: true
  - id: commit
    title: Press Prime again to paint the shifted rhythm
    caption: 'Tap Move right (12,8) so the preview reads Shift +1, then tap Prime
      (16,8) while the steps are flashing. Paint Preview now reads Preview OFF and
      the footer says Pattern painted. The steps stay lit on the pattern grid, one
      step to the right of where Prime first put them: the shifted rhythm is painted
      into the pattern.'
    citation: README.md#adding-trigs
    inputs:
    - type: grid
      x: 12
      y: 8
      state: 1
    - type: grid
      x: 12
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    - type: wait
      seconds: 0.6
    - type: wait
      seconds: 0.6
    - type: grid
      x: 16
      y: 8
      state: 1
    - type: grid
      x: 16
      y: 8
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: paint-commit
        passed: true
