  - id: edit-slot-3
    title: Select slot 3 again
    caption: Press and hold slot 3 at (3,3) for about one second. The editor moves
      to slot 3 and slot 2 is still the applied scale.
    citation: README.md#scale-editor
    inputs:
    - type: grid
      x: 3
      y: 3
      state: 1
    - type: wait
      seconds: 1.1
    - type: grid
      x: 3
      y: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: scale-edit-header
        slot: 3
  - id: global-off
    title: Turn the global scale off
    caption: 'Press and hold slot 3 again. A long press on the slot already selected
      for editing turns the global scale off: no slot button is lit and the editing
      selection clears. A short press on the applied slot does the same.'
    citation: README.md#scale-editor
    inputs:
    - type: grid
      x: 3
      y: 3
      state: 1
    - type: wait
      seconds: 1.1
    - type: grid
      x: 3
      y: 3
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: scale-edit-header
        slot: 0
