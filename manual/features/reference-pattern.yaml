    result: Open Pattern Note.
  - gesture: Tap a note in a step’s grid column
    result: Set a scale-relative note for that source step, including steps without trigs.
  - gesture: Hold K1 while entering a note
    result: Copy the note to the corresponding position on all four sixteen-step pages.
  - gesture: Grid (9,8)–(12,8)
    result: Choose steps 1–16, 17–32, 33–48 or 49–64.
  - gesture: Grid (14,8), (15,8), (16,8)
    result: Move the note range up one scale degree, return to the page with the root on the bottom row, or move it down one scale degree. Hold (14,8) or (16,8) to reach the highest or lowest range.
  - gesture: Hold a row-1 pattern button, or K1 + tap it
    result: Select another source pattern while on the note page.
  - gesture: E3 on Pattern Note screen
    result: View another channel’s resolved steps without changing the selected channel.
  details:
  - title: Source notes and channel pitch
    text: The pattern stores distance from a scale root. Each channel applies its active scale and subsequent processing. An edit affects every channel using that source pattern. A step without a source trig can supply note data when a different pattern supplies the merged rhythm.
