- id: pattern-editor
  title: Pattern Editor
  audience: all
  summary: Edit source-pattern trigs, scale-relative notes and velocities, then assign the patterns to
    channels.
  prose: 'Patterns are the building blocks of your harmony and rhythm sections. Create source patterns
    in the pattern editors, assign them to channels, then use channel merging to combine or remix their
    trig, note and velocity data.


    Press Pattern, grid (5,8), the third button of the global menu cluster, to open the Pattern Editor.
    Press it again to move through its three pages: Pattern Trig (which steps play), Pattern Note (which
    scale degree each step plays) and Pattern Velocity (how hard). The top row, (1,1) to (16,1), selects
    which of the 16 patterns you edit. Each pattern has 64 steps. Pattern Trig shows all 64 on grid rows
    4 to 7, 16 per row. Pattern Note and Pattern Velocity show 16 steps at a time and the buttons at (9,8)
    to (12,8) choose steps 1–16, 17–32, 33–48 or 49–64.


    Watch: [Pattern editor demo](https://youtu.be/J1ckUZvhFJ0?t=660)'
  musical_use: Create several source patterns. Assign them to channels and set masks or merge modes separately
    for each channel.
  related:
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#pattern-editor
