- id: adding-trigs
  title: Adding Trigs
  audience: all
  summary: Enter pattern trigs manually or preview and paint a generated rhythm.
  prose: 'Trigs are added in the pattern editor. Using the top row, pick one of the 16 available patterns.


    Press a sequencer step to enter a trig. Active trigs glow brightly. Hold a trig and select its end
    step to set its length. Dimmer steps show the note’s duration. Another trig in the same pattern ends
    that duration.


    Select a built-in rhythm algorithm using the five algorithm buttons. From left to right:


    * Button 1: The drum algorithm, using banks of classic drum patterns.

    * Button 2: The tresillo algorithm, utilizing a 3/3/2 ratio for diverse rhythm variations. The tresillo
    multiplier can be set on the Norns screen for more variations.

    * Button 3: Euclidean, a rhythm tool rooted in mathematical logic.

    * Button 4: NE Numeric Repetitor, another rhythm tool based on mathematical principles.

    * Button 5: Rhythm Doctor, a capture and paint workflow described below. Recording needs the sequencer
    stopped; an analysed bank can be used while it plays.


    Pressing an algorithm button shows the Trig Algorithm screen on the norns, with the algorithm in use
    marked SELECTED. You can also choose there: E2 moves through the five algorithms and K3 selects one,
    exactly as its grid button does. Choosing Rhythm Doctor opens the Doctor. Algorithm, in the pattern
    task list, opens the same screen.


    Use the row-3 bank fader starting at column 12 to choose a bank: five choices for Drum and Tresillo,
    four for Numeric Repetitor. Euclidean and Rhythm Doctor do not use this selector.


    Use the left fader in row 2 for the first algorithm parameter and the left fader in row 3 for the
    second. The two end buttons are brightly lit and change the value by one: the far-left button steps
    down and the far-right button steps up. The dimmer buttons between them choose broader proportional
    values, with the centre selecting the middle value. The second fader is disabled for Drum, and both
    are disabled for Rhythm Doctor. Changing an enabled parameter refreshes the prepared pattern; use
    Paint to commit it.


    Press a grid control to display its function on the norns.


    ### Previewing and painting


    Press Prime to preview the selected algorithm’s pattern. Potential new steps are shown as flashing
    bright steps on the sequencer. While these steps flash, they are not painted yet. Any step that would
    be painted over an existing active step blinks dimly. By painting the new pattern, you deactivate
    the faintly blinking steps. You can modify algorithm parameters while the pattern is primed.


    If you have not painted the new pattern, the prime button continues to blink. Pressing it again paints
    your edits. Pressing the prime button again without tweaking the algorithm or its parameters acts
    as an undo for the last action.


    Press Cancel to discard a prepared pattern.


    While previewing a new pattern, use the move controls to shift its position. The first button shifts
    it left, the third shifts it right and the centre button resets it. Press Paint to commit the changes.
    Pressing prime, cancel or a move button shows the Paint Preview screen on the norns: whether a preview
    is showing, the algorithm it comes from, the shift, and how many steps it triggers. In Rhythm Doctor
    these same three buttons browse the recording instead (see Rhythm Doctor).


    On the norns screen, Pattern Trig shows the pattern you are editing brightly over the viewed channel’s
    steps, which stay dim as context; the viewed channel is the merged version of the channel. The title
    row names both (`PAT02 CH01`). Channel view, in the Pattern tasks list, shows the viewed channel on
    its own. Use E3 to view another channel; it does not change the selected channel. Choose Options from
    Pattern tasks (E1) to edit the tresillo multiplier in use; a new multiplier takes effect the next
    time you prime the tresillo algorithm. Change the multiplier and prime Tresillo again to compare the
    generated rhythm.


    Pattern tasks, opened with E1, lists Pattern, Options, Algorithm, Channel view and, while the Rhythm
    Doctor algorithm is chosen, Rhythm Doctor.


    Watch: [Pattern editor trig page demo](https://youtu.be/J1ckUZvhFJ0?t=668)'
  musical_use: Select a drum bank or Euclidean rhythm. Press Paint to preview its steps against the existing
    pattern. Press Paint again to commit, or press Cancel to discard the preview.
  related:
