  controls:
  - gesture: With the sequencer stopped, choose Rhythm Doctor at grid (16,2).
    result: Open capture and paint. Recording, capture setup and Alignment require stopped transport; a finished bank can be browsed and painted while playing.
  - gesture: 'Empty bank: grid (1,2)'
    result: Start Record. Press again or use K3 after ENOUGH / REC OR K3 to finish.
  - gesture: Record before enough audio, or Record on an occupied bank
    result: Open an abandon/clear question; K2 cancels and K3 confirms. Clearing a bank preserves already painted patterns.
  - gesture: 'Before capture: E2/E3 edit setup → K3 confirm; K2 cancels.'
    result: Record uses the confirmed setup. Stereo records both inputs separately; L duplicates the left input and R duplicates the right input into both recorded channels. Manual uses the selected integer BPM from recording start; Auto estimates tempo and phrase start.
  - gesture: 'Ready bank: select a lane, then E2 field → E3'
    result: Browse Window bar/step, sensitivity or paint policy.
  - gesture: In a locally analysed READY bank, press grid (3,2), (4,2) or (5,2).
    result: Select BD (bass drum), SD (snare drum) or CYM (hi-hats and cymbals). The default local detector produces these three lanes; the remote server can declare additional lanes.
  - gesture: 'Ready bank: select Alignment → K3'
    result: Open the tempo, Start beat and fine-start draft. E2 chooses the field; E3 edits. K3 reanalyses the retained recording with the confirmed alignment; K2 cancels. Manual Start beat uses regular confirmed-tempo beats; Auto uses detected beats.
  - gesture: Grid (10,8) / (12,8); hold for a phrase
    result: Move the recording window one step backward / forward, or a whole four-bar phrase.
  - gesture: Grid (11,8)
    result: Return the window to its calculated phrase start.
  - gesture: Select destination pattern in row 1 → grid (16,8) twice
    result: Preview the selected lane, then paint it; grid (14,8) cancels the preview.
  - gesture: If local analysis reports ANALYSIS_BACKEND_UNAVAILABLE.
    result: No bank is created. See If local analysis fails for the norns setup needed to retry.
  details:
  - title: Lanes
    text: 'The lanes occupy a block of five columns on each of two rows, starting at

      column 3: lanes one to five on row 2 at columns 3–7, and lanes six to ten on

      row 3 at the same columns. Column 1 of row 2 is Record, column 2 is reserved,

      and columns 12–16 of both rows belong to the algorithm and bank-mask faders and

      are never lanes. A bank analysed on the device declares three lanes — **BD**

      (bass drum), **SD** (snare drum) and **CYM** (hi-hats and cymbals) — so only

      the first three cells light. A remote analysis declares up to ten, which is why

      the block is two rows: a single row would run the later lanes under the

      algorithm fader, where selecting one would also change the algorithm.


      Lanes read in kit order rather than alphabetically: kick, snare, hi-hat,

      cymbals and toms fill the top row, and whatever else the analysis separated out

      — bass, guitar, piano, vocals and demucs'' residual **OTHER** — follows on the

      bottom row. A lane neither of those names keeps a stable alphabetical place

      after the ones they do, so an unfamiliar backend still puts its columns in the

      same order every time a project loads. A bank saved before this order existed

      is brought forward when it loads, so an older capture does not keep an

      alphabetical grid until it is recorded again.


      The lanes describe what can be told apart reliably, not a full drum-kit

      transcription. **CYM** is hats *and* cymbals together because a closed hat and a

      ride are both inharmonic metal with overlapping spectra, and the decay that

      distinguishes them in isolation is buried in a mix; separating them was measured

      and does not work. Bass, open hi-hat and tom have no lane: none could be

      detected reliably enough to paint. Bass was tried and withdrawn — every

      approach either failed to separate a bass note from the kick that hides it, or

      marked the kicks themselves, so the lane only ever restated what BD already

      said.'
  - title: Finding the phrase and Alignment
    text: '**Finding the phrase.** Auto estimates where the four-bar phrase begins and aligns gates to it. Manual starts the phrase at the beginning of recording; Alignment can move it afterward. In this mode columns 10, 11 and 12 of row 8 browse the recording, and

      they do it with the same gestures that shift a previewed pattern everywhere

      else. A press of column 10 or 12 moves the window one step back or forward.

      Holding either of them covers a whole four-bar phrase in that direction, which

      is exactly the width of the displayed window, so every position reached by

      holding stays aligned with the phrase. A press of column 11 returns to the

      calculated phrase start. E3 still moves by a single bar or step. In every

      other algorithm those three buttons continue to shift a previewed pattern''s

      position.


      Each move names where it landed, as bar.beat.step, so the tooltip

      identifies the current window position. A move that the

      recording absorbs -- a step forward when the window is already at the last

      whole phrase, or a return to a phrase start you are already sitting on --

      says so instead of reporting a move that did not happen. If you are painting

      while you browse, the preview follows the window: the grid keeps showing the

      gates under the part of the recording you are looking at.


      In Auto, use the estimated phrase start as an initial position. A crash on the first beat or a fill before the bar provides evidence for the boundary. Identical bars can make it undecidable; check the reported confidence.


      Open Alignment to change Start beat. Auto browses the detected beat grid. Manual browses a regular beat grid spaced by the confirmed BPM from the confirmed phrase origin. The Manual grid covers the retained recording, including earlier beats before a later chosen phrase origin; choices stay inside the recording.


      Turn E2 to select Start beat and E3 to choose another beat. Press K3 to apply: Mosaic reanalyses the same retained recording using that phrase origin. No new recording is needed. Confirming without changing the beat preserves its position. Changing Exact BPM and applying rebuilds the regular beat spacing at the confirmed tempo. K2 cancels the draft and leaves the bank unchanged.


      A reloaded bank can still be browsed and painted, but alignment correction needs the retained capture audio. If that audio is unavailable, K3 refuses with CAPTURE AUDIO UNAVAILABLE instead of changing the bank.'
  - title: Analysis server (advanced)
    text: '**Analysis server (advanced).** Analysis runs on the norns by default and

      needs nothing configured. If you run the optional analysis server on a computer

      on the same network, Rhythm Doctor can send the capture there instead and get

      back ten lanes rather than three: KICK, SNARE, TOMS, HIHAT and CYMBALS from a

      model that separates a kit into its pieces, and BASS, GUITAR, PIANO, VOCALS and

      OTHER from the rest of the mix. The melodic lanes carry rhythm and velocity,

      not notes.


      Set it up in PARAMS > MOSAIC > Rhythm Doctor: put the address in **Analysis

      server** (for example `http://192.168.1.50:8420`) and switch **Use analysis

      server** on. The switch is separate from the address so you can keep a server

      saved while working locally.


      The on-device analysis stays the default and the fallback. If the server is

      switched off, unreachable, slower than its timeout, or returns anything Mosaic

      does not accept, the capture is analysed on the norns instead and you still get

      gates. You lose the extra lanes, not the recording.


      The server also tracks the beat with a model trained for it, so on the remote

      path the tempo and the phrase start are usually better than the on-device

      estimate.


      `tools/rhythm_doctor_server/README.md` has step-by-step setup, including a

      Windows walkthrough that needs no administrator rights, how to find the

      address to type into the setting, and what to check when captures keep coming

      back with three lanes. Three lanes is the on-device fallback: it is what you

      get whenever the server cannot be reached, so it is the symptom to look for

      rather than an error message.'
  - title: Local analysis and availability
    text: '**Availability:** Rhythm Doctor analyses captures on norns by default. The first

      capture may take about half a minute while local analysis starts; a 45-second

      capture also takes about half a minute to analyse. If local analysis fails,

      Mosaic reports `ANALYSIS_BACKEND_UNAVAILABLE` and does not create a bank. See

      **If local analysis fails** for the norns setup needed to retry.'
  - title: Recording and playback
    text: Stop the transport before recording. After analysis produces a ready bank, browse, adjust and paint it while playback runs.
  - title: Capture and analysis results
    text: Capture, analysis and painting are separate stages. A backend failure shows an explicit error and does not produce a ready bank. The ten broad instrument lanes of the optional analysis server are experimental; no detection accuracy is specified.
  - title: Paint destination
    text: Select the destination pattern and song slot before previewing. Changing either invalidates the prepared Doctor paint preview. Preview again before committing.
  - title: If local analysis fails
    text: Local analysis requires Python 3 and gcc (a C compiler) on norns. If either is missing or the analysis build fails, install or restore the dependency and try again. Mosaic reports `ANALYSIS_BACKEND_UNAVAILABLE` and does not create a bank until analysis succeeds. No third-party Python packages or network download are required.
  - title: Vertical list controls
    text: 'Rhythm Doctor’s setup, capture, analysis, window, alignment and paint screens show labelled vertical rows. Select an editable row with E2 and change it with E3. Read the contextual footer before confirming an action: the grid Paint button remains the painting control, and K3 does not substitute for it. This display change does not change capture, lane selection or paint scope.'
  - title: Confirmed capture setup
    text: Confirm the setup with K3 before Record. Stereo preserves separate left/right channels; L or R duplicates that chosen input into both channels. Manual uses 40–240 integer BPM from recording start; Auto estimates tempo and phrase start. A later explicitly confirmed Alignment draft takes precedence.
  - title: Start beat and retained recording
    text: 'Manual Start beat follows a regular grid at the confirmed BPM and phrase origin, including earlier beats when they are inside the recording. Auto uses detected beats. Apply reanalyses the retained recording; Exact BPM correction rebuilds regular beat spacing. After reload, a usable bank may lack original audio: K3 reports CAPTURE AUDIO UNAVAILABLE and leaves it unchanged. K2 cancels without changing the bank.'
