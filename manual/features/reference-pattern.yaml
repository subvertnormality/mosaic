  controls:
  - gesture: 'Pattern Trig: tap row-1 pattern button'
    result: Choose the source pattern for editing.
  - gesture: Tap a sequencer step in grid rows 4–7
    result: Toggle a trig; active trigs glow brightly.
  - gesture: Hold a trig and choose its end step
    result: Set the note’s length; dimmer steps show its duration, cut short by another trig in the same pattern.
  - gesture: Tap algorithm button, columns 12–16 of row 2
    result: Select Drum, Tresillo, Euclidean, Numeric Repetitor or Rhythm Doctor.
  - gesture: Tap Paint at grid (16,8), then tap it again
    result: Preview the generated pattern, then commit it; flashing steps show the preview.
  - gesture: Tap Cancel at grid (14,8)
    result: Discard the prepared preview.
  - gesture: Grid (10,8), (11,8), (12,8)
    result: Move the preview left, reset its shift, or move it right; paint to commit.
  - gesture: Grid row 3, columns 12–16, with Drum or Tresillo selected
    result: Select one of five algorithm banks.
  - gesture: Grid row 3, columns 12–15, with Numeric Repetitor selected
    result: Select one of four banks. Euclidean and Rhythm Doctor do not use this bank fader.
  - gesture: Grid row 2, columns 1–10
    result: Set the algorithm’s first parameter. The outer buttons decrement/increment; inner buttons choose broader values.
  - gesture: Grid row 3, columns 1–10
    result: Set the second algorithm parameter for Tresillo, Euclidean or Numeric Repetitor. This fader is disabled for Drum and Rhythm Doctor.
  details:
  - title: Algorithm faders
    text: 'Use the left faders to edit the generated pattern before painting. The first fader occupies columns 1–10 of row 2; the second occupies the same columns of row 3. Each end button, lit more brightly than the rest, changes its value by one (left steps down, right steps up). The dimmer inner buttons select proportional values, with the centre selecting the middle value. The enabled parameters depend on the algorithm: Drum uses Pattern 1 (1–128); Tresillo uses Pattern 1 and Pattern 2 (each 1–128); Euclidean uses Fill and Length (each 1–32); Numeric Repetitor uses Pattern 1 (1–32) and Pattern 2 (1–16). Rhythm Doctor disables these faders and uses its capture controls.'
  - title: Bank selection
    text: Select banks with the row-3 fader starting at column 12. Drum and Tresillo have five bank choices; Numeric Repetitor has four. Euclidean and Rhythm Doctor do not use bank selection. Changing an enabled parameter or bank refreshes the prepared algorithm pattern.
  - title: Trig options
    text: Use E1 to open Pattern tasks, select Options with E2, and press K3. E3 saves the Tresillo amount immediately; K3 has no apply action on this page. Change the amount, then prime Tresillo again on the grid to regenerate its preview. Painting the preview commits it to the selected pattern.
  recipes:
  - title: Preview a shifted Numeric pattern, cancel it, then commit a fresh preview
    text: 'Starting point: use a new empty project with playback stopped and Record Off. Select Pattern 1 on channel 1. The [Move a rhythm before committing](#adding-trigs/paint-shift-and-cancel) capture starts with 8 flashing trigs at Shift 0 (steps 5, 13, 21, 29 and onward). Its controls are Prime (16,8), Move right (12,8) and Cancel (14,8). The captured result is replayed by the manual; on hardware, the preview uses the selected Numeric settings.


      1. Select Numeric Repetitor at (15,2) and press Prime (16,8). Check the Preview readout: Algorithm Numeric, Shift 0 and 8 trigs.


      2. Tap Move right (12,8) once. The flashing steps shift one step to the right, starting at step 6; the readout is Shift +1.


      3. Tap Cancel (14,8). Check Preview OFF and Trigs NONE; the pattern has not been painted.


      4. Press Prime (16,8) again, tap Move right (12,8) once and press Prime again to commit. The new pattern stays one step to the right; only this committed preview is painted.


      Outcome: Cancel discards the preview without writing trigs. A fresh shifted preview can be committed; the captured result shows the preview state, while the project changes only after the final Prime.

      '
