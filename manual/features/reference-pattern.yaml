    - lib/controls/vertical_fader.lua
    - lib/controls/fade_button.lua
    - lib/ui_adapters/read_only.lua
  controls:
  - gesture: From Pattern Note, press grid (5,8) again
    result: Open Pattern Velocity.
  - gesture: Tap a level in a step’s grid column
    result: Set that source step’s velocity to the displayed grid level.
  - gesture: Hold K1 while entering a velocity
    result: Copy it to the corresponding position across all four sixteen-step pages.
  - gesture: Grid (9,8)–(12,8)
    result: Choose the sixteen-step page.
  - gesture: Grid (15,8) / (16,8)
    result: Move the displayed velocity range toward higher / lower values; hold to reach an extreme.
  - gesture: Hold a row-1 pattern button, or K1 + tap it
    result: Select another source pattern.
  - gesture: E3 on Pattern Velocity screen
    result: View another channel’s resolved steps without changing the selected channel.
  details:
  - title: Grid levels are discrete
    text: Fourteen source levels span MIDI 127 to 0. The initial seven levels are 127, 117, 107, 97, 87,
      78 and 68; the lower extreme shows 58, 48, 39, 29, 19, 9 and 0. A short range-button press moves
      the seven-row window by one level rather than adjusting MIDI velocity by one. The window stops at
      both extremes.
