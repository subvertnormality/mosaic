- id: adding-velocity
  title: Adding Velocity
  audience: all
  summary: Set source-pattern velocities using fourteen discrete grid levels from MIDI 127 to 0.
  prose: 'From Pattern Note, press the third global-menu button again to open Pattern Velocity.


    The velocity editor operates like the note editor. Its two extreme vertical pages show velocities
    127–68 and 58–0. Press a velocity-range button to move the displayed range by one value level. Hold
    it to reach an extreme.


    The norns Pattern Velocity screen shows the viewed channel’s steps as 64 cells. Turn E3 to view another
    channel.


    ### Set an accent and a rest


    1. Press Pattern (5,8) until Pattern Velocity opens.

    2. Each step’s column is a seven-level fader. On the first page, from the top row down, (x,1) is 127,
    (x,2) is 117, (x,3) is 107, (x,4) is 97, (x,5) is 87, (x,6) is 78 and (x,7) is 68. Tap (4,1) for an
    accent on step 4, or (4,7) for a soft hit.

    3. To silence a step, hold (16,8). The window jumps to the lower page, 58 at the top down to 0 at
    the bottom. Tap (4,7) to set velocity 0.

    4. Hold (15,8) to return to the upper page.


    A step at velocity 0 sends no note: it is a rest. Hold K1 while you tap to write the same level on
    all four step pages.


    Watch: [Pattern editor velocity page demo](https://youtu.be/J1ckUZvhFJ0?t=1229)'
  musical_use: Set higher velocities on the main hits and lower velocities on intervening hits. Use velocity
    masks for channel-specific overrides.
  related:
  - pattern-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#adding-velocity
    behaviour_cases:
    - M-EDIT-002
    - M-EDIT-003
