    text: Fourteen source levels span MIDI 127 to 0. The initial seven levels are 127, 117, 107, 97, 87, 78 and 68; the lower extreme shows 58, 48, 39, 29, 19, 9 and 0. A short range-button press moves the seven-row window by one level rather than adjusting MIDI velocity by one. The window stops at both extremes.
