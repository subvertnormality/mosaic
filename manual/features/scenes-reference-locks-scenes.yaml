  - id: zero
    title: Walk step 1 up to an explicit zero
    caption: 'Hold scale-track step 1 and press the right end of the fader, (16,8),
      twelve times, playing as you go if you like. Each press adds one semitone, from
      -12 up to 0. A lock of 0 is an explicit lock: it overrides the global +4, so
      step 1 plays MIDI 60 and not 64.'
    citation: README.md#transposition-locks
