- id: scale-lock-skipped-trig
  feature_id: scale-locks
  title: Keep a scale lock through a silent step
  behaviour_case: M-SCALE-LOCK-003
  requirements: *id001
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-SCALE-LOCK-003
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Starting point: channel 1 plays the same four-step melody (MIDI 60,
      62, 64, 65 in plain C major) through a MIDI device. Slot 3 (E major) is locked
      on channel step 1, slot 4 (G major) is locked globally on scale-track step 2,
      and Scales lock until ptn end is On. The channel lock takes precedence through
      all four steps, so the strip reads MIDI 64, 66, 68 and 69 (E3, F#3, G#3 and
      A3).'
