- id: scale-lock-scope-and-lifetime
  feature_id: scale-locks
  title: Let a scale lock last for the phrase
  behaviour_case: M-SCALE-LOCK-003
  requirements: &id001
  - SCALE-PRECEDENCE
  - LOCK-SCALE
  - OPT-SCALE-LIFETIME
  - PARAM-PROBABILITY
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-SCALE-LOCK-003
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step melody through a MIDI device: trigs on pattern
      degrees 1 to 4 of C major, so MIDI 60, 62, 64 and 65 in the plain scale. The
      scale track is four steps long. Scale slot 2 (D major) is applied, slot 3 is
      E major (root up four semitones) and slot 4 is G major (root up seven). A global
      scale lock puts slot 4 on scale-track step 2, and a channel lock puts slot 3
      on channel step 1. Scales lock until ptn end is On, its default, so the channel
      lock beats the global lock for the whole pattern. The MIDI strip reads 64, 66,
      68, 69: E major.'
    citation: README.md#scale-locks
