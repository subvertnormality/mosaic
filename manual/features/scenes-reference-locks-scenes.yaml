  authored semantic selector; per-scene deltas include native encoder units and waits.
scenes:
- id: transpose-explicit-zero-and-clear
  feature_id: transposition-locks
  title: Lock transposition without losing the global setting
  behaviour_case: M-TRANS-001
  requirements:
  - LOCK-TRANSPOSE
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-TRANS-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step melody through a MIDI device: trigs on steps
      1 to 4 on pattern degrees 1 to 4 of scale slot 1 (C major), so MIDI 60, 62,
      64 and 65. The Scale page is open on the transposition fader along the bottom
      row. Global transposition is +4 (set at (13,8)). Scale-track step 2 has a transposition
      lock of 0, the fader''s centre at (12,8), and step 1 has a lock of -12, the
      lowest value at (9,8). The MIDI strip reads 48, 62, 64, 65: step 1 sounds an
      octave below its written note, while steps 2 to 4 ignore the global +4 because
      the zero lock on step 2 holds for the rest of the loop. This is how you keep
      one part of a song at its written pitch while the rest is transposed.'
    citation: README.md#transposition-locks
