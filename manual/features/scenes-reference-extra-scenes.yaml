  - id: 'off'
    title: A new slot starts at X
    caption: 'Press K3 to select the Strm slot. It reads X, which means no strum:
      the notes of a chord sound together. Every strum division is chosen with E3
      from here.'
    citation: README.md#chord-strum
    inputs:
    - type: key
      n: 3
      state: 1
    - type: key
      n: 3
      state: 0
    - type: wait
      seconds: 0.06
    - type: key
      n: 2
      state: 1
    - type: key
      n: 2
      state: 0
    - type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: parameter-division-label
        parameter: Chord Note Strum
        value: X
        passed: true
  - id: smallest
    title: First supported division
    caption: 'Turn E3 left a few detents: nothing happens, because X is the lowest
      value. Then turn E3 one detent right. The slot reads 1/24, one twenty-fourth
      of a channel step between chord notes, the smallest strum division.'
    citation: README.md#chord-strum
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -2
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -2
    - type: wait
      seconds: 0.15
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.15
    expect:
      assertion:
        kind: parameter-division-label
        parameter: Chord Note Strum
        value: 1/24
        passed: true
  - id: maximum
    title: Climb to the upper bound
    caption: 'Keep turning E3 right, about ninety detents, through the supported divisions
      until the slot reads 128 channel steps, then turn a few detents further: it
      stays at 128 and extra turns do not go higher.'
