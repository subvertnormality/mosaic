  - id: reversed-end
    title: Refuse an end before the start
    caption: 'Hold step 4 (4,4), tap step 2 (2,4), then release step 2 and step 4.
      The end would come before the start, so Mosaic refuses it: the footer reads
      End must follow start and the grid still shows steps 2 to 4.'
    citation: README.md#channel-length
    inputs:
    - type: grid
      x: 4
      y: 4
      state: 1
    - type: grid
      x: 2
      y: 4
      state: 1
    - type: grid
      x: 2
      y: 4
      state: 0
    - type: grid
      x: 4
      y: 4
      state: 0
    - type: wait
      seconds: 0.01
    - type: wait
      seconds: 0.01
    - type: wait
      seconds: 0.01
    - type: wait
      seconds: 0.01
    expect:
      assertion:
        kind: range-rejection-feedback
        scale_page: false
        sequence: held4-release2
        passed: true
