  - id: plus-one
    title: Press +1 while it plays
    caption: 'Press Scale (4,8) to open the Scale Editor, then tap Play (1,8). One
      step lasts about a sixth of a second at 90 BPM, so the four-note phrase repeats
      about every two thirds of a second; exact timing does not matter. While it loops,
      press (16,8) on the transposition fader once. The screen shows Scale overview
      with Transpose +1: the note sounding at that moment keeps its pitch and length,
      and the next notes play a semitone higher, MIDI 61, 63, 65 and 66, as the MIDI
      strip lists.'
