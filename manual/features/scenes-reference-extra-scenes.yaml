- id: harmony-range-failure-and-fallback
  feature_id: harmony
  title: See a failed voicing and choose a fallback
  behaviour_case: M-HARMONY-FAILURE-001
  requirements:
  - HARMONY-FAILURE
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-HARMONY-FAILURE-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 on MIDI channel 1: C, D, E and F (MIDI 60,
      62, 64, 65; velocities 127, 117, 107, 97) on steps 1 to 4 at 90 BPM, rate /1.
      Harmony is Off with its default registers and Failure fallback SILENCE. Playback
      is stopped and the norns shows the Device page. This scene shows what happens
      when a register leaves no room for a note, as it can after you shift a voice
      into an unusual range.'
    citation: README.md#harmony
