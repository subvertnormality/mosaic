- id: map-scale-to-white-keys
  title: Map Scale to White Keys
  audience: all
  summary: 'Map the selected scale onto MIDI keyboard white keys, starting at C. Default: Off.'
  prose: 'Map scale to white keys is Off by default, so the keyboard plays its own notes. With On, the
    selected scale is laid out on the white keys, with the scale''s first note on C: in C major the white
    keys C D E F G A B C play 60, 62, 64, 65, 67, 69, 71, 72. Choose a different scale and the white keys
    follow it: in C natural minor they play 60, 62, 63, 65, 67, 68, 70, 72. Black keys are outside this
    lesson.'
  musical_use: Play or record in the selected scale without having to think about its sharps and flats.
  related:
  - midi-controller-options
  sources:
    readme: manual/legacy/README-1.4.0.md#map-scale-to-white-keys
    behaviour_cases:
    - M-OPT-KEYS-001
    code:
    - lib/application_parameters.lua
    - lib/devices/midi_input.lua
    - lib/quantiser.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Map scale to white keys. Change its value.
    result: 'On maps the selected scale onto MIDI keyboard white keys starting at C; changing scale changes
      the mapping. Off uses the incoming note numbers. Default: Off.'
  details:
  - title: White-key workflow scope
    text: This procedure covers white-key scale mapping. Black-key mapping is outside this example.
  recipes:
  - title: Play a minor scale on the white keys
    text: 'Starting point: a MIDI keyboard is connected to Mosaic''s MIDI input on port 1, channel 1 has
      a device selected (it plays through the test or your own synth) and the scale is C major. The norns
      names MIDI 60 as C3, so the key you call middle C sounds 60.


      1. Open PARAMS > MOSAIC > Midi control, turn E2 to Map scale to white keys and turn E3 to On. Play
      the white keys from C to C: C major, 60, 62, 64, 65, 67, 69, 71, 72, the same pitches as before.
      Each black key repeats the white key above it.


      2. Open the Scale Editor (4,8). Turn E2 to Scale, turn E3 to natural minor and press K3 to apply
      it. Return to the Channel editor (3,8).


      3. Play C to C on the white keys again: 60, 62, 63, 65, 67, 68, 70, 72. The keyboard keeps its layout
      while the scale underneath it has changed.'
  scene_refs:
  - keyboard-white-key-options
  review:
    status: verified
    cases:
    - M-OPT-KEYS-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
