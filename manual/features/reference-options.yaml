- id: midi-controller-options
  title: MIDI Controller Options
  audience: all
  summary: Set MIDI keyboard white-key mapping and scale transformations.
  prose: 'Open PARAMS > MOSAIC > Midi control. It holds Map scale to white keys and the three Honour switches
    (degree, rotations, transpose). They change what a MIDI keyboard plays and records on the selected
    channel: with mapping Off the keyboard plays its own notes, and with mapping On the white keys play
    the selected scale, optionally shaped by the Scale Editor''s degree, rotation and transposition.'
  musical_use: Play or record the selected scale on the white keys, and choose whether the Scale Editor's
    degree, rotation and transpose also apply.
  related:
  - options
  sources:
    readme: manual/legacy/README-1.4.0.md#midi-controller-options
    behaviour_cases: []
    code:
    - lib/application_parameters.lua
    - lib/ui_adapters/native.lua
  controls:
  - gesture: Open PARAMS > MOSAIC > Midi control
    result: Choose white-key mapping and which scale transformations keyboard input honours.
  details: []
  recipes:
  - title: Map an external keyboard through the scale’s rotated degrees
    text: '1. Open PARAMS > MOSAIC > Midi control and set Honour scale rotations to On.

      2. Play the recorded C3–C4 white-key phrase on the MIDI keyboard.

      3. Compare the complete mapped MIDI phrase at the enabled checkpoint with the unrotated starting
      map.

      Outcome: With Honour scale rotations enabled, the captured keyboard input maps through the rotated
      scale degrees. The enabled phrase is complete; the earlier startup output is truncated and is not
      used as the target.'
  - title: Apply scale rotation and global transpose to every keyboard key
    text: '1. Open PARAMS > MOSAIC > Midi control and set Honour scale transpose to On.

      2. Play the recorded C3–C4 white-key phrase on the MIDI keyboard.

      3. Compare the complete mapped MIDI phrase at the enabled checkpoint with the option disabled.

      Outcome: With Honour scale transpose enabled, global scale transpose affects each mapped key. The
      enabled phrase is complete; the earlier startup output is truncated and is not used as the target.'
