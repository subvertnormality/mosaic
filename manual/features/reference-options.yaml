- id: reset-at-song-editor-pattern-change
  title: Reset at Song Editor Pattern Change
  audience: all
  summary: 'Reset channel positions when the song pattern changes. Default: On.'
  prose: 'Reset on song seq change is On by default. With On, every channel restarts from its first step
    at the moment the Song Editor moves to a different slot, so each section starts together. With Off,
    channels carry on from where they were, including channels whose length does not divide the section.


    The difference shows with a slow channel. Take a three-step channel at Clock Mod /9 (one step every
    1.5 seconds) in a song whose slots are 64 steps long (10.7 seconds). With Off, the notes carry across
    the slot change. With On, the channel''s first note sounds exactly at the change.'
  musical_use: Leave On when each section should start cleanly on its first step. Set Off for polyrhythms
    that keep evolving across sections.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#reset-at-song-editor-pattern-change
    behaviour_cases:
    - M-MERGE-INTERLOCK-009
    - M-TIME-003
    - M-TIME-005
    - M-TIME-008
    - M-TIME-009
    - M-TIME-013
    - M-TIME-014
    code:
    - lib/application_parameters.lua
    - lib/song_transition.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Reset on song seq change. Change its value.
    result: 'On restarts channel positions on a song-pattern transition; Off allows their phases to continue.
      Default: On.'
  details: []
  recipes:
  - title: Hear the section restart
    text: 'Start from channel 1''s four-note pattern, C D E F (MIDI 60, 62, 64, 65), and leave the song''s
      global length at its default of 64 steps.

      1. Set channel 1 to range steps 1-3 (hold step 1 and tap step 3) and Clock Mod /9 (Channel tasks
      > Clock).

      2. In the Song editor, copy slot 1 to slot 2: hold slot 1 at (1,1) and tap slot 2 at (2,1). Select
      slot 2, go to the Channel editor and raise the channel''s octave by one with an octave select button
      at the bottom of the page, then select slot 1 again. Slot 2 now sounds an octave above slot 1.

      3. Open PARAMS > MOSAIC, set Song mode On and Reset on song seq change Off, then play for 23 seconds.
      Slot 2 enters mid-phrase on E4 (76), 12 seconds in.

      4. Turn Reset on song seq change On and play again. Slot 2 now enters on C4 (72), the first step,
      exactly at the change at 10.7 seconds.

      The slot LEDs swap at the change, and the MIDI strip under the example lists the note times for
      each run.'
  scene_refs:
  - song-change-reset-policies
  - polymeter-song-reset
  review:
    status: controlled-verified
    cases:
    - M-TIME-005
    - M-MANUAL-CLOSURE-RESET-001
    note: Current raw publications independently audited; exact current-build timing-lane receipts are
