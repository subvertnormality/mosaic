- id: trigless-locks
  title: Trigless Locks
  audience: all
  summary: 'Apply parameter locks on steps without an active trig. Default: On.'
  prose: 'Trigless locks is On by default. A trigless lock is a parameter lock on a step with no trig,
    a rest. With On, Mosaic still sends the lock on that step, so a filter or other control keeps moving
    while no note plays. With Off, locks on steps without a trig are skipped, and only steps that have
    a trig send their locks.


    A trig that fails its probability check still counts as a trig, so its locks are sent either way;
    only a removed trig is affected by this option. Example: CC 1 locks of 24, 48, 72 and 96 on steps
    1–4. Remove the trig on step 3. With Off, CC 1 sends 24, 48 and 96. With On, it sends all four, 72
    included. Locks are sent just before the step''s note.'
  musical_use: Leave On to keep modulation moving through rests, for example a filter sweep under a sparse
    rhythm. Turn Off so rests stay fully still.
  related:
  - parameter-lock-options
  sources:
    readme: manual/legacy/README-1.4.0.md#trigless-locks
    behaviour_cases:
    - M-MERGE-INTERLOCK-002
    - M-PARAM-022
    - M-PARAM-023
    - M-PARAM-024
    - M-PARAM-025
    - M-PARAM-043
    - M-PATCH-029
    - M-PATCH-030
    - M-REC-PARAM-003
    - M-REC-PARAM-028
    - M-REC-PARAM-029
    - M-REC-PARAM-030
    - M-REC-PARAM-031
    - M-TRIPLE-004
    code:
    - lib/application_parameters.lua
    - lib/clock/m_clock.lua
    - lib/step.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Trigless locks. Change its value.
    result: 'On honours parameter locks on steps with no active trig. Default: On.'
  details: []
  recipes:
  - title: Hear automation on rests
    text: 'Start with a stopped channel with a trig on every step 1 to 4, CC 1 assigned to a Trig params
      slot (see Trig Param Locks), and a device or MIDI monitor that shows CC 1.

      1. Hold each of steps 1 to 4 in turn and lock CC 1 to 24, 48, 72 and 96 with E3.

      2. Open the Pattern editor (grid (5,8)), tap step 3 to remove its trig, and return to the Channel
      editor with (3,8).

      3. Play. Trigless locks is On by default, so the value 72 is still sent at step 3 although no note
      sounds. The scene silences channel 1 with Trig probability 0, so its MIDI strip shows only the CC
      values (24, 48, 72, 96) beside a steady timing reference on channel 2.

      4. Open PARAMS > MOSAIC, select Trigless locks and turn E3 to Off. Play again: step 3''s 72 is no
      longer sent.'
  scene_refs:
  - trigless-locks-on
  - trigless-locks-off
