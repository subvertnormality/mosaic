- id: reset-at-pattern-repeat
  title: Reset at Pattern Repeat
  audience: all
  summary: 'Reset channel positions when the song pattern repeats. Default: Off.'
  prose: 'Reset on pattern repeat is Off by default. With On and Song mode On, every channel returns to
    its first step when the same song slot repeats at the end of its global length. A channel with its
    own length or clock rate therefore starts its phrase again on each repeat. With Off, the channel''s
    phase carries across the repeat, so unequal lengths drift against the song.


    Example: a three-step channel at Clock Mod /9 plays a note every 1.5 seconds, so its three notes 60,
    62, 64 cycle every 4.5 seconds. The slot repeats every 64 steps (10.7 seconds), which is not a whole
    number of cycles. With Off, the cycle carries on across the boundary, so the third note, 64, sounds
    at 12 seconds. With On, note 60 sounds exactly at the boundary. With Song mode Off the slot is not
    repeated by the song, so the reset does not apply.'
  musical_use: Turn On to restart unequal-length channels on every repeat; leave Off to let them drift.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#reset-at-pattern-repeat
    behaviour_cases:
    - M-ARP-004
    - M-SLIDE-RESET-001
    - M-TIME-003
    - M-TIME-004
    - M-TIME-005
    - M-TIME-008
    - M-TIME-009
    - M-TIME-010
    - M-TIME-011
    - M-TIME-012
    code:
    - lib/application_parameters.lua
    - lib/song_transition.lua
    - lib/clock/m_clock.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Reset on pattern repeat. Change its value.
    result: 'On resets channels to their starting steps when the song pattern repeats. Default: Off.'
  details: []
  recipes:
  - title: Restart a slow channel on each repeat
    text: 'Start from channel 1''s four-note pattern, C D E F (MIDI 60, 62, 64, 65), and leave the song
      at one slot with the default 64-step global length. Reset on pattern repeat restarts a channel when
      the same slot loops round; Reset on song seq change restarts it when the song moves to a new slot.

      1. Hold step 1 and tap step 3 to set channel 1 to steps 1-3 (notes 60, 62, 64), and set Clock Mod
      /9.

      2. Open PARAMS > MOSAIC, set Song mode On and both reset options Off, and play for 24 seconds. The
      phrase carries over the boundary at 10.7 seconds.

      3. Turn Reset on pattern repeat On and play again. The first note, 60, restarts exactly at 10.7
      and 21.3 seconds.'
