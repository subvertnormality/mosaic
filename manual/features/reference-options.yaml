features:
- id: options
  title: Options
  audience: all
  summary: 'Configure Mosaic from PARAMS > MOSAIC: playback, parameter locks, quantiser, MIDI keyboard
    and screen settings.'
  prose: 'Mosaic keeps its settings in the norns PARAMS menu, not on the grid. Tap K1 to open the norns
    menu, choose PARAMS, then choose MOSAIC. Turn E2 to move between rows and turn E3 to change the selected
    value. Changes take effect at once; there is no apply step. Press K2 to step back and K1 to close
    the menu.


    The MOSAIC list also holds the project actions (save, load, new). The settings are grouped as Sequencer,
    Parameter locks, Quantiser, Midi control and Screen. Every option is described in its own section
    below with its default, and every option starts at that default in a new project.'
  musical_use: Set how playback stops, how song sections reset, how parameter locks are sent, how notes
    are snapped to a scale, how a MIDI keyboard plays the scale and whether the screen animates.
  related:
  - save-and-load
  sources:
    readme: manual/legacy/README-1.4.0.md#options
    behaviour_cases: []
    code:
    - lib/application_parameters.lua
    - lib/ui_adapters/native.lua
  controls:
  - gesture: Tap K1, open PARAMS > MOSAIC, turn E2 to a row
    result: The row shows its current value on the right.
  - gesture: Turn E3
    result: Changes the selected option's value at once; the new value appears on the row.
  - gesture: Press K2, then K1
    result: Returns from MOSAIC and closes the norns menu. Playback continues while the menu is open.
  details:
  - title: Where each option lives
    text: 'Sequencer: Shift press to stop, Song mode, Reset on song seq change, Reset on pattern repeat,
      Wrap param slides, Elektron program changes and Elektron p.change channel. Parameter locks: Lock
      lead time and Trigless locks. Quantiser: Snap note masks to scale, Quantise note masks, Scales lock
      until ptn end, Lock all to pent., Lock random to pent. and Lock merged to pent. Midi control: Map
      scale to white keys and the Honour switches. Screen: UI motion.'
  recipes:
  - title: Prepare Mosaic for a live set
    text: '1. Tap K1 and open PARAMS > MOSAIC.

      2. Select Shift press to stop and turn E3 to On, so a stray tap cannot stop the sequencer.

      3. Press K2, then K1, and start playback with Play/Stop at grid (1,8). A quick second tap is ignored,
      and so is a hold shorter than one second.

      4. To stop, hold K1 and tap Play/Stop, or hold Play/Stop for one second or more. Shift press stop
      lists every stop gesture.

      5. Leave Song mode On, its default, if the arrangement should advance on its own. [Decide whether
      a slow channel restarts](#reset-at-pattern-repeat/repeat-reset-policies) turns Song mode Off to
      show the difference, and [Set Song slot repetitions](#navigating-the-norns-display/song-slot-repeat-values)
      shows Song mode in Slot setup. The other option groups are described below.'
  scene_refs:
  - protect-stop-gesture
  review:
    status: verified
    cases:
    - M-OPT-STOP-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
    - scene: protect-stop-gesture
      data: reference-stop-scenes.json
      clock_mode: controlled-experimental
      run: /home/andy/mosaic-manual-runs/fa19b041ff83422fb56cbf7cf8d500fd
      data_sha256: 3027bcc85ea333211b21ea12761c48ff541882e05c54009749cc046a941572d0
      case: M-OPT-STOP-001
      assertions:
      - &id001
        kind: stop-safety
        stage: default-tap
        transport: stopped
        passed: true
      - &id002
        kind: stop-safety
        stage: on-short-tap-ignored
        transport: playing
        passed: true
      - &id003
        kind: stop-safety
        stage: on-hold-below-threshold-ignored
        transport: playing
        passed: true
      - &id004
        kind: stop-safety
        stage: on-shift-K1-tap-stops
        transport: stopped
        passed: true
      - &id005
        kind: stop-safety
        stage: on-long-press-stops
        transport: stopped
        passed: true
      - &id006
        kind: stop-safety
