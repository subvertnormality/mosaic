- id: lock-random-to-pentatonic
  title: Lock Random to Pentatonic
  audience: all
  summary: 'Restrict notes changed by random trig locks to Mosaic’s five-note scale selection. Default:
    On.'
  prose: 'Lock random to pent. is On by default. Random Note and Twos Random Note shift a note by a random
    number of scale degrees. With On, a note moved by a nonzero random offset snaps to the nearest note
    of Mosaic''s five-note selection for the scale; with Off it lands on any of the seven scale degrees.
    A step whose random offset is zero keeps its own note.


    Example with Random Note 4 (offsets -2 to +2 degrees) on C D E F: with Off the draws can land on F
    (65) and B (59) as well as C, D, E, G and A. With On, every note moved by a random offset is one of
    C D E G A. The capture uses a fixed random seed; your own runs will differ each time.'
  musical_use: Leave On so random pitch changes stay consonant; turn Off to let random notes use the whole
    scale.
  related:
  - quantiser-options
  sources:
    readme: manual/legacy/README-1.4.0.md#lock-random-to-pentatonic
    behaviour_cases:
    - M-PARAM-039
    - M-PARAM-040
    - M-PARAM-041
    - M-PARAM-042
    - M-TRIPLE-001
    code:
    - lib/application_parameters.lua
    - lib/step.lua
    - lib/quantiser.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Lock random to pent.. Change its value.
    result: 'On restricts notes changed by random trig locks to the selected scale’s Mosaic five-note
      selection. Default: On.'
  details: []
  recipes:
  - title: Compare random notes with and without the filter
    text: 'Lock random to pent. is On by default. This recipe lets you hear what it does by switching
      it Off and On with Random Note at 4. Random Note chooses its offsets at random, so listen to several
      loops: a short run may not include every note.


      Starting point: channel 1 plays pattern 1 (C, D, E, F on steps 1 to 4) in C major; no Trig params
      slot is assigned yet.


      1. Assign Random Note. Select channel 1 and press E1 to Channel tasks, turn E2 to Trig params and
      press K3. Press K2 to open the parameter list, turn E3 to Random Note, press K3 to assign it to
      the first slot and press K2 to return. The slot reads 0 and the pattern still plays C, D, E, F.


      2. Set the amount. With the Random Note slot selected (E2), turn E3 four detents right to 4. Each
      note is now offset by -2, -1, 0, +1 or +2 scale degrees at random. A step that draws offset 0 keeps
      its own note.


      3. Open PARAMS > MOSAIC, select Lock random to pent. and turn E3 to Off. Close the menu, tap Play
      and listen to several loops: F and B join the random notes, and one of them will turn up within
      a few passes. Tap Play to stop.


      4. Turn Lock random to pent. On and play several loops again. The random notes now stay on C, D,
      E, G and A. A step that draws offset 0 keeps its own note, so a plain F in the pattern can still
      sound. The random stream is not reset between the two runs, so the two runs will not start with
      the same notes; compare which notes occur, not the order.'
