- id: honor-scale-rotations
  title: Honor Scale Rotations
  audience: all
  summary: 'Apply scale rotation to mapped MIDI keyboard input. Default: Off.'
  prose: 'Honour scale rotations is Off by default. With On, the scale''s rotation setting from the Scale
    Editor also applies to the white-key mapping. Rotation 2 lowers the last two scale positions, the
    white keys A and B, by an octave. In natural minor with degree II also honoured, C to C plays 62,
    63, 65, 67, 68, 58, 60, 74.


    Honour switches only change the white-key mapping. Set them after turning on Map scale to white keys;
    with it Off the keyboard plays its original notes.'
  musical_use: Voice the keyboard with the same rotation as the scale, so the top positions of the scale
    fall below the bottom.
  related:
  - midi-controller-options
  sources:
    readme: manual/legacy/README-1.4.0.md#honor-scale-rotations
    behaviour_cases:
    - M-OPT-KEYS-001
    code:
    - lib/application_parameters.lua
    - lib/devices/midi_input.lua
    - lib/quantiser.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Honour scale rotations. Change its value.
    result: 'On applies the selected scale’s rotation to the mapped MIDI keyboard input. Default: Off.'
  details:
  - title: Mapping dependency
    text: These honour switches affect the quantised white-key mapping. With Map scale to white keys Off,
      MIDI input uses the original incoming pitch.
  recipes:
  - title: Map an external keyboard through the scale’s rotated degrees
    text: '1. Open PARAMS > MOSAIC > Midi control and set Honour scale rotations to On.

      2. Play the recorded C3–C4 white-key phrase on the MIDI keyboard.

      3. Compare the complete mapped MIDI phrase at the enabled checkpoint with the unrotated starting
      map.

      Outcome: With Honour scale rotations enabled, the captured keyboard input maps through the rotated
      scale degrees. The enabled phrase is complete; the earlier startup output is truncated and is not
      used as the target.'
