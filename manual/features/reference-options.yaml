- id: honour-scale-transpose
  title: Honour Scale Transpose
  audience: all
  summary: 'Apply scale transposition to mapped MIDI keyboard input. Default: Off.'
  prose: 'Honour scale transpose is Off by default. With On, the scale''s transposition from the Scale
    Editor also shifts the white-key mapping. With degree II, rotation 2 and transpose +2 all honoured,
    C to C in natural minor plays 64, 65, 67, 69, 70, 60, 62, 76; with only transpose honoured, every
    note is two semitones above the plain mapping.


    Honour switches only change the white-key mapping. Set them after turning on Map scale to white keys;
    with it Off the keyboard plays its original notes.'
  musical_use: Keep the keyboard in the same key as a transposed scale.
  related:
  - midi-controller-options
  sources:
    readme: manual/legacy/README-1.4.0.md#honour-scale-transpose
    behaviour_cases:
    - M-OPT-KEYS-001
    code:
    - lib/application_parameters.lua
    - lib/devices/midi_input.lua
    - lib/quantiser.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Honour scale transpose. Change its value.
    result: 'On applies the selected scale transposition to the mapped MIDI keyboard input. Default: Off.'
  details:
  - title: Mapping dependency
    text: These honour switches affect the quantised white-key mapping. With Map scale to white keys Off,
      MIDI input uses the original incoming pitch.
  recipes:
  - title: Apply scale rotation and global transpose to every keyboard key
    text: '1. Open PARAMS > MOSAIC > Midi control and set Honour scale transpose to On.

      2. Play the recorded C3–C4 white-key phrase on the MIDI keyboard.

      3. Compare the complete mapped MIDI phrase at the enabled checkpoint with the option disabled.

      Outcome: With Honour scale transpose enabled, global scale transpose affects each mapped key. The
      enabled phrase is complete; the earlier startup output is truncated and is not used as the target.'
  scene_refs:
  - keyboard-honour-all
  review:
    status: controlled-verified
