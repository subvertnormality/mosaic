- id: sinfonion-connect
  title: Sinfonion Connect
  audience: all
  summary: Synchronise Mosaic with Sinfonion using the external norns2sinfonion bridge.
  prose: 'Mosaic can synchronise harmony with a Eurorack Sinfonion module through the DIY [norns2sinfonion](https://github.com/subvertnormality/norns2sinfonion)
    bridge. This needs extra hardware and software: follow the bridge''s own setup instructions, then
    use Mosaic as usual. Mosaic has no separate Sinfonion option in PARAMS > MOSAIC.'
  musical_use: Send Mosaic's harmonic changes to a Sinfonion module so the rest of a Eurorack system follows
    the same key.
