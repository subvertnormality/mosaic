- id: song-mode
  title: Song Mode
  audience: all
  summary: 'Advance through the song sequence automatically. Default: On.'
  prose: 'Song mode is On by default. With Song mode On, the song steps through its slots on its own,
    according to the Song Editor''s global length and the groups of slots you filled. Playback moves from
    one slot to the next when the current slot reaches its global length, and a group of slots loops.


    With Song mode Off, Mosaic keeps playing the selected slot and moves only when you select another
    slot yourself. Use Off to rehearse a single section or to move between sections by hand. Song mode
    also decides whether the repeat reset in Reset on pattern repeat applies: with Song mode Off, a repeating
    slot is not reset.'
  musical_use: Leave On for a finished arrangement; turn Off to stay on one section or move between sections
    by hand.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#song-mode
    behaviour_cases:
    - M-MERGE-INTERLOCK-009
    - M-SONG-FLOW-001
    - M-TIME-003
    - M-TRANS-007
    code:
    - lib/application_parameters.lua
    - lib/song_transition.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Song mode. Change its value.
    result: 'On advances through the song editor sequence; Off leaves progression to manual selection.
      Default: On.'
  details: []
  recipes:
  - title: Rehearse one section
    text: 'Starting point: Song mode is On (the default) and the song has two filled slots, slot 1 and
      slot 2, so it would normally play 1, 2, 1, 2 and so on. Playback is stopped.


      1. Open PARAMS > MOSAIC (tap K1), select Song mode and turn E3 to Off.


      2. Press Song (6,8) to open the Song editor. The slots are the buttons on rows 1 to 6; slot 1 is
      (1,1) and slot 2 is (2,1). Tap the slot you want to rehearse, for example slot 1 at (1,1).


      3. Press Play at (1,8). The slot repeats: with Song mode Off it never moves on to slot 2 by itself,
      so you hear the same section again and again.


      4. To move to another section, tap its slot, for example (2,1) while the music plays. The press
      is queued and takes over when the current pass ends. Turn Song mode On again to run the whole arrangement.


      For comparison, with Song mode On the same two slots play 1, 2, 1, 2. The captured example [Loop
      a song group or hold one slot](#song-mode-operations/song-mode-groups-and-selection) shows both:
      with Song mode On a group of slots loops, and with Song mode Off slot 1 repeats (60, 62, 60, 62)
      and a manual selection of slot 2 still takes over at the end of the pass.'
  scene_refs:
  - song-mode-groups-and-selection
  review:
    status: verified
    cases:
    - M-SONG-FLOW-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
