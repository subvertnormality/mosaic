- id: parameter-lock-options
  title: Parameter Lock Options
  audience: all
  summary: Set lock lead time, trigless locks and resending of unchanged lock values.
  prose: Open PARAMS > MOSAIC > Parameter locks. This group holds Lock lead time (how early a lock is
    sent before its step), Trigless locks (whether locks on steps without a trig are sent) and the option
    for resending unchanged lock values. Resend unchanged locks is On by default; with Off, Mosaic sends
    a slot's value only when it changes, which eases the load on busy projects. Turn E2 to a row and E3
    to change it.
  musical_use: 'Decide how parameter locks reach the assigned device: how early, on rests or not, and
    whether unchanged values are resent.'
  related:
  - options
