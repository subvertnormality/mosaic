  level: 3
- id: sequencer-options
  title: Sequencer Options
  audience: all
  summary: Set stop protection, song progression, resets, slide wrapping and program changes.
  prose: Open PARAMS > MOSAIC and scroll to the Sequencer options. They decide how playback starts and
    stops, how the song moves between slots and what each slot change or repeat does to the channels,
    how a slide behaves at the loop end, and whether Mosaic sends program changes to a receiver. Turn
    E2 to a row and turn E3 to change it.
  musical_use: Choose how the sequencer stops, advances through song slots, restarts its channels and
    talks to an external pattern-based instrument.
  related:
  - options
  sources:
    readme: manual/legacy/README-1.4.0.md#sequencer-options
    behaviour_cases: []
    code:
    - lib/application_parameters.lua
    - lib/ui_adapters/native.lua
  controls:
  - gesture: Open PARAMS > MOSAIC > Sequencer
    result: Choose Shift press to stop, Song mode, the two reset options, Wrap param slides and the Elektron
      settings.
  details:
  - title: Defaults
    text: Shift press to stop Off. Song mode On. Reset on song seq change On. Reset on pattern repeat
      Off. Wrap param slides Off. Elektron program changes Off, on channel 10.
  - title: Which lesson to read
    text: 'Stopping safely: Shift press stop. Song sections: Song mode and the two reset options, read
      in that order. Slides across the loop end: Parameter slides wrap. Syncing a pattern-based receiver:
      Elektron program changes.'
  recipes:
  - title: Arrange sections that restart together
    text: '1. Hold step 1 on the Channel editor and tap step 3 to give channel 1 a three-step range, shorter
      than the 64-step slot. In the Song editor (grid (6,8)) hold slot 1 at (1,1) and tap slot 2 at (2,1)
      to copy it, so the song has two slots.

      2. Open PARAMS > MOSAIC. Leave Song mode On and Reset on song seq change On, close the menu and
      press Play. Watch the slot LEDs: slot 1 is bright.

      3. After 10.7 seconds (64 steps at 90 BPM) the LEDs swap to slot 2. Because the reset is On, channel
      1 starts its three-step line again on its first step at that moment, so it lines up with the section
      at every change.

      4. Stop, turn Reset on song seq change Off and play again. The three-step line now carries on across
      the change and drifts against the sections, which is the right choice for evolving polyrhythms.

      Reset at Song Editor Pattern Change shows the same lesson with the exact note times.'
  scene_refs:
  - song-change-reset-policies
  review:
    status: verified
    cases:
    - M-OPT-STOP-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
    - scene: protect-stop-gesture
      data: reference-stop-scenes.json
      clock_mode: controlled-experimental
      run: /home/andy/mosaic-manual-runs/fa19b041ff83422fb56cbf7cf8d500fd
      data_sha256: 3027bcc85ea333211b21ea12761c48ff541882e05c54009749cc046a941572d0
      case: M-OPT-STOP-001
      assertions:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      scope: Overview demonstrates the protected Stop option; Song mode already has its directly asserted
        workflow.
    applicability: native-ui
    native_gap: Real-time replay is queued for this controlled diagnostic batch; physical norns scheduling
      equivalence is not established.
    rationale: Overview demonstrates the protected Stop option; Song mode already has its directly asserted
      workflow.
