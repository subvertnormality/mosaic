- id: lock-all-to-pentatonic
  title: Lock All to Pentatonic
  audience: all
  summary: 'Restrict resolved notes to Mosaic’s five-note selection for the selected scale. Default: Off.'
  prose: 'Lock all to pent. is Off by default. With On, every resolved note is restricted to Mosaic''s
    five-note selection for the selected scale: degrees 1/2/3/5/6 for Major, 1/3/4/5/7 for Minor, 2/3/5/6/7
    for Lydian, and so on (the full list is under Lock merged to pentatonic). A note outside the selection
    moves to the nearest allowed pitch, and an exact tie picks the lower one.


    Example in C major with a seven-step pattern of degrees I–VII: Off plays 60, 62, 64, 65, 67, 69, 71.
    On plays 60, 62, 64, 64, 67, 69, 72 (F falls to E, B rises to C). In C natural minor, On plays 60,
    63, 63, 65, 67, 67, 70. In Lydian, the tonic C snaps down to B, giving 59, 62, 64, 67, 67, 69, 71.'
  musical_use: Turn On to keep every note inside a five-note set so loose or generative material stays
    consonant.
  related:
  - quantiser-options
  sources:
    readme: manual/legacy/README-1.4.0.md#lock-all-to-pentatonic
    behaviour_cases:
    - M-OPT-PENT-ALL-001
    code:
    - lib/application_parameters.lua
    - lib/step.lua
    - lib/quantiser.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Lock all to pentatonic. Change its value.
    result: 'On restricts resolved notes to Mosaic’s five-note selection for the selected scale. Default:
      Off.'
  details: []
  recipes:
  - title: Hear every note restricted
    text: 'Use this option to keep generated, random or merged material consonant: with Lock all to pent.
      On, every note lands on the five-note version of the scale. The seven-note walk below is a diagnostic
      rather than a phrase, so you can hear exactly which degrees are replaced. Starting point: channel
      1 plays pattern 1 (C, D, E, F on steps 1 to 4) in C major.


      1. Build seven degrees. Press Pattern (5,8), select pattern 1 (1,1) and tap trigs on steps 5, 6
      and 7 at (5,4), (6,4) and (7,4). Press Pattern (5,8) again for the note page and tap (5,3), (6,2)
      and (7,1) to put steps 5 to 7 on degrees V, VI and VII: steps 1 to 7 now form a rising diagonal.


      2. Set the range. Press Channel (3,8), hold step 1 (1,4), tap step 7 (7,4) and release both. Tap
      Play (1,8) and listen: 60, 62, 64, 65, 67, 69, 71. Tap Play to stop.


      3. Restrict the notes. Tap K1, open PARAMS > MOSAIC, select Lock all to pent. and turn E3 to On.
      Close the menu and tap Play: 60, 62, 64, 64, 67, 69, 72. F falls to E and B rises to C because only
      C D E G A are allowed. Tap Play to stop.


      4. Change the scale. Open the Scale Editor (4,8), turn E3 to another scale, press K3 and return
      to Channel (3,8). Play again: each scale has its own five notes. Natural minor, for example, gives
      60, 63, 63, 65, 67, 67, 70.


      5. Turn the option Off in PARAMS > MOSAIC to restore all seven degrees of the current scale.'
