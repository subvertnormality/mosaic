- id: shift-press-stop
  title: Shift press stop
  audience: all
  summary: 'Require K1 or a long press to stop playback. Default: Off.'
  prose: 'Shift press to stop protects a performance from an accidental stop. With it On, a short tap
    on Play/Stop (grid (1,8)) no longer stops playback. Starting playback is not affected: a tap still
    starts it. To stop, hold K1 and tap Play/Stop, or hold Play/Stop for one second or more. A hold of
    0.9 seconds is too short and is ignored. Holding K3 while tapping does not count as shift.


    With the option Off, a tap on Play/Stop stops playback, as in an ordinary project.'
  musical_use: Turn it On before performing, and Off again when editing, so a stray tap cannot stop a
    live pattern.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#shift-press-stop
    behaviour_cases:
    - M-OPT-STOP-001
    code:
    - lib/application_parameters.lua
    - lib/m_grid.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Shift press to stop. Turn E3 to On.
    result: 'The row shows On. A short tap on Play/Stop no longer stops playback. Default: Off.'
  - gesture: Hold K1 and tap Play/Stop at grid (1,8)
    result: Playback stops and every sounding note is released.
  - gesture: Hold Play/Stop at grid (1,8) for one second or more
    result: Playback stops. A shorter hold, about 0.9 seconds, is ignored.
  details:
  - title: What is protected
    text: Only stopping is protected. A tap starts playback in either setting.
  recipes:
  - title: Play a set without accidental stops
    text: '1. Open PARAMS > MOSAIC, select Shift press to stop and turn E3 to On. Press K2, then K1.

      2. Press Play/Stop at (1,8) to start. A quick second tap does nothing and the phrase continues.

      3. To finish, hold K1 and tap Play/Stop, or hold Play/Stop for a second.

      4. Turn the option Off afterwards if you want tap-to-stop again.'
  scene_refs:
  - protect-stop-gesture
  review:
    status: verified
    cases:
