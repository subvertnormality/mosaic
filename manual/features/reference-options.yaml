- id: lock-merged-to-pentatonic
  title: Lock Merged to Pentatonic
  audience: all
  summary: 'Restrict merged notes to Mosaic’s scale-specific five-note selection. Default: On.'
  prose: 'Lock merged to pent. is On by default. A merge mode combines the notes of several patterns;
    this option restricts the result to Mosaic''s five-note selection for the selected scale. Example
    in C major with pattern 1 on degrees I, III, V, VII and pattern 2 on III, V, VII, I: Average merge
    gives degrees II, IV, VI, IV. With Off you hear 62, 65, 69, 65 (D F A F). With On, F is not in the
    major selection and snaps to the nearer E, so you hear 62, 64, 69, 64.


    The selections use one-based degrees of each named seven-note scale:

    - Major and Harmonic Major: 1/2/3/5/6.

    - Minor, Harmonic Minor and Melodic Minor: 1/3/4/5/7.

    - Dorian: 1/2/4/5/7.

    - Phrygian: 1/3/4/6/7.

    - Lydian: 2/3/5/6/7.

    - Mixolydian: 1/2/4/5/6.

    - Locrian: 2/3/4/6/7.


    Apply the named scale''s alterations to these degrees. The selection does not always retain the tonic
    or avoid semitones.


    Merged values remain seven-note scale degrees, not five-note indices. Their scale pitches snap to
    the nearest selected pitch across repeated octaves. An exact tie selects the lower pitch. Snapping
    can cross an octave boundary.


    For example, Lydian C snaps to the B below it. Melodic Minor A snaps down to G rather than the equally
    distant B.


    The scale root is used when set; otherwise, the song root is used. The effective octave offset is
    applied afterward.'
  musical_use: Leave On so merge results stay inside the five-note selection; turn Off to hear the merge
    results unchanged.
  related:
  - quantiser-options
  sources:
    readme: manual/legacy/README-1.4.0.md#lock-merged-to-pentatonic
    behaviour_cases:
    - M-MERGE-011
    - M-MERGE-019
    - M-MERGE-023
    - M-MERGE-043
    - M-MERGE-044
    - M-MERGE-TRIG-002
    - M-TRIPLE-001
    code:
    - lib/application_parameters.lua
    - lib/step.lua
    - lib/quantiser.lua
    - lib/musical_resolution/pitch_resolution.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Lock merged to pent.. Change its value.
    result: 'On snaps merged scale degrees to Mosaic’s scale-specific five-note selection; the lower pitch
      wins exact ties and snapping can cross octaves. Default: On.'
  details: []
  recipes:
  - title: Compare merged notes with and without the filter
    text: 'Lock merged to pent. is On by default. Merge modes can produce notes that no pattern contains,
      such as an average between two degrees; this option snaps those results onto the five-note version
      of the scale. Use this recipe to hear the difference.


      Starting point: channel 1 is empty and the scale is C major.


      1. Build pattern 1 on degrees I, III, V, VII (C E G B) on steps 1 to 4 and pattern 2 on III, V,
      VII, I (E G B C) on steps 1 to 4, as in Build a phrase, and pattern 3 as a velocity source (four
      trigs on steps 1 to 4, never assigned to the channel). Both note patterns have a trig on all four
      steps.


      2. Assign both patterns to channel 1 with (1,2) and (2,2).


      3. Choose the merge modes. Both patterns trig on the same steps, and the default trig merge, Skip,
      silences steps that trig in more than one pattern, so set the trig merge to All: press the trig
      merge button (14,8) until Channel tasks > Merge modes shows ALL. Check that the note merge reads
      AVERAGE; the average of each pair of degrees is II, IV, VI, IV (D, F, A, F).


      4. Open PARAMS > MOSAIC, select Lock merged to pent. and turn E3 to Off. Tap Play: 62, 65, 69, 65
      (D, F, A, F). Tap Play to stop.


      5. Turn Lock merged to pent. On and play again: 62, 64, 69, 64. The two F notes become E, because
      F is not in the pentatonic.'
