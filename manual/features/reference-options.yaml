- id: parameter-slides-wrap
  title: Parameter Slides Wrap
  audience: all
  summary: 'Let the final parameter slide of a loop run to the first lock across the loop boundary. Default:
    Off.'
  prose: 'Wrap param slides is Off by default. A parameter slide moves a value smoothly from one lock
    to the next. The last lock in a loop has no later lock to slide toward, so with Off it holds its value
    and the first lock is recalled when the loop restarts. With On, and the current song pattern repeating,
    the last slide runs on to the first lock of the same pattern, so the value arrives at the first lock
    with the first note of the next loop.


    Example: CC 1 locks of 24 on step 1, 96 on step 3 and 48 on step 4, with a slide on step 4 in a four-step
    loop at 90 BPM. With Off, CC 1 holds 48 through step 4 and jumps to 24 at the loop point. With On,
    it descends in a straight line from 48 to 24 over one sixteenth-note step (one sixth of a second)
    and reaches 24 with the next first note.'
  musical_use: Turn On for a cyclic sweep, such as a filter that returns to its start without a jump.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#parameter-slides-wrap
    behaviour_cases:
    - M-PATCH-018
    - M-PATCH-021
    - M-PATCH-022
    - M-PATCH-023
    - M-PATCH-026
    - M-SLIDE-STEP-001
    code:
    - lib/application_parameters.lua
    - lib/models/program.lua
    - lib/clock/slide_lifetime.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Wrap param slides. Change its value.
    result: 'On lets an eligible final parameter slide target the first lock within the repeating pattern;
      different song patterns are not joined. Default: Off.'
  details:
  - title: What counts as the boundary
    text: Wrapping follows the channel's configured start and end steps, so with a four-step range the
      wrap happens at step 4, not at step 64. It is also limited by the song pattern's global length.
  - title: What it does not join
    text: Slides do not run from one song pattern to a different one; the wrap happens only inside a repeating
      pattern.
  recipes:
  - title: Sweep a filter around the loop
    text: 'Start with a stopped channel with trigs on steps 1 to 4 and Wrap param slides Off (its default)
      in PARAMS > MOSAIC.

      1. Open Trig params: turn E1 to Channel tasks, turn E2 to Trig params, press K3. Press K2, turn
      E3 to CC 1 (or the CC that drives your filter), press K3 to assign it and K2 to return.

      2. Hold step 1 and turn E3 to 24, release; hold step 3 and turn E3 to 96, release; hold step 4 and
      turn E3 to 48, release. Step 2 has no lock, so it sends only the channel default (the scenes store
      63).

      3. Hold step 4 and press K3 to give that last lock a slide.

      4. Press Play and let it loop. On a MIDI monitor, or in the MIDI strip of the scene Carry a slide
      across the loop boundary, CC 1 holds 48 from step 4 and then jumps to 24 at the loop point. Stop.

      5. Open PARAMS > MOSAIC, select Wrap param slides and turn E3 to On, then Play again. CC 1 now glides
      from 48 through 40 and 32 to 24 across one step and arrives with the first note.'
  scene_refs:
  - last-lock-slide-wrap
  review:
    status: verified
    cases:
    - M-SLIDE-STEP-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
