- id: ui-motion
  title: UI Motion
  audience: all
  summary: 'Enable decorative screen motion. Default: On. This setting does not change sequencer timing
    or input.'
  prose: 'UI motion is On by default. It controls the decorative animation of the norns screen only; it
    never changes sequencer timing, input or the notes you hear. With Off the screen is still.


    With On, a miniature graphic in the header identifies the screen and moves with the music: while playing
    it follows the sequencer''s transport pulses, while stopped it follows the selected norns musical
    clock without starting playback. With Off, or if the clock is missing or invalid, it holds its rest
    pose. The start-up animation, the shadow that glides across the Masks and Trig params grids, values
    that roll into place, the characters on some screens and the small dial beside a single numeric value
    are decoration and are governed by the same setting.


    Only the selected label or value that is too long for its row scrolls right to left. Fitting labels,
    neighbouring rows, the title and controls stay still. A long selected value first gets its own full-width
    row. With motion Off, shortened text ends in ~, and an exact value that cannot fit shows LAYOUT OVERFLOW
    instead of silently changing.


    The light running round the Mosaic mark, the shadow gliding across the Masks and Trig params grids
    (diagonally when it changes row) and values rolling into place all stop with motion Off. The Rhythm
    Doctor dances to the tempo of the captured bank, and the Merge Shape garden sways and the Harmony
    choir bobs while the sequencer plays. Motion never delays input and never hides a value for more than
    a moment.'
  musical_use: Turn Off for a calm, still screen, or when photographing or filming the display; leave
    On for animated feedback.
  related:
  - screen-options
  sources:
    readme: manual/legacy/README-1.4.0.md#ui-motion
    behaviour_cases: []
    code:
    - lib/application_parameters.lua
    - lib/ui_motion.lua
    - lib/ui_render.lua
    - lib/ui_characters.lua
    - lib/ui_live.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select UI motion. Change its value.
    result: 'Off keeps the screen still; On enables decorative motion and musical characters without changing
      input or sequencer timing. Default: On.'
  details:
  - title: Selected overflow text
    text: Overflow scrolling is restricted to the selected label or value. Fitting text and neighboring
      rows remain stationary. Off stops scrolling; ~ indicates shortened text, and exact values that cannot
      fit report LAYOUT OVERFLOW.
  - title: Miniature header timing
    text: Playing uses musical sequencer transport position. Stopped uses the selected musical clock and
      does not start Mosaic or sound notes. Off or missing/invalid clock holds the rest pose. Native PARAMS
      owns its own screen.
  recipes:
  - title: Compare the screen with motion Off and On
    text: 'Use this to see what the setting does before you film or photograph the display. Changing a
      value only makes the screen react: the point is the header mark.

      1. Tap K1 and open PARAMS > MOSAIC. Select UI motion in the Screen section and turn E3 to Off.

      2. Turn E1 to open Channel tasks, select Clock and press K3. Turn E3 to /1.5 and press K3, then
      restore /1. All values stay readable and the header mark does not move.

      3. Return to PARAMS, set UI motion to On, and repeat. The header mark now animates; values are as
      readable as before.

      4. Play the pattern in each setting. The notes and timing are identical.'
  scene_refs:
  - screen-motion-on-and-off
  - public-display-readability
