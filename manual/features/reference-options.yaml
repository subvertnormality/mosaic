- id: elektron-program-changes
  title: Elektron Program Changes
  audience: all
  summary: 'Send program changes for Mosaic song-pattern selections and transitions. Default: Off.'
  prose: 'Elektron program changes is Off by default. With On, Mosaic sends a MIDI program change whenever
    it selects or moves to a song slot, so a receiving pattern-based instrument follows your song. The
    example in this manual uses the Digitakt device configuration; any receiver that accepts program changes
    on the same channel works the same way.


    The value counts from 0 on the wire. Song slot 1 sends value 0, which the receiver labels pattern
    1; slot 2 sends 1, labelled pattern 2. While playing, each incoming slot is announced once, at least
    half a step (about 83 ms at 90 BPM) before its first note, and pressing Play first sends the slot
    that is about to sound. Set the receiver to accept program changes, and set the channel in Elektron
    p.change channel.'
  musical_use: Keep an Elektron pattern selection in step with Mosaic's song slots.
  related:
  - sequencer-options
  sources:
    readme: manual/legacy/README-1.4.0.md#elektron-program-changes
    behaviour_cases:
    - M-OPT-ELEK-001
    - M-OPT-ELEK-002
    - M-OPT-ELEK-003
    - M-OPT-ELEK-004
    code:
    - lib/application_parameters.lua
    - lib/song_transition.lua
    - lib/clock/m_clock.lua
    - lib/m_midi.lua
  controls:
  - gesture: Open PARAMS > MOSAIC. Select Elektron program changes. Change its value.
    result: 'On sends MIDI program changes associated with Mosaic song-pattern changes; the receiving
      device must be configured to accept them. Default: Off.'
  details: []
  recipes:
  - title: Follow Mosaic's slots with a Digitakt
    text: '1. Give the song two slots. In the Song editor (grid (6,8)) hold slot 1 at (1,1) and tap slot
      2 at (2,1) to copy it. Set Global length to 4 steps if you want to hear the changes quickly.

      2. On channel 1''s Device screen choose the Digitakt configuration. Set the receiver to accept program
      changes on MIDI channel 10, its default. If you have no Digitakt, watch the MIDI output instead:
      the strip lists Program 1 (ch 10) and Program 0 (ch 10), the bytes C9 01 and C9 00.

      3. Open PARAMS > MOSAIC, select Elektron program changes and turn E3 to On.

      4. While stopped, press song slot 2 at grid (2,1). Mosaic sends program change C9 01 and the receiver
      switches to its pattern 2 (wire value 1); the strip lists Program 1 (ch 10). Press slot 1 for pattern
      1 (C9 00, Program 0 (ch 10)).

      5. Select slot 1 and press Play. Each slot change is announced once, just before the new slot sounds.'
