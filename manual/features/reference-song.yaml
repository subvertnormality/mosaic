features:
- id: song-editor
  title: Song Editor
  audience: all
  summary: Select and arrange 96 Song Sequence slots on six grid rows. Each slot stores its pattern, channel
    and harmonic setup.
  prose: 'The Song Editor contains 96 Song Sequence slots, arranged in six rows of 16. Slot 1 is grid
    (1,1), slot 2 is (2,1), slot 16 is (16,1), slot 17 is (1,2) and slot 96 is (16,6). Each slot stores
    one complete sequence: which patterns each channel plays, merge modes, masks, scales, mutes and the
    sequence length. Use a slot for each section of a song.


    Press Song, grid (6,8), to open the editor. The norns shows Song Playback. Fill slots by copying a
    finished section into a new slot and editing the copy (see Interacting with Slots). Read slot brightness
    in Button Indicators. Let Song mode chain slots automatically with Song Mode Operations. Set how many
    steps a section plays with the fader on row 7 (Adjusting Song Sequence Length).


    Watch: [Song editor demo](https://youtu.be/J1ckUZvhFJ0?t=2972)'
  musical_use: Store variations in separate slots. Select slots during playback or enable Song mode for
    automatic progression.
  related:
  - dig-deeper
  sources:
    readme: manual/legacy/README-1.4.0.md#song-editor
    behaviour_cases:
    - M-SONG-FLOW-001
    - M-SONG-COPY-001
    - M-SONG-SETTINGS-001
    - M-SONG-SETTINGS-002
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/models/program.lua
    - lib/song_transition.lua
  controls:
  - gesture: Press Song at grid (6,8).
    result: The Song Editor opens on Song Playback. Grid rows 1–6 contain the 96 Song slots.
  - gesture: Press a Song slot, for example (2,1) for slot 2.
    result: Select it immediately while stopped, or queue it for the current sequence boundary during
      playback.
  - gesture: Hold a source slot and press a destination slot.
    result: Copy the source slot over the destination. See Interacting with Slots.
  - gesture: Press a button on the fader at row 7, columns 1–8.
    result: Set the selected slot’s global length, from 1 to 64 steps. See Adjusting Song Sequence Length.
  details:
  - title: Song slot contents
    text: Copying a Song slot copies its sequence configuration. Source note patterns and channel settings
      can be reused or changed within the copied slot.
  recipes:
  - title: Create a two-slot group
    text: 'Starting point: slot 1 holds a four-step motif on channel 1 (C D E F, MIDI 60, 62, 64, 65;
      build it as in Creating a First Loop), playback is stopped and Song mode is On (the default; Song
      Playback shows it as AUTO). Slots 2 and 3 are empty and dim at (2,1) and (3,1).


      1. Press Song (6,8). Slot 1 at (1,1) is bright because it is selected. A slot plays 64 steps by
      default, about eleven seconds at 90 BPM with Rate /1, so shorten the audition first: tap (2,7) to
      set the global length to 1 step, then tap (8,7) three times to make it 4 steps. The length belongs
      to the slot, so the copy in step 2 keeps it.


      2. Hold slot 1 at (1,1), press slot 2 at (2,1), then release both. Slot 2 turns mid-bright: it is
      a full copy of slot 1.


      3. Tap slot 2 at (2,1). It turns bright and slot 1 drops to mid-bright.


      4. Press Channel (3,8), tap channel 1 at (1,1) and tap octave +1 at (11,8). Slot 2 now plays the
      motif an octave higher. Slot 1 is unchanged. Change a rhythm or a mask instead of the octave if
      you prefer.


      5. Press Song (6,8) and look at slot 3 at (3,1). It stays dim because it is empty, and an empty
      slot ends the group after slot 2.


      6. Tap slot 1 at (1,1) and press Play (1,8). Slot 1 plays the motif (60, 62, 64, 65), then slot
      2 plays it an octave higher (72, 74, 76, 77), then playback returns to slot 1 and repeats.


      Each slot plays for its global length times its Repeats, so with the length left at 64 a slot lasts
      about eleven seconds. Check or change Song mode in Song tasks > Slot setup (see Song Mode Operations).
      The captured example Loop a song group or hold one slot, below, plays two groups built this way
      (slots 1-2 and 4-5) and what happens when Song mode is turned Off.'
  scene_refs:
  - song-mode-groups-and-selection
  - song-global-length
  - workflow-song-chain
  review:
    status: verified
    cases:
    - M-SONG-FLOW-001
    - M-WORKFLOW-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
