- id: interacting-with-slots
  title: Interacting with Slots
  audience: all
  summary: Select, copy and erase Song slots using grid presses.
  prose: 'Press a slot button to select its Song Sequence. Slot 1 is grid (1,1), slot 2 is (2,1), slot
    16 is (16,1) and slot 17 is (1,2). While stopped, the press selects the slot at once and the norns
    shows Slot setup for it. During playback, the press queues the slot until the current sequence finishes.


    To copy a slot, press and hold the source slot, press the destination slot, then release both. The
    destination becomes a full copy of the source. Editing the copy leaves the source untouched. The destination’s
    previous contents are overwritten, so copy onto an empty slot unless you mean to replace it.


    To erase a slot, copy an empty slot over it: hold the empty slot and press the slot to clear. There
    is no undo.'
  musical_use: Copy a Song slot before editing a variation. The original slot remains available for playback.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#interacting-with-slots
    behaviour_cases:
    - M-SONG-COPY-001
    - M-SONG-FLOW-001
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/models/program.lua
  controls:
  - gesture: Press a Song slot, for example (2,1).
    result: Select the sequence while stopped; during playback, queue it until the current sequence completes.
  - gesture: Press and hold the source slot, then press the destination slot, for example hold (1,1) and
      press (2,1).
    result: Copy the first-pressed slot over the destination. Either release order keeps the first-pressed
      slot as source.
  - gesture: Copy an empty slot over a filled slot.
    result: Erase the destination. The destination’s previous content is overwritten; there is no undo.
  details:
  - title: Copy direction
    text: Press the source slot first, then the destination. Either release order uses the first-pressed
      slot as the source. Copying leaves the source and other slots unchanged.
  recipes:
  - title: Copy a slot before editing
    text: 'Starting point: slot 1 holds a section you want to keep, for example the four-note motif C
      D E F (MIDI 60, 62, 64, 65). Playback is stopped and the Song editor is open (Song, grid (6,8)).


      1. Hold slot 1 at (1,1). While holding it, press an empty slot, slot 2 at (2,1). Release both. Slot
      2 changes from dim to mid-bright: it is a full copy and slot 1 is untouched. Copying overwrites
      the destination, so choose an empty one.


      2. Tap slot 2 at (2,1). It turns bright (selected) and slot 1 drops to mid-bright.


      3. Edit the variation while stopped: press Channel (3,8), tap channel 1 at (1,1) and tap octave
      +1 at (11,8). Only slot 2 changes. (Changing a mask instead works too; either edit stays in the
      selected slot.)


      4. Press Play (1,8). Slot 2 plays the motif an octave higher (72, 74, 76, 77); with Song mode On
      playback then carries on to slot 1, so press Stop when you have heard enough. Press Song (6,8),
      tap slot 1 at (1,1) and press Play: the original section still plays 60, 62, 64, 65. Tap slot 2
      to compare.


      The destination is a full copy, so editing it never changes the original. To erase a slot you no
      longer need, hold an empty slot and press the slot to clear. There is no undo. The captured example
      [Copy a slot, then change the copy](#song-mode-operations/song-copy-and-compare) shows steps 1 to
      3 (the copy and the octave edit); to hear slot 1 and slot 2 compare, follow [Build two song groups](#song-mode-operations/song-build-two-groups),
      which plays the copies. The captured example [Read Song slot lights](#button-indicators/song-slot-light-states)
      shows the lights for a copy and for the erase.'
  - title: Copy a Song slot, then raise the copy by one octave
    text: '1. In Song view, set the song length to two steps and copy slot 1 into slot 2.

      2. Select channel 1 and raise its octave for slot 2.

      3. Compare the copied slot’s stored motif and octave setting with slot 1.

      Outcome: Slot 2 begins as a copy of slot 1, then its channel octave is set to +1. The captured checkpoint
      proves slot state; it does not claim audible playback from the stopped copy.'
  scene_refs:
  - workflow-song-chain
  - song-copy-and-compare
  review:
    status: verified
    cases:
    - M-SONG-FLOW-001
    - M-WORKFLOW-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
    - scene: workflow-compose-two-channels
