- id: adjusting-song-sequence-length
  title: Adjusting Song Sequence Length
  audience: all
  summary: Set the selected Song Sequence’s global length from 1 to 64 steps. Each track plays at most
    this number of steps, counted from its own start.
  prose: 'Use the fader at the lower left of the Song Editor to set the global length of the selected
    Song Sequence from 1 to 64 steps. It is on row 7, columns 1 to 8. Press Song (6,8) to open the editor.
    A press on the fader opens Song Playback on the norns, where Global length shows the new value.


    * (1,7) subtracts one step. (8,7) adds one step.

    * The inner buttons jump to a coarse value: (2,7) sets 1, (3,7) sets 13, (4,7) sets 32, (5,7) sets
    38, (6,7) sets 51 and (7,7) sets 64.

    * To reach an exact value, jump to a nearby coarse value and finish with the end buttons. For 16,
    tap (3,7) and then (8,7) three times.


    Channel start and end steps may lie outside the global-length range. A channel’s played length cannot
    exceed global length. The limit counts steps from the channel start: with channel range 2–4 and global
    length 2, playback repeats steps 2 and 3. Increase global length to restore the remaining selected
    steps.


    The same limit applies to the scale track. Each track follows its own clock rate, and explicit song
    reset options still apply.


    Watch: [Global pattern length demo](https://youtu.be/J1ckUZvhFJ0?t=3160)'
  musical_use: Shorten a section without changing channel endpoints. Increase global length to restore
    the remaining steps. Channel lengths and clock rates can differ within this limit.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#adjusting-song-sequence-length
    behaviour_cases:
    - M-RANGE-GLOBAL-001
    - M-RANGE-GLOBAL-002
    - M-RANGE-GLOBAL-003
    - M-RANGE-GLOBAL-004
    - M-SONG-LENGTH-001
    - M-SONG-LENGTH-002
    code:
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/controls/fader.lua
    - lib/step.lua
    - lib/clock/m_clock.lua
  controls:
  - gesture: Press a button on the length fader, Song Editor row 7, columns 1–8.
    result: 'The selected slot’s global length changes within 1–64 steps. The end buttons (1,7) and (8,7)
      subtract or add one step. The inner buttons (2,7) to (7,7) select coarse positions: 1, 13, 32, 38,
      51 and 64.'
  - gesture: Change global length while playback runs.
    result: Queue the new length for the pattern boundary; stopped changes take effect immediately.
  details:
  - title: Global length and channel range
    text: With channel range 2–4 and global length 2, the channel repeats steps 2 and 3. Its selected
      endpoint remains at 4. Increasing global length restores step 4. The scale track follows the same
      length cap. Each track retains its clock rate, and explicit song reset options still apply.
  recipes:
  - title: Shorten and restore a phrase
    text: 'Starting point: channel 1 plays a four-step motif on steps 1 to 4 (MIDI 60, 62, 64, 65). Its
      channel range is steps 1 to 4 and the global length is 64 steps. Playback is stopped.

      1. Press Song (6,8). The length fader is on row 7, columns 1 to 8.

      2. Tap (2,7) to set the global length to one step (the buttons between the ends jump to 1, 13, 32,
      38, 51 and 64), then tap (8,7) once to add one step. Song Playback shows Global length reading two.

      3. Press Play (1,8). Only the first two steps play: MIDI 60, 62, 60, 62 and so on. The channel range
      is still steps 1 to 4, so nothing is deleted.

      4. Press Stop (1,8). Tap (8,7) twice to set the global length to four steps, then press Play. All
      four steps return: 60, 62, 64, 65.

      Use this to loop a short fragment of a longer motif without editing it, then restore the full phrase.
      The end buttons (1,7) and (8,7) change the length one step at a time. The captured example Set the
      global song length, below, uses the two end buttons on the Song Playback screen: it takes one step
      off 64 (63) and puts it back. It does not play, so follow steps 2 to 4 to hear the effect.'
