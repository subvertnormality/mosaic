- id: song-mode-operations
  title: Song Mode Operations
  audience: all
  summary: Song mode advances to the next filled slot after the current slot’s repeats. An empty slot
    ends the contiguous group and returns playback to that group’s first filled slot.
  prose: 'Song mode plays your slots as an arrangement. It is on by default. With Song mode on, the sequencer
    advances to the next filled slot after the current slot has played its Repeats. Turn it on or off
    in Song tasks > Slot setup (select Song mode with E2, set it with E3, apply with K3) or in PARAMS
    > MOSAIC > Song mode.


    A run of filled slots with no gap is a group. When playback reaches an empty slot, it returns to the
    first filled slot of its group. Slots 1 and 2 with slot 3 empty therefore play 1, 2, 1, 2 and so on.
    Use empty slots to separate groups.


    Press another slot during playback to queue a change. The slot blinks, and the change takes effect
    after the current sequence, including its repeats, completes. This is how you move from one group
    to another.


    With Song mode off, slots do not advance by themselves: the selected slot keeps repeating. A queued
    manual selection still takes over at the end of the current sequence.'
  musical_use: Separate Song groups with empty slots. Press a slot in another group to queue a change
    at the current sequence boundary.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#song-mode-operations
    behaviour_cases:
    - M-SONG-FLOW-001
    - M-SONG-QUEUE-STOP-001
    - M-SONG-SETTINGS-001
    code:
    - lib/song_transition.lua
    - lib/pages/song_edit_page/song_edit_page.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/ui_adapters/song.lua
    - lib/application_parameters.lua
  controls:
  - gesture: Choose Song tasks with E1, then Slot setup; edit Song mode with E2/E3 and apply with K3.
    result: Enable automatic progression, or disable it to keep repeating the selected slot.
  - gesture: Set Repeats in Slot setup and apply with K3.
    result: Determine how many passes the selected slot plays before Song mode advances.
  - gesture: Press another Song slot during playback.
    result: Queue a change for completion of the current sequence, including its repeats.
  details:
  - title: Song groups
    text: When the next slot is empty, playback returns to the first filled slot of the current contiguous
      group. Manual slot selection remains available when Song mode is off.
  - title: How long a slot lasts
    text: A slot plays its global length in steps, once for every repeat, before Song mode advances. Set
      the length with the fader on row 7 and Repeats in Slot setup.
  recipes:
  - title: Create two Song groups
    text: 'Starting point: channel 1 plays its default four-note motif (MIDI 60, 62, 64, 65) on slot 1,
      the first slot. Song mode is On (the default) and playback is stopped. Group A will be slots 1-2
      and group B slots 4-5. Slots 3 and 6 stay empty.


      1. Set the length: press Song (6,8) with slot 1 selected. Tap (2,7), which sets the global length
      to 1 step, then tap (8,7) once to add one step. The length is now 2 steps, so each slot plays only
      the first two notes, 60 and 62.


      2. Copy slot 1 to slots 2, 4 and 5: hold slot 1 at (1,1) and press slot 2 at (2,1). Repeat for slot
      4 at (4,1) and slot 5 at (5,1). The copies keep the two-step length.


      3. Voice slot 2: tap slot 2 at (2,1), press Channel (3,8), tap channel 1 at (1,1) and tap octave
      +1 at (11,8). Slot 2 will play 72, 74.


      4. Voice slot 4: press Song (6,8), tap slot 4 at (4,1), press Channel (3,8), tap channel 1 at (1,1)
      and tap octave +2 at (12,8). Slot 4 will play 84, 86.


      5. Voice slot 5 the same way: Song (6,8), slot 5 at (5,1), Channel (3,8), channel 1 at (1,1) and
      octave -1 at (9,8). Slot 5 will play 48, 50.


      6. Check the lights: slots 1, 2, 4 and 5 are mid-bright, slots 3 and 6 are dim and the selected
      slot is bright.


      7. Tap slot 1 at (1,1) and press Play (1,8). Group A loops: slot 1 plays 60, 62, slot 2 plays 72,
      74, then empty slot 3 sends playback back to slot 1.


      8. While slot 1 sounds, tap slot 4 at (4,1). It blinks, queued. When slot 1 finishes, group B plays:
      slot 4 plays 84, 86, slot 5 plays 48, 50, then empty slot 6 returns playback to the first slot of
      group B. To go back, tap slot 1 or slot 2 to queue a return to group A.


      For a more musical version, replace the octave edits with a different bass rhythm or harmony in
      group B and keep one motif in both groups. The captured examples below build these slots: Build
      two song groups follows steps 1 to 7, up to the first group looping, and Loop a song group or hold
      one slot builds the same slots and goes on to the second group and queued selection (step 8).'
  scene_refs:
  - song-mode-groups-and-selection
  - song-build-two-groups
