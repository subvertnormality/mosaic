- id: navigating-the-norns-display
  title: Navigating the Norns Display
  audience: all
  summary: Open Playback, Slot setup or Tempo / feel from Song tasks.
  prose: 'The Song page opens on Playback. This read-only screen shows the playing slot (Playing), the
    slot that follows (Next, or HOLD when Song mode is off), the current pass within its repeats (Pass,
    for example 1 / 2), the global pattern length and whether Song mode is advancing (AUTO) or off (MANUAL).
    Turn E1 to open Song tasks: Playback, Slot setup, Tempo / feel and Channel view.


    Open Slot setup to set Repeats, the number of passes the selected Song Sequence plays before Song
    mode advances, and to see Song mode. With Song mode off, select slots manually.


    Open Tempo / feel (the screen is titled GLOBAL FEEL) to set the global tempo and Swing or Shuffle.
    The tempo is shared by every slot.


    Channel view opens the same screen as in Pattern tasks: the viewed channel on its own.'
  musical_use: Use Playback to check the playing slot and repeat count. Set repeats in Slot setup. Set
    global tempo and groove in Tempo / feel.
  related:
  - song-editor
  sources:
    readme: manual/legacy/README-1.4.0.md#navigating-the-norns-display
    behaviour_cases:
    - M-LIVEUI-DASH-001
    - M-SONG-SETTINGS-001
    - M-SONG-SETTINGS-002
    code:
    - lib/ui_spec_data.lua
    - lib/pages/song_edit_page/song_edit_page_ui.lua
    - lib/ui_adapters/song.lua
    - lib/ui_adapters/song_clock.lua
    - lib/ui_adapters/read_only.lua
  controls:
  - gesture: Open the Song Editor.
    result: Playback shows Playing, Next, Pass, global length and Song mode status.
  - gesture: Turn E1 to Song tasks, choose Slot setup and open it.
    result: Edit the selected slot’s Repeats and global Song mode with E2/E3; K3 applies and K2 cancels.
  - gesture: Choose Tempo / feel from Song tasks.
    result: Edit global tempo and Swing or Shuffle settings. Choose a field with E2, change it with E3,
      then apply with K3 or cancel with K2.
  details:
  - title: Setting scope
    text: Repeats applies to the selected Song slot. Song mode, tempo and global feel apply across the
      song.
  - title: Vertical list controls
    text: Slot setup and Tempo / feel use vertical lists. Turn E2 to select the row and E3 to edit it.
      K3 applies the draft; K2 cancels. Repeats belongs to the selected slot; Song mode and global feel
      apply across the song. Playback remains a read-only dashboard.
  - title: Set Repeats for a slot
    text: Select the slot on the grid. Turn E1 to Song tasks, turn E2 to Slot setup and press K3. Repeats
      is the first row and is already selected. Turn E3 to the new value, for example 2, and press K3
      to apply. Song mode uses Repeats to decide when to advance; with Song mode off the value appears
      as the pass count on Playback.
  - title: Set the tempo
    text: Turn E1 to Song tasks, turn E2 to Tempo / feel and press K3. Tempo is the selected row. Turn
      E3 to the required value, from 30 to 300 BPM, and press K3 to apply. Because tempo is global, every
      slot then reads and plays the same tempo.
  recipes: []
  scene_refs:
  - song-global-length
  - song-slot-repeat-values
  - song-repeats-advance
  - song-tempo-across-slots
