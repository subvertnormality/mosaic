  - id: default-skip
    title: Merge two patterns in Skip mode
    caption: 'Tap Pattern (5,8), choose pattern 2 and tap steps 1 and 3, then raise
      their notes on Pattern Note. Tap Scale (4,8), tap slot 2 and set its Root to
      D, so D major is applied. Tap Channel (3,8) and tap pattern slot (2,2) to assign
      pattern 2 to channel 1 next to pattern 1. By default overlapping trigs are skipped
      (Skip merge), so only steps 2 and 4 play: E and G of D major (MIDI 64 and 67)
      at velocities 117 and 97.'
    citation: README.md#typical-workflow
