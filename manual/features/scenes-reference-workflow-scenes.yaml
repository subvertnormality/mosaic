  - id: chained-song
    title: Copy slot 1 to slot 2 an octave up
    caption: 'Do these in order. 1) Tap Song (6,8) and set the global length to 4
      steps: tap (2,7), which sets 1, then (8,7) three times. 2) Copy slot 1 to slot
      2: hold slot (1,1) and tap (2,1), then tap (2,1) to select slot 2. 3) Tap Channel
      (3,8), select channel 1 at (1,1) and tap octave-up (11,8), so slot 2 plays an
      octave higher. 4) Tap Song (6,8), select slot 1 at (1,1) and press Play. The
      four-step phrase plays, then repeats an octave higher in slot 2: MIDI 66, 64,
      69, 67, then 78, 76, 81, 79 on channel 1, while channel 2 plays its A and 76
      in both slots.'
