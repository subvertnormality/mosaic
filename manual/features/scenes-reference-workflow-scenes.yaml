- id: workflow-compose-two-channels
  feature_id: build-a-phrase
  title: Compose two channels and chain song slots
  behaviour_case: M-WORKFLOW-001
  requirements: *id001
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-WORKFLOW-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps
      1 to 4 with the notes C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127,
      117, 107 and 97. Nothing else exists yet: no second pattern, no scale change,
      no second channel and one song slot. Trig merge modes decide what happens when
      two patterns on one channel both have a trig on a step: Skip (the default) drops
      those steps, Only keeps only those steps, and All keeps every step.'
