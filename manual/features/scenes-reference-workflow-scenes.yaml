  - id: default-skip
    title: Build pattern 2 and hear Skip
    caption: 'Do these in order. 1) Tap Pattern (5,8), choose pattern 2 at (2,1) and
      tap steps 1 and 3 on Pattern Trig. 2) Tap Pattern (5,8) again for Pattern Note
      and raise step 1 to (1,3) and step 3 to (3,1): degrees 4 and 6. 3) Tap Scale
      (4,8), tap slot 2 at (2,3), turn E2 to Root and E3 two detents up to D, then
      press K3: D major is applied. 4) Tap Channel (3,8) and tap pattern slot (2,2)
      to assign pattern 2 to channel 1 beside pattern 1. 5) Press Play, then Stop.
      Skip drops steps 1 and 3, where both patterns have a trig, so only steps 2 and
      4 play: E and G of D major (MIDI 64 and 67) at velocities 117 and 97.'
