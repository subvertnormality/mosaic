    title: Starting point
    caption: A new, empty project with the transport stopped and nothing assigned
      to a channel. The pattern editor from chapter 1 is on screen. Channel 1 has
      no output chosen yet and no tempo has been set; the rest of the course uses
      MIDI port 1, MIDI channel 1 for channel 1.
    citation: README.md#typical-workflow
    inputs:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    expect:
      assertion:
        kind: manual-course-ui
        stage: getting-started-notation
        passed: true
  - id: setup-tasks
    title: Open Channel tasks
    caption: 'Tap Channel (3,8), then turn E1 right three detents. The title row reads
      CHANNEL TASKS with CH01: a list of the pages of channel 1, each marked OPEN
      >, with the footer Channel Editor. This list is how you reach every channel
      page (Masks, Trig params, Output, Clock, Merge modes, Merge Shape, Harmony,
      Device and History).'
    citation: README.md#typical-workflow
    inputs:
    - &id008
