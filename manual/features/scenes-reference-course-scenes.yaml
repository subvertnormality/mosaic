  - id: setup-route
    title: Open Device
    caption: 'Turn E2 down the list to Device, the eighth task (seven detents below
      Masks), and press K3. The title row reads DEVICE with CH01. Only the Device
      row is listed, set to None: the MIDI channel and MIDI port rows appear once
      you choose a device.'
    citation: README.md#typical-workflow
