  - id: song-composition-copy
    title: Copy the complete section
    caption: 'Tap Song (6,8), hold slot 1 at (1,1), tap slot 2 at (2,1), release slot
      1 and tap (2,1) again to select slot 2. Holding slot 1 while you tap slot 2
      copies the whole section (patterns, channel settings, masks and mutes). The
      screen reads SLOT SETUP, SONG 02, the tooltip says Song sequence 2 selected,
      and (2,1) is the bright slot button. The next two steps check the copy: slot
      2 stays audible when slot 1 is muted.'
