  - id: first-sound-attacks
    title: Enter four trigs
    caption: Tap Channel (3,8), then Pattern (5,8), choose pattern 1 at (1,1), then
      tap (1,4), (2,4), (3,4) and (4,4). Row 4 holds steps 1 to 16, so these are the
      first four steps. PATTERN TRIG PAT01 CH01 shows four bright trigs at the left
      of row 4. Four neighbouring trigs are a deliberately plain rhythm to hear first;
      chapter 4 spreads them out.
    citation: README.md#typical-workflow
    inputs:
    - &id858
      type: grid
      x: 3
      y: 8
      state: 1
    - &id859
