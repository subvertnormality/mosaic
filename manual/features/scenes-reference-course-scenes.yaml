schema_version: 1
fixture_kind: behaviour-case
trace_contract: The original pinned case replays public inputs and verifies every
  authored semantic selector; per-scene deltas include native encoder units and waits.
scenes:
- id: course-getting-started
  feature_id: getting-started
  title: 1. Meet Mosaic
  behaviour_case: M-MANUAL-COURSE-001
  requirements: &id001
  - MANUAL-CONTINUING-COURSE
  - CH-PATTERN-ASSIGN
  - MASK-PRECEDENCE
  - SONG-COMPOSITION
  - SAVE-NAMED
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-MANUAL-COURSE-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Empty project start
    caption: A new, empty project is open on NOTE MASKS for channel 1 before the first
      course action. No mask is set.
    citation: README.md#typical-workflow
    inputs: []
    expect:
      assertion:
        kind: manual-course-ui
        stage: start
        passed: true
  - id: getting-started-objects
    title: Open channel 1
    caption: 'You start from a new, empty project: transport stopped, nothing set
      up, channel 1 selected. Tap Channel (3,8), the third button on the bottom row.
      The screen opens NOTE MASKS for CH01 with eight cells (Trig, Note, Vel, Len
      and Chd1 to Chd4) that all read X: no value is set, because a new channel has
      no pattern, pitch or sound yet. On the grid, (1,1) is lit because channel 1
      is the channel you edit, and (3,8) is lit because it is the page you are on.'
    citation: README.md#typical-workflow
    inputs:
    - &id002
      type: grid
      x: 3
      y: 8
      state: 1
    - &id003
      type: grid
      x: 3
      y: 8
      state: 0
    - &id004
      type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: manual-course-ui
        stage: getting-started-objects
        passed: true
  - id: getting-started-notation
    title: Try the Pattern button
    caption: 'Tap Pattern (5,8), the fifth button on the bottom row. The grid and
      screen switch to the pattern editor: the title row reads PATTERN TRIG with PAT01
      CH01, and every step is dim because pattern 1 has no trigs yet. (1,1) is lit
      because pattern 1 is the pattern you edit, and (5,8) is lit because you are
      on the Pattern page.'
    citation: README.md#typical-workflow
    inputs:
    - &id005
      type: grid
      x: 5
      y: 8
      state: 1
    - &id006
      type: grid
      x: 5
      y: 8
      state: 0
    - &id007
      type: wait
      seconds: 0.06
    expect:
      assertion:
        kind: manual-course-ui
        stage: getting-started-notation
        passed: true
- id: course-setup
  feature_id: setup
  title: 2. Choose one sound
  behaviour_case: M-MANUAL-COURSE-001
  requirements: *id001
  profile: base-midi
  session_ordinal: 0
