  - id: song-composition-global-length-slot1
    title: Set slot 1 to one bar
    caption: 'Tap Song (6,8), select slot 1 at (1,1), tap (3,7) on the length fader,
      then tap (8,7) three times. The fader is row 7, columns 1 to 8: (3,7) jumps
      to 13 steps and each tap of (8,7) adds one, so 13 + 3 = 16. SONG PLAYBACK, SONG
