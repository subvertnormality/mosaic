      assertion:
        kind: manual-course-ui
        stage: first-sound-assign
        passed: true
  - id: first-sound-masks-open
    title: Open Masks
    caption: 'Turn E1 right three detents to Channel tasks, turn E2 to Masks and press
      K3. NOTE MASKS CH01 lists eight cells (Trig, Note, Vel, Len and Chd1 to Chd4),
      all X: no mask is set, so the channel has no pitch, velocity or length yet.
      With no step held, E2 chooses a cell and E3 sets that cell for every step of
      the channel.'
