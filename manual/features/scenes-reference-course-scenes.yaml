  - id: first-sound-assign-pattern
    title: Assign pattern 1
    caption: Tap Channel (3,8), then tap (1,2), the first pattern slot on row 2, to
      give channel 1 pattern 1. Mosaic opens MERGE MODES for CH01 because assigning
      a pattern always shows it, and the tooltip reads Pattern 1 added to ch. 1. Patterns
      reads 01; ignore the other rows for now.
    citation: README.md#typical-workflow
    inputs:
    - &id879
      type: grid
      x: 3
      y: 8
      state: 1
    - &id880
      type: grid
      x: 3
      y: 8
      state: 0
    - &id881
      type: wait
