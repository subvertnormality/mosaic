        stage: setup-route
        passed: true
        device_configuration:
          device: None
  - id: setup-draft
    title: Choose CC Device (draft)
    caption: Turn E3 one detent to choose the first entry after None, CC Device (a
      generic MIDI device). DEVICE CH01 now lists Device CC Device, MIDI channel CC1
      and MIDI port OUT 1. This is only a draft; K2 cancels it and K3 applies it.
    citation: README.md#typical-workflow
