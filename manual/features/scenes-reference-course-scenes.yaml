    title: Set the tempo to 90
    caption: Tempo moves one BPM per detent between 30 and 300, with no coarse step.
      To see it work, turn E3 left or right and watch the number follow, then bring
      it back to 90 and press K3 to apply. GLOBAL FEEL shows Tempo 90, which makes
      a beat exactly 2/3 s for every timing in the chapters ahead.
