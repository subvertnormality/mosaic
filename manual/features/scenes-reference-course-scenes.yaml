          midi_channel: CC1
          midi_port: OUT 1
  - id: setup-apply
    title: Choose a device and apply it
    caption: Press K3 to apply the draft. Notes from channel 1 now leave on MIDI port
      1, MIDI channel 1. With your own gear, choose its device entry and set its port
      and channel; with no external gear, choose Polyperc 1 for the norns voice.
