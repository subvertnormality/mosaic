        kind: manual-course-ui
        stage: first-sound-assign-pattern
        passed: true
  - id: first-sound-assign
    title: Loop four steps
    caption: 'Row 4 of the channel page is the range row: hold (1,4), tap (4,4) and
      release (1,4) to loop only steps 1 to 4. Steps 1 to 4 stay bright, the rest
      go dark, and the tooltip reads Channel 1 length changed.'
    citation: README.md#typical-workflow
