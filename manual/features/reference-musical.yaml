- id: result-and-reason
  title: Result and Reason
  audience: all
  summary: Result shows what a step is and why. Reason lists, in order, the decisions that excluded an
    addition.
  prose: 'Use Result and Reason when an expected addition is silent. They tell you whether the step is
    an anchor, an admitted addition or empty, and which rule removed it, so you can fix the setting instead
    of editing a pattern or adding a mask.


    The examples below use a follower channel with Foundation (anchor Pattern 1 on steps 1 to 4, additions
    from Pattern 2 on steps 5 and 7) that follows channel 2 through Interlock, where channel 2 has an
    anchor on step 5. See Interlock to set that up.


    1. Press E1 for Channel tasks, select Merge Shape with E2 and press K3. Select Result and press K3.

    2. Select Step with E2. Turn E3 to the step to inspect. Role and Decision show that step.

    3. Select Reason with E2 and press K3. The Merge Reason dashboard opens with six rows. K2 returns
    to Result.


    The six rows of Reason:


    - Step: the step you are inspecting.

    - Role: what the step is, followed by its source patterns. ANCHOR is a trig from the anchor pattern,
    ADDITION P2 is an addition taken from Pattern 2, and EMPTY means nothing plays.

    - Decision: OK when the step plays, otherwise every rule that excluded it, in order. GAP comes first,
    then INTERLOCK CH02. When both apply, both are listed, as in GAP, INTERLOCK.

    - Interlock: ON while the leader’s anchors are being avoided, OFF when there is no leader, RESYNC
    or PLAN LIMIT when Interlock cannot plan the leader and is bypassed.

    - Velocity: the velocity the step plays, or NONE when it does not play.

    - Pitch target: LEGACY unless an Addition Target or Structure marker applies.


    A suppressed addition shows Role EMPTY with its source patterns, for example EMPTY P2, and Velocity
    NONE. EMPTY P2 does not mean Pattern 2 has no trig on that step. Read Decision to see why the candidate
    was removed.


    During a planning bypass, Gap and Amount still decide the step as if Interlock were Off.


    A fragment step names its fragment and source, for example FRAGMENT 1 P03 or KEPT ANCHOR. A Structure
    marker shows MARKER CHORD G01 when its pitch is snapped, CHORD MISSING when the group is unavailable,
    or a reason such as BYPASS NOTE MASK, BYPASS RANDOM, BYPASS FIXED or BYPASS QUANTISED FIXED.


    When a leader is set, Result also shows the Interlock status. A queued edit refused at the loop boundary
    is shown as Rejected. Silence-aware Interlock, which would keep space free while another channel’s
    notes sustain, is not available in this release.'
  musical_use: Open Result and Reason before changing a pattern or adding a mask to bring back an addition
    that does not play.
