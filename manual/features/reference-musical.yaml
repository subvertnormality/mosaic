- id: structure
  title: Structure
  audience: all
  summary: Structure moves selected Foundation notes to the nearest pitch class of an enabled Harmony
    group’s chord.
  prose: '[Captured Structure group and marker workflow](#structure/structure-anchor-chord-and-delete)


    Structure snaps chosen moments of a Foundation line to a chord while the notes

    in between keep their own pitch. Pitch opens Structure: Markers (Off, Anchors,

    Every 4 or Every 8) and Chord group, an enabled Harmony Ensemble group. Anchors

    marks every anchor onset; Every 4 and Every 8 mark steps 1, 5, 9… or 1, 9… of the

    channel loop counted from its start step. A note at a marker is converted to the

    scale as usual and then moved to the nearest pitch class of the group''s chord,

    taking the lower one on a tie. Notes between markers keep their Addition Target

    (additions) or their own pitch (anchors); Mosaic makes no claim that they

    resolve. Note masks, random shifts and fixed notes still win at a marker.


    Apply needs an enabled group while Markers is on. If the group becomes

    unavailable during playback the markers play their ordinary pitch and Result

    says `CHORD MISSING`. Deleting or disabling the group turns Markers Off for every

    channel that uses it in the same change; Delete group lists those channels first.

    During playback that change waits for the next pattern boundary, and a Merge

    Shape edit applied to one of those channels before then waits with it and shows

    `NEXT PATTERN` instead of `NEXT CYCLE`.

    A snapped marker keeps its chord tone when Harmony Revoice or Ensemble would move

    it: Harmony''s Result says `MARKER PRIORITY`. With Harmony Pattern, a mapped note

    value that snaps to a different pitch class at a marker than it plays between

    markers has no single mapped pitch, so it is silent at both, whichever fallback

    is chosen; unmapped values keep their own pitch.'
  musical_use: Use Structure to land chosen notes of a Foundation line on the tones of a chord while the
    notes between them keep their own pitch, for example a bass line that touches C, E or G on the strong
    beats.
  related:
  - merge-shape
  sources:
    readme: manual/legacy/README-1.4.0.md#structure
    behaviour_cases:
    - M-MERGE-STRUCTURE-001
    - M-MERGE-STRUCTURE-002
    - M-MERGE-STRUCTURE-003
    - M-MERGE-STRUCTURE-004
    - M-MERGE-STRUCTURE-005
    - M-MERGE-STRUCTURE-006
    - M-MERGE-STRUCTURE-007
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/musical_merge/structure.lua
    - lib/harmony/pattern.lua
    - lib/optional_config_transaction.lua
  controls:
  - gesture: Choose Foundation on Merge modes or with grid (14,8). On Merge Shape, select Pitch and press
      K3, then select Structure and press K3.
    result: The Structure list opens with Markers.
  - gesture: Select Markers. Turn E3.
    result: Markers changes between OFF, ANCHORS, EVERY 4 and EVERY 8. When Markers is on, a Chord group
      row appears.
  - gesture: Select Chord group. Turn E3.
    result: An enabled Harmony group becomes the draft chord source.
  - gesture: Press K3 on a value row.
    result: The draft applies. A group that is missing or disabled prevents activation.
  details:
  - title: Markers and pitch precedence
    text: Markers count from the channel loop’s start step. The nearest chord pitch class is selected;
      ties select the lower pitch. Note masks, random shifts and fixed notes retain their precedence.
  - title: Group deletion and disable
    text: Deleting or disabling a referenced group turns affected Markers Off in the same transaction.
      During playback, that change waits for NEXT PATTERN. Pending linked Merge Shape edits wait for the
      same boundary.
  recipes:
  - title: Snap anchors to a chord, then try Every 4
    text: 'Musical purpose: land the strong notes of a line on the tones of a chord while the notes between
      them stay as written. Anchors snaps every anchor note. Every 4 snaps only steps 1 and 5 of an 8-step
      loop and leaves the rest of the line alone.


      Terms: a Harmony group is a stored chord. Its Template count is how many tones the chord has, each
      Tone row sets that tone''s offset from the root, and Group enabled lets other features use it. Structure
      moves a marked note to the nearest tone of an enabled group''s chord.


      Starting point: channel 1 has an 8-step loop with Foundation on. Pattern 1 is the anchor (C D E
      F on steps 1 to 4, MIDI 60, 62, 64, 65). Pattern 2 supplies additions (a C on steps 5 and 7). If
      Foundation is not on yet, follow steps 1 to 4 of Set a two-cycle Build phrase first. Steps 1 to
      3 build a group that holds the chord C E G; if you already have an enabled group with that chord,
      start at step 4.


      1. Create the group: press E1 for Channel tasks, select Harmony and press K3. Select Groups with
      E2 and press K3. Select Create group and press K3. Group 1 appears.


      2. Set the chord: select Source and press K3. Select Template count and turn E3 twice right, so
      the chord has 3 tones. Select Tone 2 and turn E3 twice right. Select Tone 3 and turn E3 four times
      right. With the root, the offsets 2 and 4 are C E G in C major. Press K3 on a value row. The footer
      reads APPLIED.


      3. Enable the group: press K2 to return to Groups. Select Members and press K3, select Group enabled,
      turn E3 once right to ON and press K3. The footer reads APPLIED. Group 1 is enabled.


      4. Open Structure: press E1 for Channel tasks, select Merge Shape and press K3. Select Pitch and
      press K3, then select Structure and press K3. The Structure list opens with Markers OFF.


      5. Select Markers and turn E3 once right. Markers reads ANCHORS and a Chord group row appears showing
      1, then press K3. The footer reads APPLIED.


      6. Press Play (grid (1,8)) and listen to two loops. The anchors C D E F sound as C C E E (MIDI 60,
      60, 64, 64): D is equally near C and E and takes the lower one, and F is nearer E than G. The additions
      on steps 5 and 7 stay C. Press Stop.


      7. Now the contrast. Select Markers and turn E3 once right. Markers reads EVERY 4, so only steps
      1 and 5 are markers. Press K3.


      8. Press Play. Step 1 and step 5 are C, which is already a chord tone, so nothing moves. D on step
      2 and F on step 4 are not markers any more and return to their own pitches. The line plays MIDI
      60, 62, 64, 65, 60 and 60 in each loop. Then press Stop.


      Choosing Anchors snaps every anchor, and Every 4 snaps only the beats you choose. Deleting or disabling
      the group turns Markers OFF.


      The captured version, [Captured Structure group and marker workflow](#structure/structure-anchor-chord-and-delete),
      covers steps 1 to 6 with Anchors and then deletes the group. Steps 7 and 8 are captured in [Mark
      every fourth step](#structure/structure-every-4-markers), which starts from the enabled C E G group
      with Foundation on and shows Markers set to Every 4 and the line playing 60, 62, 64, 65, 60, 60
      in each loop.'
