features:
- id: lfos-and-modulation
  title: LFOs and Modulation
  audience: all
  summary: Matrix routes toolkit modulation sources to device parameters.
  prose: 'Mosaic supports Matrix mod and toolkit. Matrix routes modulation sources to device parameters;
    toolkit supplies LFOs and other rhythmic modulators.


    Install and configure the mods using their documentation:

    - [Matrix](https://github.com/sixolet/matrix)

    - [Toolkit](https://github.com/sixolet/toolkit)'
  musical_use: Route a macro or LFO to a device parameter. Clear the routing depth to restore the authored
    parameter value.
  related:
  - save-and-load
  sources:
    readme: manual/legacy/README-1.4.0.md#lfos-and-modulation
    behaviour_cases:
    - M-MOD-001
    - M-MOD-002
    - M-MOD-003
    - M-MOD-004
    - M-MANUAL-MODULATION-001
    code:
    - lib/step.lua
    - lib/devices/param_manager.lua
  controls:
  - gesture: Open Matrix routing in the native norns parameter menu.
    result: A modulation source, target and depth can be selected.
  - gesture: Open the selected toolkit source’s parameters.
    result: The macro or LFO settings can be changed. Routed modulation affects playback.
  details:
  - title: Installed mods
    text: Matrix provides routing. Toolkit provides modulation sources. Their installed versions determine
      the native menu sequence. This feature has no additional Mosaic grid shortcut.
  - title: Step-lock precedence
    text: Modulation can add or subtract from an outgoing MIDI CC value. Clearing the modulation restores
      the value supplied by its default or step lock.
  recipes: []
  scene_refs:
  - matrix-macro-route-clear
  - toolkit-clocked-lfo-menu
  - matrix-macro-modest-cc
  review:
    status: verified
    cases:
    - M-MOD-001
    - M-MOD-002
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
    - scene: matrix-macro-route-clear
      data: reference-modulation-scenes.json
      clock_mode: real-time
      run: /home/andy/mosaic-manual-runs/01ef2e2ab78c452aa35cba2ead3154c3
      data_sha256: 18a2d481c60335d5fa0c6c24617372dc23e3b75c5dc048e31f05f8331971357e
      case: M-MOD-001
      assertions:
      - kind: selected-menu-label
        text: Fixed Note
      - kind: selected-menu-label
        text: macro 1
      - kind: selected-menu-value
        text: '1.00'
      - kind: selected-menu-label
        text: value
      - kind: midi
        complete_cycles: 3
      - kind: selected-menu-value
        text: '-'
      - kind: midi
        complete_cycles: 3
      scope: Native Matrix macro source/target/depth menu plus affected/restored MIDI; clocked toolkit
        LFO configuration menu and full-case clocked MIDI acceptance.
    - scene: toolkit-clocked-lfo-menu
      data: reference-modulation-scenes.json
      clock_mode: real-time
      run: /home/andy/mosaic-manual-runs/01ef2e2ab78c452aa35cba2ead3154c3
      data_sha256: 18a2d481c60335d5fa0c6c24617372dc23e3b75c5dc048e31f05f8331971357e
      case: M-MOD-002
      assertions:
      - kind: selected-menu-label
        text: lfo 1
      - kind: selected-menu-value
        text: '1.00'
      - kind: selected-menu-label
        text: clocked
      - kind: selected-menu-label
        text: beats
      - kind: selected-menu-label
        text: shape
      scope: Native Matrix macro source/target/depth menu plus affected/restored MIDI; clocked toolkit
        LFO configuration menu and full-case clocked MIDI acceptance.
    applicability: native-ui
    native_gap: Actual installed Matrix/toolkit menu and MIDI modulation are covered; physical norns scheduling
      equivalence and every routed parameter are outside these examples.
    rationale: Native Matrix macro source/target/depth menu plus affected/restored MIDI; clocked toolkit
      LFO configuration menu and full-case clocked MIDI acceptance.
