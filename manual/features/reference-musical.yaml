- id: performance-management
  title: Performance Management
  audience: all
  summary: Channel count, clock rates, parameter slides, trigless locks and n.b. devices affect sequencer
    workload.
  prose: 'Channel count, clock rate, trig locks, parameter slides and n.b. devices affect Mosaic’s workload.
    Heavy workload can delay sequencing and make external clock synchronization unreliable.


    - Use greater care with high clock rates, trig locks, parameter slides and n.b. devices as channel
    count increases.

    - High clock rates and multipliers increase sequencer workload.

    - Use global parameter slides sparingly. Use step parameter slides when global sliding is unnecessary,
    and limit the total number of slides.

    - Disable trigless locks when the additional modulation granularity is not needed.

    - Limit the number of n.b. devices.


    A test on version 1.1.1 found unreliable external synchronization with one Doubledecker n.b. device
    at 110 BPM, trigless parameters, locks on most steps for all 10 trig parameters across four channels,
    and 40 parameters using global parameter sliding. Other combinations can produce different results.
    This earlier example does not specify a universal limit for the current version.'
  musical_use: Reduce global slides, fast multipliers or trigless-lock density when an arrangement’s timing
    becomes unreliable.
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#performance-management
    behaviour_cases:
    - M-ENDURANCE-001
    - M-SLIDE-CAPACITY-001
    code:
    - lib/clock/m_clock.lua
    - lib/step.lua
    - lib/devices/param_manager.lua
  controls: []
  details:
  - title: Earlier timing test
    text: The 110 BPM Doubledecker example comes from testing on version 1.1.1. It is not a universal
      current limit. Host and emulator timing do not establish physical norns scheduling accuracy.
  - title: Reducing workload
    text: Use step slides where a global slide is unnecessary. Disable trigless locks when their additional
      modulation detail is not needed. Compare changes using the same arrangement and clock source.
  recipes: []
  scene_refs: []
  review:
    status: verified
    cases: []
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence: []
    applicability: external-hardware
    rationale: Workload guidance includes historical physical-device timing and host/hardware distinctions.
    native_gap: No physical-norns scheduling equivalence or universal workload threshold is established.
