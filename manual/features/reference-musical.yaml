- id: merge-shape
  title: Merge Shape
  audience: all
  summary: Foundation keeps one anchor pattern’s trigs and adds a repeatable selection of trigs from the
    other assigned patterns; Phrase changes how many additions play from loop to loop.
  prose: 'Merge Shape turns several assigned patterns into one channel part. The Anchor pattern’s trigs
    always play. Trigs from the other assigned patterns are additions: Merge Shape decides how many of
    them play, how loud, and how close to an anchor. The source patterns are never changed.


    Terms used on this page: Anchor is the pattern whose trigs are protected. An addition is a trig from
    another assigned pattern that Foundation admits. A draft is a set of edits shown on screen but not
    yet applied; K3 applies it and K2 discards it. Active is the strategy that is sounding, and Pending
    is a request waiting for its boundary.


    [Captured two-cycle Build workflow](#merge-shape/foundation-two-cycle-build)


    [Captured Foundation settings and output](#merge-shape/foundation-protected-and-added)


    Choose Foundation with the shared Strategy selector on grid (14,8) or Merge modes. Merge Shape shows
    Strategy as a read-only summary; its Strategy selector action opens Merge modes and discards an unapplied
    parameter draft. K2 returns with the accepted configuration loaded. Foundation controls trigs only;
    note, velocity and length merge settings remain active. Choose Skip, Only or All to restore legacy
    trig merging with retained values. Foundation selects

    one assigned pattern as the protected Anchor. Other assigned trig patterns offer

    candidate additions at non-anchor steps; overlaps remain one anchor. Amount

    admits a deterministic, seed-ranked subset, Accent scales addition velocity, and

    Gap suppresses additions within 0–8 circular channel steps of an anchor. Anchor

    velocity remains authored. Explicit channel/step masks still win, probability

    can still reject an onset, and source patterns are never flattened or changed.


    Phrase Cycles can be 1, 2, 4 or 8. Flat, Build, Answer and Fill are stored as

    visible per-cycle percentages; changing a percentage makes a Custom curve.

    Fixed repeats the same ranked additions. Per phrase changes ranking only after a

    complete phrase. Each channel loop advances its own CYCLE counter—even with

    polymetric ranges, swing or mute—and Stop restarts at cycle 1.


    Keep anchor pitch uses the anchor pattern''s relative note on anchor steps before

    normal scale conversion. Addition Target can be Legacy, the full effective

    scale, selected effective degree indices, or the immutable material of an enabled

    Harmony Ensemble group. Targets affect admitted additions only. Note masks,

    random shifts and fixed-note operations keep their existing precedence and show

    a bypass rather than being quantised twice. Nearest-note ties choose the lower

    pitch. A missing/empty target visibly falls back to the legacy pitch.


    Foundation ranking is repeatable for the saved seed and grows as a nested set:

    raising Amount cannot remove an already selected addition while source, gap,

    seed and phrase are unchanged.


    Fragments is another shared Strategy choice. Foundation''s Interlock and Structure settings remain
    staged parameter edits: K3 applies the draft, K2 discards it. During playback the shown boundary is
    NEXT CYCLE, or NEXT PATTERN when applicable. Strategy choices themselves request immediately and do
    not need K3 Apply.'
  musical_use: Use Foundation to keep one pattern as the spine of a part and vary how many extra notes,
    and how loud, other patterns add. Use Phrase to build the part up over two to eight loops.
  related:
  - musical-merge-and-voice-leading
  sources:
    readme: manual/legacy/README-1.4.0.md#merge-shape
    behaviour_cases:
    - M-MERGE-FOUNDATION-001
    - M-MERGE-PHRASE-001
    - M-LIVEUI-SHAPETRIG-001
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/optional_config_transaction.lua
    - lib/musical_merge/config.lua
    - lib/musical_merge/foundation.lua
    - lib/musical_merge/pitch_target.lua
    - lib/musical_merge/state.lua
    - lib/pattern.lua
  controls:
  - gesture: On Merge modes, select Strategy with E2 and turn E3 to FOUNDATION, or press grid (14,8) until
      it selects Foundation.
    result: 'A valid assigned anchor allows the request: Active reads FOUNDATION and grid (14,8) brightens.
      NEEDS ANCHOR leaves the request unapplied and the previous strategy keeps sounding.'
  - gesture: On Merge Shape, select Strategy selector and press K3.
    result: An unapplied parameter draft is discarded and the shared selector opens on Merge modes. Strategy
      itself is read-only on Merge Shape.
  - gesture: Select Rhythm. Press K3.
    result: 'The Rhythm list opens: Anchor, Add amount, Amount detail, Add accent, Anchor gap, Seed and
      Interlock.'
  - gesture: Select Phrase. Press K3.
    result: 'The Phrase list opens: Cycles, Shape, one Cycle row per cycle, and Variation.'
  - gesture: On Phrase, select Cycles and turn E3. Then select Shape and turn E3.
    result: Cycles steps through 1, 2, 4 and 8. Shape steps through Flat, Build, Answer, Fill and Custom,
      and the Cycle rows show the stored percentage for each cycle (Build with 2 cycles reads 50 then
      100).
  - gesture: In Foundation, select Pitch. Press K3.
    result: Keep anchor, Add target, Target setup and Structure open.
  - gesture: Press K3 on a value row.
    result: The whole draft applies and the footer reads APPLIED. While playing, the footer reads NEXT
      CYCLE and the edit starts at the next channel loop.
  - gesture: Press K2.
    result: A dirty draft is discarded, or an opened list returns to its parent.
  details:
  - title: Anchor and precedence
    text: Foundation retains anchor velocity. Note, velocity and length merge settings still apply. Explicit
      masks take precedence. Probability can reject an onset. Source patterns are unchanged.
  - title: Saved trig merge while Foundation is active
    text: While Foundation is Active, Merge modes shows Active FOUNDATION and Foundation decides the channel's
      trigs. Your saved Skip, Only or All trig merge setting is kept and is not edited. Choose Skip, Only
      or All on the Strategy selector to restore it. Note, velocity and length merge rows stay editable.
  - title: Undo
    text: Applying a Merge Shape draft, including the Interlock and Structure edits made in the same draft,
      is one step in the channel's Memory. Open History in Channel tasks and turn E3 back one step to
      restore the previous configuration.
  - title: Amount and variation
    text: For unchanged source, Gap, Seed and phrase, increasing Amount retains previously admitted additions.
      Fixed repeats the ranking. Per phrase changes the ranking after a complete phrase.
  - title: Amount, Accent and Phrase do different jobs
    text: Add amount and the Phrase curve decide how many additions play. Add accent decides how loud
      they are. Lowering Add accent therefore makes additions quieter without removing any; it does not
      change the Phrase curve.
  recipes:
  - title: Set a two-cycle Build phrase
    text: 'Musical purpose: build a part over two loops. Loop 1 plays the anchor line with one extra note.
      Loop 2 plays the same line with both extra notes.


      Starting point: channel 1 has an 8-step loop at 90 BPM with the default Rate /1, so each step is
      one sixteenth note (one sixth of a second). Pattern 1 holds C D E F on steps 1 to 4 (velocities
      127, 117, 107, 97). Pattern 2 holds a C on steps 5 and 7, and both patterns are assigned to the
      channel. Strategy is SKIP.


      1. Press E1 to open Channel tasks, select Merge Shape with E2 and press K3. The Merge Shape list
      opens: Strategy, Rhythm, Phrase, Pitch, Result.

      2. Select Rhythm with E2 and press K3. The Rhythm list opens with Anchor on the first row.

      3. Turn E3 once so Anchor reads 01, then press K3. The footer reads APPLIED. Pattern 1 is now the
      anchor, so its four trigs always play.

      4. Press E1 for Channel tasks, select Merge modes, select Strategy with E2 and turn E3 until it
      reads FOUNDATION (or press grid (14,8) until it does). Active reads FOUNDATION. The channel grid
      lights steps 1 to 5 and 7: four anchors and two possible additions.

      5. Return to Merge Shape. Select Phrase with E2 and press K3. The Phrase list opens: Cycles, Shape,
      Variation.

      6. Select Cycles and turn E3 once right. Cycles reads 2 and two Cycle rows appear.

      7. Select Shape and turn E3 once right, from FLAT to BUILD. Cycle 1 reads 50 and Cycle 2 reads 100,
      so the first loop admits half of the additions and the second loop admits all of them.

      8. Press K3 on a value row. The footer reads APPLIED.

      9. Press Play (grid (1,8)) and listen to four loops, then press Stop. Loop 1 plays C D E F and one
      extra C on step 7; loop 2 plays C D E F and extra Cs on steps 5 and 7; then the two loops repeat.
      The extra notes play at velocity 70, quieter than the anchors.


      What each loop plays (an added C is shown as +C):


      Loop 1: steps 1 to 4 C D E F, step 5 rest, step 7 +C.


      Loop 2: steps 1 to 4 C D E F, step 5 +C, step 7 +C.


      Listen for the loop-to-loop change: the extra C on step 5 is present in every second loop only.


      To make the additions quieter or louder without changing how many play, change Add accent in Rhythm.


      The captured version of this recipe is [Captured two-cycle Build workflow](#merge-shape/foundation-two-cycle-build).'
