  details:
  - title: Combined reasons
    text: Reason can display GAP and INTERLOCK together, with GAP first. The Interlock row is separate
      and shows ON, OFF, RESYNC or PLAN LIMIT. A planning bypass does not remove Gap or Amount decisions.
  - title: Pitch status
    text: MARKER CHORD G01 identifies a snapped marker. BYPASS NOTE MASK, BYPASS RANDOM and fixed-note
      bypasses identify retained pitches. CHORD MISSING identifies the ordinary-pitch fallback.
  - title: Suppressed addition readout
    text: A suppressed Foundation addition shows Role EMPTY with its source patterns, and Velocity NONE.
      Decision tells you whether a candidate was excluded or the source step was empty.
