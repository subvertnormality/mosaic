      data: reference-musical-scenes.json
      clock_mode: real-time
      run: /home/andy/mosaic-manual-runs/004c6ad4fe4e4eb4851d1add4a91a59a
      data_sha256: e70e56a2087c59f498e4420fddb4d75e714fa6553fe1dbaf93570bbea29cba16
      case: M-MERGE-INTERLOCK-001
      assertions:
      - kind: detail-row
        row: 2
        label: Status
        value: 'ON'
        passed: true
      - kind: interlock-window-0
        window: 0
        loops: 2
        loop_steps: 8
        passed: true
      - kind: interlock-queued-window
        passed: true
      - kind: interlock-after-refusal
        window: 2
        loops: 2
        loop_steps: 8
        passed: true
      scope: The cited public workflow and stated native semantic outcomes.
    applicability: native-ui
    native_gap: Physical norns scheduling equivalence is outside the native real-time and controlled examples.
    rationale: Reference source audit and the cited public native workflow are complete for publication.
    controlled_baselines:
    - run: /home/andy/mosaic-manual-runs/044dbf8ad2234f53be3876dac68a40ee
      data_sha256: 02abfdebfa6968f7b5e3bf2b63157ea0be5b2dee708b496be9cbdd92d8b594f2
      scene: interlock-leader-window
      clock_mode: controlled-experimental
  category: musical
  parent: merge-shape
  level: 4
  teaching_bindings:
