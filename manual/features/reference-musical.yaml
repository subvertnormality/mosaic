- id: interlock
  title: Interlock
  audience: all
  summary: Interlock removes a follower channel’s Foundation additions that fall within 0 to 4 steps of
    a leader channel’s anchors.
  prose: '[Captured Interlock Leader and Window workflow](#interlock/interlock-leader-window)


    Interlock makes one channel''s Foundation additions leave room for another

    channel''s anchors. On the follower''s Rhythm screen, Interlock opens Leader (Off

    or any other channel) and Window (0–4 of the follower''s steps). An addition is

    removed when a leader anchor falls within Window steps of it; Window 0 removes

    only additions that start exactly with a leader anchor. Anchors of either channel

    are never removed, so an addition removed here simply does not play.


    Leader anchors are the anchor pattern''s trigs in the leader''s loop, planned from

    the song, not what the leader happened to sound: probability, mute and swing do

    not change them, and swing or shuffle never change which additions are removed.

    Channels at different clock divisions or loop lengths are compared in musical

    time from Start. The leader must itself use Foundation for its anchors to count;

    otherwise Status says `LEADER OFF` or `LEADER MISSING` and nothing is removed.


    A channel can follow one leader, and a channel that has a leader cannot be one:

    Apply refuses a chain with `LEADER HAS LEADER` or `CHANNEL IS A LEADER` and

    keeps your draft. Where Mosaic cannot plan the leader exactly—after a clock

    division, loop range or song change while playing (`RESYNC`, until the next

    Start or song realign) or beyond its planning budget (`PLAN LIMIT`)—the

    follower plays all of its admitted additions for that loop and shows why.

    Status on the Interlock screen and the Interlock row on Result show `ON` or the

    bypass.


    Interlock plans additions when a follower wraps its loop. Many followers wrapping together increase
    the work on that step. If you use many followers, stagger their loop lengths or wrap points.'
  musical_use: Use Interlock to keep one channel’s extra notes out of another channel’s way, for example
    hi-hat additions that never land on the kick’s anchors, bass additions that leave room for a lead,
    or two parts that should not double each other.
  related:
  - merge-shape
  sources:
    readme: manual/legacy/README-1.4.0.md#interlock
    behaviour_cases:
    - M-MERGE-INTERLOCK-001
    - M-MERGE-INTERLOCK-002
    - M-MERGE-INTERLOCK-003
    - M-MERGE-INTERLOCK-004
    - M-MERGE-INTERLOCK-005
    - M-MERGE-INTERLOCK-006
    - M-MERGE-INTERLOCK-007
    - M-MERGE-INTERLOCK-008
    - M-MERGE-INTERLOCK-009
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/optional_config_transaction.lua
    - lib/musical_merge/interlock.lua
    - lib/musical_merge/leader_query.lua
    - lib/musical_merge/dependency.lua
    - lib/musical_merge/common_time.lua
  controls:
  - gesture: Select the follower channel on the grid. In Channel tasks, open Merge Shape, select Rhythm
      and press K3, then select Interlock and press K3.
    result: 'The Interlock list opens: Leader, Window and Status.'
  - gesture: Select Leader. Turn E3.
    result: Leader changes between OFF and the other channels. Another Foundation channel becomes the
      draft leader.
  - gesture: Select Window. Turn E3.
    result: Window changes between 0 and 4 follower steps.
  - gesture: Press K3 on a value row.
    result: The draft applies and the footer reads APPLIED (NEXT CYCLE while playing). Status reads ON
      when the filter is working. An invalid chain shows a reason and keeps the draft.
  - gesture: Press K2.
    result: The draft is discarded and Rhythm returns.
  details:
  - title: Leader anchors
    text: Mute, probability and swing do not change the nominal leader-anchor decision. Window 0 removes
      only additions that start exactly with a leader anchor. Interlock compares where leader anchors
      start, not how long the leader’s note lasts, so it does not keep space free for a sustained leader
      note.
  - title: Bypass status
    text: LEADER OFF, LEADER MISSING, RESYNC and PLAN LIMIT identify inactive filtering. During a planning
      bypass, admitted additions play. Gap and Amount still apply.
  recipes:
  - title: Set Window 0
    text: 'Musical purpose: stop one channel’s extra notes landing on another channel’s anchor, for example
      hi-hat additions that never double the kick. Interlock changes only the follower’s additions. Anchors
      on both channels always play.


      Starting point: Foundation is on for two channels, both with 8-step loops. Channel 1 (the follower,
      MIDI channel 1) has anchor Pattern 1 (C D E F on steps 1 to 4) and Pattern 2 (a C on steps 5 and
      7) as additions. Channel 2 (the leader, MIDI channel 2) has anchor Pattern 3, a single trig on step
      5; channel 1 has no leader, and its grid lights steps 1 to 5 and 7.


      1. Select channel 1 on the grid (button (1,1)). Press E1 for Channel tasks, select Merge Shape with
      E2 and press K3.

      2. Select Rhythm and press K3, then select Interlock (the last row) and press K3. The Interlock
      list opens: Leader OFF, Window 0, Status.

      3. Select Leader and turn E3 once right. Leader reads CH02. A channel cannot follow itself, so CH01
      is not offered.

      4. Press K3. The footer reads APPLIED, Window stays 0 and Status reads ON. Step 5 goes dark on the
      channel 1 grid: Pattern 2’s addition starts exactly on the leader’s anchor and is removed. Steps
      1 to 4 and step 7 stay lit.

      5. Press Play (grid (1,8)) and listen to two loops, then press Stop. Channel 1 plays steps 1 to
      4 and step 7, and channel 2 plays its anchor on step 5; nothing from channel 1 sounds on step 5.

      6. Select Window and turn E3 twice right. Window reads 2.

      7. Press K3. The footer reads APPLIED. Step 7 also goes dark, because it is two steps from the leader’s
      anchor on step 5, and only steps 1 to 4 remain on channel 1; if you apply while playing, the footer
      reads NEXT CYCLE and the change starts at the next loop.


      Window 0 removes only additions that start with a leader anchor. Each step of Window widens the
      gap by one follower step, up to 4.


      The captured version of this recipe is [Captured Interlock Leader and Window workflow](#interlock/interlock-leader-window).'
  scene_refs:
  - interlock-leader-window
  review:
    status: verified
    cases:
    - M-MERGE-INTERLOCK-001
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence:
