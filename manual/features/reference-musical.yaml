- id: fragments
  title: Fragments
  audience: all
  summary: Fragments cuts the channel loop into 4-, 8- or 16-step sections and plays each section from
    one assigned pattern, chosen by a repeatable seed.
  prose: '[Captured Fragments seed and playback workflow](#fragments/fragments-seed-source-choice)


    Fragments is a separate mode for building a phrase from pieces of the assigned

    patterns. Choose Fragments with the shared Strategy selector, then open Rhythm from Merge Shape for
    Size (4,

    8 or 16 steps), Keep anchor, Anchor (shown only with Keep anchor) and Seed. The

    channel loop is cut into fragments of Size steps counted from the channel''s own

    start step; the last fragment is shorter when the loop does not divide evenly,

    and a loop shorter than Size is one fragment. Fragments never cross the loop end.


    Each fragment plays one assigned pattern, chosen repeatably by the Seed: the

    same seed always gives the same choice. The fragment keeps that pattern''s own

    trigs, notes, velocities and lengths exactly, so the legacy trig, note,

    velocity and length merge modes and merged-pentatonic do not apply while

    Fragments is active. Merge modes marks its retained note, velocity and length rows inactive, with
    values such as `AVERAGE SAVED`. These rows and their grid buttons do not edit saved values. Choose
    Skip, Only or All to restore the retained settings. A note longer than the gap to

    the next onset on the loop is shortened to that gap. Keep anchor also plays the

    Anchor pattern''s trigs where the fragment''s own pattern has none; where both have

    a trig, the fragment''s pattern wins. With no assigned pattern the mode falls back

    to legacy merging and Result says `ASSIGN PATTERN`.


    Phrase shows only Cycles and Variation in this mode. Fixed repeats the same

    fragment sources every phrase; Per phrase draws new ones for each phrase.

    Shape percentages, Amount, Accent and Gap do not apply. Fragments hides Pitch; choose the adjacent
    Harmony task directly for voice leading. Explicit masks still win and probability can still reject
    an

    onset. The channel grid shows exactly the trigs the fragments play.'
  musical_use: Use Fragments to build one phrase from sections of several patterns, for example the first
    half of a sparse pattern and the second half of a busier one, while every section keeps its authored
    notes, velocities and lengths.
  related:
  - merge-shape
  sources:
    readme: manual/legacy/README-1.4.0.md#fragments
    behaviour_cases:
    - M-MERGE-FRAGMENTS-001
    - M-MERGE-FRAGMENTS-002
    - M-MERGE-FRAGMENTS-003
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/optional_config_transaction.lua
    - lib/musical_merge/fragments.lua
    - lib/musical_merge/config.lua
    - lib/musical_merge/state.lua
    - lib/pattern.lua
  controls:
  - gesture: On Merge modes, select Strategy with E2 and turn E3 to FRAGMENTS, or press grid (14,8) until
      it selects Fragments.
    result: Active reads FRAGMENTS. Fragments owns all four merge attributes, and the note, velocity and
      length rows on Merge modes show values such as AVERAGE SAVED and are inactive.
  - gesture: On Merge Shape, select Rhythm. Press K3.
    result: 'The Fragments list opens: Size, Keep anchor, Seed, and Anchor when Keep anchor is ON.'
  - gesture: Select Size. Turn E3.
    result: Fragment size changes between 4, 8 and 16 channel steps. A draft is shown until K3 applies
      it.
  - gesture: Select Seed. Turn E3.
    result: Seed changes from 0 to 65535. The same seed always chooses the same source pattern for each
      fragment.
  - gesture: Select Keep anchor. Turn E3.
    result: When ON, the Anchor row appears and the anchor pattern’s trigs fill positions where the fragment’s
      source has no trig.
  - gesture: Press K3 on a value row.
    result: The draft applies and the footer reads APPLIED. The channel grid then shows exactly the trigs
      the fragments play.
  - gesture: Select Phrase. Press K3.
    result: Cycles and Variation open. Fixed repeats the same fragment sources every phrase; Per phrase
      draws new ones.
  details:
  - title: Loop boundaries
    text: Fragments start at the channel loop’s start step. The last fragment is shorter when the loop
      does not divide evenly. A loop shorter than Size is one fragment. Fragments do not cross the loop
      end.
  - title: Overrides and fallback
    text: Legacy trig, note, velocity and length merges and merged-pentatonic do not apply in Fragments.
      Explicit masks and probability still apply. With no assigned pattern, Result displays ASSIGN PATTERN
      and uses legacy merging.
  recipes:
  - title: Set four-step fragments
    text: 'Musical purpose: build one phrase from two patterns, taking the first half of the loop from
      one pattern and the second half from the other. Each half keeps its source notes and velocities.


      Starting point: channel 1 has an 8-step loop at 90 BPM and Rate /1. Pattern 1 holds C D E F on steps
      1 to 4 (velocities 127, 117, 107, 97). Pattern 2 holds a C at velocity 100 on steps 3 and 6, and
      both are assigned to the channel. Strategy is SKIP.


      1. Press E1 to open Channel tasks, select Merge modes and press K3. Select Strategy with E2 and
      turn E3 until it reads FRAGMENTS. Active reads FRAGMENTS. A strategy choice applies at once and
      needs no K3.

      2. Press E1 for Channel tasks, select Merge Shape and press K3. Select Rhythm with E2 and press
      K3. The Fragments list opens: Size 8, Keep anchor OFF, Seed 0; edits on this list are drafts until
      you press K3.

      3. Select Size and turn E3 once left. Size reads 4, so the loop is cut into two fragments: steps
      1 to 4 and steps 5 to 8.

      4. Press K3. The footer reads APPLIED and the channel grid lights only step 3, because Seed 0 gives
      the first fragment to Pattern 2 and the second to Pattern 1, and Pattern 1 has no trigs in the second
      half.

      5. Press Play (grid (1,8)), listen to two loops and press Stop. Each loop plays a single C (MIDI
      60) at velocity 100, and Pattern 1’s E on step 3 is not mixed in.

      6. Select Seed with E2 and turn E3 once right. Seed reads 1, and a seed always makes the same choice,
      so Seed 1 gives the first fragment to Pattern 1 and the second to Pattern 2.

      7. Press K3. The footer reads APPLIED and the grid lights steps 1, 2, 3, 4 and 6.

      8. Press Play. Each loop plays C D E F (MIDI 60, 62, 64, 65 at velocities 127, 117, 107, 97) and
      then Pattern 2’s C on step 6 at velocity 100, then press Stop.


      Edits stay drafts until K3, so change Size and Seed first and apply once if you prefer. Turn Keep
      anchor ON to let the anchor pattern fill empty positions. Open Phrase and set Variation to Per phrase
      if you want new sources each phrase.


      The seed is a repeatable dice roll: seed 0 and seed 1 above give opposite choices for the two halves,
      and every other seed gives its own choice that always repeats. Try a few more seeds and keep the
      one you like.


      The captured version of this recipe is [Captured Fragments seed and playback workflow](#fragments/fragments-seed-source-choice).'
  scene_refs:
  - fragments-seed-source-choice
  - shared-merge-strategy-workflow
