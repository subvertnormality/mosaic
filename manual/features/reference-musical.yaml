- id: harmony
  title: Harmony
  audience: all
  summary: Harmony provides Off, Revoice, Pattern and Ensemble modes for channel output pitch placement.
  prose: "Harmony changes the pitch a channel sends, not its rhythm. Open it from Channel tasks (Voice\
    \ leading list: Mode, Group, Preset, Tone Map in Pattern mode, Register, Bass, Groups, Rules, Entry,\
    \ Result). Tone Map is the page that maps written notes to voices. Register sets each voice’s range.\
    \ Entry holds the Failure fallback. Result shows what was planned and sent.\n\n[Captured Harmony range\
    \ failure and fallback](#harmony/harmony-range-failure-and-fallback)\n\n[Captured Harmony Revoice\
    \ workflow](#harmony/harmony-revoice-two-voices)\n\nHarmony offers four mutually exclusive channel\
    \ modes:\n\n- Off follows the ordinary Mosaic pitch path exactly.\n- Revoice takes the actual root\
    \ and enabled chord-mask voices after Mosaic's\n  pitch-class decisions, preserving their pitch classes\
    \ and sounding count while\n  choosing legal octaves and assignments.\n- Pattern maps explicit effective\
    \ relative values in the current merge binding\n  to Bass, Inner1–3 or Top. Repeated mapped values\
    \ reuse one pitch for the entire\n  harmonic frame; unmapped values remain Raw. Random, fixed, absolute-mask\
    \ and\n  chord-mask events visibly bypass Pattern. Conflicting aliases fail closed.\n- Ensemble assigns\
    \ Bass/Inner/Top roles to one to five explicit monophonic\n  channels. Each member retains its own\
    \ rhythm, velocity, gate, clock and route,\n  but its pitch is replaced by the shared frame. A conflicting\
    \ local scale lock\n  temporarily uses the ordinary pitch path (`LOCAL SCALE BYPASS`); a channel or\n\
    \  step octave override does the same (`LOCAL OCTAVE BYPASS`).\n\nRegister rows set inclusive MIDI\
    \ Low/High, Centre and Preferred leap for every\nrole. Smooth prioritises literal common tones and\
    \ economical movement; Compact\nprioritises register centre/spacing; Independent prioritises movement\
    \ without a\ncommon-tone score. Hard options cover crossing, exact unison, strict leap and\nstrict\
    \ bass direction. Bass can be Root, an explicit Inversion tone, Smooth or\nan exact Pedal. Revoice\
    \ pedals must already be in its input material; only an\nEnsemble group can explicitly allow a non-chord\
    \ pedal.\n\nThe deterministic solver searches every legal pitch-class placement inside the\nconfigured\
    \ ranges (up to five voices) and never clamps an illegal result. A frame\nwith no solution silences\
    \ affected mapped voices by default; Legacy fallback is\nexplicit. A bounded search reports `BUDGET\
    \ EXCEEDED` rather than emitting a\npartial answer. Preparing a frame does not change voice history:\
    \ the first real\nscheduled onset consumes it, while redraws, rests, failed probability, mute and\n\
    missing output do not. Delayed strums and arpeggios keep the pitch snapshot made\nat their onset,\
    \ and Note Off always releases the pitch and route actually sent.\n\n[Captured NO VOICING and Legacy\
    \ fallback](#harmony/harmony-range-failure-and-fallback)\n\nThe Channel grid remains the chronological\
    \ trig/mask surface. Foundation anchors\nand additions therefore appear as active steps there. After\
    \ a step plays, the\nPattern Note grid moves that step's bright note LED to the final effective pitch\n\
    that the native 21-position note range can represent. Switch its upper, centred\nor lower seven-note\
    \ bank as usual to inspect octave placement. Raw and bypassed\nevents use the ordinary pre-Harmony\
    \ position; turning Harmony Off restores the\nordinary merged/scale positions immediately. An exact\
    \ pitch outside that native\nrange has no false in-range LED and remains available in Result/Note\
    \ Dashboard.\n\nThis display is read-only: touching the projected Note fader still edits its\nselected\
    \ source-pattern value. Until the changed step plays again, the edited\nsource is displayed rather\
    \ than a stale output. Final Harmony pitches are also\nshown on Output (its Pitch and Sent rows) and\
    \ on Harmony's Result screen, one row\nper voice as the planned and sent note (`C3 > C3`). Result\
    \ uses its Step row to\nselect one coherent event chain; on Note\nDashboard, holding a grid step temporarily\
    \ inspects that step instead of combining\nit with a later delayed event. A step with no recorded\
    \ event says `NO EVENT` and\nshows no planned or emitted pitch; it never borrows the latest event\
    \ from another\nstep. This readout occupies the bottom two lines of the Note Dashboard, which is\n\
    the row tooltips use, so while a harmony event is being shown there the page\nclears that row and\
    \ tooltips are not visible on it. Result status names local scale/octave bypasses, explicit Legacy\
    \ fallback\nand the specific no-voicing reason. For an Ensemble group, any member bypass or failure\
    \ is\nsurfaced even when another member has a valid voicing. The projection never writes\nback into\
    \ a shared pattern. Copy/save stores\nversioned configuration, not running solver or phrase history.\
    \ Missing optional\nconfiguration loads as Off; unknown schema versions reject the project before\
    \ it\nreplaces the active project."
  musical_use: Use Revoice for root and chord-mask voices, Pattern for repeated relative values, or Ensemble
    for a chord distributed across monophonic channels.
  related:
  - musical-merge-and-voice-leading
  sources:
    readme: manual/legacy/README-1.4.0.md#harmony
    behaviour_cases:
    - M-HARMONY-REVOICE-001
    - M-HARMONY-PATTERN-001
    - M-HARMONY-PATTERN-CLOCKS-001
    - M-HARMONY-PATTERN-BYPASS-001
    - M-HARMONY-ENSEMBLE-001
    - M-HARMONY-PERSIST-001
    - M-HARMONY-FAILURE-001
    - M-HARMONY-HELD-001
    - M-UIACC-A19-001
    code:
    - lib/pages/channel_edit_page/channel_feature_editor.lua
    - lib/harmony/config.lua
    - lib/harmony/config_state.lua
    - lib/harmony/context.lua
    - lib/harmony/voicing.lua
    - lib/harmony/pattern.lua
    - lib/harmony/state.lua
    - lib/harmony/inspection.lua
    - lib/harmony/grid_projection.lua
    - lib/step.lua
  controls:
  - gesture: In Channel tasks, select Harmony. Press K3.
    result: Voice leading settings open.
  - gesture: Turn E2 to Mode. Turn E3.
    result: The draft mode changes between Off, Revoice, Pattern and Ensemble.
  - gesture: Select Register or another settings row marked OPEN >. Press K3.
    result: The selected settings list opens.
  - gesture: Turn E2 to select a value. Turn E3 to change it. Press K3 on a value row.
    result: Mosaic validates and applies the draft. During playback, NEXT PATTERN indicates a queued change.
  - gesture: Press K2.
    result: A dirty draft is cancelled. An opened settings list returns to its parent.
  - gesture: In Result, select Step.
    result: The selected event’s planned and sent pitches are displayed.
  - gesture: On Note Dashboard, hold a grid step.
    result: That step’s event is inspected. A step without a recorded event displays NO EVENT.
  - gesture: In Pattern mode, select Tone Map. Press K3. Select a Tone row and turn E3.
    result: The row changes between RAW, BASS, INNER1, INNER2, INNER3 and TOP. K3 on a value row applies
      the map.
  - gesture: Select Register. Press K3. Select a role with the Role row, then select Low, High or Centre
      and turn E3.
    result: The role’s inclusive MIDI range changes. A Low, High and Centre that leave no legal placement
      for a mapped note give NO VOICING RANGE and silence it.
  - gesture: Select Entry. Press K3. Select Failure fallback and turn E3.
    result: Failure fallback changes between SILENCE and LEGACY. Silence is the default; Legacy plays
      the ordinary pitch and Result reads LEGACY RANGE.
  details:
  - title: Mode selection
    text: Revoice places the actual root and enabled chord-mask voices in legal octaves. Pattern maps
      repeated effective relative values to roles. Ensemble assigns a shared harmonic frame to specified
      monophonic channels; each member retains its rhythm and route.
  - title: No voicing and fallback
    text: Infeasible registers display NO VOICING RANGE on Result. Silence is the default failure fallback.
      To change it, open Entry and set Failure fallback to LEGACY. A step with no event reads NO EVENT,
      which is different from a failed voicing. A solver budget failure does not emit a partial answer.
  - title: Note grid editing
    text: After a played event, the Note grid displays the final pitch if it is within the native range.
      Editing a Note fader still edits the selected source pattern. Projected pitches are not written
      to that pattern.
  - title: Saving and loading
    text: Saving stores the Harmony settings, not the solver position or phrase history. A project saved
      with no Harmony settings loads with Harmony Off. A project saved by a newer, unknown Harmony version
      is refused with a message that names the slot and says voicing schema version, and the project that
      is running is kept.
  recipes:
  - title: Map three relative values
    text: 'Musical purpose: pin chosen written notes to fixed voices of a chord frame, each limited to
      its own register, so a note that repeats in the phrase always lands on the same pitch. Choose Pattern
      when you want to decide which written note goes to which voice; choose Revoice when the chord notes
      are already written and you want Mosaic to arrange their octaves. In this phrase the notes are all
      different, so the repeat rule is explained at the end rather than heard.


      Terms used below: a written value is the relative note of a step (0 to 3 here); a voice is Bass,
      Inner 1 to 3 or Top; a register is the range of MIDI notes a voice may use; RAW means the value
      is not mapped and keeps its own pitch.


      Starting point: channel 1 plays one pattern, C D E F on steps 1 to 4 (written values 0, 1, 2, 3;
      MIDI 60, 62, 64, 65; velocities 127, 117, 107, 97), at 90 BPM. Harmony is Off.


      1. Press E1 for Channel tasks, select Harmony with E2 and press K3. The Voice leading list opens
      with Mode OFF.


      2. Select Mode with E2 and turn E3 twice right (Off, Revoice, Pattern). Mode reads PATTERN and a
      Tone Map row appears. The change is a draft until K3.


      3. Select Tone Map with E2 and press K3. The Tone Map lists one row for each written value, Tone
      0 to Tone 3, all RAW, followed by Reset map.


      4. Select Tone 0 and turn E3 once right. It reads BASS. Press K3. The footer reads APPLIED. Press
      Play and then Stop: C still plays as MIDI 60, because 60 already lies inside the default Bass register
      (24 to 60), so nothing sounds different yet.


      5. Select Tone 2 and turn E3 twice right so it reads INNER1. Press K3. Tone 1 (D) stays RAW.


      6. Select Tone 3 and turn E3 five times right so it reads TOP. Press K3.


      7. Press E1 to return to the Voice leading list. Select Register with E2 and press K3. The Register
      list opens: Role (the first role is Bass), Low, High, Centre, Preferred leap, Strict leap.


      8. Select High with E2 and turn E3 five times left. High reads 55. Press K3.


      9. Press Play and listen to two loops, then press Stop. The Bass register now ends at 55, so 60
      no longer fits and C plays as MIDI 48 (C2), the nearest C inside it. D stays at MIDI 62 because
      it is RAW. E and F are placed in their Inner 1 and Top registers. Open Result straight away (next
      step) to see each pitch.


      10. Press E1 to return to the Voice leading list, select Result and press K3. Select Step and turn
      E3 to step 1, step 3 and step 4: each shows its planned and sent pitch.


      A repeated mapped value uses one pitch for the whole harmonic frame: if the phrase were C D C F,
      both Cs would sound as MIDI 48. If a role''s range leaves no legal placement for a mapped note,
      Result shows NO VOICING RANGE and that note is silent. See [Captured Harmony range failure and fallback](#harmony/harmony-range-failure-and-fallback).'
