scenes:
- id: mask-precedence
  title: Set channel and step note masks
  behaviour_case: M-MASK-007
  setup:
    fixture: four-note-pattern
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: route
    caption: 'Starting point: channel 1 plays pattern 1 on steps 1-4 with the notes C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, and no masks are set. Turn E1 to open Channel tasks, turn E2 to Masks and press K3, then turn E2 to Note. The header reads NOTE MASKS CH01 and the value reads X, which means no mask is set, so each step plays its own pattern note.'
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    expect:
      screen:
      - - note
        - X
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: default
    caption: 'With no step held, turn E3 right until the screen reads G3 (MIDI 67). The screen shows the note name, so stop on the readout. This is the channel note mask: all four steps now play G, and their velocities stay as they were.'
    inputs:
    - type: enc
      n: 3
      delta: 68
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 67
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: step-one
    caption: Hold step 1 at (1,4). The header gains ST01, which means edits now apply to that step only. Turn E3 right until the screen reads C4 (MIDI 72, five detents up from G3). Step 1 has its own note, which overrides the channel default.
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 5
    expect:
      screen:
      - - note
        - C4
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: release-one
    caption: 'Release step 1. The header loses ST01 and the screen returns to the channel default, G3. Playback now starts with C4 (72) and continues G, G, G: a step mask beats the channel mask.'
    inputs:
    - type: grid
      x: 1
      y: 4
      state: 0
    expect:
      screen:
      - - note
        - G3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 72
        - 127
      - port: 1
        bytes:
        - 144
        - 67
        - 117
      - port: 1
        bytes:
        - 144
        - 67
        - 107
      - port: 1
        bytes:
        - 144
        - 67
        - 97
