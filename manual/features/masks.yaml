schema_version: 1
feature:
  id: masks
  title: Masks
  audience: all
  summary: Override channel and step trig, note, velocity, length and chord values.
  prose: 'Masks override attributes of the merged pattern data. They can overwrite pattern values or create steps the patterns do not have, and they accept triggers, notes, velocities and chords. Set a channel default to affect every step, or hold a step to set an individual override. Unset attributes use the channel default or merged pattern data. Each Masks recipe below starts from the four-step loop in Make your first loop (channel 1, pattern 1, steps 1-4). A masked value always wins over the pattern for that step; the channel default wins over the pattern for every step without its own mask.

    The Masks screen shows the value you are editing as you turn E3, with note names for the Note row, so stop on the readout instead of counting detents. One detent moves a note by one MIDI note and other values by one unit.


    [Masks demo](https://www.youtube.com/watch?v=J1ckUZvhFJ0&t=1740s)'
  musical_use: Set a note mask to change the pitch of one step while the pattern keeps its rhythm; set a velocity mask to accent or soften a step; fill the Chd rows to add chord voices; add a trig mask to put a note on an empty step. To run channels at different lengths, see Channel Length.
  related:
  - merge-modes
  - channel-length
  - chord-strum
  - fully-quantise-mask
  - arm-live-record
  sources:
    readme: manual/legacy/README-1.4.0.md#masks
    behaviour_cases:
    - M-MASK-007
    - M-MASK-008
    - M-MASK-010
    - M-MASK-005
    - M-MASK-017
    - M-MASK-021
    - M-MASK-NOTE-X-001
    code:
    - lib/pages/channel_edit_page/channel_edit_masks.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/ui_adapters/masks.lua
  controls:
  - gesture: Grid (3,8) → E1 tasks → E2 Masks → K3
    result: Open the eight mask values.
  - gesture: E2
    result: Choose Trig, Note, Vel, Len, Chd1–Chd4.
  - gesture: E3, no step held
    result: Edit the channel default.
  - gesture: Hold step + E3
    result: Edit that step's exception.
  - gesture: Hold K1 + tap step
    result: Add or remove a trig mask.
  - gesture: Hold step + K2
    result: Clear all mask attributes for the held step.
  - gesture: K1 + K2, no grid keys held
    result: Clear channel step overrides; preserve defaults.
  details:
  - title: Unset values and precedence
    text: X is an unset attribute, not zero. A step's explicit attribute wins over the channel default; an unset step uses the default; an unset default falls back to merged pattern data. Clearing step overrides does not erase the defaults.
  - title: Chord masks
    text: Chd1–Chd4 add four scale-relative voices above or below the root. 3rd and 5th specify intervals, not MIDI note numbers. From X, turn E3 right for a voice above the root and left for a voice below it; each row reaches 14 scale steps either way. Select a polyphonic output to play simultaneous chord voices. Use strum and chord velocity to adjust their timing and level.
  - title: Scale, degree and rotation
    text: Note masks snap to the selected scale by default. Degree and rotation apply only when full quantisation is enabled. See Snap Note Masks to Scale, Quantise Note Masks and Fully Quantise Mask for their precedence. Turn off Snap note masks to scale in the Mosaic params to enter accidentals or dissonant notes.
  - title: MIDI and clearing
    text: Hold a step and play a MIDI keyboard to enter notes and chords. Live recording also enters masks. With a step held, K2 clears that step even if K1 is held. Other channels are unaffected.
  - title: If a new note is silent
    text: Check the selected channel's output, active range and mute state. A trig alone needs an audible note, velocity and length. A mono voice cannot sound all chord voices together. To undo an exception, hold that step and press K2.
  - title: Note names on the Masks screen
    text: 'The Masks screen uses norns musicutil: floor(MIDI note / 12 − 2). MIDI note 60 is displayed as C3. The Fixed Note parameter uses a different label convention and displays MIDI note 60 as C5. Use numeric MIDI notes when comparing these controls.'
  recipes:
  - title: Try a different ending for a four-note melody
    text: 'Goal: change only the last note so the same four-step melody can resolve to a different ending; steps 1–3 remain fixed.


      Starting point: the four-step loop from Make your first loop. Channel 1 plays pattern 1 on steps 1-4 with channel defaults Note C3 (MIDI 60), Vel 80 and Len 1/2, so it repeats one note four times. The Masks screen shows the note name for the value you are editing, and one detent of E3 moves one MIDI note, so turn E3 until the screen reads the name given below instead of counting. Norns shows MIDI 60 as C3, so 72 is C4, 74 is D4, 76 is E4 and 79 is G4.


      1. Open Channel tasks with E1, turn E2 to Masks and press K3. Turn E2 to Note. The header reads NOTE MASKS CH01 and, with no step held, the Note row shows the channel default, C3.


      2. Hold step 1 (grid (1,4)). The header gains ST01, which means edits now apply to that step only. Turn E3 right until the screen reads C4 (12 detents), then release the step.


      3. Hold step 2 (2,4), turn E3 right until the screen reads D4 (14 detents) and release the step.


      4. Hold step 3 (3,4), turn E3 right until the screen reads G4 (19 detents) and release the step.


      5. Hold step 4 (4,4), turn E3 right until the screen reads E4 (16 detents) and release the step. After each release the screen goes back to the channel default, C3; each step you set keeps its own note.


      6. Tap Play at (1,8). The loop plays C4, D4, G4, E4 (72, 74, 79, 76). Tap Play again to stop.


      7. Hold step 4 and turn E3 left until the screen reads D4 (two detents). Release the step and tap Play: the phrase now ends C4, D4, G4, D4. Only step 4 changed; steps 1-3 keep their masks. Tap Play to stop.


      8. To end on the root instead, hold step 4 and turn E3 left until the screen reads C4 (two more detents). Release the step and tap Play: the phrase is C4, D4, G4, C4.


      All of these notes are in the default C major scale, so scale snapping leaves them unchanged. A note outside the scale is moved onto it. The captured example "Change the ending of a four-note melody" runs steps 1 to 8 on the four-note loop and shows the MIDI strip after each change (its pattern keeps its own velocities, so the recipe''s Vel 80 is not repeated there); "Set channel and step note masks" shows the same hold-and-turn gestures on a different loop.

      '
  - title: Add a ghost note before an accent
    text: 'Starting point: the four-step loop from Make your first loop, with channel default Vel 80. A ghost note is a very quiet note played just before a louder one; it makes the louder note feel pushed.


      1. Open Channel tasks with E1, turn E2 to Masks and press K3. Turn E2 to Vel. With no step held the screen reads 80, the channel default.


      2. Hold step 3 (grid (3,4)) and turn E3 right until the screen reads 100. Release the step. Step 3 is now the accent.


      3. Hold step 2 (2,4) and turn E3 left until the screen reads 35. Release the step. Step 2 is the ghost note.


      4. Tap Play at (1,8). The velocities are 80, 35, 100, 80: a soft tap on step 2 leads into the loud step 3. Tap Play again to stop.


      The [captured screen/grid example, Set a ghost note and an accent](#masks/mask-ghost-note) shows the same 80, 35, 100, 80 MIDI velocities over C, D, E and F (MIDI 60, 62, 64 and 65). It shows the exact mask edits from this recipe.

      Listen to the [separate Oilcan comparison, Adding a Ghost Note](#recording/ghost-note-comparison): bars 1 and 2 play the main hits; bars 3 and 4 add MIDI 38 at velocity 35 on step 12 before the MIDI 37 accent. This recording uses a different four-bar drum arrangement, not the C, D, E, F loop above.

      To make the ghost note come and go, continue with [Make the ghost note intermittent](#masks/recipe/3).'
  - title: Make the ghost note intermittent
    text: 'Starting point: the ghost-note loop from Add a ghost note before an accent (step 2 at velocity 35, step 3 at 100). Velocity decides how loud a note is; Trig Probability decides whether the trig plays at all. At 50, some loop passes include the ghost note and some omit it; judge over several passes, not from one fixed sequence.


      1. Open Channel tasks with E1, turn E2 to Trig params and press K3. The screen shows all ten slots at once. A slot that has no parameter assigned yet is an empty slot.


      2. Turn E2 to the first empty slot. E2 stops at slot 1 and at slot 10.


      3. Press K2, turn E3 until Trig Probability appears, press K3 to assign it and press K2 to return to slot selection. The slot now carries Trig Probability.


      4. Hold step 2 (grid (2,4)) and turn E3 until the screen reads 50. Release the step. Step 2 now has its own probability of 50; the other steps use the channel default and still play every time.


      5. Tap Play at (1,8) and listen over several passes: the ghost note sounds on about half of them and the other three notes never drop out. Tap Play again to stop.


      6. To remove the exception, hold step 2 on Trig params and press K2. This clears every parameter lock on that step.


      Steps 1 to 3 (moving to an empty slot and assigning Trig Probability) are shown screen by screen in the captured example "Turn chance into explicit rests".

      '
  - title: Add chord voices over a bass
    text: 'Starting point: keep the four-step loop from [Make your first loop](#getting-started) on channel 1 and use channel 2 for the chord. The bass device can be monophonic; channel 2 needs a polyphonic device because one step plays several notes together. The audio example "A bass with room above it" below plays the same idea with Polyperc 1 for the bass and Doubledecker for the chords; its notes and levels differ from the values used here.


      Set up the bass on channel 1.


      1. Tap (1,1) to select channel 1. Open Channel tasks with E1, turn E2 to Masks and press K3.


      2. With no step held, set Note to C2 (MIDI 48), Vel to 70 and Len to 1/2. Channel 1 now plays bass notes on steps 1-4.


      Set up the chord channel.


      3. Tap (2,1) to select channel 2. Open Channel tasks, choose Device and pick a polyphonic voice; press K3 to apply it.


      4. Assign pattern 1 to channel 2: tap pattern slot (1,2).


      5. Set channel 2 to the same four steps: hold step 1 (1,4), tap step 4 (4,4), then release step 1.


      6. On Masks, with no step held, set channel 2''s Note to C3 (MIDI 60), Vel to 60 and Len to 1/2. Checkpoint: it now plays single notes over the bass. If the chord channel is silent later, verify it has a polyphonic device assigned.


      Add the chord voices.


      7. Turn E2 to Chd1 and, with no step held, turn E3 two detents to 3rd. Every step adds the scale third above its root: 64.


      8. Turn E2 to Chd2 and turn E3 four detents to 5th. Every step adds the scale fifth: 67.


      9. Result check: tap Play at (1,8). Channel 2 plays C3, E3 and G3 (60, 64, 67) together on every step over bass C2 (48). If only C3 sounds, check that Chd1 is 3rd and Chd2 is 5th and that the channel uses a polyphonic device. Tap Play again to stop.


      Change the voicing.


      10. Turn E2 to Chd3 and set 6th (five detents): the chord adds A (69). Hold a single step and change a Chd row to give only that step a different voicing.


      Chd values are scale intervals above the root, not MIDI note numbers. In another scale the same 3rd and 5th give that scale''s intervals. The captured example "Set chord masks" shows each Chd edit and the MIDI notes it produces.'
  - title: 'Build the recording: Small hours · four bars in C major'
    text: "Starting point: Use an empty project at 90 BPM, Rate /1 and C major. Assign Polyperc 1 to channel 1 and Doubledecker to channel 2. Set both channel ranges and Song slot 1 to 64 steps; set Song tempo to 90 and apply Rate /1 on both channels with K3. Check: Song slot 1 shows 64 steps and playback is stopped.\n\nControls and step map: Open Channel (3,8), select a channel on row 1, use E1 for tasks and E2 to choose Device, Masks or Clock; K3 opens the task. On Masks, E2 chooses Note, Vel, Len, Chd1 or Chd2 and E3 changes the value. Hold K1 while tapping a step to add a trig; hold a step and turn E3 to edit its value. Hold the first step and tap the last to set a channel range. The grid shows 16 steps per page in rows 4–7: steps 1–16 are row 4, 17–32 row 5, 33–48 row 6 and 49–64 row 7. Step 33 is (1,6) and step 61 is (13,7); move to the page containing the bar before editing it. Open Song (6,8): slots 1–3 are on row 1; the length fader at (7,7) sets 64 steps.\n\nCheckpoint 1 — bass. On channel 1 set default Note MIDI 48, Vel 70 and Len ½. Add trigs at steps 1, 5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45, 49, 53, 57 and 61. Set steps 9, 25, 41 and 57 to MIDI 43; the other bass trigs stay at MIDI 48. Check the Masks readout at one normal step (48) and one low step (43); the bass line now spans all four bars.\n\nCheckpoint 2 — chord layer. On channel 2 set default Note MIDI 60, Vel 45 and Len 3 steps. Set Chd1=3rd and Chd2=5th. Add trigs at steps 1, 9, 17, 25, 33, 41, 49 and 57; each chord root stays MIDI 60. Check that the chord tones are the scale third and fifth above each root.\n\nCheckpoint 3 — hear the layer change. Press Play for four bars. Hold K1 and tap channel 2 selector (2,1) to mute the chords; check that the bass remains. Tap (2,1) again with K1 held to restore the chords; check that the same four-bar bass continues under them. Stop playback.\n\nRestore: Leave channel 2 unmuted and playback stopped. Keep this four-bar extension in its separate project; the course Masks phrases use different notes."
