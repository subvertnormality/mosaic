    canonical_route: adding-chords/lesson/add-scale-third-to-chord
    label: Open the scale-third chord lesson in Adding Chords
    reason: This action adds the scale third above each root; the canonical walkthrough is in Adding Chords.
  teaching_bindings:
  - id: note-default-g3
    binding:
      status: controlled-verified
      scene: mask-precedence
      step: default
    teaching_binding:
      transition_scope: adjacent
      from_step_id: route
      actions:
      - kind: select-value
        control: E3
        field_label: Note
        label: Set the channel Note default to G3
        value: G3
        direction: clockwise
        id: note-default-g3-01
        mask_field: note
      - kind: preview-recorded-result
        target_step_id: default
        label: Preview the loop with its G3 channel default
        id: note-default-g3-02
      semantic_requires:
        public_readout_equals:
          mask_fields:
          - field: note
            value: G3
            layout: overview_masks
        midi_events_at_target:
        - port: 1
          bytes:
          - 144
          - 67
          - 127
        - port: 1
          bytes:
          - 144
          - 67
          - 117
        - port: 1
          bytes:
          - 144
          - 67
          - 107
        - port: 1
          bytes:
          - 144
          - 67
          - 97
      human_outcome: All four pattern steps use the G3 channel note default while keeping their individual velocities.
      practice_prompt: '1. With no step held, turn E3 right until the screen reads G3 (MIDI 67). The screen shows the note name, so stop on the readout. This is the channel note mask: all four steps now play G, and their velocities stay as they were.'
    title: Set the channel Note default to G3
    goal: With no step held, set the channel Note default to G3. All four pattern steps then use G3 while retaining their individual velocities.
    starting_point: channel 1 plays pattern 1 on steps 1-4 with the notes C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, and no masks are set. Turn E1 to open Channel tasks, turn E2 to Masks and press K3, then turn E2 to Note. The header reads NOTE MASKS CH01 and the value reads X, which means no mask is set, so each step plays its own pattern note.
  - id: ghost-note-before-accent
    binding:
      status: controlled-verified
      scene: mask-ghost-note
      step: ghost
    teaching_binding:
      transition_scope: interval
      from_step_id: accent
      actions:
      - kind: hold-grid
        x: 2
        y: 4
        label: Hold Step 2 for its ghost-note velocity
        id: ghost-note-before-accent-01
      - kind: select-value
        control: E3
        field_label: Velocity
        label: Set the ghost-note velocity to 35
        value: '35'
        direction: anticlockwise
        id: ghost-note-before-accent-02
        mask_field: velocity
      - kind: release-grid
        x: 2
        y: 4
        label: Release Step 2
        id: ghost-note-before-accent-03
      - kind: preview-recorded-result
        target_step_id: ghost
        label: Preview the ghost note leading into the accent
        id: ghost-note-before-accent-04
      semantic_requires:
        public_readout_equals:
          mask_fields:
          - field: velocity
            value: '80'
            layout: overview_masks
        midi_events_at_target:
        - port: 1
          bytes:
          - 144
          - 60
          - 80
        - port: 1
          bytes:
          - 144
          - 62
          - 35
        - port: 1
          bytes:
          - 144
          - 64
          - 100
        - port: 1
          bytes:
          - 144
          - 65
          - 80
      human_outcome: Step 2 becomes the quiet ghost note before step 3’s louder accent.
      practice_prompt: '1. Hold step 2 at (2,4). Turn E3 anticlockwise until Velocity reads 35, then release the step.

        2. The phrase uses velocities 80, 35, 100, 80: the quiet ghost note leads into step 3’s accent. The channel default stays 80.'
    title: Set a ghost note and an accent
    goal: Set step 2 to a quiet ghost note at velocity 35 before step 3's accent at 100. Keep the channel default at 80.
    starting_point: Step 3 is already accented at velocity 100; step 2 is ready for its quiet ghost note. The channel default is 80 and the loop plays C, D, E and F.
  - id: change-melody-ending-to-d
    binding:
      status: controlled-verified
      scene: mask-melody-ending
      step: ending-d
    teaching_binding:
      transition_scope: interval
      from_step_id: step-four
      actions:
      - kind: hold-grid
        x: 4
        y: 4
        label: Hold Step 4 to edit the melody ending
        id: change-melody-ending-to-d-01
      - kind: select-value
        control: E3
        field_label: Note
        label: Set Step 4 to D4
        value: D4
        direction: anticlockwise
        id: change-melody-ending-to-d-02
        mask_field: note
      - kind: release-grid
        x: 4
        y: 4
        label: Release Step 4
        id: change-melody-ending-to-d-03
      - kind: preview-recorded-result
        target_step_id: ending-d
        label: Preview the melody ending on D4
        id: change-melody-ending-to-d-04
      semantic_requires:
        public_readout_equals:
          mask_fields:
          - field: note
            value: C3
            layout: overview_masks
        midi_events_at_target:
        - port: 1
          bytes:
          - 144
          - 72
          - 127
        - port: 1
          bytes:
          - 144
          - 74
          - 117
        - port: 1
          bytes:
          - 144
          - 79
          - 107
        - port: 1
          bytes:
          - 144
          - 74
          - 97
      human_outcome: 'Only step 4 changes: the melody ends on D4 (MIDI 74).'
      practice_prompt: '1. Hold step 4 at (4,4). Turn E3 anticlockwise until Note reads D4 (MIDI 74), then release the step.

        2. Only the ending changes: the phrase is now MIDI 72, 74, 79, 74.


        Keep the first three notes and use the last note to change how the phrase resolves.'
    title: Change the ending of a four-note melody
    goal: Change only step 4 to D4 (MIDI 74), so the four-note phrase ends on D4 while steps 1-3 stay the same.
    starting_point: The four-note loop ends on E4 (MIDI 76). Step 4 is ready for a new Note mask; the phrase currently reads 72, 74, 79, 76.
  - id: add-scale-third-to-chord
    binding:
      status: controlled-verified
      scene: mask-chords
      step: thirds
    teaching_binding:
      transition_scope: adjacent
      from_step_id: chord
      actions:
      - kind: select-value
        control: E3
        field_label: Chd1
        label: Add the scale third above each root with Chd1
        value: 3rd
        direction: clockwise
        id: add-scale-third-to-chord-01
        mask_field: chord_1
      - kind: preview-recorded-result
        target_step_id: thirds
        label: Preview roots with their scale thirds
        id: add-scale-third-to-chord-02
      semantic_requires:
        public_readout_equals:
          mask_fields:
          - field: chord_1
            value: 3rd
            layout: overview_masks
        midi_events_at_target:
        - port: 1
          bytes:
          - 144
          - 60
          - 127
        - port: 1
          bytes:
          - 144
          - 64
          - 127
        - port: 1
          bytes:
          - 144
          - 62
          - 117
        - port: 1
          bytes:
          - 144
          - 65
          - 117
        - port: 1
          bytes:
          - 144
          - 64
          - 107
        - port: 1
          bytes:
          - 144
          - 67
          - 107
        - port: 1
          bytes:
          - 144
          - 65
          - 97
        - port: 1
          bytes:
          - 144
          - 69
          - 97
      human_outcome: 'Each step plays its root with the scale third above it: MIDI pairs 60+64, 62+65, 64+67 and 65+69.'
      practice_prompt: '1. With no step held, turn E3 right until the screen reads 3rd (two detents). Every step now plays its root and the scale third above it: 60+64, 62+65, 64+67, 65+69. Chord values are scale intervals, not MIDI numbers. Read the MIDI strip: each step sends its root and its chord note together.'
    title: 'Context: Add a scale third with Chd1'
    goal: Masks explains how Chd1–Chd4 add scale-relative voices. The full captured walkthrough is [Add a scale third to each step in Adding Chords](#adding-chords/lesson/add-scale-third-to-chord).
    starting_point: channel 1 plays pattern 1 on steps 1-4 with the notes C, D, E and F (MIDI 60, 62, 64, 65) and no masks are set. Turn E1 to Channel tasks, turn E2 to Masks and press K3, then turn E2 to Chd1. The four chord rows Chd1-Chd4 add voices above each step's root, and X means no voice.
