- id: mask-trigs
  title: Add and remove trig masks
  behaviour_case: M-MASK-005
  setup:
    fixture: four-note-eight-step
    seed: 42
    voices:
      '1': Emulator test device
  steps:
  - id: route
    caption: 'Starting point: channel 1 plays pattern 1 in an eight-step loop. Steps 1-4 hold four notes and steps 5-8 are empty. No masks are set. Open Channel tasks with E1, turn E2 to Masks and press K3, then turn E2 to Note. The value reads X.'
    inputs:
    - type: enc
      n: 1
      delta: 1
    - type: enc
      n: 2
      delta: -20
    - type: key
      n: 3
    - type: enc
      n: 2
      delta: -10
    - type: enc
      n: 2
      delta: 1
    expect:
      screen:
      - - note
        - X
    citation: README.md#adding-melodic-notes-over-harmony-and-drums
  - id: note
    caption: 'With no step held, turn E3 right until Note reads C3 (MIDI 60). The channel default replaces the pattern''s notes on every step, so all four steps now play C3: read the MIDI strip, which shows C3 four times at the velocities the pattern already had (127, 117, 107, 97).'
    inputs:
    - type: enc
      n: 3
      delta: 61
    expect:
      screen:
      - - note
        - C3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 127
      - port: 1
        bytes:
        - 144
        - 60
        - 117
      - port: 1
        bytes:
        - 144
        - 60
        - 107
      - port: 1
        bytes:
        - 144
        - 60
        - 97
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#masks
  - id: velocity
    caption: 'Turn E2 to Vel and turn E3 right until it reads 80. The channel velocity replaces the pattern''s velocities too: the MIDI strip now shows C3 at velocity 80 four times.'
    inputs:
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 3
      delta: 81
    expect:
      screen:
      - - velocity
        - '80'
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#masks
  - id: length
    caption: Turn E2 to Len and turn E3 right until it reads 1/2. The four notes now have a half-step gate. A trig mask has no pattern note of its own, so a trig you add next will use these three channel defaults.
    inputs:
    - type: enc
      n: 2
      delta: 1
    - type: enc
      n: 3
      delta: 8
    expect:
      screen:
      - - length
        - 1/2
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
      durations:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
    citation: README.md#adding-trig-masks
  - id: select-note-field
    caption: Return to the channel Note field before setting Step 5.
    inputs:
    - type: enc
      n: 2
      delta: -2
    expect:
      screen:
      - - note
        - C3
      midi_phrase:
      - &id001
        port: 1
        bytes:
        - 144
        - 60
        - 80
      - *id001
      - *id001
      - *id001
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#adding-trig-masks
  - id: step-five-note-held
    caption: Hold Step 5 and set its stored note to E3.
    inputs:
    - type: grid
      x: 5
      y: 4
      state: 1
    - type: enc
      n: 3
      delta: 4
    expect:
      screen:
      - - note
        - E3
    citation: README.md#adding-trig-masks
  - id: step-five-no-trig
    caption: Release Step 5. Its E3 note is stored, but the step still has no trig, so the loop keeps playing the four C3 notes.
    inputs:
    - type: grid
      x: 5
      y: 4
      state: 0
    expect:
      screen:
      - - note
        - C3
      midi_phrase:
      - &id002
        port: 1
        bytes:
        - 144
        - 60
        - 80
      - *id002
      - *id002
      - *id002
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#adding-trig-masks
  - id: add
    caption: 'Turn E2 back to Note. Hold step 5 at (5,4), turn E3 right four detents until the screen reads E3 (MIDI 64) and release it. Step 5 now has its own note, but it still has no trig, so nothing new sounds. Then hold K1 and tap step 5, release the step, then release K1. A trig mask now forces step 5 on, so the loop plays a fifth note after the four notes on steps 1-4: E3 (64) at velocity 80, shown in the MIDI strip and by the new lit step 5 on the grid.'
    inputs:
    - type: key
      n: 1
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 0
    - type: key
      n: 1
      state: 0
    expect:
      screen:
      - - note
        - C3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 64
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      - 4
      cycle_steps: 8
    citation: README.md#adding-trig-masks
  - id: remove
    caption: Hold K1 and tap step 5 again, release the step, then release K1. The same gesture toggles the trig mask off, so the loop returns to four C3 notes on steps 1-4. Step 5 keeps its note mask but has no trig, so it stays silent.
    inputs:
    - type: key
      n: 1
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 1
    - type: grid
      x: 5
      y: 4
      state: 0
    - type: key
      n: 1
      state: 0
    expect:
      screen:
      - - note
        - C3
      midi_phrase:
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      - port: 1
        bytes:
        - 144
        - 60
        - 80
      positions:
      - 0
      - 1
      - 2
      - 3
      cycle_steps: 8
    citation: README.md#adding-trig-masks
