scenes:
- id: public-display-readability
  feature_id: navigating-the-norns-display
  title: 'See what UI motion changes: Off and On'
  behaviour_case: M-UI-READABILITY-001
  requirements:
  - CH-ASSIGN
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
    case: M-UI-READABILITY-001
    input_units: native; encoder units are twice the detents
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step phrase on steps 1-4 (MIDI 60, 62, 64, 65
      at velocities 127, 117, 107, 97) through a MIDI device on OUT 1, in C major,
      with the internal clock at 90 BPM and Rate /1. In PARAMS > MOSAIC, UI motion
      starts Off; later steps turn it On and then change the tempo. This lesson compares
      the norns screen with UI motion Off and On: Off keeps everything still, On animates
      the small title pictures and any text too long for its space.'
    citation: README.md#ui-motion
