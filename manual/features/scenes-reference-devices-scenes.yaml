  - id: value-0
    title: Turn up from X to 0
    caption: Turn E3 one detent right from X. Control 1 reads 0 and sends MIDI CC
      1 with value 0.
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -2
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: selected-menu-value
        text: '0'
  - id: value-1
    title: One more detent
    caption: Turn E3 one detent right. Control 1 reads 1 and sends MIDI CC 1 with
      value 1. Each detent moves the value by one.
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: selected-menu-value
        text: '1'
  - id: value-64
    title: Turn up to the middle
    caption: Keep turning E3 right until Control 1 reads 64, passing 63. In the MIDI
      strip, CC 1 shows 63 and then 64.
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 124
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: selected-menu-value
        text: '64'
  - id: value-126
    title: Turn up to just below the top
    caption: Keep turning E3 right until Control 1 reads 126, one below the highest
      value.
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 124
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: selected-menu-value
        text: '126'
  - id: value-127
    title: Turn up to the top and stop
    caption: 'Turn E3 right once more: Control 1 reads 127, the highest value, and
      sends MIDI CC 1 with 127. One more turn leaves it at 127.'
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: 2
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: selected-menu-value
        text: '127'
  - id: bounds
    title: Turn down to X
    caption: 'Turn E3 left: the value falls to 64, then 1, then to X, which means
      Off: no CC is sent. One more turn down stays at X. The last frame shows Control
      1 back at X.'
    citation: README.md#device-parameters
    inputs:
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -126
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -126
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -4
    - type: wait
      seconds: 0.03
    - type: wait
      seconds: 0.05
    - type: enc
      n: 3
      delta: -2
    - type: wait
      seconds: 0.03
    expect:
      assertion:
        kind: stored-patch-sentinel-boundaries
        configured: true
        clamped_attempts: true
        passed: true
- id: device-sparse-control-domain
  feature_id: device-parameters
  title: Set a parameter with a restricted range
  behaviour_case: M-PATCH-010
  requirements:
  - CH-PATCH-SENTINEL
  profile: base-midi
  session_ordinal: 0
  setup:
    fixture: behaviour-case
