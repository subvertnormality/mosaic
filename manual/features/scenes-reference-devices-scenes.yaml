      117, 107 and 97, in C major. The sequencer is stopped. Channel 1''s output is
      a test device with a control named SparseLow that only accepts values 100 to
      127; it is unset (X). A device definition can limit a control to part of the
      CC range like this, and Mosaic then offers only the valid values. The norns
      shows channel 1''s Device screen.'
