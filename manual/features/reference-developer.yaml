- id: interesting-components-for-norns-script-developers
  title: Interesting Components for Norns Script Developers
  audience: developer
  summary: The Lua harness and mocks run norns script tests away from hardware.
  prose: 'Mosaic has a Lua test harness that runs norns scripts away from the hardware. It downloads a
    copy of the norns repository and uses local mocks and shims so luaunit tests run on a normal computer.
    The harness and example tests are in the lib/tests folder; start there when you want to test your
    own script the same way. Run it on a development machine, never on norns.


    This program is released under the GNU license. Copyright Andrew Hillel 2024.'
  musical_use: ''
  related:
  - development
  sources:
    readme: manual/legacy/README-1.4.0.md#interesting-components-for-norns-script-developers
    behaviour_cases: []
    code:
    - lib/tests/run_tests.lua
  controls: []
  details:
  - title: Where to look
    text: lib/tests/run_tests.lua downloads the norns copy and loads every test file. lib/tests/lib holds
      the unit tests, for example m_midi_tests.lua (MIDI output with a spy device), scheduler_tests.lua
      (the scheduler) and ui_adapters_tests.lua (screen pages). lib/tests/lib/integration_tests holds
      tests that run several modules together. lib/tests/helpers/mocks holds the stand-ins for norns,
      params, MIDI and the scheduler.
  recipes:
  - title: Read a harness example
    text: "1. Open lib/tests/lib/m_midi_tests.lua in the Mosaic repository. Its helper with_output_spy\
      \ swaps the global midi_devices for a stub that records note_on and note_off calls, runs the module\
      \ under test and checks what was sent with luaunit.assert_equals. That is a complete example of\
      \ testing a norns script without hardware. The helper, lines 3-14 of the file:\n```lua\nlocal function\
      \ with_output_spy(run)\n  local original_devices=midi_devices\n  local sent={}\n  midi_devices={{\n\
      \    note_on=function(_,note,velocity,channel) sent[#sent+1]={\"on\",note,velocity,channel} end,\n\
      \    note_off=function(_,note,velocity,channel) sent[#sent+1]={\"off\",note,velocity,channel} end\n\
      \  }}\n  midi_output:reset_note_counts()\n  local ok,err=pcall(run,sent)\n  midi_output:reset_note_counts();midi_devices=original_devices\n\
      \  if not ok then error(err,0) end\nend\n```\nThe test that uses it, lines 33-38 of the file: it\
      \ releases a note that was never played with an out-of-range value, and the spy shows the value\
      \ clamped to 127 before it is sent.\n```lua\nfunction test_unmatched_midi_release_is_clamped_before_safety_send()\n\
      \  with_output_spy(function(sent)\n    midi_output:note_off(200,77,4,1)\n    luaunit.assert_equals(sent,{{\"\
      off\",127,77,4}})\n  end)\nend\n```\n2. Open lib/tests/helpers/mocks to see the other stand-ins\
      \ (norns_mock.lua, params_mock.lua, scheduler_mock.lua, m_midi_mock.lua) and search lib/tests/lib\
      \ for the tests that include them.\n3. Run every test with ./test.sh on your computer. To run a\
      \ single test, change into lib/tests and run lua ./run_tests.lua with luaunit's -p option and part\
      \ of the test's name, for example -p test_unmatched_midi_release."
  scene_refs: []
  review:
    status: verified
    cases: []
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
