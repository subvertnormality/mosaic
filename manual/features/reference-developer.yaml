features:
- id: development
  title: Development
  audience: developer
  summary: Run the repository tests on a development machine before opening a pull request.
  prose: 'This section is for people changing Mosaic''s code, not for playing it. Before opening a pull
    request, run the repository tests on a development machine:


    ```

    ./test.sh

    ```


    Do not run the harness on norns. It downloads a copy of the norns repository, which can conflict with
    the device''s own installation. If you ran it on the device by mistake, delete /code/mosaic/lib/tests/test_artefacts
    to remove that copy and restore the device.'
  musical_use: ''
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#development
    behaviour_cases: []
    code:
    - test.sh
    - lib/tests/run_tests.lua
    - tests/behaviour/run.py
    - tests/behaviour/suite.py
  controls:
  - gesture: Run ./test.sh on the development machine.
    result: The Lua test suite runs. Do not run the harness on the norns device.
  details:
  - title: Behavior changes
    text: '1. Add the smallest regression for the change.

      2. Confirm that it fails for the expected reason.

      3. Make the production change and rerun the regression.

      4. Run affected unit, integration and emulator behavior tests, then the full Lua suite.

      Follow AGENTS.md. Documentation does not replace observable acceptance.'
  recipes:
  - title: Check a change before a pull request
    text: 'Before you start you need Lua (CI uses 5.3), curl, unzip and network access to GitHub: the
      first run downloads a copy of the norns repository.

      1. On your computer, open a terminal in the Mosaic folder.

      2. Run ./test.sh and wait for it to finish. It ends with luaunit''s summary, Ran N tests in S seconds,
      N successes, 0 failures, then OK.

      3. Fix any failing test, then run it again until the whole suite passes.

      4. Only then open the pull request. CI runs the same ./test.sh on every pull request, so a pass
      here predicts the check.

      5. Never run this on the norns itself. If you did, delete /code/mosaic/lib/tests/test_artefacts
      to remove the downloaded copy.'
  scene_refs: []
  review:
    status: verified
    cases: []
    note: Source and case definitions reviewed. Published native assertions and their scope are listed
      separately; pending gaps are not acceptance evidence.
    source_status: code-and-case-reviewed
    native_evidence: []
    applicability: documentation-only
    rationale: Development-machine test commands are developer guidance, not a player-input feature.
    native_gap: No native playback capture is required for the prose; test-suite results remain separate
      evidence.
  category: developer
  parent: null
  level: 2
