schema_version: 1
status: semantic-checkpoint-plan-not-captured
scope: Public norns key and encoder device parameter cases. Deferred steps verify an explicit final live
  native menu before teardown and bind it to the complete passing native MIDI oracle; they do not depict
  the processing of the shutdown log.
scenes:
- id: configured-device-value-boundaries
  feature_id: device-parameters
  title: Set a configured device parameter
  behaviour_case: M-PATCH-002
  citation: README.md#device-parameters
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes
      C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, in C major. The sequencer
      is stopped. Channel 1''s output is a test device whose parameter Control 1 sends MIDI CC 1 from
      0 to 127 and has an Off position shown as X. No value is stored for Control 1 yet. The norns shows
      channel 1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: select-control-1
    title: Select Control 1
    caption: 'Choose the test device on channel 1''s Device screen. Tap K1 to open the norns PARAMS menu,
      go to MOSAIC, open channel 1''s device parameters and turn E2 to Control 1. It reads X: Off, so
      no CC is sent.'
    assertion:
      kind: selected-menu-label
      text: Control 1
  - id: value-0
    title: Turn up from X to 0
    caption: Turn E3 one detent right from X. Control 1 reads 0 and sends MIDI CC 1 with value 0.
    assertion:
      kind: selected-menu-value
      text: '0'
  - id: value-1
    title: One more detent
    caption: Turn E3 one detent right. Control 1 reads 1 and sends MIDI CC 1 with value 1. Each detent
      moves the value by one.
    assertion:
      kind: selected-menu-value
      text: '1'
    occurrence: 1
  - id: value-64
    title: Turn up to the middle
    caption: Keep turning E3 right until Control 1 reads 64, passing 63. In the MIDI strip, CC 1 shows 63
      and then 64.
    assertion:
      kind: selected-menu-value
      text: '64'
    occurrence: 1
  - id: value-126
    title: Turn up to just below the top
    caption: Keep turning E3 right until Control 1 reads 126, one below the highest value.
    assertion:
      kind: selected-menu-value
      text: '126'
    occurrence: 1
  - id: value-127
    title: Turn up to the top and stop
    caption: 'Turn E3 right once more: Control 1 reads 127, the highest value, and sends MIDI CC 1 with
      127. One more turn leaves it at 127.'
    assertion:
      kind: selected-menu-value
      text: '127'
    occurrence: 2
  - id: bounds
    title: Turn down to X
    caption: 'Turn E3 left: the value falls to 64, then 1, then to X, which means Off: no CC is sent.
      One more turn down stays at X. The last frame shows Control 1 back at X.'
    assertion:
      kind: stored-patch-sentinel-boundaries
      configured: true
      clamped_attempts: true
      passed: true
- id: device-sparse-control-domain
  feature_id: device-parameters
  title: Set a parameter with a restricted range
  behaviour_case: M-PATCH-010
  citation: README.md#device-parameters
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes
      C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, in C major. The sequencer
      is stopped. Channel 1''s output is a test device with a control named SparseLow that only accepts
      values 100 to 127; it is unset (X). A device definition can limit a control to part of the CC range
      like this, and Mosaic then offers only the valid values. The norns shows channel 1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: select-sparselow
    title: Select SparseLow
    caption: 'Choose the test device on channel 1''s Device screen. Press K1 to open the norns PARAMS
      menu, go to MOSAIC, open channel 1''s device parameters and turn E2 to SparseLow. It reads X: nothing
      is sent. SparseLow only accepts 100 to 127, and X means no CC is sent.'
    assertion:
      kind: selected-menu-label
      text: SparseLow
    occurrence: 1
  - id: value-100
    title: Turn up to 100
    caption: Turn E3 one detent right. SparseLow jumps from X straight to 100, the lowest value it accepts,
      and sends its CC with value 100.
    assertion:
      kind: selected-menu-value
      text: '100'
  - id: value-127
    title: Keep turning up to 127
    caption: 'Keep turning E3 right: SparseLow climbs through 101 to 127 and stops at 127, the highest
      value. One more turn leaves it there.'
    assertion:
      kind: selected-menu-value
      text: '127'
    occurrence: 2
  - id: range
    title: Turn back down to X
    caption: 'Turn E3 back down: SparseLow drops past 100 to X, where nothing is sent. The screen ends
      on SparseLow / X.'
    assertion:
      kind: sparse-CC-domain
      range:
      - 100
      - 127
      'off': -1
      values: 28
      passed: true
    capture_stage: before-finish
    pre_finish_expect:
      menu_label:
        label: SparseLow
      menu_value:
        value: X
- id: device-stored-value-and-step-lock
  feature_id: device-parameters
  title: Keep a stored value while locking a step
  behaviour_case: M-PATCH-012
  citation: README.md#device-parameters
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes
      C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97, in C major. The sequencer
      is stopped. The test device has a CC 1 control; no value is stored for it yet. The norns shows channel
      1''s Device screen.'
    assertion:
      kind: screen-header
      expected: DEVICE CH01
      matched: true
  - id: stored-63
    title: Store CC 1 at 63
    caption: 'Choose the test device on channel 1''s Device screen. Press K1 to open the norns PARAMS
      menu, go to MOSAIC > channel 1''s device parameters, select CC 1 and turn E3 right until it reads
      63. This is the stored value: the level CC 1 holds whenever no step overrides it.'
    assertion:
      kind: selected-menu-value
      text: '63'
    occurrence: 1
  - id: assign-cc1
    title: Assign CC 1 to a Trig params slot
    caption: Close the menu. On Channel tasks > Trig params assign CC 1 to a slot with E3 and K3. Its
      slot is the one you will lock per step.
    assertion:
      kind: parameter-list-label
      label: CC 1
      passed: true
  - id: lock-held
    title: Lock step 1 to 99
    caption: Press K3 to confirm the assignment and K2 to go back. Hold step 1 at (1,4) and turn E3 right
      36 detents from 63 to 99. Slot 1 shows 99 with an L in its corner while the step is held. The
      stored value, 63, is not changed. Release the step.
    assertion:
      kind: selected-param
      value: '99'
      marker: L
  - id: lock-play
    title: Play two loops
    caption: Press Play, let two loops sound and press Play again to stop. In the MIDI strip, CC 1 = 99
      comes just before step 1's note, and CC 1 = 63, the stored value, before the other steps; at the
      very first note the stored 63 is sent first and then the lock 99.
    assertion:
      kind: midi
    occurrence: 1
  - id: stored-versus-lock
    title: The stored value is unchanged
    caption: 'Press K1 and reopen the device parameters: CC 1 still reads 63, because a lock never changes
      the stored value.'
    assertion:
      kind: patch-lock-complete-phrase-order
      lock_value: 99
      passed: true
    capture_stage: before-finish
    pre_finish_expect:
      menu_label:
        label: CC 1
      menu_value:
        value: '63'
