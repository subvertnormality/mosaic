    117, 107, 97), in a scale with Degree II and Rotation 1. On enables full scale mapping; Off disables
    it. An absent step lock uses the channel, and channel X uses the global option. An explicitly stored
    step X skips the channel and uses the global option directly; clearing it with K2 restores channel
    inheritance. In the state lists, X without a stored step lock means no exception; explicit step X
    is named separately. The state is listed as global / channel / step 1 / step 2. Now: Off / X / Off
    / On. The global Off is inherited by the channel, step 1 is Off and step 2 is On, so the strip reads
    60, 65, 69, 71.'
  baseline_caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities
    127, 117, 107, 97), in a scale with Degree II and Rotation 1. Quantise Note Mask works on three levels,
    strongest first: a step lock, then the channel value, then the global option. On follows the scale,
    Off keeps the written pitch, and X means inherit from the next level down. The state is listed as
    global / channel / step 1 / step 2. Now: Off / X / Off / On. The global Off is inherited by the channel,
    step 1 is Off and step 2 is On, so the strip reads 60, 65, 69, 71.'
  contract_sha256: fd5663ad255f20e23978e018fe39455c41972cd69b8060f626c03a484132391b
