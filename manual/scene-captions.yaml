- scene_id: trigless-locks-on
  step_id: start
  caption: 'Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities 127,
    117, 107 and 97, in C major through the test MIDI device at 90 BPM with Rate /1 and channel range
    steps 1-4. The sequencer is stopped and the Device page for CH01 is showing. Channel 2 is not set
    up yet: you will route the same pattern to it as a timing reference. Trigless locks is at its default
    On.'
  baseline_caption: 'Channel 1 plays a four-step pattern, C3 D3 E3 F3 (MIDI 60, 62, 64, 65) at velocities
    127, 117, 107 and 97, in C major through the test MIDI device at 90 BPM with Rate /1 and channel range
    steps 1-4. The sequencer is stopped and the Device page for CH01 is showing. Channel 2 is not set
    up yet: you will make it a steady timing reference. Trigless locks is at its default On.'
  contract_sha256: 508add5c99179199992512882ec5c8fdc9b9f69e3edd7deef89d47f4ca1a53a6
- scene_id: trigless-locks-on
  step_id: assign-cc
  caption: 'Tap K1 and open PARAMS > MOSAIC. Trigless locks reads On, its default, so locks on steps without
    a trig will still be sent. Press K2, then K1 to leave the menu. Set up channel 2 as the timing reference:
    tap (2,1), open Channel tasks > Device, point it at the second MIDI port, give it pattern 1 at (1,2)
    and range steps 1-4 (hold (1,4), tap (4,4)). Both channels use pattern 1, so pattern-trig edits affect
    both. Probability and CC locks on channel 1 do not change channel 2. Then tap channel 1 (1,1), open
    Channel tasks > Trig params and assign CC 1 to the first slot.'
  baseline_caption: 'Tap K1 and open PARAMS > MOSAIC. Trigless locks reads On, its default, so locks on
    steps without a trig will still be sent. Press K2, then K1 to leave the menu. Set up channel 2 as
    the timing reference: tap (2,1), open Channel tasks > Device, point it at the second MIDI port, give
    it pattern 1 at (1,2) and range steps 1-4 (hold (1,4), tap (4,4)). It will play C D E F on MIDI channel
    2 on every loop whatever you do to channel 1. Then tap channel 1 (1,1), open Channel tasks > Trig
    params and assign CC 1 to the first slot.'
  contract_sha256: 508add5c99179199992512882ec5c8fdc9b9f69e3edd7deef89d47f4ca1a53a6
- scene_id: trigless-locks-on
  step_id: rest
  caption: 'Open the Pattern editor (5,8), tap step 3 to remove its trig, and return to the Channel editor
    (3,8). Play. With Trigless locks On, a lock on a step with no trig is still sent: the MIDI strip shows
    CC 1 still sending 72 at step 3, so automation keeps moving through rests, for example a filter sweep
    under a sparse rhythm. Pattern 1 is shared: channel 2 also loses its E note on step 3 and now plays
    C, D, F; its timing continues through that rest.'
  baseline_caption: 'Open the Pattern editor (5,8), tap step 3 to remove its trig, and return to the Channel
