  step_id: ready
  caption: Wait while the norns analyses the recording; a short take takes roughly half a minute, and
    this wait cannot be shortened. When it finishes, the Window screen shows READY with Window bar 1,
    Window step 1, Sensitivity 0 and Paint policy TOGGLE. Window bar moves the view by 16 steps and Window
    step by one, Sensitivity is set for the selected lane, and Paint policy (Toggle, Add or Replace) decides
    how painted hits meet trigs already in the pattern. The lane buttons BD (bass drum), SD (snare) and
