- scene_id: first-sound-equal-note-loop
  step_id: assignment
  caption: 'Tap Channel (3,8), then tap pattern slot (1,2) to feed pattern 1 to channel 1. Next limit
    the channel to four steps: hold step 1 at (1,4), tap step 4 at (4,4), then release step 1. Hold the
    first step of the range, tap the last, then let go. The channel now loops steps 1 to 4, and those
    four steps are brighter than the rest of row 4.'
  baseline_caption: Tap Channel and assign pattern 1. Hold step 1, tap step 4, then release step 1 to
    set a four-step range.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: first-sound-equal-note-loop
  step_id: device
  caption: 'Starting point: a new, empty project, stopped, with Record off. No channel has an output,
    no pattern has trigs and no masks are set. Tap Channel (3,8): the header reads CH01. Turn E1 to open
    Channel tasks, choose Device with E2 and press K3. Turn E3 one detent to the first output in the list
    and press K3 to apply it. Whichever name the row shows is fine for this walk-through; in your own
    project pick the note-capable output you set up in Connect a sound. The Device page for CH01 stays
    on screen.'
  baseline_caption: Tap Channel. Open Channel tasks, select Device, choose the first MIDI output and press
    K3.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: first-sound-equal-note-loop
  step_id: length-and-playback
  caption: Turn E2 one detent to select Len, then turn E3 until the screen reads 1/2, so each note lasts
    half a step. Tap Play (1,8) to hear four equal C notes (MIDI 60, velocity 80) repeating as the playhead
    runs along steps 1 to 4; the frame shows the Masks screen, so listen to your output or check the MIDI
    strip below. Tap Play again to stop.
  baseline_caption: Select Len and set 1/2. Press Play to hear four equal MIDI 60 attacks. The replay
    checks two complete cycles and stops playback.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: first-sound-equal-note-loop
  step_id: note
  caption: Turn E1 to open Channel tasks, scroll up to Masks with E2 and press K3. Select Note with E2,
    then turn E3 right until the screen reads C3, which is MIDI 60. The Note row shows the name, so stop
    on the readout instead of counting. With no step held this sets the channel note for all steps.
  baseline_caption: Open Masks, select Note and set MIDI 60. The Masks screen displays C3.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: first-sound-equal-note-loop
  step_id: pattern
  caption: Tap Pattern (5,8) for the Trig view of pattern 1, then tap steps (1,4), (2,4), (3,4) and (4,4).
    Four steps light on row 4. Each lit step is a trig, a moment where a note will sound.
  baseline_caption: Tap Pattern and activate steps 1–4. The Pattern Trig page remains selected.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: first-sound-equal-note-loop
  step_id: velocity
  caption: Turn E2 one detent to select Vel, then turn E3 right until the screen reads 80. Every step
    now plays at velocity 80, a medium-loud level.
  baseline_caption: Select Vel and set 80. All steps use this channel velocity default.
  contract_sha256: 606d8f8e0eaa2f5385dfdabd14cb0ef68d586447e5fd39fa90fe0f8a9645aedf
- scene_id: software-player-doubledecker
  step_id: select-player
  caption: This captured frame shows Doubledecker selected as a draft; the Device page still asks for
    K3. Press K3 to apply it, then confirm Doubledecker in the Device row. The complete captured apply-and-reopen
    sequence is in [Apply Doubledecker to the chord channel](#mods-and-software-devices/player-apply-doubledecker).
    Once applied, its two layers can voice a chord part.
  baseline_caption: On channel 3's Device page, turn E3 until the Device row reads Doubledecker. The row
    shows the player name and the screen asks you to press K3 to confirm; nothing is applied yet.
  contract_sha256: 4e0d28119b21916618c7f5b0b3d6017eeb4f0afd943c1a5ae87162190e1d284e
- scene_id: software-player-oilcan
