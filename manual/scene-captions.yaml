schema_version: 1
overlays:
- scene_id: doctor-local-auto-capture-and-paint
  step_id: analyse
  caption: 'Let the take run until the screen reads ENOUGH / REC OR K3 (about 25 seconds of the loop;
    this is real time, so wait for the readout), then press K3. Doctor stops recording and analyses it:
    ANALYSING, Lanes BD SD CYM.'
  baseline_caption: Press K3 after enough audio has been recorded. Doctor analyses the recording.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: paint
  caption: Press Paint at (16,8) again to commit. The tooltip reads Pattern painted and the flashing steps
    become solid trigs in pattern 1, on the same steps as the preview. The captured bank stays unchanged.
  baseline_caption: Tap Paint again. The attacks are stored in pattern 1.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: play
  caption: Press Channel (3,8), then Play at (1,8). Channel 1 sends MIDI note 60 on each painted step, with
    velocities taken from the recording. In this captured three-second pass, the MIDI strip shows
    velocities 114, 110 and 107, one hit per beat. The frame shows the Masks screen with the pattern
    stopped; check the MIDI strip below for the notes sent. Press Play again after about three seconds
    to stop.
  baseline_caption: Tap Play. Channel 1 sends the painted attacks to its MIDI output. Tap Play again to
    stop.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: preview
  caption: 'Select the BD lane (bass drum) at (3,2) and tap Paint at (16,8). The grid flashes the detected
    bass-drum hits on steps 10, 14, 18 and so on every fourth step to step 62, one per beat. The first
    hit is on step 10, not step 1, because Auto estimates the phrase start from the recording and the
    first thump comes some way into it; a Manual-tempo take of the same loop shows it on step 11. This
    is only a preview: nothing is stored yet. The screen reads PAINT, Policy TOGGLE, Destination 1.'
  baseline_caption: Select BD and tap Paint to preview its detected attacks.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: ready
  caption: Wait while the norns analyses the recording; a short take takes roughly half a minute, and
    this wait cannot be shortened. When it finishes, the Window screen shows READY with Window bar 1,
    Window step 1, Sensitivity 0 and Paint policy TOGGLE. Window bar moves the view by 16 steps and Window
    step by one, Sensitivity is set for the selected lane, and Paint policy (Toggle, Add or Replace) decides
    how painted hits meet trigs already in the pattern. The lane buttons BD (bass drum), SD (snare) and
    CYM (cymbal) light at (3,2) to (5,2).
  baseline_caption: When analysis finishes, Doctor displays the recording window.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: record
  caption: Leave Tempo on AUTO and tap Record at (1,2). Doctor starts listening to the audio input and
    will estimate the tempo and phrase start itself. The screen reads CAPTURE, MORE AUDIO NEEDED, LISTENING.
  baseline_caption: Tap Record. Doctor starts listening to the audio input using Auto tempo.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-auto-capture-and-paint
  step_id: setup
  caption: 'Starting point: channel 1 has a MIDI device on OUT 1 with pattern 1 assigned (range steps
    1-64) and playback is stopped. Play a steady loop into the norns audio input, with a short thump on
    every beat at 120 BPM; the example uses a 29-second loop, so use one at least that long. Press Pattern
    (5,8) and choose the Rhythm Doctor algorithm at (16,2). Rhythm Doctor opens on the norns: Record READY,
    Tempo AUTO, Manual BPM 120, Input STEREO. The bank is EMPTY, so there are no detected hits to paint yet.'
  baseline_caption: Select Rhythm Doctor while the sequencer is stopped.
  contract_sha256: 8f2e021bf96f7c8c374c1dc9605f7c9dfaa3f08bbf9073121c691c57eea8231d
- scene_id: doctor-local-capture-and-paint
  step_id: analyse
  caption: 'Let the take run until the screen reads ENOUGH / REC OR K3 (about 25 seconds of the loop;
    this is real time, so wait for the readout), then press K3. Doctor stops recording and analyses it:
    ANALYSING, Lanes BD SD CYM.'
  baseline_caption: Press K3 after enough audio has been recorded. Doctor analyses the recording.
  contract_sha256: 3c32acba60d3d1596fe3418732527428ec5017cfdb21c502cf78b2c8671dc074
