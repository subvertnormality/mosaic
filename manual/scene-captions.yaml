  baseline_caption: Tap Paint again. The attacks are stored in pattern 1.
  contract_sha256: 3c32acba60d3d1596fe3418732527428ec5017cfdb21c502cf78b2c8671dc074
- scene_id: doctor-local-capture-and-paint
  step_id: play
  caption: Press Channel (3,8), then Play at (1,8). Channel 1 sends MIDI note 60 on each painted step
    at velocities near 123, taken from the recording, one hit per beat; the painted steps are the bass-drum
    hits. The frame shows the Masks screen with the pattern stopped; check the MIDI strip below for the
    notes sent. Press Play again after about three seconds to stop.
  baseline_caption: Tap Play. Channel 1 sends the painted attacks to its MIDI output. Tap Play again to
    stop.
  contract_sha256: 3c32acba60d3d1596fe3418732527428ec5017cfdb21c502cf78b2c8671dc074
- scene_id: doctor-local-capture-and-paint
  step_id: preview
  caption: 'Select the BD lane (bass drum) at (3,2) and tap Paint at (16,8). The grid flashes the detected
    bass-drum hits on steps 11, 15, 19 and so on every fourth step to step 63, one per beat at 120 BPM.
    The first hit is on step 11, not step 1, because Manual starts the phrase at the very start of the
    recording and the first thump comes some way into it. This is only a preview: nothing is stored yet.
