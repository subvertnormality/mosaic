  caption: Tap channel 2 at (2,1), open Channel tasks > Device with E1/E2 and K3. Check the screen header
    reads DEVICE CH02. A channel is the numbered MIDI route on an output.
  baseline_caption: Tap channel 2 at (2,1), turn E1 to Channel tasks, turn E2 to Device and press K3.
    The Device page now reads CH02.
  contract_sha256: 7aaf73d07de2cc309648f2872d040a2ec6e1b8137a41c8475075e8713e0de09a
  step_title: Checkpoint 2 — select channel 2
  baseline_step_title: Select channel 2
- scene_id: workflow-second-channel
  step_id: channel-2-routed
  caption: On Device, choose the same device on port 2 and MIDI channel 2, then press K3 to apply. A port
    is a MIDI output; the channel number is the route the receiver listens to. Assign pattern 2 at (2,2),
    set its range to steps 1–4 by holding step 1 and tapping step 4, then check Merge modes shows CH02
    and Patterns 02 and slot (2,2) remains lit.
  baseline_caption: On the Device page choose the same device on MIDI port 2 and MIDI channel 2 (turn
    E3 or E2 to each setting) and press K3 to apply. Tap pattern slot (2,2) for pattern 2, then hold step
    1 and tap step 4 to give channel 2 the range steps 1-4. Assigning the pattern brings up Merge modes
    for CH02 with Patterns 02, and the pattern slot (2,2) stays lit.
  contract_sha256: 7aaf73d07de2cc309648f2872d040a2ec6e1b8137a41c8475075e8713e0de09a
  step_title: Checkpoint 3 — assign a separate output
  baseline_step_title: Route channel 2
- scene_id: workflow-second-channel
  step_id: channel-2-masks
  caption: Open Channel tasks > Masks and press K3. Check the screen reads Note Masks for CH02; this is
    where the channel's note values and held-step masks are edited.
  baseline_caption: Turn E1 to Channel tasks, turn E2 to Masks and press K3. The screen reads Note Masks
    for CH02.
  contract_sha256: 7aaf73d07de2cc309648f2872d040a2ec6e1b8137a41c8475075e8713e0de09a
  step_title: Checkpoint 4 — open channel 2 Masks
  baseline_step_title: Open its Masks
- scene_id: workflow-second-channel
  step_id: two-channels
  caption: 'On Masks, hold step 3 and play MIDI note 76 at velocity 90; a mask is an override stored on
    the held step. Release the key and step. Select channel 1 at (1,1), press Play (1,8), then Stop. Check
    the MIDI strip: port 1/channel 1 keeps MIDI 66, 64, 69, 67 at velocities 127, 117, 107, 97; port 2/channel
    2 plays MIDI 69 (A) on step 1 and MIDI 76 on step 3. The complete route for this scene is [MIDI Keyboard
    Input](#midi-keyboard-input/workflow-second-channel).'
  baseline_caption: 'On Masks, hold step 3 and play MIDI note 76 at velocity 90 on a MIDI keyboard or
    controller to lock it to that step. Tap channel 1 at (1,1) and press Play, then Stop. Both channels
    sound, each on its own port, in the MIDI strip: channel 1 plays 66, 64, 69, 67 as before, and channel
    2 plays pattern 2, MIDI 69 (A) on step 1 and your 76 on step 3.'
  contract_sha256: 7aaf73d07de2cc309648f2872d040a2ec6e1b8137a41c8475075e8713e0de09a
  step_title: Checkpoint 5 — add one note and verify both routes
  baseline_step_title: Add a keyboard note to channel 2
- scene_id: parameter-slot-endpoints
  step_id: first-slot
  caption: 'Open Trig params, press K2 to enter the slot list and turn E3 to CC 1, press K3, then K2.
    Check the visible list: slot 1 holds CC 1.'
  baseline_caption: Open Trig params, press K2 to enter the slot list and turn E3 to CC 1, press K3, then
    K2. Slot 1 now holds CC 1.
  contract_sha256: f40ae47810a7e3c167d4092610eb0c691adc3fbe92ffba2c932d217ca8ab22c1
  step_title: Batch 1 — assign CC 1 to slot 1
  baseline_step_title: Assign CC 1 to slot 1
- scene_id: parameter-slot-endpoints
  step_id: slot-two
  caption: 'Turn E2 one slot right, press K2, turn E3 to CC 2 and press K3, then K2. Check the visible
    list: slot 1 holds CC 1 and slot 2 holds CC 2.'
  baseline_caption: Turn E2 one slot right, press K2, turn E3 to CC 2 and press K3, then K2. Slot 2 now
    holds CC 2 and slot 1 still holds CC 1.
  contract_sha256: f40ae47810a7e3c167d4092610eb0c691adc3fbe92ffba2c932d217ca8ab22c1
  step_title: Batch 1 — assign CC 2 to slot 2
  baseline_step_title: Assign CC 2 to slot 2
- scene_id: parameter-slot-endpoints
  step_id: slot-five
  caption: Repeat for slots 3, 4 and 5 (E2 to the next slot, K2, E3 to the next controller, K3, K2). Check
    the list shows CC 1 through CC 5 in order; slot 5 holds CC 5.
  baseline_caption: Repeat for slots 3, 4 and 5 (E2 to the next slot, K2, E3 to the next controller, K3,
    K2). Slot 5 now holds CC 5.
  contract_sha256: f40ae47810a7e3c167d4092610eb0c691adc3fbe92ffba2c932d217ca8ab22c1
  step_title: Finish batch 1 — slots 3 to 5
  baseline_step_title: Carry on to slot 5
- scene_id: parameter-slot-endpoints
  step_id: assigned-ten
  caption: Repeat for CC 6 up to CC 10 on slot 10. Check the list shows CC 1 through CC 10 in order; the
    final slot holds CC 10.
  baseline_caption: 'Repeat for CC 6 up to CC 10 on slot 10. All ten slots are now assigned: the list
    holds CC 1 to CC 10, the most a channel can hold.'
  contract_sha256: f40ae47810a7e3c167d4092610eb0c691adc3fbe92ffba2c932d217ca8ab22c1
  step_title: Finish batch 2 — slots 6 to 10
  baseline_step_title: Fill slots 6 to 10
- scene_id: parameter-slot-endpoints
  step_id: clamped-slots
  caption: 'Select slot 10 and keep turning E2 right: it stops at slot 10. Hold step 1 (1,4) and turn
    E3 to set the value to 0. Turn E2 left well past slot 1: it stops at slot 1. Hold step 2 (2,4) and
    set the value to 1. Tap Play (1,8). Check the strip below: before its note, step 1 sends CC 10 and
    step 2 sends CC 1. Tap Play again to stop.'
  baseline_caption: 'Select slot 10 and keep turning E2 right: it stops at slot 10. Hold step 1 (1,4)
    and turn E3 to set the value to 0. Turn E2 left well past slot 1: it stops at slot 1. Hold step 2
    (2,4) and set the value to 1. Tap Play (1,8). Before its note, step 1 sends CC 10 and step 2 sends
    CC 1: look for the two controller changes in the strip below. Tap Play again to stop.'
  contract_sha256: f40ae47810a7e3c167d4092610eb0c691adc3fbe92ffba2c932d217ca8ab22c1
  step_title: Check both ends
  baseline_step_title: The first and last slots hold their ends
- scene_id: panic-stops-sounding-note
  step_id: panic-released
  caption: While C sounds, hold Channel (3,8), a page you are not on. Keep holding until Panic cuts the
    note, then release the key. Allow about two seconds for the hold. Here the note is cut off 1.26 seconds
    after it starts, before its natural four-second end. That interval starts at note onset, not at the
    start of the hold. Song playback continues, so C sounds again when the loop comes round. Press Stop
    at (1,8) to stop the sequence.
  baseline_caption: 'While the note sounds, hold Channel (3,8), a page you are not on, for about two seconds
    and release it. The note is cut off about a second and a quarter after it started, well before its
    four seconds are up: the MIDI strip shows the 6,144 note-offs of the panic sweep, 128 notes on each
    of the 16 MIDI channels of the three ports. The screen stays on Song and playback carries on, so C
    starts again when the loop comes round. Press Stop at (1,8).'
  contract_sha256: a4a21357d2a7fb533b5cc9de2aeba31666a46bfae58408e792dca1336028166f
- scene_id: workflow-compose-two-channels
  step_id: start
  caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with the notes
    C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. Nothing else exists yet: no
    second pattern, no scale change, no second channel and one song slot. Trig merge modes decide what
    happens when two patterns on one channel both have a trig on a step: Skip (the default) drops those
    steps, Only keeps only those steps, and All keeps every step.'
  baseline_caption: 'Channel 1 plays pattern 1 through a MIDI device: four trigs on steps 1 to 4 with
    the notes C, D, E and F (MIDI 60, 62, 64, 65) at velocities 127, 117, 107 and 97. Nothing else exists
    yet: no second pattern, no scale change, no second channel and one song slot. Trig merge modes decide
    what happens when two patterns on one channel both have a trig on a step: Skip (the default) drops
    those steps, Only keeps only those steps, and All keeps every step.'
  contract_sha256: e108361a74e8daf89f74c8c3eaa0ecac0dcb099ae92237d03a292aa622f5a448
  scene_title: 'Build two channels: merge patterns, route a second part and chain slots'
  baseline_scene_title: Compose two channels and chain song slots
- scene_id: panic-from-song-channel
  step_id: hold-and-release
  caption: From Song, hold the Channel button (3,8) for about two seconds, then release it. Panic sends
    Note Off to the connected MIDI outputs to release stuck notes. This example starts silent, so you
    hear no change and the screen stays on Song. Panic leaves playback running. Holding the button of
    the page you are already on does nothing.
  baseline_caption: Hold the Channel button (3,8), a page you are not on, for about two seconds, then
    release it. Mosaic sends Note Off for every one of the 128 notes on all 16 MIDI channels of each of
    the three connected ports, 6,144 messages. Nothing was sounding, so you hear no change and the screen
    stays on Song; the sweep only matters when a note is stuck. Holding the button of the page you are
    already on does nothing. Playback is not stopped by a panic.
  contract_sha256: a96702b29055e1eb3abe10fd6aec247056749a2c985d718eb44780d8b5dd3a86
