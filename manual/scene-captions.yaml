- scene_id: full-quantisation-precedence
  step_id: start
  caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities 127,
    117, 107, 97), in a scale with Degree II and Rotation 1; both are already set in the scale editor.
    In PARAMS > MOSAIC, Snap note masks to scale is On, while Quantise note masks (the global full-quantisation
    option) and Lock merged to pent. are Off. With Snap alone the masks play as written, 60, 64, 69, 71
    in the MIDI strip, because Degree and Rotation affect masks only under full quantisation. On enables
    full scale mapping; Off disables it. An absent step lock uses the channel, and channel X uses the
    global option. An explicitly stored step X skips the channel and uses the global option directly;
    clearing it with K2 restores channel inheritance. In the state lists, X without a stored step lock
    means no exception; explicit step X is named separately. Each step below lists the state as global
    / channel / step 1 / step 2. Now: Off / X / X / X.'
  baseline_caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities
    127, 117, 107, 97), in a scale with Degree II and Rotation 1; both are already set in the scale editor.
    In PARAMS > MOSAIC, Snap note masks to scale is On, while Quantise note masks (the global full-quantisation
    option) and Lock merged to pent. are Off. With Snap alone the masks play as written, 60, 64, 69, 71
    in the MIDI strip, because Degree and Rotation affect masks only under full quantisation. Quantise
    Note Mask works on three levels, strongest first: a step lock, then the channel value, then the global
    option. On follows the scale, Off keeps the written pitch, and X means inherit from the next level
    down. Each step below lists the state as global / channel / step 1 / step 2. Now: Off / X / X / X.'
  contract_sha256: 57bc20cb2e9fbf33d96161bf0ba8edd8353fa987aba5ef1d04ff452c2abcb5a9
- scene_id: full-quantisation-inherit-and-step-off
  step_id: start
  caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities 127,
    117, 107, 97), in a scale with Degree II and Rotation 1. On enables full scale mapping; Off disables
    it. An absent step lock uses the channel, and channel X uses the global option. An explicitly stored
    step X skips the channel and uses the global option directly; clearing it with K2 restores channel
    inheritance. In the state lists, X without a stored step lock means no exception; explicit step X
    is named separately. The state is listed as global / channel / step 1 / step 2. Now: On / Off / X
    / On. The channel Off beats the global On and step 2 has its own On lock, so the strip reads 60, 65,
    69, 71.'
  baseline_caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities
    127, 117, 107, 97), in a scale with Degree II and Rotation 1. Quantise Note Mask works on three levels,
    strongest first: a step lock, then the channel value, then the global option. On follows the scale,
    Off keeps the written pitch, and X means inherit from the next level down. The state is listed as
    global / channel / step 1 / step 2. Now: On / Off / X / On. The channel Off beats the global On and
    step 2 has its own On lock, so the strip reads 60, 65, 69, 71.'
  contract_sha256: fb3c1d630bf8717628192815c8b7cd3c007609fac1e8b5dead7372033cc41042
