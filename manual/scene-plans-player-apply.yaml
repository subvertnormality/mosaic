schema_version: 1
status: external-case-source-authored-not-captured
scenes:
- id: player-apply-oilcan
  feature_id: mods-and-software-devices
  title: Apply Oilcan to the percussion channel
  behaviour_case: M-MANUAL-PLAYER-APPLY-001
  profile: manual-player-ui
  citation: manual:mods-and-software-devices
  requirements:
  - CH-DEVICE
  setup:
    fixture: controlled-manual-case
    case: M-MANUAL-PLAYER-APPLY-001
    channel: 1
    target_device: Oilcan 1
  steps:
  - id: device-start
    title: Open the Device page
    caption: "Starting point: Channel 1's Device page is open. Read the Device row before changing it."
    assertion:
      kind: manual-player-apply-start
      citation: manual:mods-and-software-devices
      channel: 1
      page: midi_config
      field: Device
      passed: true
  - id: oilcan-pending
    title: Choose Oilcan 1
    caption: "Turn E3 until the Device row reads Oilcan 1. The footer says “Press K3 to confirm”, so this is still a draft."
    assertion:
      kind: manual-player-apply-pending
      citation: manual:mods-and-software-devices
      channel: 1
      field: Device
      value: Oilcan 1
      confirmation_prompt: Press K3 to confirm
      passed: true
  - id: oilcan-applied
    title: Apply Oilcan 1
    caption: "Press K3 to apply Oilcan 1. The Device row remains Oilcan 1 and the confirmation prompt clears."
    assertion:
      kind: manual-player-apply-applied
      citation: manual:mods-and-software-devices
      channel: 1
      page: midi_config
      field: Device
      value: Oilcan 1
      confirmation_prompt_absent: true
      passed: true
  - id: oilcan-reopened
    title: Reopen and verify Oilcan 1
    caption: "Open Channel tasks → Device again. The Device row still reads Oilcan 1 without a confirmation prompt."
    assertion:
      kind: manual-player-apply-reopened
      citation: manual:mods-and-software-devices
      channel: 1
      page: midi_config
      field: Device
      value: Oilcan 1
      confirmation_prompt_absent: true
      passed: true
