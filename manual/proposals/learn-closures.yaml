scenes:
- id: lock-lead-time-menu-and-output
  feature_id: lock-lead-time
  title: Set MIDI lock lead time
  behaviour_case: M-SYNC-LEAD-001
  citation: README.md#lock-lead-time
  source: tests/behaviour/contract/lock_lead_time.py
  scope: Four child sessions, ordinals 1–4. The unchanged full case checks pulse rounding, first-note
    exception, clocks, release gates and cross-run gate consistency. The menu frames are live; the final
    comparison is not used as a closed-session frame.
  steps:
  - id: lead-0
    title: Set 0 ms lead
    caption: Open the norns MOSAIC parameter group. Set Lock lead time (ms) to 0. The menu displays this
      value.
    session_ordinal: 1
    assertion:
      kind: global-lock-lead-setting
      value_ms: 0
      default_checked: 25
  - id: play-0
    title: Compare lock and note timing
    caption: Play the phrase. CC 1 values alternate 24 and 48. The values precede later notes according
      to the selected lead; note timing and gate lengths remain unchanged. Stop playback.
    session_ordinal: 1
    assertion:
      kind: lock-lead-time
      lead_time_ms: 0
      notes: 8
      passed: true
  - id: lead-5
    title: Set 5 ms lead
    caption: Open the norns MOSAIC parameter group. Set Lock lead time (ms) to 5. The menu displays this
      value.
    session_ordinal: 2
