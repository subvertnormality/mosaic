      value_ms: 10
      default_checked: 25
  - id: play-10
    title: Compare lock and note timing
    caption: Play the phrase. CC 1 values alternate 24 and 48. The values precede later notes according
      to the selected lead; note timing and gate lengths remain unchanged. Stop playback.
    session_ordinal: 3
    assertion:
      kind: lock-lead-time
      lead_time_ms: 10
      notes: 8
      passed: true
  - id: lead-25
    title: Set 25 ms lead
    caption: Open the norns MOSAIC parameter group. Set Lock lead time (ms) to 25. The menu displays this
      value.
    session_ordinal: 4
    assertion:
