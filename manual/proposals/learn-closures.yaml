      notes: 8
      passed: true
- id: panic-hold-without-navigation
  feature_id: midi-panic
  title: Release MIDI notes without changing pages
  behaviour_case: M-PANIC-001
  citation: README.md#midi-panic
  source: tests/behaviour/contract/panic_navigation.py
  required_adapter_extension: deferred-final-assertion-v1
  scope: Freeze the live second matching grid checkpoint, after the Channel hold is released while Song
    remains selected. Publish only after unchanged full exported panic trace passes. Never obtain a new
    snapshot after Driver.finish.
  steps:
  - id: release
    title: Hold a non-selected page key
    caption: From Song, hold the Channel key and release it after the panic sweep. Song remains selected.
      The sweep sends Note Off for all 128 notes on all 16 channels to each of the three connected MIDI
      ports.
    assertion:
      kind: grid
      cells:
      - - 3
        - 8
      - - 4
        - 8
      - - 5
        - 8
      - - 6
        - 8
      expected:
      - 2
      - 2
      - 2
      - 15
      actual:
      - 2
      - 2
      - 2
      - 15
    occurrence: 2
    final_assertion:
      kind: panic-navigation
      held_button: 3
      selected_page: song
      repeat: 0
      expected_panic: true
      passed: true
    final_accounting:
      kind: panic-full-stream-accounting
      note_events: 6144
      windows: 1
      unaccounted: 0
      passed: true
