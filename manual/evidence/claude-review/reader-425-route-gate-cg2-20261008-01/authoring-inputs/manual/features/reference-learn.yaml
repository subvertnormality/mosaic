        - x: 6
          y: 8
          level: 15
      human_outcome: From Song, hold the Channel button (3,8) for about two seconds, then release it. Panic sends Note Off to the connected MIDI outputs to release stuck notes. This example starts silent, so you hear no change and the screen stays on Song. Panic leaves playback running. Holding the button of the page you are already on does nothing.
      practice_prompt: '1. Hold Channel for the panic gesture

        2. Release Channel'
    title: Panic by holding Channel while on Song
    goal: Send a panic sweep from Song while keeping playback and the selected page as they are.
    starting_point: Press Song (6,8). The Song page opens (Song Playback, SONG 01) and Song is the lit page button. Panic only works from the button of a page you are not on, so every other page button, including Channel (3,8), is a panic button from here.
