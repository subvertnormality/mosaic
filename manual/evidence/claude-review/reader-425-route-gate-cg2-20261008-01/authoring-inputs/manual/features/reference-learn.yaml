- id: sequencer-start-and-stop
  title: Starting and Stopping Playback
  audience: beginner
  summary: Grid (1,8) starts and stops the sequencer.
  prose: '1. Press Grid `(1,8)` to start. The grid playhead advances through the sequence.

    2. Press Grid `(1,8)` again to stop.


