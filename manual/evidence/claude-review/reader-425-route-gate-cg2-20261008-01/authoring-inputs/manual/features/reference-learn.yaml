    - lib/ui_live.lua
    - lib/ui_spec_data.lua
  controls:
  - gesture: E1 → E2 → K3
    result: Open the context task list, select a task, then open it.
  - gesture: E2 / E3
    result: Select a row / change its value.
  - gesture: K3 / K2 on staged settings
    result: Apply the draft / cancel or return. K3 also confirms a question and K2 cancels it. While an OPEN > row is chosen the last line names the target, for example K3 OPEN RHYTHM, or just K3 OPEN when space is short.
  - gesture: Hold K1 + E3
    result: Change the selected value finely where it supports that.
  - gesture: Hold step + K2 in Masks
    result: Clear all mask attributes of that step.
  details:
  - title: Reading the screen
    text: 'The title row names the screen and its scope. `CH03` is the channel. `S02` is the song slot when it is not the first. `ST05` is one held step and `3ST` is several held steps. `PAT02 CH01` is the pattern editor showing pattern 2 over channel 1. A Channel screen also shows `MUTE` when the channel is muted, `OCT+1` when its octave is not 0 and `O-1` for a held step''s octave lock.


      The selected field is outlined or marked with `>`, and its whole value is always shown. On a grid of fields the value sits in its cell. When a cell is too narrow it shows `...` and the full value appears on the last line next to the field''s name. A single-field screen shows the value in large type. Screens change instantly, without a transition.


      The four small tiles at the right of the title row are Mosaic''s mark; they light up in turn when something changes.'
  - title: Screens that open themselves
    text: 'A grid action opens the screen that shows what it changed, with that value selected. A merge button or a pattern assignment shows Merge modes, where E2 and E3 also change the trig, note, velocity and length merge modes. A channel scale lock shows Scale source. Global transposition and scale-track locks show Scale overview. The song length fader shows Song playback. Press K2 or turn E1 to carry on from there.


      Screens that only show information, such as Scale overview, Song playback and Paint preview, list every value at once with no cursor.'
  - title: Task lists
    text: 'E1 opens the task list for the page you are on, and the list opens on the row of the screen you came from. Each detent of E1 or E2 moves one row, and the list stops at its first and last rows. Press K3 to open the highlighted task.


      Channel tasks: Masks, Trig params, Output, Clock, Merge modes, Merge Shape, Harmony, Device and History. Scale tasks: Scale, Scale clock and Overview. Pattern tasks: Pattern, Options, Algorithm, Channel view and, while the Rhythm Doctor algorithm is chosen, Rhythm Doctor. Song tasks: Playback, Slot setup, Tempo and feel and Channel view.


      Other settings are in the norns PARAMS menu under MOSAIC: projects, sequencer options, MIDI mapping and each channel''s device parameters. A short K1 tap opens it. The Channel tasks footer reminds you with `K1 PARAMS`.'
  - title: Staged changes
    text: Device, clock, scale and song settings show your change straight away but apply only when you press K3. K2, or leaving the screen with E1, cancels a staged change without touching what is playing. Merge Shape and Harmony keep a whole draft in the same way.
  - title: Start-up animation
    text: When Mosaic starts, the logo's dots and bars lay down across the screen row by row, lift away to leave the mosaic wordmark, and fade into the first screen. Any key, encoder or grid press skips it. UI Motion turns the animation and the movement of the screen characters off. For the layout of the norns itself, see the [norns documentation](https://monome.org/docs/norns/).
