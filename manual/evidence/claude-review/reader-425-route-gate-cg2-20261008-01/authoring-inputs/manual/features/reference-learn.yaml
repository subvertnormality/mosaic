    - lib/m_grid.lua
    - lib/m_midi.lua
  controls:
  - gesture: Hold a non-selected page key (stopping first is optional)
    result: Sweep Note Off across connected MIDI channels; holding the selected page key does not panic.
  details:
  - title: "Panic and connected devices"
    text: "After Panic sends its Note Off sweep, the connected instrument determines how quickly its sound releases. Use Play/Stop separately to stop playback; Panic does not stop the sequencer or cancel scheduled strum and arpeggio voices."
  recipes:
  - title: Silence connected MIDI notes from Song view with the Channel panic gesture
    text: 'Use this on a connected MIDI instrument when a note is stuck. The panic gesture sends note-release messages to connected MIDI outputs, but it does not stop the sequencer. The manual’s captured Output strip replays a recorded result; it does not send messages to your instrument.


      1. Open Song at (6,8), so Channel is an inactive page button.

      2. Hold Channel at (3,8) until the panic gesture fires, then release. The page remains Song.

      3. A stuck MIDI note should stop; inspect the release messages in Output. The sequencer keeps running, so new notes may still play. Press Stop separately if you want silence to continue.


      Use [Silence a sounding note](#midi-panic/panic-stops-sounding-note) for the long-note comparison. The other examples show the gesture from a silent project.

      '
  - title: Silence connected MIDI notes from Song view with the Pattern panic gesture
    text: 'Use this on a connected MIDI instrument when a note is stuck. The panic gesture sends note-release messages to connected MIDI outputs, but it does not stop the sequencer. The manual’s captured Output strip replays a recorded result; it does not send messages to your instrument.


      1. Open Song at (6,8), so Pattern is an inactive page button.

      2. Hold Pattern at (5,8) until the panic gesture fires, then release. The page remains Song.

      3. A stuck MIDI note should stop; inspect the release messages in Output. The sequencer keeps running, so new notes may still play. Press Stop separately if you want silence to continue.


      Use [Silence a sounding note](#midi-panic/panic-stops-sounding-note) for the long-note comparison. The other examples show the gesture from a silent project.

      '
