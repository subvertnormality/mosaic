      human_outcome: The long MIDI 60 note is sounding before the Channel panic gesture. Holding Channel releases it early, while playback continues.
      practice_prompt: With C already sounding on Song, hold Channel (3,8), a page you are not on, for about two seconds, then release it. Confirm the MIDI strip shows a Note Off for C before its four-second natural end and that playback continues; press Play (1,8) to stop.
    title: Panic silences a note that is still sounding
    goal: Silence a sounding MIDI 60 note with Channel panic while Song playback continues.
    starting_point: 'Song is already playing a long note through MIDI port 1: C (MIDI 60) at velocity 127 is still sounding, before its four-second natural end. The norns screen shows SONG PLAYBACK; three MIDI ports are connected.'
  - id: panic-from-song-channel
