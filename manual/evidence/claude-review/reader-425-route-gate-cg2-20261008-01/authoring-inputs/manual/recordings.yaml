- id: masks-small-hours
  title: Small hours · four bars in C major
  purpose: With channel 2 muted, only the bass remains. Unmuting restores the chord layer over the same four-bar bass phrase.
  starting_point: Use a separate empty project at 90 BPM, Rate /1 and C major. Set channel 1 to Polyperc 1 and channel 2 to Doubledecker; set both ranges and Song slot 1 length to 64 steps. The event positions below come from the Masks feature’s frozen audio track definition.
  lesson_relations:
  - kind: recipe
    feature_id: masks
    recipe_index: 5
    recipe_title: 'Build the recording: Small hours · four bars in C major'
    relationship: exact
    explanation: "This recipe follows the recording’s setup in a separate project, apart from the course project."
  build_steps:
  - 'Channel 1 bass, bars 1-2: in Masks set default Note MIDI 48, Vel 70 and Len 1/2. Add trigs at steps 1, 5, 9, 13, 17, 21, 25 and 29. Set steps 9 and 25 to MIDI 43; the other bass trigs stay MIDI 48. Check: each bar has four bass notes.'
  - 'Channel 1 bass, bars 3-4: add trigs at steps 33, 37, 41, 45, 49, 53, 57 and 61. Set steps 41 and 57 to MIDI 43; the others stay MIDI 48. Check: the four-bar bass phrase now has all sixteen notes.'
  - 'Channel 2 chords, bars 1-2: in Masks set default Note MIDI 60, Vel 45 and Len 3 steps; set Chd1=3rd and Chd2=5th. Add trigs at 1, 9, 17 and 25; keep each root at MIDI 60. Check: two C-major chord masks sound per bar.'
  - 'Channel 2 chords, bars 3-4: add trigs at 33, 41, 49 and 57, all with root MIDI 60. Check: the chord layer repeats on beats 1 and 3 over the bass.'
  - Play four bars. Hold K1 and tap channel 2 selector (2,1) to mute the chords; tap it again with K1 held to restore them. Stop playback.
  listen_for:
  - The bass alternates C2 and G1 within each bar while C-E-G chord masks sound on beats 1 and 3; muting channel 2 leaves the bass alone.
  restore_steps:
  - Unmute channel 2 and stop. Keep this four-bar extension in its separate project; the course Masks phrases use different notes.
  limits: []
