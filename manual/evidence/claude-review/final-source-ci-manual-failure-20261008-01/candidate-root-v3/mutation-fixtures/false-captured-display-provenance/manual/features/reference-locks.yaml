      practice_prompt: '1. Hold step 1 at (1,4), turn E3 anticlockwise until CC 1
        reads 24, then release it.

        2. Hold step 3 at (3,4), turn E3 clockwise until CC 1 reads 96, then release
        it.

        3. With no step held, press K3. The slot gains an S: its locks now slide toward
        the next one.

        4. Tap Play at (1,8), let two loops run, then tap it again to stop. CC 1 rises
        from 24 toward 96 between the locks.'
    title: Move between parameter locks
    goal: Enable the slot-wide CC 1 slide and hear a gradual change between the two
      locks.
    starting_point: Press K3 to assign CC 1 and K2 to return. Slot 1 now reads 63,
      the stored value, with no marker in its corner, because no step has a lock for
      it yet.
