- id: mask-locks
  title: Mask Locks
  audience: all
  summary: Give one step its own note, velocity, length or other mask value. Step
    locks override the channel default masks.
  prose: 'A mask has a channel default and, for each step, an optional step lock.
    With no step held, E3 changes the channel default. With a step held, E3 changes
    the lock on that step only.


    Set a mask lock:


    1. Open Masks from Channel tasks with E1.

    2. Turn E2 to the mask you want, for example Note or Vel.

    3. Hold a step on the channel sequencer.

    4. Turn E3 to the value for that step.

    5. Release the step. The screen shows the channel default again; the step keeps
    its lock.


    Clear a step''s mask locks:


    1. Open Masks.

    2. Hold the step and press K2.


    Clear all step-mask locks on the channel:


    1. Open Masks.

    2. Release all steps.

    3. Hold K1 and press K2.

    Channel default masks are retained.


    Video: [Mask locks demo](https://youtu.be/J1ckUZvhFJ0?t=1780)'
  musical_use: 'Vary single steps while the rest of the channel keeps its default:
    raise one note, accent one hit, shorten one gate.'
  related:
  - locks
  sources:
    readme: manual/legacy/README-1.4.0.md#mask-locks
    behaviour_cases:
    - M-PATCH-041
    - M-PATCH-042
    - M-UIACC-A02-001
    code:
    - lib/pages/channel_edit_page/channel_edit_masks.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/models/program.lua
    - lib/ui_adapters/masks.lua
    - lib/step.lua
  controls:
  - gesture: On Channel tasks > Masks, select a mask with E2
    result: The highlighted cell identifies the field to edit.
  - gesture: Hold a channel sequencer step and turn E3
    result: Sets that mask for the held step instead of changing the channel default.
  - gesture: Hold the step and press K2 on Masks
    result: Clears the held step’s mask locks so its channel defaults can apply again.
  - gesture: Release all steps, then hold K1 and press K2 on Masks
    result: Clears channel step-mask locks while keeping channel default masks.
  details:
  - title: Example
    text: With a channel velocity of 50, hold step 1 and turn E3 to 90. Step 1 plays
      at velocity 90 and the other steps play at 50. Holding step 1 and pressing K2
      returns it to 50.
  - title: X and zero
    text: 'X means no mask: the step inherits the pattern''s value. A velocity of
      0 is a mask that silences the step. The two are different.'
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: 'This Masks note shows how a step Note exception differs from the channel
      G3 default. Complete canonical walkthrough: [Make one step override a channel
      Note default, then restore inheritance](#melody-composition/recipe/1).'
  - title: Contrast inherited velocity with explicit zero and a cleared exception
    text: 'Starting point: channel 1’s phrase has active trigs on steps 1 and 2.


      1. Turn E1 to Channel tasks, turn E2 to Masks and press K3. Select Vel with
      E2. With no step held, turn E3 to 50 for the channel default.

      2. Hold step 1 at (1,4), turn E3 clockwise to 90 and release. This exception
      makes the first hit louder.

      3. Hold step 2 at (2,4), turn E3 anticlockwise to 0 and release. Its note is
      silent while the first hit keeps the 90 accent. Play and stop to compare them.

      4. Hold step 2 again, press K2 and release. It now inherits the default 50;
      the accent on step 1 remains.


      Outcome: X inherits the channel velocity; explicit 0 silences a step. Clearing
      one exception restores its default without erasing its neighbour.'
