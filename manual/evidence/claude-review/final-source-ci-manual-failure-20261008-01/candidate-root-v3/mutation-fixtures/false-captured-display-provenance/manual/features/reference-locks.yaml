  category: locks
  parent: null
  level: 2
  teaching_bindings:
  - id: save-named-arrangement
    title: Enter a project name and keep the arrangement
    goal: Save the finished arrangement as Four notes and find it in the Load picker.
    starting_point: The sequencer is stopped with SONG 01 selected. This separate
      demonstration loads a copy of the finished course arrangement and opens Slot
      setup through the public Song grid control. It begins with the first Save attempt
      already cancelled and < Save project selected. It is not a continuation of the
      original course recording.
    binding:
      status: controlled-verified
      scene: course-save-dialog
      step: saved
    teaching_binding:
      from_step_id: cancel
      transition_scope: interval
      actions:
      - id: open-entry
        kind: tap-key
        n: 3
        label: Press K3 on Save project to open name entry again
      - id: delete-1
        kind: tap-key
        n: 3
        label: With DEL selected using E2, press K3 to remove the last character
      - id: delete-2
        kind: tap-key
        n: 3
        label: With DEL selected using E2, press K3 to remove the last character
      - id: delete-3
        kind: tap-key
        n: 3
        label: With DEL selected using E2, press K3 to remove the last character
      - id: enter-1
        kind: tap-key
        n: 3
        label: Select F with E2 on the character row, then press K3
      - id: enter-2
        kind: tap-key
        n: 3
        label: Select o with E2 on the character row, then press K3
      - id: enter-3
        kind: tap-key
        n: 3
        label: Select u with E2 on the character row, then press K3
      - id: enter-4
        kind: tap-key
        n: 3
        label: Select r with E2 on the character row, then press K3
      - id: enter-5
        kind: tap-key
        n: 3
        label: Select the blank space with E2 on the character row, then press K3
      - id: enter-6
        kind: tap-key
        n: 3
        label: Select n with E2 on the character row, then press K3
      - id: enter-7
        kind: tap-key
        n: 3
        label: Select o with E2 on the character row, then press K3
      - id: enter-8
        kind: tap-key
        n: 3
        label: Select t with E2 on the character row, then press K3
      - id: enter-9
        kind: tap-key
        n: 3
        label: Select e with E2 on the character row, then press K3
      - id: enter-10
        kind: tap-key
        n: 3
        label: Select s with E2 on the character row, then press K3
      - id: confirm-name
        kind: tap-key
        n: 3
        label: Select OK with E3 and E2, then press K3 to save Four notes
      - id: return-after-save
        kind: tap-key
        n: 1
        label: Press K1 to return to SLOT SETUP / SONG 01
      - id: open-load-menu
        kind: tap-key
        n: 1
        label: Press K1 to return to PARAMS > MOSAIC
      - id: open-load-picker
        kind: tap-key
        n: 3
        label: Select Load project with E2, then press K3 to open the file picker
      - id: cancel-load-picker
        kind: tap-key
        n: 2
        label: Select Four notes.ptn with E2, then press K2 to leave the picker
      - id: return-after-picker
        kind: tap-key
        n: 1
        label: Press K1 to return to the same arrangement
      - id: show-result
        kind: preview-recorded-result
        target_step_id: saved
        label: Show the saved arrangement
      semantic_requires:
        project_files_at_target:
        - Four notes.ptn
        - Four notes.pset
        held_controls_at_target: []
      practice_prompt: '1. Stop playback and select SONG 01. Open the Song editor
        with its grid control. Turn E1 clockwise to open Song tasks, select Slot setup
        with E2 and press K3. SLOT SETUP / SONG 01 is the starting screen.

        2. Press K1, open PARAMS > MOSAIC and select Save project with E2. Press K3
        to open name entry. Press K2 to cancel this first attempt. The Save project
        menu returns without creating a named file.

        3. Press K3 to open name entry again. The suggested name is new, with OK selected.

        4. Turn E2 left to DEL. Press K3 three times to remove the suggested name.
        The name is empty.

        5. Turn E3 left to the character row. Turn E2 until F is the bright character,
        then press K3. F appears in the name.

        6. Select o, u and r with E2, pressing K3 after each character. Select the
        blank space and press K3. Select n, o, t, e and s in the same way. The name
        reads Four notes.

        7. Turn E3 right to the DEL / OK row, then turn E2 right to OK. Press K3 to
        save. Press K1 to return to Mosaic. SLOT SETUP / SONG 01 returns.

        8. Press K1 to return to PARAMS > MOSAIC. Select Load project with E2 and
        press K3. Turn E2 until Four notes.ptn is selected. This confirms that the
        named project is available; leave it selected without loading a different
        project.

        9. Press K2 to cancel the picker, then K1 to return to Mosaic. The same arrangement
        remains open.'
      human_outcome: 'Saved Four notes: the named project retains the complete arrangement
        and its parameter file. Four notes.ptn is available in the Load picker; cancelling
        the picker leaves SLOT SETUP / SONG 01 open.'
