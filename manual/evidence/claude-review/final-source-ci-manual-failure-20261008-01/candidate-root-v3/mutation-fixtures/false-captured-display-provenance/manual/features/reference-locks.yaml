    - mosaic.lua
    - lib/application_parameters.lua
    - lib/project_lifecycle.lua
    - lib/models/program.lua
  controls:
  - gesture: Open PARAMS > MOSAIC and choose Save
    result: Prompts for a project name; a successful named save keeps a durable version
      separate from autosave.
  - gesture: Choose Load and select a saved project
    result: Checks saved song slots and ranges before replacing the current project;
      rejection keeps the current project and playback.
  - gesture: Leave Mosaic stopped and idle for 60 seconds
    result: Normally writes autosave; rejected loads suspend this until a successful
      valid load, named save or New.
  details:
  - title: 'Enter a name: separate arrangement demonstration'
    text: 'Open [Enter a project name and keep the arrangement](#save-and-load/lesson/save-named-arrangement)
      for the complete name-entry demonstration. The sequencer is stopped with SONG
      01 selected. This separate demonstration loads a copy of the finished course
      arrangement and opens Slot setup through the public Song grid control. It begins
      with the first Save attempt already cancelled and < Save project selected. It
      is not a continuation of the original course recording.


      1. Stop playback and select SONG 01. Open the Song editor with its grid control.
      Turn E1 clockwise to open Song tasks, select Slot setup with E2 and press K3.
      SLOT SETUP / SONG 01 is the starting screen.

      2. Press K1, open PARAMS > MOSAIC and select Save project with E2. Press K3
      to open name entry. Press K2 to cancel this first attempt. The Save project
      menu returns without creating a named file.

      3. Press K3 to open name entry again. The suggested name is new, with OK selected.

      4. Turn E2 left to DEL. Press K3 three times to remove the suggested name. The
      name is empty.

      5. Turn E3 left to the character row. Turn E2 until F is the bright character,
      then press K3. F appears in the name.

      6. Select o, u and r with E2, pressing K3 after each character. Select the blank
      space and press K3. Select n, o, t, e and s in the same way. The name reads
      Four notes.

      7. Turn E3 right to the DEL / OK row, then turn E2 right to OK. Press K3 to
      save. Press K1 to return to Mosaic. SLOT SETUP / SONG 01 returns.

      8. Press K1 to return to PARAMS > MOSAIC. Select Load project with E2 and press
      K3. Turn E2 until Four notes.ptn is selected. This confirms that the named project
      is available; leave it selected without loading a different project.

      9. Press K2 to cancel the picker, then K1 to return to Mosaic. The same arrangement
      remains open.


      Saved Four notes: the named project retains the complete arrangement and its
      parameter file. Four notes.ptn is available in the Load picker; cancelling the
      picker leaves SLOT SETUP / SONG 01 open.


      Saving under an existing name replaces that save. Use a distinct name when retaining
      an earlier version. If loading leaves the norns tasks unresponsive, tap the
      Song editor grid control before opening Song tasks; the demonstration uses this
      explicit public starting navigation.'
