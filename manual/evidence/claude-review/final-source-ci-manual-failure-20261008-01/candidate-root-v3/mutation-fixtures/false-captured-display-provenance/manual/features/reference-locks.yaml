features:
- id: locks
  title: Locks
  audience: all
  summary: Store a different value on one step. Hold the step, then change the same
    control you use for the whole channel.
  prose: 'A lock stores a value on one step, so that step differs from the channel
    default. Hold the step on the grid, change the value, then release the step. The
    lock stays in place and the screen returns to the channel default.


    Each lock type has its own control:


    1. Parameter lock: on Channel tasks > Trig params, hold a step and turn E3. See
    [Trig Param Locks](#trig-param-locks).

    2. Mask lock: on Channel tasks > Masks, hold a step and turn E3. See [Mask Locks](#mask-locks).

    3. Octave lock: hold a step and press an octave button on Grid row 8, columns
    8–12. See [Octave Locks](#octave-locks).

    4. Scale lock: hold a step and press a scale slot on Grid row 3. On a channel
    page the lock affects that channel. On the Scale page it is global. See [Scale
    Locks](#scale-locks).

    5. Transposition lock: on the Scale page, hold a scale-track step and press the
    transposition fader on Grid row 8. See [Transposition Locks](#transposition-locks).


    Parameter, mask and octave locks change their own step only. A transposition lock
    stays in force on the steps that follow it until a later transposition lock replaces
    it. A channel scale lock lasts as set by Scales lock until ptn end (see [Scale
    Locks](#scale-locks)). A global scale lock lasts until another global lock replaces
    it or the scale track wraps.


    To remove a lock, hold its step and press K2 on the screen where you set it. For
    octave, scale and transposition locks you can also press the same button again.'
  musical_use: 'Change one step without editing the pattern: lift a single bass note
    an octave, accent one hit, open a filter on the last note, or change the scale
    for one part of the phrase.'
  related: []
  sources:
    readme: manual/legacy/README-1.4.0.md#locks
    behaviour_cases: []
    code:
    - lib/models/program.lua
    - lib/pages/channel_edit_page/channel_edit_navigation.lua
    - lib/step.lua
  controls:
  - gesture: Hold a sequencer step, then change a value (E3 on Trig params or Masks,
      or a grid button for octave, scale and transposition).
    result: The value is written to that step. The channel default does not change.
  - gesture: Release the step.
    result: The screen shows the channel default again. The lock remains on the step.
  - gesture: Hold the step and press K2 on the screen where the lock was set.
    result: The lock is removed and the step uses the channel default again.
  details:
  - title: After clearing a transpose lock
    text: After you clear the selected transpose lock, the full phrase plays again
      while the separate zero lock at step 2 remains.
  recipes:
  - title: Make one step override a channel Note default, then restore inheritance
    text: 'This Locks note shows how a step-local Note overrides the channel G3 default.
      Complete canonical walkthrough: [Make one step override a channel Note default,
      then restore inheritance](#melody-composition/recipe/1).'
  - title: Compare a stored device value with one step-local CC lock
    text: 'This Locks note compares a step-local CC override with the device’s stored
      value of 63. Complete canonical walkthrough: [Compare a stored device value
      with one step-local CC lock](#device-parameters/recipe/2).'
  - title: Use a channel octave for a bass line and a local octave exception
    text: 'Start with a routed four-note C–D–E–F phrase (MIDI 60, 62, 64, 65), pattern
      1 on steps 1–4, stopped. Keep the line low but lift its second note.


      1. On Channel, tap octave −2 at (8,8). Play and stop: the line moves down two
      octaves. The octave buttons (8,8) through (12,8) select −2, −1, 0, +1, +2.

      2. Hold step 2 at (2,4), tap −1 at (9,8) and release. Play and stop: only the
      second note is one octave higher than its neighbours. A local −1 replaces the
      channel −2; it is not added to it.

      3. Hold step 2 and press K2, then release. The step inherits −2 again.

      4. Hold step 2 and tap 0 at (10,8), then release. This explicit zero plays the
      written register on step 2. Clear it with held-step K2 to restore the bass register.


      Outcome: an octave exception changes one step, and clearing restores the channel
      register. Compare the authentic results at [Octave Locks](#octave-locks).'
  - title: Distinguish an explicit zero transpose lock from inheritance
    text: 'Start with the four-note C–D–E–F melody. Setup A: on the Scale page, set
      global transpose to +4. Setup B: hold scale-track step 2, set its transpose
      lock to 0 with the fader, then release it. The zero lock persists until the
      next lock or the scale-track wrap. Now compare the lock on step 1 with inheritance.


      1. Hold scale-track step 1 and move its transpose lock to 0 using the fader.
      The held-step tooltip shows zero: this is a chosen value, not an empty lock.

      2. Release the step. Global +4 remains on the fader, while the step’s zero replaces
      it when that step is reached.

      3. Hold step 1 and press K2 to clear only that lock, then release. Step 1 follows
      global +4; the separate zero lock at step 2 remains and restores the written
      pitch from step 2 onwards.


      Outcome: clearing a zero lock restores inheritance; it does not erase the next
      step’s lock. See [Transposition Locks](#transposition-locks) for the direct-tap
      comparison.'
  - title: Practice longer and shorter Decay envelopes
    text: 'Comparison purpose: keep the note pattern fixed while only the Decay envelope
      changes. This recipe has two exercises: compare longer and shorter Decay tails
      with relative turns, then try the 0.1 s and 3.2 s endpoints. Use a separate
      project so neither changes your course arrangement.


      Starting point: use an empty project at 90 BPM, Rate /1 and playback stopped.
      Make sure n.b. PolyPerc is installed and enabled using [Sound Sources with n.b.](#norns-sound-sources-with-n-b);
      assign Polyperc 1 to channel 1 with range 1–16. In Masks set default velocity
      70 and Len ½. Add trig masks on odd steps by holding K1, tapping each odd step
      and releasing K1. Select Note with E2; for each odd step, hold it and turn E3
      to set the absolute MIDI note: step 1=48, 3=55, 5=52, 7=55, 9=48, 11=55, 13=53
      and 15=55. Press Channel at (3,8), select channel 1 on row 1, then tap Pattern
      1 in the second-from-top grid row to assign it before playing; an empty project
      has no pattern assigned by default.


      Controls and step map: press Channel at (3,8), select its number on row 1, then
      turn E1 to Channel tasks. Use E2 to highlight Device, Masks, Clock, Trig params
      or Harmony and K3 to open it. On Device use E2 for the row, E3 for the named
      sound and K3 to apply. On Masks, E2 selects Note, Vel, Len or Chd1/Chd2; E3
      changes the value. Hold a step while turning E3 for a local exception, then
      release it. To add a trig mask, hold K1, tap that step and release K1. Steps
      1–16 are row 4, 17–32 row 5, 33–48 row 6 and 49–64 row 7. Column is the position
      within that group. For Song slots, press Song at (6,8); slots 1–3 are (1,1)–(3,1).
      Hold the source slot, tap the destination and release; then tap the destination
      to edit it. Set Song Tempo to 90 and each channel Rate to /1, applying changes
      with K3. In Trig params, E2 selects a slot, K2 opens its assignment list, E3
      highlights a parameter, K3 assigns it and K2 returns. Hold a step and turn E3
      to set its lock. K2 clears a held-step lock.


      Relative-turn comparison — compare longer and shorter Decay tails while keeping
      the note pattern fixed. In Song, select slot 1 and set its length to 32 steps
      with no parameter locks; this is the two-bar straight reference. Copy slot 1
      to slot 2 and keep slot 2 at 32 steps. Tap slot 2 before editing its locks.
      Open Channel tasks → Trig params and assign Decay to slot 1. In slot 2, hold
      step 1 and turn E3 clockwise by 200 detents; release it. Repeat the 200-detent
      turn on step 9 and release. Then hold step 5 and turn E3 clockwise by 40 detents;
      release it. Repeat the 40-detent turn on step 13 and release. Check: steps 1
      and 9 form the longer-tail group; steps 5 and 13 form the shorter-tail group,
      while the note pattern stays fixed. These turns are relative to the current
      setting; the absolute Decay value shown depends on its starting value and your
      device. Select slot 1 before comparing the two slots. Play slots 1 and 2, then
      stop and select slot 1 to restore the plain line.


      Separate endpoint practice — try the 0.1 s and 3.2 s endpoints. In Song set
      slot 1 to 32 steps with no parameter locks. Copy slot 1 to slot 2 and set its
      length to 32. Tap slot 2 before editing its locks. Open Channel tasks → Trig
      params. Use E2 to select parameter slot 1, press K2, use E3 to highlight Decay,
      press K3 to assign it and K2 to return. In slot 2, hold step 1 and turn E3 anticlockwise
      until the displayed Decay reaches its 0.1 s minimum, then clockwise to the displayed
      3.2 s maximum; release the step. Repeat the 3.2 s setting on step 9. Set Decay
      to 0.1 s on steps 5 and 13, releasing each step afterward. Check the Trig params
      readout for the long settings on 1 and 9 and short settings on 5 and 13. Select
      slot 1 before comparing the two slots. Play slots 1 and 2, then stop and select
      slot 1. On your instrument, compare the tails while the notes stay in the same
      order.


      Restore: Select slot 1 to restore the unmodified line. Stop and return to the
      separate course project when finished.'
