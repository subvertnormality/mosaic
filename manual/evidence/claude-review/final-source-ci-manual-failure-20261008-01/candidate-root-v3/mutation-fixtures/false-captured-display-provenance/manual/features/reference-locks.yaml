  controls:
  - gesture: Select an assigned parameter in Trig params and press K3 with no grid
      step or K1 held.
    result: Toggle channel-wide sliding for that parameter. Enabled cells show S.
  - gesture: Hold a channel step and press K3 on the selected parameter.
    result: Toggle a slide from that step to the next lock of the same parameter.
      Other locks are unchanged.
  - gesture: Open PARAMS > MOSAIC and change Wrap param slides.
    result: On lets an eligible final slide reach the first lock across the repeat
      of the same pattern. It never slides into another song pattern.
  details: []
  recipes:
  - title: Open a filter over two steps
    text: 'Starting point: Use a stopped four-step channel with trigs on steps 1–4
      and a Trig params slot assigned to CC 1 (or the CC that controls your filter).
      See “Brighten the last note” on Trig Param Locks for slot assignment. The MIDI
      monitor or the linked event map is the check; no instrument sound is required.


      **Make one two-step slide.** Open Trig params and turn E2 to the assigned slot.
      Hold step 1, turn E3 to 24, release; hold step 3, turn E3 to 96, release. Release
      all steps and press K3. The cell shows S. Play once: CC 1 leaves 24 at step
      1 and reaches 96 as step 3 starts; the captured event map reads 36, 48, 60,
      72, 84, 96. Press Play again to stop.


      **Compare local and channel scope.** Hold step 4, turn E3 to 48, and release.
      This third endpoint distinguishes a slide on step 1 from a channel-wide slide.
      With no step held, press K3 to turn the channel-wide slide Off. Hold step 1
      and press K3; its cell shows S while held. Play: 24 slides toward 96 between
      steps 1 and 3, then jumps to 48 at step 4. Stop. Check that this is the step-local
      slide while the channel-wide setting is Off.


      **Wrap the channel slide.** Open PARAMS > MOSAIC and turn Wrap param slides
      On. Release all steps and press K3 to turn the channel-wide slide on again.
      The step 4 lock now slides back toward 24 across the loop boundary instead of
      holding at 48. Check the loop-boundary CC values on the monitor/event map.'
