- id: no-sound
  title: Troubleshooting No Sound
  audience: beginner
  summary: Check transport, channel data and output settings in order.
  prose: 'Use the loop in [Creating a First Loop](#first-sound). Check the following in order.


    1. Check that the grid playhead moves. If it does not, press Play. For an external clock source, check
    that the source is running and sending clock. Use the internal clock for a standalone check.

    2. Select the intended channel and check that it is unmuted. Assign a pattern or enter trig masks.
    An unassigned source pattern does not play through the channel.

    3. Check that active attacks are inside the channel range. If several patterns are assigned, check
    whether Skip removes their overlaps. Compare one assigned pattern or All trig merge.

    4. Open Masks. Check Trig, Note, Vel and Len at channel and held-step scope. An explicit step value
    overrides its default. Velocity 0 is silent. Clear an exception to restore inheritance.

    5. Open Device. Apply the selection with K3; a draft is not the active destination. For MIDI, match
    output port and receive channel. For n.b., check that the player is installed, enabled and supported.
    Check norns audio level and the listening path.


    For hanging notes, stop playback, then hold a non-selected page navigation key to invoke panic. Panic
    sends Note Off messages but does not stop playback. A running sequence can sound new notes after the
    sweep.'
  musical_use: ''
