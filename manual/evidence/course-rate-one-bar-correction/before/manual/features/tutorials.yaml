- id: build-a-phrase
  title: Creating a Phrase and Arrangement
  audience: beginner
  summary: Turn four fast attacks into four evenly spaced beats.
  prose: 'Before starting: Use channel 1 with pattern 1 assigned, active attacks at steps 1–4 and range
    1–4. Set channel Masks Note to MIDI 60, Vel to 80 and Len to 1/2; clear existing step exceptions.
    Stop playback. [Creating a First Loop](#first-sound) gives the complete preparation route.


    ### Extend the range


    1. Tap Channel (3,8).

    2. Hold (1,4), tap (16,4), release.

    3. Turn E1 to Channel tasks; select Clock with E2 and press K3.

    4. Select Rate with E2; set /4 with E3.

    5. Press K3 to apply while stopped.


    The channel traverses16 steps before repeating.


    ### Move the attacks


    1. Open Pattern Trig, pattern 1.

    2. Remove steps 2,3,4.

    3. Add steps 5,9,13; keep step 1.


    Four attacks now sit on the four beats. The old attacks have been removed explicitly.


    ### Hear the longer phrase


    1. Play two bars.

    2. Stop.


    C–C–C–C remains the pitch sequence; the space between attacks has increased.


    Resulting project: P1 attacks 1/5/9/13; CH01 range 1–16; sixteenth-note rate; Note 60/Vel 80/Len1/2
    unchanged.'
  musical_use: ''
