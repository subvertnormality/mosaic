  details:
  - title: Coordinates and pitches
    text: 'The first channel steps run across row 4. Coordinates count from the grid’s top-left corner.
      Octave labels vary between screens: this tutorial uses the Masks field, where MIDI 60 is C3. Numeric
      MIDI is the reliable reference when moving between instruments or controls.'
  - title: Walkthrough Result
    text: The recorded walkthrough checks two cycles of four equal MIDI notes and then stops playback.
      It demonstrates the native controls and MIDI output; it does not include a live audio recording
      of the first-loop tutorial.
  - title: Recovery
    text: If silent, follow No Sound in transport → assignment → range → masks → output order.
  - title: Course continuity
    text: Continue the same project through Make a piece. The separate reference demonstrations below
      start from their stated starting projects; they do not load a replacement into your project.
