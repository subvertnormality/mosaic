- id: keep-your-work
  title: Saving and Loading a Project
  audience: beginner
  summary: Restore the arrangement from a named project.
  prose: 'Before starting: Use any stopped project containing a named arrangement. The worked reload check
    uses slot 1 with channel 1 muted and another channel audible. For another project, make a reversible
    visible change before loading and confirm the saved state returns.


    ### Save the arrangement


    1. Tap K1 briefly to enter the norns system menu.

    2. Open PARAMS → MOSAIC → Save project.

    3. Enter Four notes and confirm.


    The named project stores the two-section arrangement.


    ### Prove the saved version


    1. Return to Mosaic, select Song slot 1, then open Channel.

    2. Hold K1, tap channel 1 at (1,1), release K1 to unmute it temporarily.

    3. With playback stopped, open PARAMS → MOSAIC → Load project.

    4. Select Four notes and confirm.


    Slot 1 returns to bass alone; the temporary change is removed.


    ### Replay the restored sections


    1. Select slot 1.

    2. Play four section passes and stop.


    The saved bass-only/full-phrase alternation is restored. Continue with merge, recording or modulation
    task guides without replacing this saved version.


    Resulting project: Named project Four notes contains both sections and restores their exact playback.
    Transport stopped with no held notes.'
  musical_use: ''
  related:
