features:
- id: first-sound
  title: Creating a First Loop
  audience: beginner
  summary: Hear a repeating four-note loop.
  prose: 'Before starting: Start a new project with Record off. Configure channel 1 to a working output
    using [Configuring an Output](#setup). No patterns or masks have been entered.


    ### Enter four attacks


    1. Tap Pattern (5,8) to Trig.

    2. Select pattern 1 on the top row.

    3. Tap (1,4), (2,4), (3,4), (4,4).


    Four active attacks light on row 4.


    ### Assign and shorten


    1. Tap Channel (3,8).

    2. Tap pattern slot (1,2).

    3. Hold step (1,4), tap (4,4), release (1,4).


    Pattern 1 feeds channel 1 across a four-step range.


    ### Give the attacks a pitch and level


    1. Open Channel tasks → Masks.

    2. With no step held, select Note with E2 and set MIDI 60 with E3 (C3).

    3. Select Vel and set 80.

    4. Select Len and set 1/2.


    All four attacks share pitch, velocity and duration.


    ### Play and stop


    1. Tap Play (1,8).

    2. Hear two cycles.

    3. Tap Play again to stop; hold K1 too if Shift press stop is enabled.


    Four equal C notes repeat. Playback stops with notes released.


    Resulting project: Pattern 1 attacks 1–4; CH01 assigned P1; range 1–4; Note 60/Vel 80/Len1/2; no step
    exceptions; stopped.'
