gaps:
- feature_id: lock-lead-time
  case: M-SYNC-LEAD-001
  reason: Parent closes before child runs. Separate child sessions test leads 0,5,10,25; final comparison
    arrives after every child has closed. Use M-SYNC-LEAD-002 for a compact single-child 0/25/50 scene;
    do not snapshot parent comparison.
- feature_id: midi-panic
  reason: Selected-page no-panic boundary and overlapping/hotplug panic are existing cases but not included
    in this compact guide scene. Their final UI state needs separate exact expectations before capture.
