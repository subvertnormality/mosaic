- id: masks
  title: 5. Give the phrase an ending
  goal: Raise the last beat from C to D and make it softer. One step gets its own pitch and velocity while the other three keep the channel defaults.
  prerequisite: 'Continue chapter 4: channel 1 plays pattern 1 on steps 1, 5, 9 and 13, range 16; Note 60, Vel 80 and Len 1/2 are the channel defaults; stopped.'
  outgoing_state: Same rhythm. Step 13 has Note 62 (D3) and Vel 50; the channel defaults are still Note 60, Vel 80 and Len 1/2; no other step has a mask; stopped. The main lesson is complete at Make the ending softer. Optional default and clearing comparisons end by restoring this same phrase.
  recovery: 'If every note changes, you edited the channel default: release all steps and check that the title row shows ST13 while you edit. To remove a step''s masks, hold the step and press K2; this clears Note and Vel together, so set them again.'
  stages:
  - id: masks-open
    title: Find the channel default
    goal: See the value every step uses before any step has an exception, so you can tell later what an exception changes.
    action: '1. Turn E1 right until Channel tasks opens, turn E2 to Masks and press K3 if you are not already on this page from chapter 4.

      2. With no step held, turn E2 to Note.'
    result: NOTE MASKS CH01 shows Note C3 (MIDI 60) in the highlighted cell. The title row has no step number, so C3 is the default for the whole channel. A step mask will override it for one step only.
    binding:
      status: controlled-verified
      scene: course-masks
      step: masks-open
    teaching_binding:
      transition_scope: adjacent
      from_step_id: start
      actions:
      - id: a01
        kind: choose-menu
        label: Open Masks and choose the Note field
        destination:
          header_title: NOTE MASKS
        trigger:
          type: enc
          n: 2
          direction: anticlockwise
      - id: a02
        kind: preview-recorded-result
        label: Show result
        target_step_id: masks-open
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01
          header.layout: overview_masks
          mask_fields:
          - field: note
            value: C3
            layout: overview_masks
        held_controls_at_target: []
      human_outcome: NOTE MASKS CH01 shows Note C3 (MIDI 60) in the highlighted cell. The title row has no step number, so C3 is the default for the whole channel. A step mask will override it for one step only.
      practice_prompt: See the value every step uses before any step has an exception, so you can tell later what an exception changes.
  - id: masks-hold
    title: Select the last beat
    goal: Choose the one step you will change.
    action: Hold (13,4), the fourth trig, and keep holding it for the next stage.
    result: 'The title row now reads CH01 ST13: the screen edits step 13 only. Note still reads C3 because step 13 has no exception yet.'
    binding:
      status: controlled-verified
      scene: course-masks
      step: masks-hold
    teaching_binding:
      transition_scope: adjacent
      from_step_id: masks-open
      actions:
      - id: a01
        kind: hold-grid
        label: Hold step 13
        x: 13
        y: 4
      - id: a02
        kind: preview-recorded-result
        label: Show result
        target_step_id: masks-hold
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01 ST13
          header.layout: overview_masks
          mask_fields:
          - field: note
            value: C3
            layout: overview_masks
        held_controls_at_target:
        - type: grid
          x: 13
          y: 4
      human_outcome: 'The title row now reads CH01 ST13: the screen edits step 13 only. Note still reads C3 because step 13 has no exception yet.'
      practice_prompt: Choose the one step you will change.
      preserve_holds_at_target: true
  - id: masks-edit
    title: Raise the last note
    goal: Give step 13 a pitch of its own.
    action: While you hold (13,4), turn E3 right two detents. Note moves by one semitone per detent, 60 to 61 to 62, and reads D3 (MIDI 62).
    result: Only step 13 now has a Note exception, D3. Steps 1, 5 and 9 still use the channel default C3.
