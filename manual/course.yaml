schema_version: 1
title: Make your first piece
summary: 'Keep one project: make a four-beat phrase, add a bass and a quiet pickup, then arrange and save two sections.'
project:
  name: Four notes
  output: One MIDI instrument or Polyperc1; an independent MIDI channel or Doubledecker for the second part. Polyperc1 is used once.
  incoming_state: Fresh project. Do not load separate reference-example projects during the course.
  capture_status: controlled-verified
  validation_scope: controlled-manual-generation
  realtime_qualification: pending-ci
learning_path:
- id: getting-started
  title: 1. Meet Mosaic
  goal: Learn what a pattern, a channel and a song slot each do, and how this manual names grid buttons and norns controls, before you change anything.
  prerequisite: Mosaic is running on norns with a 128 grid connected. Start a new project (PARAMS > MOSAIC > + New) so the course begins from an empty project. Have a MIDI instrument, or a norns voice such as Polyperc 1, ready for chapter 2.
  outgoing_state: Nothing in the project has changed. You can find a grid button from its (column,row) coordinates, tell the norns keys K1-K3 from the encoders E1-E3, and say what a pattern, a channel and a song slot do.
  recovery: If a tap opens the wrong page, tap Channel (3,8) to return to the channel page. If the grid does not respond, check the grid connection in the norns menu. If playback later makes no sound, open No Sound.
  stages:
  - id: getting-started-objects
    title: Learn the three objects
    goal: Know what a pattern, a channel and a song slot are for before you edit any of them.
    action: 'Read these three ideas first. Nothing changes until the last line.

      1. A pattern holds a rhythm of trigs (steps that play a note) and relative notes. You write patterns on the Pattern page.

      2. A channel plays patterns through one sound: a MIDI instrument or a norns voice. Its masks are values that override pitch, velocity and length, for the whole channel or for single steps.

      3. A song slot stores one section of the song. You arrange slots in chapter 9.

      Then do one thing: tap Channel (3,8) on the grid to open channel 1.'
    result: 'The norns screen reads NOTE MASKS with CH01 in the title row. Its eight cells (Trig, Note, Vel, Len and Chd1 to Chd4) all show X, which means no value is set: the new channel has no pattern, pitch or sound yet. On the grid, (1,1) is lit because channel 1 is the channel you edit, and (3,8) is lit because you are on the Channel page. In chapter 3 you give channel 1 a pattern and a pitch.'
    binding:
      status: controlled-verified
      scene: course-getting-started
      step: getting-started-objects
    teaching_binding:
      from_step_id: start
      actions:
      - id: choose-channel
        kind: tap-grid
        x: 3
        y: 8
        label: Tap Channel (3,8) to open channel 1
      - id: preview
        kind: preview-recorded-result
        target_step_id: getting-started-objects
        label: Show result
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01
          header.layout: overview_masks
        grid_cells:
        - x: 1
          y: 1
          level: 15
        - x: 3
          y: 8
          level: 15
        held_controls_at_target: []
      human_outcome: 'The norns screen reads NOTE MASKS with CH01 in the title row. Its eight cells (Trig, Note, Vel, Len and Chd1 to Chd4) all show X, which means no value is set: the new channel has no pattern, pitch or sound yet. On the grid, (1,1) is lit because channel 1 is the channel you edit, and (3,8) is lit because you are on the Channel page. In chapter 3 you give channel 1 a pattern and a pitch.'
      practice_prompt: Before changing a channel, identify what the pattern, channel, and song slot each store.
      transition_scope: adjacent
  - id: getting-started-notation
    title: Read the grid and norns controls
    goal: Be able to find any button from its coordinates for the rest of the course.
    action: '1. A grid position is written (column,row). Columns count from 1 at the left to 16 at the right; rows count from 1 at the top to 8 at the bottom. (3,8) is column 3 on the bottom row.

      2. The bottom-left buttons open the main pages: Play (1,8), Record (2,8), Channel (3,8), Scale (4,8), Pattern (5,8) and Song (6,8). Row 1 selects the channel on the channel page, the pattern on the Pattern page and the song slot on the Song page.

      3. On the norns, K1-K3 are the three keys and E1-E3 the three encoders, numbered as printed on the norns. "Tap" means a short press. "Hold K1" means keep K1 down while you act: it is the shift key.

      4. Tap Pattern (5,8) on the grid to try a button. Chapter 2 starts by tapping Channel (3,8), so you can leave the Pattern page that way.'
    result: The screen changes to PATTERN TRIG with PAT01 CH01 in the title row. No trigs are set yet, so the steps are dim. On the grid, (1,1) is lit because pattern 1 is the pattern you edit, and (5,8) is lit because you are on the Pattern page.
    binding:
      status: controlled-verified
      scene: course-getting-started
      step: getting-started-notation
    teaching_binding:
      transition_scope: adjacent
      from_step_id: getting-started-objects
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Pattern page
        x: 5
        y: 8
      - id: a02
        kind: preview-recorded-result
        label: Show result
        target_step_id: getting-started-notation
      semantic_requires:
        public_readout_equals:
          page: trigger_editor
          header.title: PATTERN TRIG
          header.scope: PAT01 CH01
          header.layout: pattern64
        held_controls_at_target: []
      human_outcome: The screen changes to PATTERN TRIG with PAT01 CH01 in the title row. No trigs are set yet, so the steps are dim. On the grid, (1,1) is lit because pattern 1 is the pattern you edit, and (5,8) is lit because you are on the Pattern page.
      practice_prompt: Be able to find any button from its coordinates for the rest of the course.
- id: setup
  title: 2. Choose one sound
  goal: Send channel 1 to one instrument you can hear, and set a known tempo of 90 BPM.
  prerequisite: New project, transport stopped, Record off. A MIDI instrument is connected and set to receive on a MIDI channel you know, or Polyperc 1 is enabled for norns. Switch it on and set its volume before you start.
  outgoing_state: Channel 1 routes to your instrument or to Polyperc 1; the tempo is 90 BPM; no pattern is assigned yet, so nothing plays.
  recovery: If the Device page does not offer your instrument, check the connection, the MIDI port and the enabled norns voices before changing notes. K2, or E1, cancels a draft without changing the active output.
  stages:
  - id: setup-route
    title: Open the Device page
    goal: Reach the page where a channel is given its sound.
    action: '1. Tap Channel (3,8). Channel 1 is selected (CH01 in the title row).

      2. Turn E1 right until Channel tasks opens. This list holds everything you can do with the channel: Masks, Trig params, Output, Clock, Merge modes, Merge Shape, Harmony, Device and History.

      3. Turn E2 until Device is highlighted.

      4. Press K3 to open it.'
    result: 'The title row reads DEVICE with CH01. Only the Device row is listed, set to None: the MIDI channel and MIDI port rows appear once you choose a device. What you change here is only a draft until you press K3.'
    binding:
      status: controlled-verified
      scene: course-setup
      step: setup-route
    teaching_binding:
      transition_scope: interval
      from_step_id: start
      actions:
      - id: open-channel
        kind: tap-grid
        x: 3
        y: 8
        label: Open the Channel page
      - id: channel-tasks
        kind: choose-menu
        label: Open Channel tasks
        trigger:
          type: enc
          n: 1
          direction: clockwise
        destination:
          page: channel_tasks
      - id: select-device
        kind: select-value
        label: Select Device
        field_label: Device
        value: OPEN >
        control: E2
        direction: anticlockwise
      - id: open-device
        kind: tap-key
        n: 3
        label: Open the selected Device row
      - id: preview
        kind: preview-recorded-result
        target_step_id: setup-route
        label: Show result
      semantic_requires:
        public_readout_equals:
          page: midi_config
          header.title: DEVICE
          header.scope: CH01
          header.layout: detail
          device_configuration:
            device: None
        held_controls_at_target: []
      human_outcome: 'The title row reads DEVICE with CH01. Only the Device row is listed, set to None: the MIDI channel and MIDI port rows appear once you choose a device. What you change here is only a draft until you press K3.'
      practice_prompt: Open Device settings for channel 1.
    human_outcome: 'The title row reads DEVICE with CH01. Only the Device row is listed, set to None: the MIDI channel and MIDI port rows appear once you choose a device. What you change here is only a draft until you press K3.'
  - id: setup-apply
    title: Choose the output and apply it
    goal: Make channel 1 play your instrument.
    action: '1. Turn E3 one detent to choose a Device. The first entry after None is CC Device, a generic MIDI device that suits any MIDI instrument. If your instrument has its own entry, choose that instead. With no external instrument, choose Polyperc 1, the norns voice.

      2. The MIDI channel and MIDI port rows now appear. CC Device reads CC1 and OUT 1, so notes leave on port 1, MIDI channel 1. If your instrument listens elsewhere, turn E2 to a row and E3 to the value it needs. A device entry that fixes a value does not let you change it, and Polyperc 1 needs neither row.

      3. Press K3 to apply. Until K3 the page only shows a draft and the channel keeps its old routing; K2 cancels the draft.'
    result: The DEVICE page lists Device CC Device, MIDI channel CC1 and MIDI port OUT 1 (or your own choices), and the routing is now active for channel 1. You hear it in chapter 3 when the first notes play. If it stays silent, open No Sound.
    binding:
      status: controlled-verified
      scene: course-setup
      step: setup-apply
    teaching_binding:
      transition_scope: interval
      from_step_id: setup-route
      actions:
      - id: a01
        kind: select-value
        label: Choose CC Device
        control: E3
        value: CC Device
        direction: clockwise
        field_label: Device
      - id: a02
        kind: tap-key
        label: Apply the channel routing
        n: 3
      - id: a03
        kind: preview-recorded-result
        label: Show result
        target_step_id: setup-apply
      semantic_requires:
        public_readout_equals:
          page: midi_config
          header.title: DEVICE
          header.scope: CH01
          header.layout: detail
          device_configuration:
            device: CC Device
            midi_channel: CC1
            midi_port: OUT 1
        held_controls_at_target: []
      human_outcome: The DEVICE page lists Device CC Device, MIDI channel CC1 and MIDI port OUT 1 (or your own choices), and the routing is now active for channel 1. You hear it in chapter 3 when the first notes play. If it stays silent, open No Sound.
      practice_prompt: On the Device page, turn E3 once to choose CC Device. Check the Device, MIDI channel, and MIDI port rows, then press K3 to apply; K2 cancels the draft.
    human_outcome: The DEVICE page lists Device CC Device, MIDI channel CC1 and MIDI port OUT 1 (or your own choices), and the routing is now active for channel 1. You hear it in chapter 3 when the first notes play. If it stays silent, open No Sound.
  - id: setup-tempo
    title: Set the tempo to 90 BPM
    goal: Set a comfortable shared tempo of 90 BPM for the phrase and bass.
    action: '1. Tap Song (6,8).

      2. Turn E1 right one detent to open Song tasks, turn E2 to Tempo & feel and press K3. GLOBAL FEEL opens.

      3. Turn E2 up to Tempo, the top row. Turn E3 left until Tempo reads 90. Tempo follows the norns clock, so it shows whatever your norns is set to (often 120 on a fresh norns; this walkthrough''s recording opens at 90). It moves one BPM per detent with no coarse step: keep turning E3 until the screen reads 90.

      4. Press K3 to apply.'
    result: 'GLOBAL FEEL, SONG 01 shows Tempo 90. At the default channel Rate /1, each step is a sixteenth note: four steps make one beat and sixteen steps make one bar.'
    binding:
      status: controlled-verified
      scene: course-setup
      step: setup-tempo
    teaching_binding:
      transition_scope: interval
      from_step_id: setup-apply
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Song page
        x: 6
        y: 8
      - id: a02
        kind: choose-menu
        label: GLOBAL FEEL
        destination:
          header_title: GLOBAL FEEL
        trigger:
          type: key
          n: 3
          gesture: tap
      - id: a03
        kind: select-value
        label: Turn E3 down, then return Tempo to 90 BPM
        control: E3
        value: '90'
        direction: anticlockwise
        field_label: Tempo
      - id: a04
        kind: tap-key
        label: Apply the tempo
        n: 3
      - id: a05
        kind: preview-recorded-result
        label: Show result
        target_step_id: setup-tempo
      semantic_requires:
        public_readout_equals:
          page: song_global_settings
          header.title: GLOBAL FEEL
          header.scope: SONG 01
          header.layout: vertical_list
          selected_field.label: Tempo
          selected_field.value: '90'
          selected_field.layout: vertical_list
        held_controls_at_target: []
      human_outcome: 'GLOBAL FEEL, SONG 01 shows Tempo 90. At the default channel Rate /1, each step is a sixteenth note: four steps make one beat and sixteen steps make one bar.'
      practice_prompt: Turn E3 down, then return Tempo to 90 BPM. The page reads 90 before the next lesson.
- id: first-sound
  title: 3. Make four equal notes
  goal: Write four trigs, give them a pitch and hear them repeat as a very fast four-note loop.
  prerequisite: 'Continue with the routed project from chapter 2: tempo 90, channel 1 routed to your instrument, transport stopped.'
  outgoing_state: Pattern 1 has trigs on steps 1-4; channel 1 plays pattern 1 over steps 1-4; its masks are Note 60 (C3), Vel 80 and Len 1/2; no step has its own mask; playback is stopped.
  recovery: 'If you hear nothing, check in this order: Play (1,8) was tapped; pattern 1 is lit on row 2 of the channel page; steps 1-4 are lit on row 4; Note, Vel and Len are set in Masks; the Device page from chapter 2 was applied with K3. If Play will not stop because Shift press stop is on (PARAMS > MOSAIC > sequencer options), hold K1 while you tap Play.'
  stages:
  - id: first-sound-attacks
    title: Enter four trigs
    goal: Write a first rhythm. A trig is a step that will play a note. Four neighbouring trigs are deliberately plain; chapter 4 reshapes them.
    action: '1. Tap Pattern (5,8). The screen reads PATTERN TRIG.

      2. Tap (1,1) on the top row to choose pattern 1. PAT01 appears in the title row.

      3. Tap (1,4), (2,4), (3,4) and (4,4). Row 4 holds steps 1 to 16 of the pattern. Each tap switches one step on; tap a lit step again to remove it.'
    result: 'Four bright buttons light at (1,4) to (4,4), and PATTERN TRIG PAT01 CH01 shows four bright trigs. Nothing sounds yet: the pattern is not assigned to a channel and no pitch is set.'
    binding:
      status: controlled-verified
      scene: course-first-sound
      step: first-sound-attacks
    teaching_binding:
      transition_scope: adjacent
      from_step_id: start
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Pattern page
        x: 5
        y: 8
      - id: a02
        kind: tap-grid
        label: Choose pattern 1
        x: 1
        y: 1
      - id: a03
        kind: tap-grid
        label: Add the first note
        x: 1
        y: 4
      - id: a04
        kind: tap-grid
        label: Add the second note
        x: 2
        y: 4
      - id: a05
        kind: tap-grid
        label: Add the third note
        x: 3
        y: 4
      - id: a06
        kind: tap-grid
        label: Add the fourth note
        x: 4
        y: 4
      - id: a07
        kind: preview-recorded-result
        label: Show result
        target_step_id: first-sound-attacks
      semantic_requires:
        public_readout_equals:
          page: trigger_editor
          header.title: PATTERN TRIG
          header.scope: PAT01 CH01
          header.layout: pattern64
        leds_at_target:
        - x: 1
          y: 4
          level: 15
        - x: 2
          y: 4
          level: 15
        - x: 3
          y: 4
          level: 15
        - x: 4
          y: 4
          level: 15
        grid_cells:
        - x: 1
          y: 4
          level: 15
        - x: 2
          y: 4
          level: 15
        - x: 3
          y: 4
          level: 15
        - x: 4
          y: 4
          level: 15
        held_controls_at_target: []
        midi_silence_at_target: true
      human_outcome: 'Four bright buttons light at (1,4) to (4,4), and PATTERN TRIG PAT01 CH01 shows four bright trigs. Nothing sounds yet: the pattern is not assigned to a channel and no pitch is set.'
      practice_prompt: Write a first rhythm. A trig is a step that will play a note. Four neighbouring trigs are deliberately plain; chapter 4 reshapes them.
  - id: first-sound-assign
    title: Assign pattern 1 and loop four steps
    goal: Connect the pattern to channel 1 and make the channel repeat steps 1 to 4 only.
    action: '1. Tap Channel (3,8). Channel 1 is selected on row 1.

      2. Tap (1,2), the first pattern slot on row 2. It lights: channel 1 now plays pattern 1. The screen opens MERGE MODES for CH01 because assigning a pattern always shows it; Patterns reads 01. You do not need the other rows yet.

      3. Row 4 of the channel page is the range row: it sets which steps the channel loops. Hold (1,4), tap (4,4), then release (1,4). Steps 1 to 4 stay bright and the other steps go dark, so the channel loops four steps. A short loop keeps the first sound easy to hear; chapter 4 widens it.'
    result: Channel 1 plays pattern 1 and repeats steps 1 to 4. The grid shows (1,2) lit and steps 1 to 4 bright on row 4, and the tooltip reads Channel 1 length changed.
    binding:
      status: controlled-verified
      scene: course-first-sound
      step: first-sound-assign
    teaching_binding:
      transition_scope: interval
      from_step_id: first-sound-attacks
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Channel page
        x: 3
        y: 8
      - id: a02
        kind: tap-grid
        label: Assign pattern 1 to channel 1
        x: 1
        y: 2
      - id: a03
        kind: hold-grid
        label: Hold the loop start
        x: 1
        y: 4
      - id: a04
        kind: tap-grid
        label: Set the loop end at step 4
        x: 4
        y: 4
      - id: a05
        kind: release-grid
        label: Release the loop start
        x: 1
        y: 4
      - id: a06
        kind: preview-recorded-result
        label: Show result
        target_step_id: first-sound-assign
      semantic_requires:
        public_readout_equals:
          page: merge_detail
          header.title: MERGE MODES
          header.scope: CH01
          header.layout: detail
        held_controls_at_target: []
      human_outcome: Channel 1 plays pattern 1 and repeats steps 1 to 4. The grid shows (1,2) lit and steps 1 to 4 bright on row 4, and the tooltip reads Channel 1 length changed.
      practice_prompt: Connect the pattern to channel 1 and make the channel repeat steps 1 to 4 only.
  - id: first-sound-masks-open
    title: Open the Masks page
    goal: Find where a channel's pitch, velocity and length are set.
    action: '1. Turn E1 right until Channel tasks opens.

      2. Turn E2 to Masks and press K3. The title reads NOTE MASKS with CH01.

      3. A mask is a value that overrides what the pattern would use. With no step held, E2 chooses a cell and E3 sets that cell for every step of the channel.'
    result: NOTE MASKS CH01 lists eight cells (Trig, Note, Vel, Len and Chd1 to Chd4). They all read X, which means no mask is set, so the channel has no pitch, velocity or length yet.
    binding:
      status: controlled-verified
      scene: course-first-sound
      step: first-sound-masks-open
    teaching_binding:
      transition_scope: adjacent
      from_step_id: first-sound-assign
      actions:
      - id: a01
        kind: choose-menu
        label: Open Masks for channel 1
        destination:
          page: masks
        trigger:
          type: key
          n: 3
          gesture: tap
      - id: a02
        kind: preview-recorded-result
        label: Show result
        target_step_id: first-sound-masks-open
      semantic_requires:
        public_readout_equals:
          page: masks
        held_controls_at_target: []
      human_outcome: NOTE MASKS CH01 lists eight cells (Trig, Note, Vel, Len and Chd1 to Chd4). They all read X, which means no mask is set, so the channel has no pitch, velocity or length yet.
      practice_prompt: Find where a channel's pitch, velocity and length are set.
  - id: first-sound-defaults
    title: Set pitch, velocity and length
    goal: Give all four trigs the same pitch, velocity and duration with the channel's mask defaults.
    action: '1. With no step held, turn E2 to Note and turn E3 right until Note reads C3 (MIDI 60; norns labels MIDI note 60 as C3). It starts at X, so expect about 60 detents; turn until the screen shows C3.

      2. Turn E2 to Vel and turn E3 right until Vel reads 80 (about 80 detents from X).

      3. Turn E2 to Len and turn E3 right until Len reads 1/2, a note half a step long (8 detents).'
    result: 'NOTE MASKS shows Note C3, Vel 80 and Len 1/2. All four trigs use these values: a medium-loud, short note. You do not need to count detents; turn until the screen shows the value.'
    binding:
      status: controlled-verified
      scene: course-first-sound
      step: first-sound-defaults
    teaching_binding:
      transition_scope: interval
      from_step_id: first-sound-masks-open
      actions:
      - id: a01
        kind: select-value
        label: Choose Note field, then set the channel note to C3
        control: E3
        value: C3
        field_label: note
        field_control: E2
        direction: clockwise
        field_direction: clockwise
      - id: a03
        kind: select-value
        label: Choose Velocity field, then set the channel velocity to 80
        control: E3
        value: '80'
        field_label: velocity
        field_control: E2
        direction: clockwise
        field_direction: clockwise
      - id: a05
        kind: select-value
        label: Choose Length field, then set the note length to half a step
        control: E3
        value: 1/2
        field_label: length
        field_control: E2
        direction: clockwise
        field_direction: clockwise
      - id: a07
        kind: preview-recorded-result
        label: Show result
        target_step_id: first-sound-defaults
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01
          header.layout: overview_masks
          mask_fields:
          - field: note
            value: C3
            layout: overview_masks
          - field: velocity
            value: '80'
            layout: overview_masks
          - field: length
            value: 1/2
            layout: overview_masks
        held_controls_at_target: []
      human_outcome: 'NOTE MASKS shows Note C3, Vel 80 and Len 1/2. All four trigs use these values: a medium-loud, short note. You do not need to count detents; turn until the screen shows the value.'
      practice_prompt: Give all four trigs the same note, loudness and duration with the channel's mask defaults.
  - id: first-sound-hear
    title: Play the loop
    goal: Hear the four trigs repeat.
    action: '1. Tap Play (1,8).

      2. Listen for two repeats. Four identical short C notes follow quickly, making a fast stutter.

      3. Tap Play again to stop.'
    result: Four equal C notes repeat, then stop with no note left sounding. The note output shows MIDI 60 at velocity 80. You have connected the pattern, channel and sound. Next, spread these four notes onto the beats of a bar.
    binding:
      status: controlled-verified
      scene: course-first-sound
      step: first-sound-hear
    teaching_binding:
      transition_scope: adjacent
      from_step_id: first-sound-defaults
      actions:
      - id: a01
        kind: play-phrase
        label: Play the four-note pattern
        trigger:
          type: grid
          x: 1
          y: 8
          gesture: tap
      - id: a02
        kind: preview-recorded-result
        label: Show result
        target_step_id: first-sound-hear
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01
          header.layout: overview_masks
        leds_at_target:
        - x: 1
          y: 8
          level: 12
        grid_cells:
        - x: 1
          y: 8
          level: 12
        held_controls_at_target: []
        midi_events_at_target:
        - port: 1
          bytes:
          - 144
          - 60
          - 80
        - port: 1
          bytes:
          - 144
          - 60
          - 80
        - port: 1
          bytes:
          - 144
          - 60
          - 80
        - port: 1
          bytes:
          - 144
          - 60
          - 80
      human_outcome: Four equal C notes repeat, then stop with no note left sounding. The note output shows MIDI 60 at velocity 80. You have connected the pattern, channel and sound. Next, spread these four notes onto the beats of a bar.
      practice_prompt: Hear the four trigs repeat.
- id: build-a-phrase
  title: 4. Spread the rhythm across a bar
  goal: Turn the four fast trigs into four evenly spaced beats by stretching the loop to 16 steps.
  prerequisite: Continue chapter 3, stopped. Note 60, Vel 80 and Len 1/2 stay set.
  outgoing_state: Pattern 1 has trigs on steps 1, 5, 9 and 13; channel 1 plays steps 1-16; Rate is /1, the default sixteenth-note rate; Note 60, Vel 80 and Len 1/2 are unchanged; playback is stopped.
  recovery: Remove an accidental trig by tapping it again in Pattern Trig. If the loop still repeats after four steps, hold (1,4), tap (16,4) and release (1,4) again on the channel page.
  stages:
  - id: build-a-phrase-range
    title: Loop all 16 steps
    goal: Make the channel play a whole bar before it repeats.
    action: '1. If you are not on the channel page, tap Channel (3,8).

