- id: sequence-composition
  title: 6. Add a second part
  goal: Add a second channel that plays a root-and-fifth bass beneath the phrase.
  prerequisite: Continue chapter 5 with C, C, C, D and the softer ending, stopped. If you tried its optional comparisons, finish Rebuild the ending first. You need an independent second MIDI route or a different norns player, such as Doubledecker. Polyperc 1 can be assigned to only one channel.
  outgoing_state: Channel 1 still plays C, C, C, D. Channel 2 plays pattern 2 (trigs on steps 1 and 9, degrees 0 and 4) over 16 steps at octave -1, with no masks, so it sounds MIDI 48 and 55 at velocity 100 and length 1. If you tried the optional merge detour, channel 1 plays pattern 1 alone again and its merge Strategy is left on All.
  recovery: 'If the first part changes, select channel 1 and check its Device page and masks: selecting channel 2 does not change channel 1. If channel 2 repeats too fast, set its range to 16 steps again.'
  stages:
  - id: sequence-composition-bass-pattern
    title: Write a root-and-fifth bass pattern
    goal: 'Write pattern 2: two trigs, one on the root of the scale and one on the fifth.'
    action: '1. Tap Pattern (5,8) until the screen reads PATTERN TRIG. Tap (2,1) on the top row to choose pattern 2 (PAT02). It starts empty.

      2. Tap (1,4) and (9,4): two trigs, half a bar apart.

      3. Tap Pattern (5,8) once more. The screen reads PATTERN NOTE. Here row 7, the bottom row of notes, is degree 0, the root of the scale, and each row above it is one scale step higher. The bright band along row 7 is the degree 0 baseline every step starts on.

      4. Tap (1,7) for degree 0 at step 1 and (9,3) for degree 4, the fifth, at step 9.

      Pattern notes are relative: the scale decides the real pitch. The title still says CH01 because channel 1 is selected; pattern 2 is not assigned to anything yet.'
    result: 'PATTERN NOTE PAT02 shows Step 9 note set to 4 and a note at (9,3); step 1 stays on the degree-0 baseline at row 7. Only steps 1 and 9 have trigs, so only their pattern notes will sound: C and G in C major. A note shown at a step without a trig does not add an attack.'
    binding:
      status: controlled-verified
      scene: course-sequence-composition
      step: sequence-composition-bass-pattern
    teaching_binding:
      transition_scope: interval
      from_step_id: start
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Pattern page
        x: 5
        y: 8
      - id: a02
        kind: tap-grid
        label: Set the first bass note to the root
        x: 1
        y: 7
      - id: a03
        kind: tap-grid
        label: Set the second bass note
        x: 9
        y: 3
      - id: a04
        kind: preview-recorded-result
        label: Show result
        target_step_id: sequence-composition-bass-pattern
      semantic_requires:
        public_readout_equals:
          page: note_editor
          header.title: PATTERN NOTE
          header.scope: PAT02 CH01
          header.layout: pattern64
        held_controls_at_target: []
      human_outcome: 'PATTERN NOTE PAT02 shows Step 9 note set to 4 and a note at (9,3); step 1 stays on the degree-0 baseline at row 7. Only steps 1 and 9 have trigs, so only their pattern notes will sound: C and G in C major. A note shown at a step without a trig does not add an attack.'
      practice_prompt: 'Write pattern 2: two trigs, one on the root of the scale and one on the fifth.'
