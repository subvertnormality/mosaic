        kind: tap-key
        label: Open the norns menu
        n: 1
      - id: a02
        kind: choose-menu
        label: Choose Load project for Mosaic
        menu_text: '> Load project'
        trigger:
          type: enc
          n: 2
          direction: anticlockwise
      - id: a03
        kind: preview-recorded-result
        label: Show result
        target_step_id: keep-your-work-load-menu
      semantic_requires:
        public_readout_equals:
          selected_menu_text: '> Load project'
        held_controls_at_target: []
      human_outcome: The norns menu shows Load project selected.
      practice_prompt: Reach the load command.
  - id: keep-your-work-reload
    title: Reload to check the saved version
    goal: See that loading brings back the saved arrangement.
    action: '1. Press K3 on > Load project, turn E2 to Four notes in the file list and press K3.

      2. Tap K1 to return to Mosaic and tap Channel (3,8).'
