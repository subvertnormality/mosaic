      human_outcome: Only step 13 now has a Note exception, D3. Steps 1, 5 and 9 still use the channel default C3.
      practice_prompt: Give step 13 a pitch of its own.
      preserve_holds_at_target: true
  - id: masks-release
    title: Return to the default view
    goal: Leave step 13 and see that its exception is kept.
    action: 'Release (13,4).

      To check that the exception is still there, hold (13,4) again: the title row shows ST13 and Note reads D3. Release it again.'
