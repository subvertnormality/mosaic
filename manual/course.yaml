- id: keep-your-work
  title: 10. Save, reload and perform
  goal: Save the two-section arrangement as Four notes, make one temporary change, then reload and hear the saved version return.
  prerequisite: Continue chapter 9, stopped, with slot 1 selected.
  outgoing_state: The saved project Four notes contains both sections and restores their playback exactly. Playback is stopped and no note is held.
  recovery: K2 cancels the Load dialog without replacing the current project. Keep the saved name Four notes until you have finished the optional follow-ups.
  stages:
  - id: keep-your-work-menu
    title: Open Save project
    goal: Reach the save command in the norns menu.
    action: '1. Stop playback. Tap K1 briefly to open the norns system menu.

      2. Turn E1 to PARAMS and press K3, open MOSAIC and turn E2 to < Save project.'
    result: The norns menu shows Pattern project management with Save project selected.
    binding:
      status: controlled-verified
      scene: course-keep-your-work
      step: keep-your-work-menu
    teaching_binding:
      transition_scope: adjacent
      from_step_id: start
      actions:
      - id: a01
        kind: tap-key
        label: Open the norns menu
        n: 1
      - id: a02
        kind: choose-menu
        label: Choose Save project for Mosaic
        menu_text: < Save project
        trigger:
          type: enc
          n: 2
          direction: clockwise
      - id: a03
        kind: preview-recorded-result
        label: Show result
        target_step_id: keep-your-work-menu
      semantic_requires:
        public_readout_equals:
          selected_menu_text: < Save project
        held_controls_at_target: []
      human_outcome: The norns menu shows Pattern project management with Save project selected.
      practice_prompt: Reach the save command in the norns menu.
  - id: keep-your-work-save
    title: Save the arrangement
    goal: Store the project under a name so autosave cannot replace it.
    action: '1. Press K3 on < Save project. Text entry opens with the suggested name new.

      2. Turn E2 left to highlight DEL. Press K3 three times to remove n, e and w from the end of the name.

      3. Turn E3 left to select the character row. Turn E2 to choose F and press K3; repeat for o, u, r, a space, n, o, t, e, s. The character above the bright centre position is the one K3 enters.

      4. Turn E3 right to return to the bottom row. Turn E2 right to highlight OK, then press and release K3 to save. K2 cancels text entry if you need to start again.

      5. Tap K1 to return to Mosaic.


      Check the save in the next Load project stage: choose Four notes.ptn. If the name is absent, repeat this save and confirm OK; cancelling with K2 does not create the named files.'
    result: 'Saved Four notes: the project files Four notes.ptn and Four notes.pset contain your two-section arrangement. Mosaic returns to SLOT SETUP, SONG 01.'
    binding:
      status: controlled-verified
      scene: course-keep-your-work
      step: keep-your-work-save
    teaching_binding:
      transition_scope: adjacent
      from_step_id: keep-your-work-menu
      actions:
      - id: a01
        kind: tap-key
        label: Confirm Save project
        n: 3
      - id: a03
        kind: preview-recorded-result
        label: Show result
        target_step_id: keep-your-work-save
      semantic_requires:
        project_files_at_target:
        - Four notes.ptn
        - Four notes.pset
        held_controls_at_target: []
      human_outcome: 'Saved Four notes: the project files Four notes.ptn and Four notes.pset contain your two-section arrangement. Mosaic returns to SLOT SETUP, SONG 01.'
      practice_prompt: Store the project under a name so autosave cannot replace it.
    human_outcome: 'Saved Four notes: the project files Four notes.ptn and Four notes.pset contain your two-section arrangement. Mosaic returns to SLOT SETUP, SONG 01.'
  - id: keep-your-work-temporary-edit
    title: Make an unsaved change
    goal: Change something you will not save, so the reload has something to undo.
    action: 'Tap Channel (3,8). Hold K1, tap (1,1) and release K1. This unmutes channel 1 in slot 1: a deliberate change you have not saved.'
    result: The title row reads CH01 with no MUTE and the tooltip says Channel 1 unmuted.
    binding:
      status: controlled-verified
      scene: course-keep-your-work
      step: keep-your-work-temporary-edit
    teaching_binding:
      transition_scope: adjacent
      from_step_id: keep-your-work-save
      actions:
      - id: a01
        kind: tap-grid
        label: Open the Channel page
        x: 3
        y: 8
      - id: a02
        kind: hold-key
        label: Hold K1 as the shift key
        n: 1
      - id: a03
        kind: tap-grid
        label: Unmute channel 1 in this slot
        x: 1
        y: 1
      - id: a04
        kind: release-key
        label: Release K1
        n: 1
      - id: a05
        kind: preview-recorded-result
        label: Show result
        target_step_id: keep-your-work-temporary-edit
      semantic_requires:
        public_readout_equals:
          page: masks
          header.title: NOTE MASKS
          header.scope: CH01
          header.layout: overview_masks
        held_controls_at_target: []
      human_outcome: The title row reads CH01 with no MUTE and the tooltip says Channel 1 unmuted.
      practice_prompt: Change something you will not save, so the reload has something to undo.
  - id: keep-your-work-load-menu
    title: Open Load project
    goal: Reach the load command.
    action: With playback stopped, tap K1, open PARAMS, then MOSAIC, and turn E2 to > Load project. K2 cancels the dialog.
    result: The norns menu shows Load project selected.
    binding:
      status: controlled-verified
      scene: course-keep-your-work
      step: keep-your-work-load-menu
