      3. Hold (13,4), press K2 to clear both its Note and Vel masks, then release it.


      4. Restore the softer ending: turn E2 to Vel, hold (13,4), turn E3 left 30 detents until Vel reads 50, then release (13,4). The held checkpoint shows this restored quiet ending; the final frame shows the channel defaults after release.'
