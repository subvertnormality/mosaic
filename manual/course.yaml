  prerequisite: 'Continue chapter 6, stopped: channel 1 plays pattern 1 alone and channel 2 plays the root-and-fifth bass. If you tried the optional merge comparison, finish Return to the two-part phrase first. Its final All strategy has the same result as Skip with one pattern.'
