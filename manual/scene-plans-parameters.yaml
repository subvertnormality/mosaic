  - id: global-off
    title: 'Global: turn full quantisation Off'
    caption: 'State: Off / X / Off / On. Press K1, open the Mosaic params and turn Quantise note masks
      Off. The channel value is still X, so it follows the global Off. Play, then stop: steps 3 and 4
      play as written and step 2 keeps its On lock, 60, 65, 69, 71.'
