  feature_id: chord-spread
  title: Slow the strum with Spread
  behaviour_case: M-SPREAD-006
  citation: README.md#chord-spread
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays one trig on step 1: root C (MIDI 60, C3) at velocity 50, with Chd1 to Chd4
