      and 2 pass in silence at 3/4 and 1 3/4 steps, slot 1 (E3, 64) sounds at 3 steps and the root C3 (60)
      at 4 1/2 steps. Look at the MIDI strip "MIDI sent in this step": the three notes arrive further and
      further apart.'
    assertion:
      kind: chord-shape-slots
      passed: true
      acceleration: 1
      arp: false
      shape: 2
      muted: false
      mask_bits: 9
      onsets: 3
      release_checks: 3
