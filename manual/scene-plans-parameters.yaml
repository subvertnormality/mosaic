      list, showing Chord Spread; Spread and Chord Accel Mod are not assigned yet.'
    assertion:
      kind: parameter-list-label
      label: Chord Spread
      passed: true
  - id: spread
    title: Set a quarter-step Spread
    caption: Press K3 to assign Chord Spread and K2 to return, then turn E3 up to 1/4. Each gap is now
      1/2 + 1/4 = 3/4 step. Turn E2 to the next slot, press K2 and turn E3 to Chord Accel Mod.
    assertion:
      kind: parameter-list-label
      label: Chord Accel Mod
      passed: true
  - id: positive
    title: A positive Accel makes each gap longer
    caption: 'Press K3 to assign Chord Accel Mod and K2 to return, then turn E3 one detent up to +1: each
      gap is a quarter step (Spread x 1) longer than the one before. Tap Play (1,8), then tap it again to
