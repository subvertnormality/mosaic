- id: global-parameter-slide
  feature_id: param-slides
  title: Move between parameter locks
  behaviour_case: M-PATCH-017
  citation: README.md#param-slides
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays the four-step phrase (C, D, E, F = MIDI 60, 62, 64, 65; velocities 127, 117,
      107, 97) through a device with MIDI CCs, at 90 BPM with Rate /1, so one step lasts a sixth of a
      second. PARAMS is open on the device's CC 1 control at its stored value, 63, set in PARAMS > MOSAIC.
      CC 1 is not assigned to a Trig params slot yet, and parameter slides are off.
    assertion:
      kind: selected-menu-value
      text: '63'
    occurrence: 1
  - id: assign-list
    title: Find CC 1
    caption: Press K1 to leave PARAMS. Turn E1 to Channel tasks, choose Trig params with E2 and press
      K3, then press K2 and turn E3 to CC 1 in the parameter list.
    assertion:
      kind: parameter-list-label
      label: CC 1
      passed: true
  - id: assigned
    title: Assign CC 1 to the slot
    caption: Press K3 to assign CC 1 and K2 to return. Slot 1 now reads 63, the stored value, with no
      marker in its corner, because no step has a lock for it yet.
    assertion:
      kind: selected-param
      value: '63'
      marker: null
  - id: lock-step-1
    title: Lock step 1 to 24
    caption: Hold step 1 at (1,4) and turn E3 to 24. Slot 1 shows 24 with an L in its corner while the
      step is held, so this step now has its own value for CC 1. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: L
  - id: lock-step-3
    title: Lock step 3 to 96
    caption: Hold step 3 at (3,4) and turn E3 to 96. Slot 1 shows 96 with the L. Release the step. Steps
      1 and 3 now carry different CC 1 values, two steps apart.
    assertion:
      kind: selected-param
      value: '96'
      marker: L
  - id: slide-on
    title: Turn slides on for the parameter
    caption: With no step held, press K3. Slot 1 reads 63 again and gains an S in its corner, so every
      lock of CC 1 slides toward the next one.
    assertion:
      kind: selected-param
      value: '63'
      marker: S
  - id: play
    title: Play and watch the glide
    caption: 'Tap Play (1,8), let two loops play, then tap it again to stop. In the MIDI strip, CC 1 starts
      at 24 on step 1 and climbs in equal steps of 12, about every 56 ms: 36, 48, 60, 72, 84, reaching
      96 as step 3''s note starts. The glide fills the two steps between the locks.'
    assertion:
      kind: midi
    occurrence: 1
  - id: ramp
    title: The device setting does not change
    caption: 'Press K1 to open PARAMS. CC 1 still shows its stored value, 63: playback never changes the
      setting you stored, so the glide exists only in the CC messages that were sent.'
    assertion:
      kind: slide-musical-time
      passed: true
      from_value: 24
      to_value: 96
      step_distance: 2
      off_middle: false
      step_local: false
      swing: null
      shuffle: null
      clock_ratio: /1
    capture_stage: before-finish
    pre_finish_expect:
      menu_label:
        label: CC 1
      menu_value:
        value: '63'
- id: local-parameter-slide
  feature_id: param-slides
  title: Slide only one source lock
  behaviour_case: M-PATCH-033
  citation: README.md#param-slides
  steps:
  - id: start
    title: Starting point
    caption: Channel 1 plays the four-step phrase (C, D, E, F = MIDI 60, 62, 64, 65; velocities 127, 117,
      107, 97) through a device with MIDI CCs, at 90 BPM with Rate /1, so one step lasts a sixth of a
      second. PARAMS is open on the device's CC 1 control at its stored value, 63, set in PARAMS > MOSAIC.
      CC 1 is not assigned to a Trig params slot yet, and parameter slides are off. The previous scene
      turned slides on for the whole parameter; this one turns them on for a single step.
    assertion:
      kind: selected-menu-value
      text: '63'
    occurrence: 1
  - id: assign-list
    title: Find CC 1
    caption: Press K1 to leave PARAMS. Turn E1 to Channel tasks, choose Trig params with E2 and press
      K3, then press K2 and turn E3 to CC 1 in the parameter list.
    assertion:
      kind: parameter-list-label
      label: CC 1
      passed: true
  - id: assigned
    title: Assign CC 1 to the slot
    caption: Press K3 to assign CC 1 and K2 to return. Slot 1 now reads 63, the stored value, with no
      marker in its corner, because no step has a lock for it yet.
    assertion:
      kind: selected-param
      value: '63'
      marker: null
  - id: lock-step-1
    title: Lock step 1 to 24
    caption: Hold step 1 at (1,4) and turn E3 to 24. Slot 1 shows 24 with an L in its corner while the
      step is held. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: L
  - id: lock-step-3
    title: Lock step 3 to 96
    caption: Hold step 3 at (3,4) and turn E3 to 96. Slot 1 shows 96 with the L. Release the step.
    assertion:
      kind: selected-param
      value: '96'
      marker: L
  - id: lock-step-4
    title: Lock step 4 to 48
    caption: Hold step 4 at (4,4) and turn E3 to 48. Slot 1 shows 48 with the L. Release the step.
    assertion:
      kind: selected-param
      value: '48'
      marker: L
  - id: slide-on
    title: Slide from step 1 only
    caption: Hold step 1 at (1,4) and press K3. Slot 1 shows 24 with an S in its corner while step 1 is
      held, so only the slide that starts at step 1 is on. Release the step.
    assertion:
      kind: selected-param
      value: '24'
      marker: S
  - id: play
    title: Play and watch the glide stop at step 3
    caption: 'Tap Play (1,8), let two loops play, then tap it again to stop. In the MIDI strip, CC 1
      glides from 24 to 96 in equal steps of 12 (36, 48, 60, 72, 84) between steps 1 and 3, then jumps
      straight to 48 at step 4 with no glide.'
    assertion:
      kind: midi
    occurrence: 1
  - id: local
    title: The device setting does not change
    caption: 'Press K1 to open PARAMS. CC 1 still shows 63, the value you stored: the slide only shapes
      the messages sent while playing.'
    assertion:
      kind: slide-musical-time
      passed: true
      from_value: 24
      to_value: 96
      step_distance: 2
      off_middle: false
      step_local: true
      swing: null
      shuffle: null
      clock_ratio: /1
    capture_stage: before-finish
    pre_finish_expect:
      menu_label:
        label: CC 1
      menu_value:
        value: '63'
- id: slide-wrap-boundary
  feature_id: parameter-slides-wrap
  title: Choose what the final lock slides toward
  behaviour_case: M-SLIDE-STEP-001
  citation: README.md#parameter-slides-wrap
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays a four-step pattern through the test MIDI device: trigs on steps 1-4 with
      notes C3, D3, E3 and F3 (MIDI 60, 62, 64, 65) and velocities 127, 117, 107 and 97, at the default
      90 BPM with Rate /1 (sixteenth-note steps, one sixth of a second each); the sequencer is stopped.
      CC 1 is assigned to a Trig params slot and locked on three steps: 24 on step 1, 96 on step 3 and
      48 on step 4; step 2 has no lock. Step 1''s slide is off, and step 4''s slide is on. Wrap param
      slides is Off, so there is no later lock for step 4 to slide toward: CC 1 holds at 48 until the
      loop restarts and the first lock, 24, is recalled with a jump.'
    assertion:
      kind: step-slide
      passed: true
      stage: last-lock-no-wrap
  - id: wrap-on
    title: Turn on Wrap param slides
    caption: Press K1 to open PARAMS, go to the MOSAIC group, select Wrap param slides and turn E3 right
      to On. The row reads On.
    assertion:
      kind: selected-menu-option-row
      label: Wrap param slides
      value: 'On'
      matched: true
  - id: wrap
    title: Slide back to the first lock
    caption: Press K1 to leave PARAMS, tap Play (1,8), let two loops play and tap it again to stop. In
      the MIDI strip, CC 1 now descends from 48 to 24 across the loop boundary, 40, 32, 24 about 56 ms
      apart, and arrives at 24 together with the first note. A filter or other target sweeps smoothly
      around the loop.
    assertion:
      kind: step-slide
      passed: true
      stage: last-lock-wraps
