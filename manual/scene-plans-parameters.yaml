      parameter: Chord Spread
      value: X
    occurrence: 1
  - id: clamp-low
    title: X is the lowest setting
    caption: With no step held, turn E3 down three detents. The slot stays at X; there is nothing below
      Off.
    assertion:
      kind: parameter-division-label
      passed: true
      parameter: Chord Spread
