- id: full-quantisation-precedence
  feature_id: fully-quantise-mask
  title: Choose which note masks follow the scale
  behaviour_case: M-MASK-021
  citation: README.md#fully-quantise-mask
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities 127,
      117, 107, 97), in a scale with Degree II and Rotation 1; both are already set in the scale editor.
      In PARAMS > MOSAIC, Snap note masks to scale is On, while Quantise note masks (the global full-quantisation
      option) and Lock merged to pent. are Off. With Snap alone the masks play as written, 60, 64, 69,
      71 in the MIDI strip, because Degree and Rotation affect masks only under full quantisation. Quantise
      Note Mask works on three levels, strongest first: a step lock, then the channel value, then the
      global option. On follows the scale, Off keeps the written pitch, and X means inherit from the next
      level down. Each step below lists the state as global / channel / step 1 / step 2. Now: Off / X
      / X / X.'
    assertion:
      kind: full-mask-quantisation
      passed: true
      stage: snap-ignores-degree-and-rotation
      pitches:
      - 60
      - 64
      - 69
      - 71
  - id: global-full-degree-and-rotation
    title: 'Global: turn full quantisation On'
    caption: 'State: On / X / X / X. Press K1, open the Mosaic params and turn Quantise note masks On
      (the global option). Play, then stop: the same masks now follow Degree II and Rotation 1 and the
      strip reads 62, 65, 71, 60.'
    assertion:
      kind: full-mask-quantisation
      passed: true
      stage: global-full-degree-and-rotation
      pitches:
      - 62
      - 65
      - 71
      - 60
  - id: channel-off-overrides-global-on
    title: 'Channel: an Off beats the global On'
    caption: 'State: On / Off / X / X. Open Channel tasks > Trig params, press K2 and turn E3 to Quantise
      Note Mask in the parameter list. Press K3 to assign it and K2 to return, then turn E3 one detent
      to Off. Play, then stop: the written phrase 60, 64, 69, 71 returns, because the channel setting
      beats the global On.'
    assertion:
      kind: full-mask-quantisation
      passed: true
      stage: channel-off-overrides-global-on
      pitches:
      - 60
      - 64
      - 69
      - 71
  - id: step-on-overrides-channel-off
    title: 'Step: map just one step'
    caption: 'State: On / Off / X / On. Hold step 2 and turn E3 to On to lock that step, then release.
      Play, then stop: only step 2 changes, to 65. The strip reads 60, 65, 69, 71.'
    assertion:
      kind: full-mask-quantisation
      passed: true
      stage: step-on-overrides-channel-off
      pitches:
      - 60
      - 65
      - 69
      - 71
- id: full-quantisation-inherit-and-step-off
  feature_id: fully-quantise-mask
