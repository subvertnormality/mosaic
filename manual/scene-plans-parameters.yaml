    caption: 'Assign Mute Chord Root and leave it at X so the root still sounds; then assign Chord Velocity
      Mod and turn E3 to +10 (E2 moves to the next slot, K2 opens the list, E3 browses, K3 assigns, K2
      returns). Tap Play (1,8), then tap it again to stop. The order flips: C4 (72), A3 (69), G3 (67),
