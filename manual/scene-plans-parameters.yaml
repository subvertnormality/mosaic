- id: chord-strum-a-timed-chord
  feature_id: chord-strum
  title: Separate a chord into timed voices
  behaviour_case: M-CHORDSHAPE-001
  citation: README.md#chord-strum
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays one trig on step 1: root C (MIDI 60, C3) at velocity 50, held for 4 steps.
      Chd1 to Chd4 on the Masks page are E, G, A and C (MIDI 64, 67, 69, 72) and the output is polyphonic.
      Trig params is open on its parameter list, showing Chord Note Strum. No slot is assigned yet, so
      the five notes would sound together.'
    assertion:
      kind: parameter-list-label
      label: Chord Note Strum
      passed: true
  - id: strum-value
    title: Verify the half-step Strum value
    caption: Press K3 to assign Chord Note Strum to slot 1 and K2 to return. Turn E3 to 1/2. Slot 1
      now shows 1/2 with no L or S marker; pause here before moving to another slot.
    assertion:
      kind: selected-param
      slot: 1
      value: 1/2
      marker: null
      passed: true
  - id: assign-strum
    title: Choose the chord pattern slot
    caption: From the verified half-step Strum slot, turn E2 to the next slot, press K2 and turn E3 to
      Chord Pattern.
    assertion:
      kind: parameter-list-label
      label: Chord Pattern
      passed: true
  - id: forward
    title: Hear the strummed chord
    caption: 'Finish the setup the next examples reuse: assign Chord Pattern and turn E3 one detent to
      -> (forward); Assign Mute Chord Root and leave it at X so the root still sounds; then assign Chord
      Velocity Mod and turn E3 to +10 (E2 moves to the next slot, K2 opens the list, E3 browses, K3 assigns,
      K2 returns). Tap Play (1,8), then tap it again to stop. In the MIDI strip the notes arrive one after
      another, half a step apart: C3 (60), E3 (64), G3 (67), A3 (69) and C4 (72). With Strum at X they
      would all start together.'
    assertion:
      kind: chord-shape-slots
      passed: true
      arp: false
      shape: 1
      muted: false
      mask_bits: 15
      onsets: 5
      release_checks: 5
