- id: chord-acceleration-termination
  feature_id: chord-acceleration
  title: Stop when the next gap closes
  behaviour_case: M-CHORDSHAPE-257
  citation: README.md#chord-acceleration
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays one trig on step 1: root C (MIDI 60, C3) at velocity 50, held for 4 steps.
      Only Chd1 (E, 64) and Chd4 (C, 72) are set, so Chd2 and Chd3 are empty slots; the output is polyphonic.
      Chord Note Strum is 1/2, Chord Pattern is <- (reverse: slot 4, 3, 2, 1, then the root), Mute Chord
      Root is assigned and left at X, and Chord Velocity Mod is +10. Trig params is open on its parameter
      list, showing Chord Spread; Spread and Chord Accel Mod are not assigned yet.'
    assertion:
      kind: parameter-list-label
      label: Chord Spread
      passed: true
  - id: spread
    title: Set a quarter-step Spread
    caption: Press K3 to assign Chord Spread and K2 to return, then turn E3 up to 1/4. Each gap is now
      1/2 + 1/4 = 3/4 step. Acceleration works on Spread, so with Spread at zero it would do nothing.
      Turn E2 to the next slot, press K2 and turn E3 to Chord Accel Mod.
    assertion:
      kind: parameter-list-label
      label: Chord Accel Mod
      passed: true
  - id: negative
    title: A faster reverse strum can end early
    caption: 'Press K3 to assign Chord Accel Mod and K2 to return, then turn E3 one detent down to -1:
      each gap is a quarter step (Spread x 1) shorter than the one before. Tap Play (1,8), then tap it
      again to stop. The gaps are 3/4, 1/2 and 1/4 step, and the gap after that would be 0, so scheduling
      stops. Slot 4 (C4, 72) sounds at once, empty slots 3 and 2 pass in silence at 3/4 and 1 1/4 steps,
      and slot 1 (E3, 64) sounds 1 1/2 steps after the trigger. The MIDI strip lists only those two notes;
      the root C3 (60) never sounds.'
    assertion:
      kind: chord-shape-slots
      passed: true
      arp: false
      shape: 2
      muted: false
      mask_bits: 9
      onsets: 2
      release_checks: 2
