  citation: README.md#fully-quantise-mask
  steps:
  - id: start
    title: Starting point
    caption: 'Channel 1 plays four trigs with note masks 60, 64, 69 and 71 on steps 1-4 (velocities 127,
      117, 107, 97), in a scale with Degree II and Rotation 1. Quantise Note Mask works on three levels,
      strongest first: a step lock, then the channel value, then the global option. On follows the
